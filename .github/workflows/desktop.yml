# Builds the NomuHub CRM Windows installer (desktop/) and publishes it as a
# GitHub Release, which is also where the installed app looks for app
# updates. Runs when desktop/package.json changes on main (bump "version" to
# ship a new installer) or by hand from the Actions tab. Dashboard changes
# don't need this: the app loads the live site and offers a reload itself.
name: Desktop app (Windows)

on:
  push:
    branches: [main]
    paths: ['desktop/package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      # On failure the tail of the build output is posted as an annotation,
      # which is public, unlike the job log of this repo.
      - name: Build and publish installer
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --x64 --publish always 2>&1 | tee build.log || { echo "::error title=electron-builder::$(tail -40 build.log | tr '\n' '|' | tr -d '\r')"; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
