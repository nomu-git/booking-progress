# Campaign on/off alerts to Slack. Meta can't push a campaign status change
# to us, so this asks api/campaign-alerts every 5 minutes (GitHub's shortest
# schedule; Vercel's Hobby plan only allows a daily cron) and the endpoint
# posts any switch it hasn't posted before. Free here because the repo is
# public. GitHub can start a scheduled run a few minutes late under load;
# the endpoint looks back 3 hours, so a late run still catches up.
#
# The endpoint keeps no state, so the list of switches already posted
# ("seen") lives in the Actions cache between runs: restored from the newest
# entry, sent with the request, and saved again only if the call succeeded.
#
# Needs the repository secret CAMPAIGN_ALERT_SECRET, the same value as the
# Vercel env var of that name.
name: Campaign on/off alerts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# One run at a time, so two runs can't both post the same switch.
concurrency:
  group: campaign-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore switches already posted
        uses: actions/cache/restore@v4
        with:
          path: seen.json
          key: campaign-alerts-${{ github.run_id }}
          restore-keys: campaign-alerts-

      - name: Check Meta and post new switches to Slack
        env:
          SECRET: ${{ secrets.CAMPAIGN_ALERT_SECRET }}
        run: |
          [ -s seen.json ] || echo 'null' > seen.json
          code=$(curl -sS -o out.json -w '%{http_code}' -X POST \
            'https://bookingprogress.vercel.app/api/campaign-alerts' \
            -H "Authorization: Bearer $SECRET" \
            -H 'Content-Type: application/json' \
            --data "{\"seen\": $(cat seen.json)}")
          python3 - <<'PY'
          import json
          out = json.load(open('out.json'))
          print(json.dumps({k: v for k, v in out.items() if k != 'seen'}))
          PY
          [ "$code" = 200 ] || { echo "HTTP $code"; exit 1; }
          python3 -c 'import json; print(json.dumps(json.load(open("out.json"))["seen"]))' > seen.json

      - name: Save for the next run
        uses: actions/cache/save@v4
        with:
          path: seen.json
          key: campaign-alerts-${{ github.run_id }}

      # Posted fine but Meta or Slack refused something: fail the run (after
      # saving) so it shows red in GitHub and emails the repo owner.
      - name: Fail if Meta or Slack reported an error
        run: python3 -c 'import json,sys; e=json.load(open("out.json")).get("errors") or []; print("\n".join(e)); sys.exit(1 if e else 0)'
