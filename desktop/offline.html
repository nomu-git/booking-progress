<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NomuHub CRM · offline</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; background: #14223d; color: #fff; font-family: "Segoe UI", system-ui, sans-serif; }
  .box { text-align: center; max-width: 420px; padding: 24px; }
  img { width: 96px; height: 96px; border-radius: 18px; }
  h1 { font-size: 22px; margin: 18px 0 8px; }
  p { color: #b4c2d8; line-height: 1.5; margin: 0 0 20px; }
  button { padding: 10px 22px; border: 0; border-radius: 999px; background: #f2b233; color: #14223d; font-size: 15px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    <img src="build/icon.png" alt="NomuHub">
    <h1>Can't reach the dashboard</h1>
    <p>NomuHub CRM shows live data, so it needs an internet connection. Check your connection, then try again.</p>
    <button id="retry">Try again</button>
  </div>
  <script>
    const url = new URLSearchParams(location.search).get('url') || 'https://crm.nomuhub.com';
    document.getElementById('retry').addEventListener('click', () => { location.href = url; });
    addEventListener('online', () => { location.href = url; });
  </script>
</body>
</html>
