  .kp-area span { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
  .kp-area b { font-size: 15px; font-weight: 800; color: var(--strong); font-variant-numeric: tabular-nums; }

  .kp-area i { grid-column: 1 / -1; display: block; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .kp-area u { display: block; height: 100%; border-radius: 3px; background: var(--q-high); text-decoration: none; }

  .kp-ac { font-size: 12.5px; color: var(--text-3); }
  .kp-list { display: flex; flex-direction: column; }
  .kp-row { display: grid; grid-template-columns: 26px minmax(170px, 1fr) minmax(0, 2.2fr); gap: 4px 14px; padding: 13px 4px; border-top: 1px solid var(--line); align-items: start; }
  .kp-list > .kp-row:first-child { border-top: 0; }
  .kp-ic { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; margin-top: 1px; }
  .kp-ic.pass { background: rgba(12,163,12,.12); color: var(--good-ink); }
  .kp-ic.fail { background: rgba(208,59,59,.12); color: var(--bad-ink); }
  .kp-ic.na { background: rgba(var(--ov),.07); color: var(--text-3); }
  .kp-n { font-size: 14px; font-weight: 700; color: var(--strong); line-height: 1.3; }
  .kp-tgt { margin-top: 3px; font-size: 12px; color: var(--text-3); }
  .kp-why { font-size: 13.5px; line-height: 1.5; color: var(--text); }

  .kp-row.pass .kp-why { color: var(--text-2); }
  .kp-name { cursor: help; border-bottom: 1px dotted rgba(var(--ov),.3); }
  .kp-more { color: var(--yellow); font-weight: 600; cursor: help; white-space: nowrap; }
  .kp-row.grp { cursor: pointer; border-radius: 10px; }
  .kp-row.grp:hover, .kp-row.grp:focus-visible { background: rgba(var(--acc-rgb),.05); outline: none; }
  .kp-open { display: inline-block; margin-top: 8px; font-size: 12.5px; font-weight: 700; color: var(--yellow); }

  /* AI Adviser bubble: the bottom-left corner of the screen (over the empty
     foot of the sidebar on a desktop; Anton, 13 Oct 2026: "the left most
     corner"), with a thought-cloud
     "Ask me anything!" and a small panel that opens above it. */
  .adv { position: fixed; bottom: 18px; left: 14px; z-index: 45; }
  .adv-btn {
    width: 60px; height: 60px; border-radius: 50%; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
    color: var(--navy); background: radial-gradient(circle at 30% 25%, #8fe3ec, var(--yellow) 55%, #1a8fa1);
    box-shadow: 0 8px 24px rgba(0,0,0,.35), 0 0 0 6px rgba(var(--acc-rgb),.16), 0 0 28px rgba(var(--acc-rgb),.45);
    animation: advPulse 2.8s ease-in-out infinite;
  }
  .adv-btn svg { width: 28px; height: 28px; }
  .adv-btn:hover { transform: scale(1.06); }
  .adv-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  @keyframes advPulse { 0%, 100% { box-shadow: 0 8px 24px rgba(0,0,0,.35), 0 0 0 6px rgba(var(--acc-rgb),.16), 0 0 28px rgba(var(--acc-rgb),.45); } 50% { box-shadow: 0 8px 24px rgba(0,0,0,.35), 0 0 0 12px rgba(var(--acc-rgb),.06), 0 0 40px rgba(var(--acc-rgb),.6); } }
  /* The thought cloud: a rounded bubble with two trailing puffs. */
  .adv-cloud {
    position: absolute; left: 66px; bottom: 58px; white-space: nowrap; pointer-events: none;
    padding: 9px 16px; border-radius: 22px; background: #fff; color: #16294a;
    font-size: 13.5px; font-weight: 800; box-shadow: 0 8px 22px rgba(0,0,0,.3);
    animation: advFloat 3.2s ease-in-out infinite;
  }
  .adv-cloud::before, .adv-cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,.2); }
  .adv-cloud::before { width: 13px; height: 13px; left: -4px; bottom: -9px; }
  .adv-cloud::after { width: 7px; height: 7px; left: -13px; bottom: -17px; }
  @keyframes advFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .adv.open .adv-cloud { display: none; }
  .adv-panel {
    position: absolute; left: 0; bottom: 76px; width: 340px; max-width: calc(100vw - 32px);
    border-radius: 16px; overflow: hidden; background: var(--card-2); border: 1px solid rgba(var(--acc-rgb),.35);
    box-shadow: 0 18px 50px rgba(0,0,0,.5), 0 0 30px rgba(var(--acc-rgb),.12);
  }
  .adv-head { display: flex; align-items: center; gap: 11px; padding: 14px 14px 12px; border-bottom: 1px solid var(--line); }
  .adv-head div b { display: block; font-size: 15px; }
  .adv-head div span { display: block; font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
  .adv-mini { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--navy); background: var(--yellow); flex: none; }
  .adv-mini svg { width: 18px; height: 18px; }
  .adv-new { white-space: nowrap; flex: none; margin-left: auto; display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid rgba(var(--ov),.18); background: rgba(var(--ov),.06); color: var(--text-2); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
  .adv-new:hover { color: var(--strong); border-color: var(--yellow); }
  .adv-x { width: 30px; height: 30px; border-radius: 8px; border: 0; background: rgba(var(--ov),.06); color: var(--text-2); font-size: 20px; line-height: 1; cursor: pointer; }
  .adv-x:hover { background: rgba(var(--ov),.12); color: var(--strong); }
  .adv-panel { display: flex; flex-direction: column; width: 400px; max-height: min(620px, calc(100vh - 120px)); }
  .adv-msgs { flex: 1; min-height: 160px; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .adv-hi { font-size: 13.5px; line-height: 1.55; color: var(--text-2); }
  .adv-hi b { color: var(--strong); display: block; margin-bottom: 4px; }
  .adv-chips { display: flex; flex-direction: column; gap: 7px; }
  .adv-chips button { text-align: left; padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(var(--acc-rgb),.35); background: rgba(var(--acc-rgb),.07); color: var(--strong); font: inherit; font-size: 13px; cursor: pointer; }
  .adv-chips button:hover { background: rgba(var(--acc-rgb),.16); }
  .adv-m { max-width: 92%; padding: 9px 12px; border-radius: 12px; font-size: 13.5px; line-height: 1.5; overflow-wrap: anywhere; }
  .adv-m.me { align-self: flex-end; background: var(--yellow); color: var(--navy); font-weight: 600; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .adv-m.ai { align-self: flex-start; background: rgba(var(--ov),.06); color: var(--text); border-bottom-left-radius: 4px; }
  .adv-m.ai p { margin: 0 0 6px; }
  .adv-m.ai p:last-child { margin-bottom: 0; }
  .adv-m.ai b { color: var(--strong); }
  .adv-h { font-weight: 800; color: var(--yellow); margin: 6px 0 4px; font-size: 13px; letter-spacing: .02em; }
  .adv-li { position: relative; padding-left: 14px; margin: 3px 0; }
  .adv-li::before { content: '•'; position: absolute; left: 2px; color: var(--yellow); }
  .adv-li.num { padding-left: 0; }
  .adv-li.num::before { content: none; }
  .adv-li.num i { font-style: normal; color: var(--yellow); font-weight: 700; }
  .adv-tag { display: inline-block; margin-bottom: 6px; padding: 1px 8px; border-radius: 999px; background: rgba(var(--acc-rgb),.18); color: var(--yellow); font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .adv-m.note { background: rgba(111,134,168,.16); color: var(--text-2); }
  .adv-m.error { background: rgba(208,59,59,.18); color: var(--bad-soft); }
  .adv-m.wait { color: var(--text-3); display: flex; align-items: center; gap: 4px; }
  .adv-m.wait span { width: 6px; height: 6px; border-radius: 50%; background: var(--yellow); animation: advDot 1s infinite ease-in-out; }
  .adv-m.wait span:nth-child(2) { animation-delay: .15s; }
  .adv-m.wait span:nth-child(3) { animation-delay: .3s; margin-right: 6px; }
  @keyframes advDot { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
  .adv-form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
  .adv-form textarea { flex: 1; resize: none; border-radius: 10px; border: 1px solid var(--line); background: rgba(var(--well-rgb),.55); color: var(--strong); font: inherit; font-size: 13.5px; padding: 8px 10px; }
  .adv-form textarea:focus { outline: none; border-color: var(--yellow); }
  .adv-form button { width: 40px; border-radius: 10px; border: 0; background: var(--yellow); color: var(--navy); font-size: 16px; cursor: pointer; }
  .adv-form :disabled { opacity: .45; cursor: not-allowed; }
  .adv-foot { padding: 0 12px 10px; font-size: 11px; color: var(--text-3); }
  .adv-foot.out { color: var(--bad-soft); }
  @media (max-width: 900px) {
    .adv { left: 16px; bottom: 16px; }
    html.sb-open .adv { display: none; }
  }
  @media (max-width: 600px) {
    .adv-btn { width: 52px; height: 52px; }
    .adv-cloud { left: 56px; bottom: 50px; font-size: 12.5px; padding: 7px 13px; }
  }

  [hidden] { display: none !important; }
  .msg { padding: 24px 4px; color: var(--text-2); font-size: 14px; }
  .msg.err { color: #ffbfa8; }
  /* Not an error — the numbers are real, one of them just needs a human eye. */
  .msg.warn {
    color: #ffd9a3; background: rgba(239,139,60,.10);
    border: 1px solid rgba(239,139,60,.35); border-radius: 8px;
    padding: 10px 13px; font-size: 12px; line-height: 1.55; margin-bottom: 12px;
  }
  .msg.warn b { color: var(--target-ink); }
  .flag {
    display: inline-block; min-width: 15px; padding: 0 4px; border-radius: 4px;
    background: rgba(239,139,60,.20); color: var(--target-ink);
    font-size: 10px; font-weight: 700; text-align: center; cursor: help;
  }

  /* ---------- shared tooltip (report bars + day cells) ---------- */
  .tip {
    position: fixed; z-index: 40; pointer-events: none; opacity: 0;
    background: var(--tip-bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font-size: 12px; line-height: 1.5; color: var(--text);
    box-shadow: 0 10px 26px rgba(0,0,0,.45); max-width: 280px; transition: opacity .12s;
  }
  .tip.on { opacity: 1; }
  .tip .tt { font-weight: 700; color: var(--yellow); margin-bottom: 5px; }
  .tip .tk { color: var(--text-3); }
  .tip .trow { display: flex; justify-content: space-between; gap: 10px; padding: 1px 0; }
  .tip .trow b { font-variant-numeric: tabular-nums; }
  .tip .more { color: var(--text-3); font-size: 11px; margin-top: 3px; }
  .tip .hint { color: var(--text-3); font-size: 10.5px; margin-top: 6px; border-top: 1px solid var(--line); padding-top: 6px; }

  /* Anything with an explanation behind it gets a dotted underline and the
     help cursor, so it reads as "there is more here" rather than people
     having to discover it by accident. */
  [data-help] {
    display: inline-block;
    cursor: help;
    text-decoration: underline dotted rgba(134,152,180,.55);
    text-underline-offset: 3px;
  }
  [data-help]:hover { color: var(--yellow); }

  /* Listeners bind to the bar shapes themselves, not the full-height column,
     so hovering empty space above a short bar doesn't trigger the tooltip. */
  .cbar, .dbar { cursor: pointer; }

  /* ---------- click popup: full breakdown for one period ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50; background: rgba(10,18,32,.6);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal {
    position: relative; width: 100%; max-width: 480px; max-height: 80vh; overflow-y: auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px 22px 18px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .modal-close {
    position: absolute; top: 12px; right: 14px; background: transparent; border: 0;
    color: var(--text-3); font-size: 22px; line-height: 1; cursor: pointer; padding: 4px;
  }
  .modal-close:hover { color: var(--text); }
  .mtitle { font-size: 16px; font-weight: 700; margin: 0 0 3px; padding-right: 20px; }
  .msub { font-size: 12px; color: var(--text-2); margin-bottom: 16px; }
  .mrow { padding: 10px 0; border-bottom: 1px solid #2a4568; }
  .mrow:last-child { border-bottom: 0; }
  .mrow-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .mtrip { font-weight: 700; font-size: 13.5px; }
  .mcount { font-weight: 700; font-size: 14px; color: var(--yellow); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mcount.charter { color: #8fb3e0; }
  .mwhen { font-size: 11px; color: var(--text-3); margin-top: 3px; }
  .mempty { color: var(--text-3); font-size: 13px; padding: 12px 0; }
  .mcancel { color: var(--bad-ink); font-size: 11px; margin-top: 2px; }
  /* ---------- feedback (trip survey sheet) ----------
     Scores are coloured by the sheet's own bands (4.0+, 3.0-3.9, under 3.0)
     with the Trips tab's status steps, and the number always sits beside

  #feedbackWrap .ctable th.fb-l, #feedbackWrap .ctable td.fb-l { text-align: left; }

  #feedbackWrap .ctable tr.fb-month td {

  }
  .fb-hbar { display: block; width: 140px; margin-top: 8px; }
  .fb-na { color: var(--text-3); }
  .fb-flag { margin-left: 6px; font-size: 11px; font-weight: 700; color: var(--bad-ink); white-space: nowrap; }
  .fb-alert {

    background: color-mix(in srgb, var(--q-low) 12%, transparent); font-size: 12.5px; line-height: 1.55; color: var(--text-2);
  }
  .fb-alert b { color: var(--strong); }
  /* The opened trip: sticky inside the scroll box, like the Trips details. */
  .fb-detail { position: sticky; left: 16px; max-width: 900px; }
  .fb-filters { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .fb-fl { display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
  .fb-fl select { font: inherit; font-size: 13px; font-weight: 500; letter-spacing: 0; text-transform: none; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); min-width: 140px; max-width: 260px; }
  .fb-dc .fb-c { background: var(--card); border: 1px solid var(--line); }

  .fb-low .fb-score .abar { width: 120px; }

  .fb-prog h3 { margin: 0 0 4px; font-size: 15px; color: var(--strong); }
  .fb-ask { margin-bottom: 8px; font-size: 12px; line-height: 1.55; color: var(--text-2); max-width: 900px; }
  .fb-trip { margin: 14px 0 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
  .fb-c { margin-bottom: 6px; padding: 10px 13px; border-radius: 8px; background: var(--track); font-size: 12.5px; line-height: 1.55; color: var(--text-2); max-width: 900px; }

  .fb-kind { padding: 1px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700; color: var(--strong); background: rgba(var(--ov),.08); }
  .fb-kind.fb-k-concern { background: color-mix(in srgb, var(--q-low) 35%, transparent); }
  .fb-kind.fb-k-suggestion { background: color-mix(in srgb, var(--yellow) 28%, transparent); }
  /* ---------- trip revenue ----------
     One bar per row is the row's revenue: expenses (neutral slate) plus
     profit (status green), or on a loss, revenue in slate and the expense
     overrun in status red. The numbers sit in their own columns, so colour
     is never the only signal. */
  #revenueWrap .ctable th.rv-l, #revenueWrap .ctable td.rv-l { text-align: left; }
  #revenueWrap .ctable td.cname { min-width: 170px; }
  #revenueWrap .ctable tr.rv-month td {
    background: transparent; border-bottom: 0; text-align: left; padding: 14px 10px 4px;
    font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3);

  .rv-leg { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 11.5px; color: var(--text-2); }
  .rv-leg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .rv-leg b { color: var(--strong); font-variant-numeric: tabular-nums; }
  .rv-na { color: var(--text-3); }

  .rv-res i { font-style: normal; font-size: 9px; }
  .rv-sug { display: grid; gap: 8px; }
  .rv-s { padding: 9px 13px; border-radius: 8px; border-left: 3px solid var(--q-none); background: var(--track); }
  .rv-s-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 13px; color: var(--strong); }
  .rv-s-tag { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }

  .mon-top { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px 20px; margin-bottom: 18px; }

  .mon-row, .mon-headrow {

    padding: 13px 18px; border-radius: 10px; background: var(--card); border: 1px solid transparent;

<script>
  const POLL_MS = 30000;   // server caches upstream calls, so this stays cheap
  const $ = (id) => document.getElementById(id);
  const esc = (s) => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
  // esc() goes through textContent, which escapes & < > but leaves quotes
  // alone — fine for text nodes, silently broken inside an attribute, where
  // the first embedded " ends the value early. Anything interpolated into an
  // attribute has to come through here instead.
  const attr = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  // The executive Dashboard is the first screen (Anton, 19 Oct 2026); a
  // device that was on another tab goes back to it.
  let view = 'overview';
  let latest = null;

  // Banner content comes from Vercel env vars via /api/announcement, so it can
  // be changed without touching code. Null means nothing is set, which renders
  // a quiet "no current announcement" placeholder rather than vanishing — a
  // disappearing element reads as broken, and keeps the layout from jumping.
  // Several can show at once: the env-var banner plus dated reminders, each
  // with a countdown to its due day (Muscat). The API drops them once past.
  let announcement = null;
  async function loadAnnouncement() {
    try {
      const res = await fetch('/api/announcement');
      const a = await res.json();
      const items = (a && a.items) || (a && (a.title || a.body) ? [a] : []);
      announcement = items.length ? { items, today: a.today } : null;
    } catch (e) {
      announcement = null;
    }
    applyAnnouncement();
  }
  function annCountdown(due, today) {
    const days = Math.round((Date.parse(due + 'T00:00:00Z') - Date.parse(today + 'T00:00:00Z')) / 86400000);
    const d = new Date(due + 'T00:00:00Z');
    const date = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
    const left = days <= 0 ? 'Today' : days === 1 ? 'Tomorrow' : `${days} days left`;
    return { text: `${left} · ${date}`, soon: days <= 2 };
  }
  function applyAnnouncement() {
    const el = $('announce');
    const today = (announcement && announcement.today) || new Date(Date.now() + 4 * 3600 * 1000).toISOString().slice(0, 10);
    el.innerHTML = announcement ? announcement.items.map((a) => {
      const c = a.due ? annCountdown(a.due, today) : null;
      return `<div class="announce${a.due ? ' due' : ''}">
        <div class="announce-icon">${a.due ? '⏰' : '📢'}</div>
        <div>
          ${c ? `<div class="announce-due${c.soon ? ' soon' : ''}">${esc(c.text)}</div>` : ''}
          <div class="announce-title">${esc(a.title || '')}</div>
          ${a.body ? `<div class="announce-body">${esc(a.body)}</div>` : ''}
        </div>
      </div>`;
    }).join('') : '';
    // Nothing to announce: no banner at all (Anton, 13 Oct 2026), not the
    // old "No current announcement" placeholder.
    el.hidden = !announcement || view !== 'board';
  }

  // Which tab and which Report period the screen was on — restored on load
  // so a refresh (or the wall display losing power overnight) doesn't reset
  // whoever's looking at it back to the very beginning.
  const STORAGE_KEY = 'bookingProgressView';
  function saveViewState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        view, rGran, rCount, selectedWeekStart, selectedMonthStart, ptYear, ptMonth,
      }));
    } catch (e) { /* storage unavailable (private mode, etc.) — just skip persisting */ }
  }
  function loadViewState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const s = JSON.parse(raw);
      // A browser that saved state before the Table tab was removed could
      // still have "table" stored — fall back to the dashboard rather than
      // restoring a view that no longer exists.
      if (['overview', 'board', 'report', 'previous', 'trips', 'feedback', 'revenue', 'impact', 'campaigns', 'history', 'leads', 'engagements', 'pending', 'kpis'].includes(s.view)) view = s.view;
      // Older saves stored 'all' or a numeric string; a plain finite number is
      // the only valid value now, anything else falls back to the latest year.
      if (s.ptYear != null && Number.isFinite(Number(s.ptYear)) && String(s.ptYear) !== 'all') {
        ptYear = Number(s.ptYear);
      }
      if (s.ptMonth) ptMonth = s.ptMonth;
      if (s.rGran) rGran = s.rGran;
      if (s.rCount) rCount = s.rCount;
      if (s.selectedWeekStart) selectedWeekStart = s.selectedWeekStart;
      if (s.selectedMonthStart) selectedMonthStart = s.selectedMonthStart;
    } catch (e) { /* corrupt or blocked storage — fall back to defaults */ }
  }

  const D = (iso) => new Date(iso + 'T00:00:00Z');
  const day = (iso) => D(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
  const range = (a, b) => day(a) + ' – ' + day(b);
  const monthKey = (iso) => iso.slice(0, 7);
  const monthName = (iso) => D(iso).toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
  const fmtStamp = (iso) => {
    const d = new Date(iso);
    return isNaN(d) ? '—' : d.toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
      + ', ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  };

  // "Week 2 (06 Sep - 12 Sep)" -> "Week 2"; the dates are shown separately.
  const weekName = (label) => String(label || '').replace(/\s*\(.*\)\s*$/, '').trim() || 'Week';

  // A booking stays highlighted for exactly 24h from the moment it was placed:
  // one taken at 2pm stops being new at 2pm the next day. Computed in the browser
  // against live time, so it expires on the minute rather than on the poll.
  const NEW_MS = 24 * 60 * 60 * 1000;
  // Lets the highlight be seen on demand, since real bookings are days old.
  const PREVIEW = new URLSearchParams(location.search).get('preview') === 'new';

  function freshness(week) {
    const now = Date.now();
    let count = 0;
    let newest = 0;
    for (const r of week.recent || []) {
      const at = Date.parse(r.at);
      if (!Number.isFinite(at)) continue;
      if (now - at < NEW_MS) {
        count += r.count || 0;
        if (at > newest) newest = at;
      }
    }
    return { count, newest };
  }

  function ago(ms) {
    const mins = Math.floor((Date.now() - ms) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    return hrs + 'h ago';
  }

  function meter(w, target) {
    // The track runs to whichever is larger, so a capacity below target visibly
    // falls short of the marker instead of quietly rescaling to look full.
    const scale = Math.max(target, w.capacity || 0, w.booked, 1);
    const pct = Math.min(100, (w.booked / scale) * 100);
    // Sold out only when WeTravel has seats on sale and they're all taken; a
    // week set to 0 seats is "Unavailable" there, which reads as Cancelled.
    const soldOut = !w.unavailable && w.capacity > 0 && w.booked >= w.capacity;
    const state = w.unavailable ? 'cancelled' : w.booked === 0 ? 'none' : soldOut ? 'full' : '';
    const tickPct = Math.min(100, (target / scale) * 100);
    const f = freshness(w);

    return `
      <div class="wk ${f.count && !w.unavailable ? 'fresh' : ''}${w.unavailable ? ' wk-cancel' : ''}">
        <div>
          <span class="wlab">${esc(weekName(w.label))}</span><span class="wdate">${esc(range(w.start, w.end))}</span>
          ${w.unavailable ? '<span class="wcancel">CANCELLED</span>' : f.count ? `<span class="wpill">+${f.count}</span>` : ''}
        </div>
        <div class="wnum ${state}">${w.booked}<span class="of"> ${w.unavailable ? 'booked' : `/ ${w.capacity ?? target}`}</span></div>
        <div class="track">
          <div class="fill ${state}" style="width:${pct}%"></div>
          <div class="tick" style="left:calc(${tickPct}% - 1px)" title="Target ${target}"></div>
        </div>
        ${f.count ? `<div class="cap wago">New booking ${esc(ago(f.newest))}</div>` : ''}
      </div>`;
  }

  function tripCard(t, target) {
    // Sold out: every week still on sale has seats in WeTravel and all are
    // taken. Unavailable (0-seat) weeks don't count either way.
    const open = t.weeks.filter((w) => !w.unavailable);
    const soldOut = !t.cancelled && open.length > 0 && open.every((w) => w.capacity > 0 && w.booked >= w.capacity);
    const newCount = t.weeks.reduce((sum, w) => sum + freshness(w).count, 0);
    const cls = [
      t.cancelled ? 'cancelled' : '',
      soldOut ? 'done' : '',
      newCount && !t.cancelled ? 'fresh' : '',
    ].filter(Boolean).join(' ');
    const numCls = t.totalBooked === 0 ? 'none' : soldOut ? 'full' : '';
    const many = t.weeks.length > 1;

    return `
      <div class="trip ${cls}">
        <div class="thead">
          <div class="tname">${esc(t.name)}${t.cancelled ? '<span class="tag">CANCELLED</span>' : ''}${
            soldOut && !t.cancelled ? '<span class="tag soldout">SOLD OUT</span>' : ''}${
            newCount && !t.cancelled
              ? `<span class="newbadge">${newCount} NEW</span>` : ''}</div>
          <div class="tnum">
            <div class="b ${numCls}">${t.totalBooked}</div>
            <div class="s">booked</div>
          </div>
        </div>
        <div class="tmeta">${esc(range(t.start, t.end))} · ${t.weeks.length} ${many ? 'weeks' : 'week'}${
          t.cancelledCount ? ' · ' + t.cancelledCount + ' cancelled' : ''}</div>
        <div class="weeks ${many ? '' : 'single'}">
          ${t.weeks.map((w) => meter(w, target)).join('')}
        </div>
      </div>`;
  }

  // Booking filters (Shakir, Oct 2026: filter by month and by trip, like
  // Thai Wellness or Bali Teaching, so only what exists shows). Options are
  // built from the departures on the board, so nothing empty is offered.
  let bkMonth = 'all';
  let bkCat = 'all';
  const bkCatMatch = (t) => (bkCat === 'all' ? true
    : bkCat.startsWith('d:') ? t.pd === bkCat.slice(2)
      : bkCat.startsWith('p:') ? t.pg === bkCat.slice(2)
        : `${t.pd}|${t.pg}` === bkCat.slice(2));
  function bkFilterBar(all) {
    const monthsSeen = [...new Set(all.map((t) => monthKey(t.start)))];
    if (bkMonth !== 'all' && !monthsSeen.includes(bkMonth)) bkMonth = 'all';
    const count = (fn) => all.filter((t) => (bkMonth === 'all' || monthKey(t.start) === bkMonth) && fn(t)).length;
    const dests = [...new Set(all.filter((t) => t.pd).map((t) => t.pd))];
    const progs = [...new Set(all.filter((t) => t.pg).map((t) => t.pg))];
    const pairs = [...new Set(all.filter((t) => t.pd && t.pg).map((t) => `${t.pd}|${t.pg}`))];
    if (bkCat !== 'all' && !count(bkCatMatch)) bkCat = 'all';
    const opt = (v, label, n) => (n || v === bkCat ? `<option value="${attr(v)}"${v === bkCat ? ' selected' : ''}>${esc(label)} (${n})</option>` : '');
    const byName = (lab) => (a, b) => lab(a).localeCompare(lab(b));
    const dl = (d) => OV_DEST[d] || d;
    const pl = (g) => OV_PROG[g] || g;
    const save = bkCat;
    const cnt = (v) => { bkCat = v; const n = count(bkCatMatch); bkCat = save; return n; };
    const monthBtn = (k, label) => `<button data-bk-month="${k}" aria-pressed="${bkMonth === k}">${esc(label)} · ${all.filter((t) => (k === 'all' || monthKey(t.start) === k) && bkCatMatch(t)).length}</button>`;
    return `<div class="bk-filters">
      <div class="seg">${monthBtn('all', 'All months')}${monthsSeen.map((k) => monthBtn(k, D(k + '-01').toLocaleDateString('en-GB', { month: 'short', year: 'numeric', timeZone: 'UTC' }))).join('')}</div>
      ${dests.length ? `<select id="bkCat" aria-label="Trip">
        <option value="all"${bkCat === 'all' ? ' selected' : ''}>All trips (${count(() => true)})</option>
        <optgroup label="Destination">${dests.sort(byName(dl)).map((d) => opt('d:' + d, dl(d), cnt('d:' + d))).join('')}</optgroup>
        <optgroup label="Programme">${progs.sort(byName(pl)).map((g) => opt('p:' + g, pl(g), cnt('p:' + g))).join('')}</optgroup>
        <optgroup label="Trip">${pairs.sort(byName((c) => dl(c.split('|')[0]) + pl(c.split('|')[1]))).map((c) => opt('c:' + c, `${dl(c.split('|')[0])} · ${pl(c.split('|')[1])}`, cnt('c:' + c))).join('')}</optgroup>
      </select>` : ''}
      ${bkMonth !== 'all' || bkCat !== 'all' ? '<button class="btn" id="bkClear" type="button">Clear</button>' : ''}
    </div>`;
  }

  function render(p) {
    const all = p.trips || [];
    const trips = all.filter((t) => (bkMonth === 'all' || monthKey(t.start) === bkMonth) && bkCatMatch(t));
    if (!all.length) {
      $('msg').textContent = 'No departures between today and ' + p.seasonEnd + '.';
      $('msg').hidden = view !== 'board'; $('board').hidden = true; $('legend').hidden = true; $('announce').hidden = true;
      return;
    }
    $('msg').hidden = true;
    // The board polls every 30s; without this it would pop back over the
    // Report or Table view on the next refresh.
    $('board').hidden = view !== 'board';
    $('legend').hidden = view !== 'board';
    applyAnnouncement();

    // group cards under the month they depart in, keeping date order
    const months = [];
    for (const t of trips) {
      const key = monthKey(t.start);
      const last = months[months.length - 1];
      if (last && last.key === key) last.trips.push(t);
      else months.push({ key, label: monthName(t.start), trips: [t] });
    }

    $('board').innerHTML = bkFilterBar(all) + (trips.length ? '' : '<div class="msg">No departures match these filters.</div>') + months.map((m) => {
      const booked = m.trips.reduce((s, t) => s + t.totalBooked, 0);
      return `<section class="month">
        <div class="mhead">${esc(m.label)}
          <span class="c">${m.trips.length} ${m.trips.length > 1 ? 'departures' : 'departure'} · ${booked} booked</span>
        </div>
        <div class="grid">${m.trips.map((t) => tripCard(t, p.target)).join('')}</div>
      </section>`;
    }).join('');

    // The header's New in 24h / Last Week / Weekly Target trio is now sourced
    // from the Report data (see applyHeaderStats), so it's identical whether
    // you're looking at the Dashboard or the Report tab — not a second,
    // slightly-different count computed from the board's own data.

    $('board').querySelectorAll('[data-bk-month]').forEach((b) => b.addEventListener('click', () => { bkMonth = b.dataset.bkMonth; render(p); }));
    const sel = $('bkCat');
    if (sel) sel.addEventListener('change', () => { bkCat = sel.value; render(p); });
    const clr = $('bkClear');
    if (clr) clr.addEventListener('click', () => { bkMonth = 'all'; bkCat = 'all'; render(p); });

    $('notes').innerHTML = (p.warnings || []).length
      ? '<b>Needs attention in WeTravel:</b> ' + p.warnings.map((w) => esc(w.title) + ' — ' + esc(w.issue)).join(' · ')
      : '';
  }

  // ?preview=new backdates a couple of bookings so the highlight can be judged
  // on demand. It only ever runs from that URL, never on the live board.
  function previewNew(p) {
    const targets = (p.trips || []).filter((t) => !t.cancelled).slice(0, 2);
    targets.forEach((t, i) => {
      const week = t.weeks[t.weeks.length > 1 ? 1 : 0];
      if (!week) return;
      week.recent = [{ at: new Date(Date.now() - (i ? 5 * 3600e3 : 12 * 60e3)).toISOString(), count: i ? 1 : 2 }];
    });
  }

  async function load(force) {
    try {
      const res = await fetch('/api/trips-progress' + (force ? '?refresh=1' : ''));
      const p = await res.json();
      if (!res.ok) throw new Error(p.error || 'request failed');

      if (PREVIEW) previewNew(p);
      latest = p;
      $('asof').textContent = fmtStamp(p.asOf);
      $('range').textContent = D(p.today).toLocaleDateString('en-US', { month: 'long', day: 'numeric', timeZone: 'UTC' })
        + ' to ' + D(p.seasonEnd).toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
      $('dot').className = 'dot' + (p.stale ? ' warn' : '');
      $('dot').title = p.stale ? 'Showing last known data' : 'Live';
      render(p);
      ovSoon();
    } catch (err) {
      if (!latest) {
        $('msg').textContent = 'Could not load booking data: ' + err.message;
        $('msg').className = 'msg err'; $('msg').hidden = view !== 'board'; $('board').hidden = true;
      }
      $('dot').className = 'dot warn';
    }
  }

  /* ================= REPORT ================= */

  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const RANGES = { daily: [14, 30], weekly: [4, 8, 12], monthly: [6, 12] };

  let report = null;
  let rGran = 'weekly';      // Muatasam's headline number is the weekly one
  let rCount = 4;            // "actual weekly for last 4 weeks"
  // Corporate/institutional charters (KUMSA, CISCO, University of Sharjah)
  // are always excluded from the target — one charter can book a dozen seats
  // in a single week and make it look like a retail target was hit when it
  // wasn't, so there's no toggle to turn this back on.
  const rCharters = false;

  // The week/month the hero panel, daily strip, and KPI panel are showing.
  // null means "not yet initialized" — renderReport() sets it to the real
  // current period on first run. Clicking a bar or a nav arrow changes these;
  // neither is ever allowed to move past the real current period.
  let selectedWeekStart = null;
  let selectedMonthStart = null;

  const iso = (d) => d.toISOString().slice(0, 10);
  const addDays = (d, n) => new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + n));
  const sundayOf = (d) => addDays(d, -d.getUTCDay());

  // Periods are built backwards from today, so the report never shows a future
  // bucket and rolls forward on its own as the days pass.
  function buckets(today) {
    const t = D(today);
    const out = [];
    for (let i = rCount - 1; i >= 0; i--) {
      let start, end;
      if (rGran === 'daily') {
        start = addDays(t, -i); end = start;
      } else if (rGran === 'weekly') {
        start = addDays(sundayOf(t), -i * 7); end = addDays(start, 6);
      } else {
        start = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() - i, 1));
        end = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + 1, 0));
      }
      out.push({ start, end, key: iso(start), current: i === 0 });
    }
    return out;
  }

  function bucketLabel(b) {
    if (rGran === 'daily') return `${DOW[b.start.getUTCDay()]}<br>${b.start.getUTCDate()} ${MON[b.start.getUTCMonth()]}`;
    if (rGran === 'weekly') {
      const sameMon = b.start.getUTCMonth() === b.end.getUTCMonth();
      return sameMon
        ? `${b.start.getUTCDate()}–${b.end.getUTCDate()} ${MON[b.start.getUTCMonth()]}`
        : `${b.start.getUTCDate()} ${MON[b.start.getUTCMonth()]}–<br>${b.end.getUTCDate()} ${MON[b.end.getUTCMonth()]}`;
    }
    return `${MON[b.start.getUTCMonth()]}<br>${b.start.getUTCFullYear()}`;
  }

  // Same period label as bucketLabel() but plain text, for attributes/titles.
  function bucketPlain(b) {
    if (rGran === 'daily') return `${DOW[b.start.getUTCDay()]}, ${b.start.getUTCDate()} ${MON[b.start.getUTCMonth()]}`;
    if (rGran === 'weekly') return `${b.start.getUTCDate()} ${MON[b.start.getUTCMonth()]} – ${b.end.getUTCDate()} ${MON[b.end.getUTCMonth()]}`;
    return `${MON[b.start.getUTCMonth()]} ${b.start.getUTCFullYear()}`;
  }

  // Oman is UTC+4 with no DST. WeTravel's created_at is UTC, so a booking at
  // 22:00 UTC already fell on the next calendar day in Muscat — shifting by
  // the offset before reading the date turns it into the correct local day.
  const OMAN_OFFSET_MS = 4 * 60 * 60 * 1000;
  const omanDay = (isoTimestamp) => {
    const ms = Date.parse(isoTimestamp);
    return Number.isFinite(ms) ? new Date(ms + OMAN_OFFSET_MS).toISOString().slice(0, 10) : isoTimestamp.slice(0, 10);
  };

  // Muscat wall-clock time for a single booking's timestamp, for the popup —
  // the bucketing math uses the +4h shift trick, but for display the browser's
  // built-in Intl timezone support reads more naturally.
  const fmtOman = (isoTimestamp) => new Date(isoTimestamp).toLocaleString('en-GB', {
    timeZone: 'Asia/Muscat', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', hour12: true,
  });

  // Which trips booked within this period, and how many each, plus the exact
  // timestamps — the hover tooltip uses the totals, the click popup uses all of it.
  function tripBreakdown(events, from, to, charters) {
    const a = iso(from), z = iso(to);
    const byTrip = new Map();
    for (const e of events) {
      if (omanDay(e.at) < a || omanDay(e.at) > z) continue;
      if (e.x && !charters) continue;
      if (!byTrip.has(e.t)) byTrip.set(e.t, { trip: e.t, n: 0, c: 0, charter: !!e.x, bookings: [] });
      const row = byTrip.get(e.t);
      row.n += e.n; row.c += e.c;
      if (e.n > 0) row.bookings.push({ at: e.at, n: e.n });
    }
    return Array.from(byTrip.values()).sort((x, y) => y.n - x.n);
  }

  // Bookings placed in the rolling 24h ending now — same "how recent" concept
  // as the board's freshness badge, but summed across the whole report window
  // rather than one trip's weeks.
  function last24hTotal(events) {
    const cutoff = Date.now() - 24 * 60 * 60 * 1000;
    let n = 0;
    for (const e of events) {
      if (e.x) continue;
      const at = Date.parse(e.at);
      if (Number.isFinite(at) && at >= cutoff && at <= Date.now()) n += e.n;
    }
    return n;
  }

  // The most recently FINISHED Sun-Sat week — always real, fixed to actual
  // "now", never affected by whatever week is navigated to in the Report
  // tab's hero panel. This is what the always-visible header bar uses,
  // deliberately decoupled from Report-tab navigation.
  function lastCompletedWeekTotal(p) {
    const start = addDays(D(p.weekStart), -7);
    const end = addDays(D(p.weekStart), -1);
    return tally(p.events, start, end, false).n;
  }

  // Three numbers, no table: Muatasam asked for this in place of the detailed
  // Volume/Key-Percentages breakdown. Unlike the header's fixed version, this
  // panel lives inside the Report tab right under the hero, so everything here
  // is relative to whichever week is navigated to there:
  //   "Last Week"     = the week BEFORE the selected one (not the selected
  //                     week itself — the hero right above already shows that,
  //                     so repeating it was both redundant and mislabelled).
  //   "Last 24 Hours" = real rolling 24h while on the current week; on a past
  //                     week it anchors to that week's own final day, since
  //                     today's live count says nothing about the period shown.
  // Each carries its date range so there's no ambiguity about what it covers.
  function buildSimpleKpi(p, wkStart, wkEnd, isCurrentWeek, target) {
    const prevStart = addDays(wkStart, -7);
    const prevEnd = addDays(wkStart, -1);
    const lastWeek = tally(p.events, prevStart, prevEnd, false).n;

    let last24h, last24hLabel;
    if (isCurrentWeek) {
      last24h = last24hTotal(p.events);
      last24hLabel = 'rolling, up to now';
    } else {
      const anchor = Date.parse(iso(addDays(wkEnd, 1))); // midnight right after that week ends
      const cutoff = anchor - 24 * 60 * 60 * 1000;
      last24h = 0;
      for (const e of p.events) {
        if (e.x) continue;
        const at = Date.parse(e.at);
        if (Number.isFinite(at) && at >= cutoff && at < anchor) last24h += e.n;
      }
      last24hLabel = `final day of ${day(iso(wkEnd))}`;
    }

    return `
      <div class="panel skpi-panel">
        <div class="skpi">
          <div class="skpi-n">${last24h}</div>
          <div class="skpi-l">Last 24 Hours</div>
          <div class="skpi-sub">${esc(last24hLabel)}</div>
        </div>
        <div class="skpi">
          <div class="skpi-n">${lastWeek}</div>
          <div class="skpi-l">Last Week</div>
          <div class="skpi-sub">${esc(range(iso(prevStart), iso(prevEnd)))}</div>
        </div>
        <div class="skpi">
          <div class="skpi-n">${target}</div>
          <div class="skpi-l">Weekly Target</div>
          <div class="skpi-sub">per week</div>
        </div>
      </div>`;
  }

  function tally(events, from, to, charters) {
    let n = 0, c = 0, ch = 0;
    const a = iso(from), z = iso(to);
    for (const e of events) {
      const day = omanDay(e.at);
      if (day < a || day > z) continue;
      if (e.x) { ch += e.n; if (!charters) continue; }
      n += e.n; c += e.c;
    }
    return { n, c, charter: ch };
  }

  function renderReport() {
    const p = report;
    if (!p) return;
    if (p.error && !p.events) {
      $('reportWrap').innerHTML = `<div class="msg err">Could not load report: ${esc(p.error)}</div>`;
      return;
    }

    const today = D(p.today);
    if (selectedWeekStart === null) selectedWeekStart = p.weekStart;
    if (selectedMonthStart === null) {
      selectedMonthStart = iso(new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), 1)));
    }

    const wkStart = D(selectedWeekStart);
    const wkEnd = addDays(wkStart, 6);
    const isCurrentWeek = selectedWeekStart === p.weekStart;
    const week = tally(p.events, wkStart, wkEnd, rCharters);
    const target = p.weeklyTarget;
    const pct = Math.min(100, (week.n / target) * 100);
    const hit = week.n >= target;

    // A past week is fully elapsed by definition; only the real current week
    // can be partway through, so only it gets "N days left" / pacing language.
    const elapsed = isCurrentWeek
      ? Math.max(1, Math.min(7, Math.round((today - wkStart) / 864e5) + 1))
      : 7;
    const left = isCurrentWeek ? 7 - elapsed : 0;
    const expected = (target / 7) * elapsed;
    const onPace = week.n >= expected;

    // How far back navigation is allowed to go — the server only scans
    // `lookbackDays` back, so earlier weeks would just show misleading zeros.
    const earliestIso = iso(addDays(today, -(p.lookbackDays || 300)));
    const canGoBackWeek = iso(addDays(wkStart, -7)) >= earliestIso;

    const dayCells = Array.from({ length: 7 }, (_, i) => {
      const d = addDays(wkStart, i);
      const v = tally(p.events, d, d, rCharters).n;
      const ahead = iso(d) > p.today;
      const isToday = iso(d) === p.today;
      const peak = Math.max(3, ...Array.from({ length: 7 }, (_, j) =>
        tally(p.events, addDays(wkStart, j), addDays(wkStart, j), rCharters).n));
      return `<div class="dcell ${ahead ? 'ahead' : ''} ${isToday ? 'today' : ''} ${v ? '' : 'zero'}"
                   data-start="${iso(d)}" data-end="${iso(d)}" data-label="${esc(DOW[i] + ', ' + d.getUTCDate() + ' ' + MON[d.getUTCMonth()])}">
        <div class="dbar-wrap"><div class="dbar" style="height:${(v / peak) * 100}%"></div></div>
        <div class="dnum">${v}</div>
        <div class="dlab">${DOW[i]}${isToday ? ' •' : ''}</div>
      </div>`;
    }).join('');

    const bs = buckets(p.today).map((b) => ({ ...b, ...tally(p.events, b.start, b.end, rCharters) }));
    const showTarget = rGran === 'weekly';
    const peak = Math.max(showTarget ? target : 0, ...bs.map((b) => b.n), 1);
    const max = Math.ceil((peak + 1) / 5) * 5;

    let chrome = '';
    for (let v = 0; v <= max; v += 5) {
      chrome += `<div class="crule" style="bottom:${(v / max) * 100}%"><span class="ct">${v}</span></div>`;
    }
    if (showTarget) {
      chrome += `<div class="ctarget" style="bottom:${(target / max) * 100}%">
        <span class="ctflag">TARGET ${target}/WEEK</span></div>`;
    }

    // Highlights whichever bar matches what the hero/KPI panel is currently
    // showing — the visual confirmation that clicking it actually did something.
    const selectedIso = rGran === 'weekly' ? selectedWeekStart : rGran === 'monthly' ? selectedMonthStart : null;
    const bars = bs.map((b) => `
      <div class="cslot ${b.n ? '' : 'zero'} ${showTarget && b.n >= target ? 'hit' : ''} ${b.current ? 'partial' : ''} ${iso(b.start) === selectedIso ? 'selected' : ''}"
           data-start="${iso(b.start)}" data-end="${iso(b.end)}" data-label="${esc(bucketPlain(b))}">
        <div class="cval">${b.n}</div>
        <div class="cbar" style="height:${(b.n / max) * 100}%"></div>
      </div>`).join('');

    const axis = bs.map((b) => `<div class="clab ${b.current ? 'partial' : ''}">
      ${bucketLabel(b)}${b.current ? '<br><span style="font-size:9px">so far</span>' : ''}</div>`).join('');

    const totalCharter = bs.reduce((s, b) => s + b.charter, 0);
    const kpiHtml = buildSimpleKpi(p, wkStart, wkEnd, isCurrentWeek, target);

    const subLabel = isCurrentWeek
      ? `Day <b>${elapsed}</b> of 7${left > 0 ? ` · ${left} day${left > 1 ? 's' : ''} left` : ' · final day'}`
      : 'Full week · completed';
    const paceLine = hit
      ? '✓ Target reached'
      : isCurrentWeek
        ? (onPace ? `On pace · ${(target - week.n)} to go` : `Behind pace · ${(target - week.n)} to go (expected ~${expected.toFixed(0)} by now)`)
        : `Target missed by ${target - week.n}`;
    const paceClass = hit ? 'ok' : (isCurrentWeek ? (onPace ? 'ok' : 'behind') : 'behind');

    $('reportWrap').innerHTML = `
      <div class="rtop">
        <div class="panel">
          <div class="pnav">
            <button class="navbtn" id="wkPrev" aria-label="Previous week" ${canGoBackWeek ? '' : 'disabled'}>‹</button>
            <div class="ptitle" style="margin:0">${isCurrentWeek ? 'This week' : 'Week of'} · ${wkStart.getUTCDate()} ${MON[wkStart.getUTCMonth()]} – ${wkEnd.getUTCDate()} ${MON[wkEnd.getUTCMonth()]}</div>
            <button class="navbtn" id="wkNext" aria-label="Next week" ${isCurrentWeek ? 'disabled' : ''}>›</button>
            ${isCurrentWeek ? '' : '<button class="navbtn navbtn-today" id="wkToday">Today</button>'}
          </div>
          <div class="hero ${hit ? 'hit' : ''}">
            <span class="big">${week.n}</span><span class="of">/ ${target} bookings</span>
          </div>
          <div class="htrack"><div class="hfill ${hit ? 'hit' : ''}" style="width:${pct}%"></div></div>
          <div class="hsub">${subLabel}</div>
          <div class="pace ${paceClass}">
            ${paceLine}
          </div>
        </div>

        <div class="panel">
          <div class="ptitle">${isCurrentWeek ? 'Daily progress this week' : 'Daily progress that week'}</div>
          <div class="days">${dayCells}</div>
        </div>
      </div>

      ${kpiHtml}

      <div class="panel">
        <div class="filters">
          <div class="seg" id="granSeg">
            ${['daily', 'weekly', 'monthly'].map((g) =>
              `<button data-g="${g}" aria-pressed="${g === rGran}">${g[0].toUpperCase() + g.slice(1)}</button>`).join('')}
          </div>
          <div class="seg" id="rangeSeg">
            ${RANGES[rGran].map((n) =>
              `<button data-n="${n}" aria-pressed="${n === rCount}">Last ${n}</button>`).join('')}
          </div>
          <div class="fnote">${p.tripsScanned} trips scanned${totalCharter ? ` · ${totalCharter} charter booking(s) excluded` : ''}</div>
        </div>
        <div class="tzbadge">🕐 All dates and times shown in <b>Muscat, Oman time (UTC+4)</b></div>
        <div class="chart">${chrome}<div class="cbars">${bars}</div></div>
        <div class="caxis">${axis}</div>
        <div class="rlegend">
          <span><i style="background:var(--fill)"></i>Bookings taken</span>
          <span><i style="background:#56b98a"></i>Week hit target</span>
          <span><i style="background:repeating-linear-gradient(135deg,var(--fill) 0 4px,rgba(var(--fill-rgb),.35) 4px 8px)"></i>Still in progress</span>
        </div>
      </div>`;

    bindReportInteractions(p);
    bindPeriodNav();

    $('granSeg').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      rGran = b.dataset.g;
      rCount = RANGES[rGran][0];
      renderReport();
    }));
    $('rangeSeg').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      rCount = Number(b.dataset.n); renderReport();
    }));

    // Every path that changes what Report is showing (filters, nav arrows,
    // clicking a bar) routes through a renderReport() call, so saving here
    // catches all of them in one place.
    saveViewState();
  }

  // Hover for a quick read, click for the full list — both driven by the same
  // per-period breakdown so they can never disagree with each other.
  function bindReportInteractions(p) {
    const tip = $('tip');

    function tipHtml(rows, label, charter, jumpHint) {
      const total = rows.reduce((s, r) => s + r.n, 0);
      if (!total) return `<div class="tt">${esc(label)}</div><div class="tk">No bookings in this period</div>`;
      const shown = rows.filter((r) => r.n > 0).slice(0, 5);
      const rest = rows.filter((r) => r.n > 0).length - shown.length;
      return `<div class="tt">${esc(label)}</div>
        <div class="tk">${total} booking${total > 1 ? 's' : ''} · ${rows.filter((r) => r.n > 0).length} trip${rows.filter((r) => r.n > 0).length > 1 ? 's' : ''}${charter ? ' · incl. charters' : ''}</div>
        ${shown.map((r) => `<div class="trow"><span>${esc(r.trip)}${r.charter ? ' 🏫' : ''}</span><b>+${r.n}</b></div>`).join('')}
        ${rest > 0 ? `<div class="more">+${rest} more trip${rest > 1 ? 's' : ''}</div>` : ''}
        <div class="hint">${jumpHint}</div>`;
    }

    function moveTip(e) {
      const pad = 14, r = tip.getBoundingClientRect();
      let x = e.clientX + pad, y = e.clientY + pad;
      if (x + r.width > innerWidth) x = e.clientX - r.width - pad;
      if (y + r.height > innerHeight) y = e.clientY - r.height - pad;
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    }

    // Bound to the bar shape itself (.cbar / .dbar), not the full-height column
    // it sits in — so the tooltip only appears when the cursor is actually
    // over the drawn bar, not the empty space above a short one.
    document.querySelectorAll('.cbar, .dbar').forEach((bar) => {
      const container = bar.closest('[data-start]');
      if (!container) return;
      const from = D(container.dataset.start), to = D(container.dataset.end);
      const rows = tripBreakdown(p.events, from, to, rCharters);
      const jumpHint = 'Click for full details';

      bar.addEventListener('mouseenter', () => {
        tip.innerHTML = tipHtml(rows, container.dataset.label, rCharters, jumpHint);
        tip.classList.add('on');
      });
      bar.addEventListener('mousemove', moveTip);
      bar.addEventListener('mouseleave', () => tip.classList.remove('on'));
      // Clicking a bar does two things at once: filters the hero/daily-strip/
      // KPI panel to that exact period in place, AND opens a popup with the
      // full per-trip, per-booking breakdown as extra detail on top of that.
      bar.addEventListener('click', () => {
        tip.classList.remove('on');
        if (rGran === 'monthly') {
          selectedMonthStart = container.dataset.start;
        } else if (rGran === 'weekly') {
          selectedWeekStart = container.dataset.start;
        } else {
          selectedWeekStart = iso(sundayOf(D(container.dataset.start)));
        }
        renderReport();
        openReportModal(container.dataset.label, rows, rCharters);
      });
    });
  }

  function openReportModal(label, rows, charter) {
    const withBookings = rows.filter((r) => r.n > 0);
    const total = withBookings.reduce((s, r) => s + r.n, 0);

    $('modalBody').innerHTML = `
      <div class="mtitle">${esc(label)}</div>
      <div class="msub">${total} booking${total !== 1 ? 's' : ''} across ${withBookings.length} trip${withBookings.length !== 1 ? 's' : ''}${charter ? ' (incl. charters)' : ' (retail only)'}</div>
      ${withBookings.length ? withBookings.map((r) => `
        <div class="mrow">
          <div class="mrow-top">
            <span class="mtrip">${esc(r.trip)}${r.charter ? ' 🏫' : ''}</span>
            <span class="mcount ${r.charter ? 'charter' : ''}">+${r.n}</span>
          </div>
          <div class="mwhen">${r.bookings.map((b) => esc(fmtOman(b.at)) + (b.n > 1 ? ` (+${b.n})` : '')).join(' · ')}</div>
          ${r.c ? `<div class="mcancel">${r.c} cancelled in this period</div>` : ''}
        </div>`).join('') : '<div class="mempty">No bookings in this period.</div>'}`;

    $('modalBackdrop').hidden = false;
  }

  function closeReportModal() { $('modalBackdrop').hidden = true; }
  $('modalClose').addEventListener('click', closeReportModal);
  $('modalBackdrop').addEventListener('click', (e) => { if (e.target.id === 'modalBackdrop') closeReportModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeReportModal(); });

  function bindPeriodNav() {
    const wkPrev = $('wkPrev'), wkNext = $('wkNext'), wkToday = $('wkToday');
    if (wkPrev) wkPrev.addEventListener('click', () => {
      selectedWeekStart = iso(addDays(D(selectedWeekStart), -7)); renderReport();
    });
    if (wkNext) wkNext.addEventListener('click', () => {
      selectedWeekStart = iso(addDays(D(selectedWeekStart), 7)); renderReport();
    });
    if (wkToday) wkToday.addEventListener('click', () => {
      selectedWeekStart = report.weekStart; renderReport();
    });
  }

  async function loadReport(force) {
    try {
      const res = await fetch('/api/booking-report' + (force ? '?refresh=1' : ''));
      const p = await res.json();
      if (!res.ok) throw new Error(p.error || 'request failed');
      report = p;
      renderReport();
      ovSoon();
      applyHeaderStats();
      // The Leads table's Bookings / Conversion columns come from this data.
      if (leads) renderLeads();
    } catch (err) {
      $('reportWrap').innerHTML = `<div class="msg err">Could not load report: ${esc(err.message)}</div>`;
    }
  }

  // Drives the header's New in 24h / Last Week / Weekly Target. Uses the same
  // lastCompletedWeekTotal() as the Report tab's panel, so the two can never
  // show different numbers for the same thing, and neither is affected by
  // whatever week is navigated to in the Report tab's hero panel.
  function applyHeaderStats() {
    if (!report) return;
    const last24h = last24hTotal(report.events);
    $('sNew').textContent = last24h;
    $('sNew').className = 'n' + (last24h > 0 ? ' fresh' : '');
    $('sLastWeek').textContent = lastCompletedWeekTotal(report);
    $('sWeeklyTarget').textContent = report.weeklyTarget;
  }

  /* ================= Meta Ads: shared formatting ================= */

  let campaigns = null;
  let campShow = 'active'; // Campaign Ads table: 'active' (running, default) or 'all'
  let adHistory = null;
  // Which year the History tab is showing. Null until the API answers, so the
  // first load takes whatever it considers current rather than guessing here.
  let historyYear = null;

  const nf0 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
  const nf2 = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const int = (n) => nf0.format(Math.round(Number(n) || 0));
  const dec = (n) => nf2.format(Number(n) || 0);

  // Precision follows magnitude: cost-per-result runs from under a riyal to
  // four figures across these campaigns, and neither end should look wrong.
  const money = (n) => {
    const v = Number(n) || 0;
    if (Math.abs(v) >= 1000) return int(v);
    if (Math.abs(v) >= 1) return dec(v);
    return v === 0 ? '0' : v.toFixed(3);
  };
  const pct = (n) => (Number.isFinite(n) ? (n * 100).toFixed(1) + '%' : '—');

  // Every derived figure in the spreadsheet was a division wrapped in IFERROR,
  // which blanks rather than showing a misleading zero. Same contract here.
  const ratio = (a, b) => (Number(b) ? Number(a) / Number(b) : null);
  const show = (v, fmt) => (v == null ? '—' : fmt(v));

    stResult: ['Result', 'What the audience said, as Maryam recorded it (poll percentages, or the replies received).'],
  };

  // data-help carries HTML into an attribute, so it goes through attr() and
  // not esc() — esc() leaves quotes alone and the value would end early.
  const hlp = (key) => {
    const entry = GLOSSARY[key];
    if (!entry) return '';
    return `data-help="${attr(`<div class="tt">${esc(entry[0])}</div><div class="tk">${esc(entry[1])}</div>`)}"`;
  };

  // The trigger has to sit on the word itself. A <th> is a full-width cell
  // with padding either side, so hanging the tooltip off the cell fires it
  // when the pointer is nowhere near the label.
  const hcol = (key, label) => `<th><span ${hlp(key)}>${esc(label)}</span></th>`;

  // Scrolling moves the table out from under a pointer that never moves, so
  // the tooltip has to be dismissed on scroll too, not only on mouseleave.
  const hideTip = () => $('tip').classList.remove('on');
  addEventListener('scroll', hideTip, true);

  // One tooltip element for the page, same one the Report bars use.
  function bindHelp(root) {
    const tip = $('tip');
    // Re-rendering replaces the node the pointer is over, so its mouseleave
    // never arrives and the tooltip would stay up over a table it no longer
    // belongs to. Clearing on every bind is what closes that hole.
    hideTip();
    const move = (e) => {
      const pad = 14;
      const r = tip.getBoundingClientRect();
      let x = e.clientX + pad;
      let y = e.clientY + pad;
      if (x + r.width > innerWidth) x = e.clientX - r.width - pad;
      if (y + r.height > innerHeight) y = e.clientY - r.height - pad;
      tip.style.left = `${x}px`;
      tip.style.top = `${y}px`;
    };
    root.querySelectorAll('[data-help], [data-tip]').forEach((el) => {
      el.addEventListener('mouseenter', (e) => {
        tip.innerHTML = el.dataset.help || el.dataset.tip;
        tip.classList.add('on');
        move(e);
      });
      el.addEventListener('mousemove', move);
      el.addEventListener('mouseleave', hideTip);
    });
  }

  // Spend against budget, as one bar. Amber as it nears the budget, red once
  // it is past it — the percentage beside it says the same thing, so colour
  // is never carrying the meaning on its own.
  const barFor = (spend, budget) => {
    const usedPct = ratio(spend, budget);
    const width = Math.min(100, (usedPct || 0) * 100);
    const state = usedPct == null ? '' : usedPct > 1 ? ' over' : usedPct >= 0.85 ? ' near' : '';
    return `<div class="abar"><div class="abar-fill${state}" style="width:${width.toFixed(1)}%"></div></div>`
      + `<span class="abar-pct">${show(usedPct, pct)}</span>`;
  };

  /* ================= campaigns tab ================= */

  // Lead quality of the running campaigns (api/campaigns.js leadQuality):
  // each campaign's project leads and high potential leads from Marina's
  // sheet since it started, beside its cost per result. Best first.
  const LQ_ORDER = { Good: 0, Watch: 1, Bad: 2 };
  const LQ_GLYPH = { Good: '▲', Watch: '■', Bad: '▼' };
  function lqPanel(p, rows) {
    const run = rows.filter((c) => c.status === 'Active' && c.leadQuality);
    if (!run.length) return '';
    const g = p.leadQuality || {};
    const sorted = [...run].sort((a, b) => {
      const qa = a.leadQuality, qb = b.leadQuality;
      return (qa.status ? LQ_ORDER[qa.status] : 9) - (qb.status ? LQ_ORDER[qb.status] : 9)
        || (qa.costPerHp ?? Infinity) - (qb.costPerHp ?? Infinity) || b.spend - a.spend;
    });
    const tip = (title, text) => `data-tip="${attr(`<div class="tt">${esc(title)}</div><div class="more">${esc(text)}</div>`)}"`;
    const body = sorted.map((c) => {
      const q = c.leadQuality;
      if (!q.linked) {
        return `<tr><td class="cname">${esc(c.name)}</td>
          <td><span class="lq-st none" ${tip('Not linked', `${q.reason}, so its leads can't be told apart in the leads sheet.`)}>○ Not linked</span></td>
          <td class="num">—</td><td class="num">—</td><td class="abar-cell">—</td>
          <td class="num">${show(c.costPerResult, money)}</td><td class="num">—</td></tr>`;
      }
      const why = `${q.why || ''}. Leads for ${q.project} in the leads sheet since ${q.since}, from any source, not only this ad.`
        + (q.sharedWith && q.sharedWith.length ? ` Shared with ${q.sharedWith.join(', ')}, which runs on the same project.` : '');
      const rate = q.hpRate;
      return `<tr>
        <td class="cname">${esc(c.name)}<div class="lq-sub">${esc(q.project)}${q.sharedWith && q.sharedWith.length ? ' · shared' : ''}</div></td>
        <td>${q.status ? `<span class="lq-st ${q.status.toLowerCase()}" ${tip(q.status, why)}>${LQ_GLYPH[q.status]} ${q.status}</span>` : `<span class="lq-st none" ${tip('Not judged', why)}>○ —</span>`}</td>
        <td class="num">${int(q.leads)}</td>
        <td class="num">${q.hp == null ? '—' : int(q.hp)}</td>
        <td class="abar-cell">${rate == null ? '—' : `<div class="abar"><div class="abar-fill lq" style="width:${Math.min(100, rate * 100).toFixed(1)}%"></div></div><span class="abar-pct">${pct(rate)}</span>`}</td>
        <td class="num">${show(c.costPerResult, money)}</td>
        <td class="num">${show(q.costPerHp, money)}</td>
      </tr>`;
    }).join('');
    const rule = `Good: at least 1 high potential lead and cost per high potential lead at or below the running average (${g.avgCostPerHp == null ? 'none yet' : `${p.currency || 'SAR'} ${money(g.avgCostPerHp)}`}). Watch: under ${g.minLeads || 5} leads so far, or above that average. Bad: ${g.minLeads || 5}+ leads and no high potential, or a high potential rate under ${Math.round((g.minHpRate || 0.1) * 100)}%. Leads are matched to a campaign by the project in its name (EB-ZNZ-EX -> ZNZ|EX), counted from its start, so they include the project's leads from any source.`;
    return `<div class="panel">
        <div class="ptitle"><span ${tip('Lead quality', rule)}>Running campaigns · lead quality</span></div>
        ${g.error ? `<div class="msg err">Leads sheet unavailable: ${esc(g.error)}</div>` : ''}
        <div class="tscroll">
          <table class="ctable">
            <thead><tr>
              <th>Campaign</th><th>Status</th><th class="num">Leads</th><th class="num">High potential</th>
              <th>High potential rate</th><th class="num">Cost / Result</th><th class="num">Cost / HP lead</th>
            </tr></thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      </div>`;
  }

  // Every 2026 campaign, each with its own budget to measure against. Budget
  // comes from Updated Budget.xlsx where the campaign ties to a plan line and
  // from a flat default where it doesn't; spend, names and status come live
  // from Meta.
  function renderCampaigns() {
    const p = campaigns;
    if (!p) return;
    if (p.error && !p.campaigns) {
      $('campaignsWrap').innerHTML = `<div class="msg err">Could not load campaign data: ${esc(p.error)}</div>`;
      return;
    }

    const cur = esc(p.currency || 'SAR');
    const t = p.totals || {};
    const allRows = [...(p.campaigns || [])].sort((a, b) => b.spend - a.spend || a.name.localeCompare(b.name));
    // Running / All filter for the table (Anton, 15 Oct 2026), running by
    // default. The year hero above keeps every campaign; the table's TOTAL
    // row sums whatever the table shows.
    const running = allRows.filter((c) => c.status === 'Active');
    const rows = campShow === 'all' ? allRows : running;
    const sum = (k) => rows.reduce((n, c) => n + (Number(c[k]) || 0), 0);
    const ft = { budget: sum('budgetSar'), spend: sum('spend'), results: sum('results'), purchases: sum('purchases'), impressions: sum('impressions') };
    ft.remaining = ft.budget - ft.spend;
    ft.costPerResult = ft.results ? ft.spend / ft.results : null;
    // Daily spend = the daily budget set in Meta on the campaign's active ad
    // sets (CBO is off, so it lives there), only for campaigns running now.
    const daily = (c) => (c.status === 'Active' && c.dailyBudget ? c.dailyBudget : null);
    ft.daily = rows.reduce((n, c) => n + (daily(c) || 0), 0);
    // Cost-per-result limit for running campaigns (api/campaigns.js cprOver).
    const lim = p.cprLimit || { report: 25, minResults: 5 };
    const overCpr = rows.filter((c) => c.cprOver);

    const body = rows.map((c) => `
      <tr>
        <td class="cname">${esc(c.name)}</td>
        <td><span class="cpill ${c.status === 'Active' ? 'on' : 'off'}">${esc(c.status || 'Inactive')}</span></td>
        <td class="num">${show(daily(c), money)}</td>
        <td class="num">${money(c.budgetSar)}</td>
        <td class="num">${money(c.spend)}</td>
        <td class="num">${money(c.remaining)}</td>
        <td class="num">${int(c.results)}</td>
        <td class="num">${c.cprOver
          ? `<span class="cpr-over" data-tip="${attr(`<div class="tt">Over the cost limit</div><div class="more">${esc(cur)} ${esc(money(c.costPerResult))} per result, limit ${esc(cur)} ${esc(int(lim.report))}. Slack was alerted when it went over.</div>`)}">▲ ${money(c.costPerResult)}</span>`
          : show(c.costPerResult, money)}</td>
        <td class="num">${int(c.purchases)}</td>
        <td class="num">${int(c.impressions)}</td>
        <td class="abar-cell">${barFor(c.spend, c.budgetSar)}</td>
      </tr>`).join('');

    $('campaignsWrap').innerHTML = `
      ${p.stale ? `<div class="msg err">Showing last known figures — ${esc(p.error || 'Meta unreachable')}</div>` : ''}

      <div class="panel">
        <div class="ptitle">Budget vs actual · ${p.year}</div>
        <div class="bvhero">
          <div class="bv-side">
            <div class="bv-lab"><span ${hlp('budget')}>Budget</span></div>
            <div class="bv-n">${money(t.budget)}</div>
            <div class="bv-s">${cur}</div>
          </div>
          <div class="bv-vs">vs</div>
          <div class="bv-side">
            <div class="bv-lab"><span ${hlp('actualSpend')}>Actual spend</span></div>
            <div class="bv-n bv-act">${money(t.spend)}</div>
            <div class="bv-s">${show(t.usedPct, pct)} of budget used</div>
          </div>
          <div class="bv-side">
            <div class="bv-lab"><span ${hlp('remaining')}>Remaining</span></div>
            <div class="bv-n">${money(t.remaining)}</div>
            <div class="bv-s">${cur}</div>
          </div>
        </div>
        <div class="bvbar">
          <div class="bvbar-track">
            <div class="bvbar-fill" style="width:${Math.min(100, (t.usedPct || 0) * 100).toFixed(1)}%"></div>
          </div>
        </div>
      </div>

      ${lqPanel(p, rows)}

      <div class="panel">
        <div class="ptitle">Budget vs actual by campaign · ${p.year}</div>
        <div class="cpr-note${overCpr.length ? ' bad' : ''}">${overCpr.length ? '▲' : '✓'}
          Cost per result limit: <b>${cur} ${int(lim.report)}</b> for running campaigns ·
          ${overCpr.length ? `<b>${overCpr.length} over</b>: ${overCpr.map((c) => esc(c.name)).join(', ')}` : 'none over'}</div>
        <div class="efilter cshow"><span class="efl">Show</span><div class="seg" id="campShowSeg">
          <button data-show="active" aria-pressed="${campShow !== 'all'}">Running · ${running.length}</button>
          <button data-show="all" aria-pressed="${campShow === 'all'}">All · ${allRows.length}</button>
        </div></div>
        <div class="tscroll">
          <table class="ctable">
            <thead><tr>
              ${hcol('campaign', 'Campaign')}${hcol('status', 'Status')}${hcol('dailySpend', 'Daily Spend')}${hcol('budget', 'Budget')}
              ${hcol('spend', 'Spend')}${hcol('remaining', 'Remaining')}
              ${hcol('results', 'Results')}${hcol('costPerResult', 'Cost / Result')}
              ${hcol('purchases', 'Purchases')}${hcol('impressions', 'Impressions')}
              ${hcol('spendVsBudget', 'Spend vs Budget')}
            </tr></thead>
            <tbody>${body || `<tr><td class="cname" colspan="11">${campShow === 'all' ? 'No campaigns.' : 'No campaign is running right now.'}</td></tr>`}</tbody>
            <tfoot><tr>
              <td class="cname">TOTAL</td>
              <td></td>
              <td class="num">${ft.daily ? money(ft.daily) : '—'}</td>
              <td class="num">${money(ft.budget)}</td>
              <td class="num">${money(ft.spend)}</td>
              <td class="num">${money(ft.remaining)}</td>
              <td class="num">${int(ft.results)}</td>
              <td class="num">${show(ft.costPerResult, money)}</td>
              <td class="num">${int(ft.purchases)}</td>
              <td class="num">${int(ft.impressions)}</td>
              <td class="abar-cell">${barFor(ft.spend, ft.budget)}</td>
            </tr></tfoot>
          </table>
        </div>
      </div>`;

    bindHelp($('campaignsWrap'));
    $('campaignsWrap').querySelectorAll('#campShowSeg [data-show]').forEach((b) => b.addEventListener('click', () => {
      campShow = b.dataset.show;
      renderCampaigns();
    }));
  }

  async function loadCampaigns(force) {
    try {
      const res = await fetch('/api/campaigns' + (force ? '?refresh=1' : ''));
      const p = await res.json();
      if (!res.ok && !p.campaigns) throw new Error(p.error || `HTTP ${res.status}`);
      campaigns = p;
      renderCampaigns();
      ovSoon();
    } catch (err) {
      if (!campaigns) {
        $('campaignsWrap').innerHTML = `<div class="msg err">Could not load campaign data: ${esc(err.message)}</div>`;
      }
    }
  }

  /* ================= history tab (one full calendar year) ================= */

  function renderHistory() {
    const p = adHistory;
    if (!p) return;
    if (p.error && !p.campaigns) {
      $('historyWrap').innerHTML = `<div class="msg err">Could not load campaign history: ${esc(p.error)}</div>`;
      return;
    }

    const t = p.totals;
    const cur = esc(p.currency);
    const nowMonth = String(p.today || '').slice(0, 7);

    const years = (p.availableYears || [p.year]).map((y) =>
      `<button data-year="${y}" aria-pressed="${y === p.year}">${y}</button>`).join('');

    // Every month of the year, spend or not. A month with no campaigns is a
    // fact about the year, so it keeps its row and shows an empty bar rather
    // than being dropped and leaving the year looking continuous.
    const peak = Math.max(0, ...p.months.map((m) => m.spend));
    const monthRows = p.months.map((m) => {
      const w = peak > 0 ? (m.spend / peak) * 100 : 0;
      return `
        <div class="m-l${m.month === nowMonth ? ' now' : ''}">${esc(m.label)}</div>
        <div class="m-b"><div class="m-f" style="width:${w.toFixed(1)}%"></div></div>
        <div class="m-v${m.spend > 0 ? '' : ' zero'}">${m.spend > 0 ? money(m.spend) : '—'}</div>`;
    }).join('');

    const body = p.campaigns.map((c) => `
      <tr>
        <td class="cname">${esc(c.name)}</td>
        <td class="num">${esc(c.firstMonth || '—')}${c.lastMonth && c.lastMonth !== c.firstMonth ? ' – ' + esc(c.lastMonth) : ''}</td>
        <td class="num">${money(c.budget)}</td>
        <td class="num">${money(c.spend)}</td>
        <td class="num">${money(c.remaining)}</td>
        <td class="num">${int(c.results)}</td>
        <td class="num">${show(c.costPerResult, money)}</td>
        <td class="num">${int(c.purchases)}</td>
        <td class="num">${int(c.impressions)}</td>
        <td class="abar-cell">${barFor(c.spend, c.budget)}</td>
      </tr>`).join('');

    $('historyWrap').innerHTML = `
      ${p.stale ? `<div class="msg err">Showing last known figures — ${esc(p.error || 'Meta unreachable')}</div>` : ''}

      <div class="panel">
        <div class="ptitle">Ad spend · ${p.year}</div>
        <div class="filters"><div class="seg" id="histYearSeg">${years}</div></div>
        <div class="bvhero">
          <div class="bv-side">
            <div class="bv-lab"><span ${hlp('budgetAssumed')}>Budget</span></div>
            <div class="bv-n">${money(t.budget)}</div>
            <div class="bv-s">${cur}</div>
          </div>
          <div class="bv-vs">vs</div>
          <div class="bv-side">
            <div class="bv-lab"><span ${hlp('actualSpend')}>Actual spend</span></div>
            <div class="bv-n bv-act">${money(t.spend)}</div>
            <div class="bv-s">${show(t.usedPct, pct)} of budget used</div>
          </div>
          <div class="bv-side">
            <div class="bv-lab"><span ${hlp('costPerResult')}>Cost per result</span></div>
            <div class="bv-n">${show(t.costPerResult, money)}</div>
            <div class="bv-s">${int(t.results)} results · ${int(t.campaigns)} campaign${t.campaigns === 1 ? '' : 's'}</div>
          </div>
        </div>
        <div class="mgrid">${monthRows}</div>
        ${p.purgedBefore ? `<div class="pnote">Meta only keeps about ${p.retentionMonths || 37} months of insights. Months before <b>${esc(p.purgedBefore)}</b> were purged at the source, so they read as empty here rather than as zero spend.</div>` : ''}
      </div>

      <div class="panel">
        <div class="ptitle">Campaigns · ${p.year}</div>
        <div class="tscroll">
          <table class="ctable">
            <thead><tr>
              ${hcol('campaign', 'Campaign')}${hcol('months', 'Months')}${hcol('budgetAssumed', 'Budget')}
              ${hcol('spend', 'Spend')}${hcol('remaining', 'Remaining')}
              ${hcol('results', 'Results')}${hcol('costPerResult', 'Cost / Result')}
              ${hcol('purchases', 'Purchases')}${hcol('impressions', 'Impressions')}
              ${hcol('spendVsBudget', 'Spend vs Budget')}
            </tr></thead>
            <tbody>${body || `<tr><td class="cname" colspan="10">No campaigns ran in ${p.year}.</td></tr>`}</tbody>
            <tfoot><tr>
              <td class="cname">TOTAL</td>
              <td></td>
              <td class="num">${money(t.budget)}</td>
              <td class="num">${money(t.spend)}</td>
              <td class="num">${money(t.remaining)}</td>
              <td class="num">${int(t.results)}</td>
              <td class="num">${show(t.costPerResult, money)}</td>
              <td class="num">${int(t.purchases)}</td>
              <td class="num">${int(t.impressions)}</td>
              <td class="abar-cell">${barFor(t.spend, t.budget)}</td>
            </tr></tfoot>
          </table>
        </div>
      </div>`;

    bindHelp($('historyWrap'));

    $('historyWrap').querySelectorAll('#histYearSeg button').forEach((b) => {
      b.addEventListener('click', () => {
        const year = Number(b.dataset.year);
        if (year === historyYear) return;
        historyYear = year;
        adHistory = null;
        $('historyWrap').innerHTML = '<div class="msg">Loading…</div>';
        loadHistory();
      });
    });
  }

  async function loadHistory(force) {
    const q = [];
    if (historyYear) q.push('year=' + historyYear);
    if (force) q.push('refresh=1');
    try {
      const res = await fetch('/api/campaign-history' + (q.length ? '?' + q.join('&') : ''));
      const p = await res.json();
      if (!res.ok && !p.campaigns) throw new Error(p.error || `HTTP ${res.status}`);
      adHistory = p;
      historyYear = p.year;
      renderHistory();
    } catch (err) {
      if (!adHistory) {
        $('historyWrap').innerHTML = `<div class="msg err">Could not load campaign history: ${esc(err.message)}</div>`;
      }
    }
  }

  /* ================= previous trips (Booking) ================= */

  let previousTrips = null;
  // Which year Previous Trips is showing. Null until the API answers — same
  // pattern as History's historyYear — so the first load takes the most
  // recent year with data rather than guessing here.
  let ptYear = null;
  let ptMonth = 'all';
  const ptOpenTrips = new Set();

  const PT_MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'];
  const PT_MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  const ptDate = (iso) => {
    const d = new Date(`${iso}T00:00:00Z`);
    return Number.isNaN(d.getTime()) ? '' : `${d.getUTCDate()} ${PT_MONTHS_SHORT[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  };

  function ptGroupTotals(rows) {
    return {
      booked: rows.reduce((sum, t) => sum + t.booked, 0),
      cancelled: rows.reduce((sum, t) => sum + t.cancelled, 0),
    };
  }

  // The dropdown only earns its place on a trip that actually has more than
  // one week to break down — a single-week trip's own date range already
  // says everything the expansion would, so it gets no button at all rather
  // than a "Weeks · 1" that opens onto one row identical to what's already
  // shown.
  function ptTripRow(t) {
    const weeks = t.weeks || [];
    const multi = weeks.length > 1;
    const cancelled = !!t.cancelledTrip;
    const open = ptOpenTrips.has(t.uuid);

    // An empty cell still fills its grid column, so Booked/Cancelled stay
    // aligned whether or not this row has a button in it.
    const weeksCell = multi ? `
      <button class="pt-toggle" data-toggle="${esc(t.uuid)}" aria-expanded="${open}">
        <span class="pt-toggle-lab"><span class="pt-ar">›</span>Weeks</span>
        <b>${weeks.length}</b>
      </button>` : '<div></div>';

    const weeksPanel = multi && open ? `
      <div class="pt-weeks">
        ${weeks.map((w) => `
          <div class="pt-wrow${w.unavailable ? ' pt-cancelled-row' : ''}">
            <div class="pt-wlabel">${esc(w.label)}${w.unavailable ? '<span class="pt-tag">Cancelled</span>' : ''}</div>
            <div class="pt-wnum">Booked <b>${int(w.booked)}</b></div>
          </div>`).join('')}
        ${t.unallocated ? `<div class="pt-unalloc">+${int(t.unallocated)} booked, week not specified</div>` : ''}
      </div>` : '';

    return `
    <div class="pt-row${cancelled ? ' pt-cancelled-row' : ''}">
      <div>
        <div class="pt-name${t.code ? ' pt-code' : ''}">${esc(t.code || t.name)}${t.charter ? '<span class="pt-charter">Charter</span>' : ''}${cancelled ? '<span class="pt-tag">Cancelled</span>' : ''}</div>
        <div class="pt-dest">${t.code ? esc(t.name) + ' · ' : ''}${esc(t.destination || '—')}</div>
      </div>
      <div class="pt-dates">${esc(ptDate(t.start))}${t.end && t.end !== t.start ? ' – ' + esc(ptDate(t.end)) : ''}</div>
      ${weeksCell}
      <div class="pt-num">Booked<br><b>${int(t.booked)}</b></div>
      <div class="pt-num pt-cancel">Cancelled<br><b>${int(t.cancelled)}</b></div>
      ${weeksPanel}
    </div>`;
  }

  // One year on screen at a time — same approach as the History tab, so a
  // long booking history doesn't turn into one endless scroll of every year
  // stacked on top of each other. Trips within the chosen year still break
  // out by month, since that grouping is what makes a busy year scannable.
  // Previous Sales charts (Muatasam, 5 Oct 2026): bookings taken per month
