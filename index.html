  // from /api/previous-trips' `sales` (counted like the Report), the same
  // month across years, and the last 12/24/36 months.
  let psMonth = null; // 0-11, defaults to the current month
  let psRange = 12;
  const PS_MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const psKey = (y, m) => `${y}-${String(m + 1).padStart(2, '0')}`;

  // One bar chart in the Report's own style. Bars: [{ label, sub, n, partial, none, tip }].
  function psChart(bars) {
    const peak = Math.max(1, ...bars.map((b) => b.n || 0));
    const step = peak > 60 ? 20 : peak > 25 ? 10 : 5;
    const max = Math.ceil((peak + 1) / step) * step;
    let chrome = '';
    for (let v = 0; v <= max; v += step) chrome += `<div class="crule" style="bottom:${(v / max) * 100}%"><span class="ct">${v}</span></div>`;
    const slots = bars.map((b) => `
      <div class="cslot ${b.n ? '' : 'zero'} ${b.partial ? 'partial' : ''}" ${b.tip ? tipOf(b.tip[0], b.tip[1]) : ''}>
        <div class="cval">${b.none ? '—' : int(b.n)}</div>
        <div class="cbar" style="height:${b.none ? 0 : ((b.n || 0) / max) * 100}%"></div>
      </div>`).join('');
    const axis = bars.map((b) => `<div class="clab ${b.partial ? 'partial' : ''}">${esc(b.label)}${b.sub ? `<br><span style="font-size:9px">${esc(b.sub)}</span>` : ''}</div>`).join('');
    const minW = bars.length > 12 ? `style="min-width:${bars.length * 34 + 30}px"` : '';
    return `<div class="ps-scroll"><div ${minW}><div class="chart">${chrome}<div class="cbars">${slots}</div></div><div class="caxis">${axis}</div></div></div>`;
  }

  function psHtml(p) {
    const sales = p.sales;
    if (!sales || !sales.months) return '';
    const months = sales.months;
    const n = (y, m) => (months[psKey(y, m)] || { n: 0 }).n;
    const today = p.today;
    const ty = Number(today.slice(0, 4));
    const tm = Number(today.slice(5, 7)) - 1;
    const td = Number(today.slice(8, 10));
    const first = Object.keys(months).sort()[0] || today.slice(0, 7);
    const fy = Number(first.slice(0, 4));
    if (psMonth == null) psMonth = tm;
    const m = psMonth;

    // ---- same month, year on year ----
    const years = [];
    for (let y = fy; y <= ty; y++) years.push(y);
    const yoy = years.map((y) => {
      const key = psKey(y, m);
      const future = y === ty && m > tm;
      const before = key < first;
      const partial = y === ty && m === tm;
      const prev = y > fy ? n(y - 1, m) : null;
      const v = n(y, m);
      const rows = [['Bookings taken', future || before ? 'no data' : int(v)]];
      if (prev != null && !future && !before && !partial && prev) rows.push([`vs ${PS_MON[m]} ${y - 1}`, `${v >= prev ? '+' : '−'}${Math.round(Math.abs(v - prev) / prev * 100)}%`]);
      return { label: String(y), sub: partial ? 'so far' : '', n: future || before ? 0 : v, none: future || before, partial, tip: [`${PS_MON[m]} ${y}`, rows] };
    });
    const pctTxt = (a, b) => (b ? `<span class="${a >= b ? 'up' : 'down'}">${a >= b ? '▲ +' : '▼ −'}${Math.round(Math.abs(a - b) / b * 100)}%</span>` : '');
    let line = '';
    if (m === tm) {
      // This month isn't over, so it's compared with the same days last year.
      const sofar = n(ty, m);
      const lastByNow = ((months[psKey(ty - 1, m)] || {}).byDay || []).slice(0, td).reduce((a, b) => a + b, 0);
      const lastFull = n(ty - 1, m);
      line = `<b>${PS_MON[m]} ${ty}</b> so far: <b>${int(sofar)}</b> · ${PS_MON[m]} ${ty - 1} by ${td} ${PS_MON[m]}: <b>${int(lastByNow)}</b> ${pctTxt(sofar, lastByNow)} · full ${PS_MON[m]} ${ty - 1}: <b>${int(lastFull)}</b>`;
    } else {
      const y = m < tm ? ty : ty - 1;
      const cur = n(y, m);
      const prev = n(y - 1, m);
      const past = years.filter((x) => x < y && psKey(x, m) >= first).map((x) => n(x, m));
      const avg = past.length ? past.reduce((a, b) => a + b, 0) / past.length : null;
      line = `<b>${PS_MON[m]} ${y}</b>: <b>${int(cur)}</b> · ${PS_MON[m]} ${y - 1}: <b>${int(prev)}</b> ${pctTxt(cur, prev)}${avg != null ? ` · average of earlier years: <b>${avg.toFixed(0)}</b>` : ''}`;
    }

    // ---- last N months ----
    const recent = [];
    for (let k = psRange - 1; k >= 0; k--) {
      const d = new Date(Date.UTC(ty, tm - k, 1));
      const y = d.getUTCFullYear();
      const mm = d.getUTCMonth();
      const partial = y === ty && mm === tm;
      recent.push({ label: PS_MON[mm], sub: partial ? 'so far' : String(y), n: n(y, mm), partial, tip: [`${PS_MON[mm]} ${y}`, [['Bookings taken', int(n(y, mm))]]] });
    }

    return `
      <div class="panel">
        <div class="ptitle">Same month, year on year · bookings taken</div>
        <div class="filters"><div class="seg ps-months" id="psMonthSeg">${PS_MON.map((x, i) => `<button data-m="${i}" aria-pressed="${i === m}">${x}</button>`).join('')}</div></div>
        ${psChart(yoy)}
        <div class="ps-line">${line}</div>
        <div class="rlegend">
          <span><i style="background:var(--fill)"></i>Bookings taken in ${PS_MON[m]}</span>
          <span><i style="background:repeating-linear-gradient(135deg,var(--fill) 0 4px,rgba(var(--fill-rgb),.35) 4px 8px)"></i>Still in progress</span>
          ${sales.charterExcluded ? `<span>${int(sales.charterExcluded)} charter booking(s) excluded, as on the Report</span>` : ''}
        </div>
      </div>
      <div class="panel">
        <div class="ptitle">Bookings taken by month</div>
        <div class="filters"><div class="seg" id="psRangeSeg">${[12, 24, 36].map((x) => `<button data-n="${x}" aria-pressed="${x === psRange}">Last ${x}</button>`).join('')}</div></div>
        ${psChart(recent)}
      </div>`;
  }

  function renderPreviousTrips() {
    const p = previousTrips;
    if (!p) return;
    if (p.error && !p.trips) {
      $('previousWrap').innerHTML = `<div class="msg err">Could not load previous projects: ${esc(p.error)}</div>`;
      return;
    }

    if (ptYear == null || !p.years.includes(ptYear)) ptYear = p.years[0] ?? null;

    const inYear = p.trips.filter((t) => t.year === ptYear);
    const filtered = inYear.filter((t) => ptMonth === 'all' || t.month === Number(ptMonth));
    const yTotals = ptGroupTotals(filtered);

    const showMonths = ptMonth === 'all';
    let body;
    if (showMonths) {
      const byMonth = new Map();
      for (const t of filtered) {
        if (!byMonth.has(t.month)) byMonth.set(t.month, []);
        byMonth.get(t.month).push(t);
      }
      // Rows arrive already sorted most-recent-first, so months only need a
      // distinct-and-descending pass, not a second re-sort by date.
      const months = [...byMonth.keys()].sort((a, b) => b - a);
      body = months.map((month) => {
        const mRows = byMonth.get(month);
        const mTotals = ptGroupTotals(mRows);
        return `
          <div class="pt-month">
            <div class="pt-mhead">
              <span class="pt-mname">${esc(PT_MONTHS[month])}</span>
              <span class="pt-mmeta">${mRows.length} project${mRows.length === 1 ? '' : 's'}</span>
              <div class="pt-mnums">
                <span>Booked <b>${int(mTotals.booked)}</b></span>
                <span class="cancel">Cancelled <b>${int(mTotals.cancelled)}</b></span>
              </div>
            </div>
            ${mRows.map(ptTripRow).join('')}
          </div>`;
      }).join('');
    } else {
      body = filtered.map(ptTripRow).join('');
    }

    const yearTabs = p.years.map((y) =>
      `<button data-year="${y}" aria-pressed="${y === ptYear}">${y}</button>`).join('');
    const monthOptions = ['<option value="all">All months</option>']
      .concat(PT_MONTHS.map((m, i) => `<option value="${i}" ${String(i) === ptMonth ? 'selected' : ''}>${esc(m)}</option>`));

    $('previousWrap').innerHTML = `
      ${p.stale ? `<div class="msg err">Showing last known figures — ${esc(p.error || 'WeTravel unreachable')}</div>` : ''}

      ${psHtml(p)}

      <div class="panel">
        <div class="ptitle">Previous projects · ${ptYear ?? '—'}</div>
        <div class="filters"><div class="seg" id="ptYearSeg">${yearTabs}</div></div>
        <div class="vhero">
          <span class="vh-n">${int(filtered.length)}</span>
          <span class="vh-s">departed project${filtered.length === 1 ? '' : 's'} · <b style="color:var(--strong)">${int(yTotals.booked)}</b> booked · <b style="color:var(--danger)">${int(yTotals.cancelled)}</b> cancelled</span>
        </div>
        <div class="filters" style="margin-top:12px">
          <select class="fselect" id="ptMonthSel">${monthOptions.join('')}</select>
          <div class="fnote">${p.trips.length} projects on record across ${p.years.length} year${p.years.length === 1 ? '' : 's'}</div>
        </div>
      </div>

      <div class="panel">
        ${body || '<div class="msg">No previous projects match this filter.</div>'}
      </div>`;

    $('previousWrap').querySelectorAll('#ptYearSeg button').forEach((b) => {
      b.addEventListener('click', () => {
        const year = Number(b.dataset.year);
        if (year === ptYear) return;
        ptYear = year;
        ptMonth = 'all';
        renderPreviousTrips();
        saveViewState();
      });
    });
    $('ptMonthSel').addEventListener('change', (e) => { ptMonth = e.target.value; renderPreviousTrips(); saveViewState(); });
    bindHelp($('previousWrap'));
    $('previousWrap').querySelectorAll('#psMonthSeg [data-m]').forEach((b) => {
      b.addEventListener('click', () => { psMonth = Number(b.dataset.m); renderPreviousTrips(); });
    });
    $('previousWrap').querySelectorAll('#psRangeSeg [data-n]').forEach((b) => {
      b.addEventListener('click', () => { psRange = Number(b.dataset.n); renderPreviousTrips(); });
    });
    $('previousWrap').querySelectorAll('[data-toggle]').forEach((b) => {
      b.addEventListener('click', () => {
        const uuid = b.dataset.toggle;
        if (ptOpenTrips.has(uuid)) ptOpenTrips.delete(uuid); else ptOpenTrips.add(uuid);
        renderPreviousTrips();
      });
    });
  }

  async function loadPreviousTrips(force) {
    try {
      const res = await fetch('/api/previous-trips' + (force ? '?refresh=1' : ''));
      const p = await res.json();
      if (!res.ok && !p.trips) throw new Error(p.error || `HTTP ${res.status}`);
      previousTrips = p;
      renderPreviousTrips();
      ovSoon();
    } catch (err) {
      if (!previousTrips) {
        $('previousWrap').innerHTML = `<div class="msg err">Could not load previous projects: ${esc(err.message)}</div>`;
      }
    }
  }

  /* ================= leads tab (Marina's sheet) ================= */

  let leads = null;
  // ManyChat's automatic count (lib/manychat.js), shown beside Marina's sheet
  // until the two agree (Anton, 21 Oct 2026).
  let mcData = null;
  // Which numbers the Leads tab draws: Marina's sheet, or ManyChat's
  // automatic count in the very same charts and table (Anton, 22 Oct 2026:
  // "make it look like the one I built for Marina's sheet").
  let leadsSrc = 'sheet';

  // ManyChat's daily counts reshaped exactly like the sheet's payload (weeks
  // of Sunday to Saturday days, per project), so renderLeads() draws them
  // unchanged. Days before the first event aren't "logged"; today counts live.
  function mcAsLeads() {
    if (!mcData || !mcData.first || !mcData.days) return null;
    const today = ovToday();
    const byDate = new Map(mcData.days.map((d) => [d.date, d]));
    const first = mcData.first;
    const sumProjects = (list) => {
      const m = new Map();
      for (const pr of list) {
        const r = m.get(pr.code) || { code: pr.code, ig: 0, wa: 0, total: 0, hp: 0, hpIg: 0, hpWa: 0 };
        for (const k of ['ig', 'wa', 'total', 'hp', 'hpIg', 'hpWa']) r[k] += pr[k] || 0;
        m.set(pr.code, r);
      }
      return [...m.values()].sort((a, b) => b.total - a.total || a.code.localeCompare(b.code));
    };
    const weeks = [];
    const lastWs = ovWeekStart(today);
    for (let ws = ovWeekStart(first); ws <= lastWs; ws = ovAdd(ws, 7)) {
      const days = [];
      for (let i = 0; i < 7; i += 1) {
        const date = ovAdd(ws, i);
        const m = byDate.get(date);
        const future = date > today;
        const rec = !future && date >= first;
        const v = (k) => (rec ? (m ? m[k] : 0) : null);
        days.push({
          date, recorded: rec, future,
          total: v('leads'), ig: v('ig'), wa: v('wa'), hp: v('hp'), hpIg: v('hpIg'), hpWa: v('hpWa'), hpOther: rec ? 0 : null, ret: v('ret'),
          projects: m ? Object.entries(m.projects || {}).filter(([, x]) => x.leads || x.hp).map(([code, x]) => ({ code, ig: x.ig || 0, wa: x.wa || 0, total: x.leads, hp: x.hp, hpIg: x.hpIg || 0, hpWa: x.hpWa || 0 })) : [],
        });
      }
      const rd = days.filter((d) => d.recorded);
      const sum = (k) => rd.reduce((a, d) => a + (d[k] || 0), 0);
      weeks.push({
        label: `${ovDate(ws)} – ${ovDate(ovAdd(ws, 6))}`, start: ws, end: ovAdd(ws, 6), current: ws === lastWs, source: 'daily',
        total: sum('total'), ig: sum('ig'), wa: sum('wa'), days, daysRecorded: rd.length, dailyTotal: sum('total'),
        hp: sum('hp'), hpIg: sum('hpIg'), hpWa: sum('hpWa'), hpOther: 0, ret: sum('ret'),
        projects: sumProjects(rd.flatMap((d) => d.projects)), issues: [],
      });
    }
    return { source: 'manychat', today, year: Number(today.slice(0, 4)), first, totals: { leads: weeks.reduce((a, w) => a + w.total, 0) }, weeks };
  }
  const leadsSrcBar = () => `<div class="seg subtabs" role="tablist" aria-label="Where the numbers come from">
      <button role="tab" data-lsrc="sheet" aria-pressed="${leadsSrc === 'sheet'}" aria-selected="${leadsSrc === 'sheet'}">Marina's sheet</button>
      <button role="tab" data-lsrc="mc" aria-pressed="${leadsSrc === 'mc'}" aria-selected="${leadsSrc === 'mc'}">ManyChat · automatic</button>
    </div>`;
  const bindLeadsSrc = () => $('leadsWrap').querySelectorAll('[data-lsrc]').forEach((b) => b.addEventListener('click', () => {
    if (leadsSrc === b.dataset.lsrc) return;
    leadsSrc = b.dataset.lsrc;
    leadsDay = null;
    renderLeads();
  }));
  // The week on screen, by its start date. Null means "whichever week is
  // current", so the tab rolls into the next week on its own, which is the
  // behaviour Muatasam asked for.
  let leadsWeek = null;
  // A day tapped in the daily chart, whose breakdown the table then shows.
  // Null means the table shows the whole week. Cleared whenever the week
  // changes, since the day belongs to the week it was picked from.
  let leadsDay = null;

  const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const dayOf = (day) => new Date(`${day}T00:00:00Z`);
  const dayName = (day) => {
    const d = dayOf(day);
    return `${WEEKDAYS[d.getUTCDay()]} ${d.getUTCDate()} ${PT_MONTHS_SHORT[d.getUTCMonth()]}`;
  };

  // Tooltip rows for a chart mark. attr(), not esc(): this goes inside an
  // attribute, and esc() would let a quote end it early.
  const tipOf = (title, rows, note) => `data-tip="${attr(
    `<div class="tt">${esc(title)}</div>`
    + rows.map(([k, v]) => `<div class="trow"><span class="tk">${esc(k)}</span><b>${esc(v)}</b></div>`).join('')
    + (note ? `<div class="more">${esc(note)}</div>` : ''),
  )}"`;

  // A "nice" chart top, so the gridline lands on a round number.
  function niceTop(v) {
    if (!(v > 0)) return 1;
    const mag = 10 ** Math.floor(Math.log10(v));
    const n = v / mag;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  }

  // IG and WA only stack when they genuinely add up to the total. When the
  // sheet has no split, or its split doesn't add up (a typo in one row), the
  // column is one combined block, so it never shows a breakdown that isn't
  // true.
  const splits = (total, ig, wa) => ig != null && wa != null && ig + wa === total;
  function leadStack(total, ig, wa, px, thin) {
    if (!total) return '';
    const inner = splits(total, ig, wa)
      ? `${wa ? `<i class="lseg wa" style="flex:${wa}"></i>` : ''}${ig ? `<i class="lseg ig" style="flex:${ig}"></i>` : ''}`
      : '<i class="lseg all" style="flex:1"></i>';
    return `<span class="lstack${thin ? ' thin' : ''}" style="height:${Math.max(2, px)}px">${inner}</span>`;
  }

  // The team's daily targets, set by Muatasam (6 Oct 2026).
  const LEADS_DAILY_TARGET = 20;
  const HP_DAILY_TARGET = 5;

  function dailyChart(w, today, picked) {
    const H = 130;
    // The scale always reaches the leads target, so its line is on the chart
    // even on a quiet week.
    const top = Math.max(LEADS_DAILY_TARGET, ...w.days.map((d) => d.total || 0));
    const cols = w.days.map((d) => {
      const name = dayName(d.date) + (d.date === today ? ' (today)' : '');
      if (d.future) return `<div class="lcol future" ${tipOf(name, [['Status', 'Still to come']])}><span class="lval"></span></div>`;
      if (!d.recorded) return `<div class="lcol missing" ${tipOf(name, [['Status', 'Not logged in the sheet']])}><span class="lval">—</span></div>`;
      const rows = splits(d.total, d.ig, d.wa)
        ? [['WhatsApp', int(d.wa)], ['Instagram', int(d.ig)], ['Total', int(d.total)]]
        : [['IG + WA', int(d.total)]];
      rows.push(['Target ' + LEADS_DAILY_TARGET, d.total >= LEADS_DAILY_TARGET ? '✓ reached' : `${LEADS_DAILY_TARGET - d.total} short`]);
      if (d.hp != null) {
        if (d.hpWa != null && d.hpIg != null) rows.push(['HP WhatsApp', int(d.hpWa)], ['HP Instagram', int(d.hpIg)]);
        rows.push(['High potential', `${int(d.hp)} of ${HP_DAILY_TARGET}`]);
      }
      const on = d.date === picked;
      const hpBar = d.hp ? `<span class="lhp1"><b class="lhpn">${int(d.hp)}</b><i class="lhpbar" style="height:${Math.max(2, (d.hp / top) * H)}px"></i></span>` : '';
      return `<button class="lcol${on ? ' sel' : ''}" data-day="${attr(d.date)}" aria-pressed="${on}" ${tipOf(name, rows, on ? 'Tap again for the whole week' : 'Tap for this day\'s breakdown')}><span class="lval">${int(d.total)}</span><span class="lpair">${leadStack(d.total, d.ig, d.wa, (d.total / top) * H)}${hpBar}</span></button>`;
    }).join('');
    const axis = w.days.map((d) => {
      const dt = dayOf(d.date);
      const cls = [d.date === today ? 'on' : '', d.date === picked ? 'pick' : ''].filter(Boolean).join(' ');
      return `<span class="${cls}">${WEEKDAYS[dt.getUTCDay()]}<b>${dt.getUTCDate()}</b></span>`;
    }).join('');
    const line = (n, c, label) => `<div class="ltgt" style="--c:${c};bottom:${(n / top) * H}px"><span>${label}</span></div>`;
    const anyHp = w.days.some((d) => d.hp != null);
    const lines = line(LEADS_DAILY_TARGET, 'var(--tgt-leads)', `${LEADS_DAILY_TARGET} LEADS`)
      + (anyHp ? line(HP_DAILY_TARGET, 'var(--tgt-hp)', `${HP_DAILY_TARGET} HP`) : '');
    const legend = `<div class="lleg">
      <span><i style="background:var(--lead-wa)"></i>WhatsApp</span>
      <span><i style="background:var(--lead-ig)"></i>Instagram</span>
      ${anyHp ? '<span><i style="background:var(--tgt-hp)"></i>High potential (HP)</span>' : ''}
      <span><span class="ltl" style="--c:var(--tgt-leads)"></span>Target ${LEADS_DAILY_TARGET} leads a day</span>
      ${anyHp ? `<span><span class="ltl" style="--c:var(--tgt-hp)"></span>Target ${HP_DAILY_TARGET} HP a day</span>` : ''}
    </div>`;
    return `<div class="lchart"><div class="lplot tg" style="height:${H + 20}px">${lines}${cols}</div><div class="laxis tg">${axis}</div></div>${legend}`;
  }

  // Overall conversion (Muatasam, 8 Oct 2026): all bookings taken in a week
  // divided by all leads that week, beside the per-project one. Weekly only,
  // since a day is too small to mean anything. Target at least 10%; around
  // 10% means lead quality needs to improve.
  const CONV_TARGET = 0.10;
  // The days a week's leads come from: the logged days, or the whole week
  // when it only exists as one of Marina's weekly report totals.
  const leadDaysOf = (w) => (w.days && w.days.length ? new Set(w.days.filter((d) => d.recorded && !d.future).map((d) => d.date)) : null);
  const weekConv = (w) => {
    const bk = leadBookings(w.start, w.end, leadDaysOf(w));
    if (!bk || !w.total) return null;
    return { bookings: bk.all, leads: w.total, rate: bk.all / w.total };
  };

  function convChart(weeks, sel) {
    const H = 120;
    const rows = weeks.map((w) => ({ w, c: weekConv(w) }));
    if (!rows.some((r) => r.c)) return '<div class="msg">Bookings are still loading.</div>';
    const top = niceTop(Math.max(CONV_TARGET * 1.5, ...rows.map((r) => (r.c ? r.c.rate : 0))));
    let lastMonth = -1;
    const cols = [];
    const axis = [];
    for (const { w, c } of rows) {
      const on = w.start === sel.start;
      if (!c) {
        cols.push(`<div class="lcol"><span class="lval"></span></div>`);
      } else {
        const ok = c.rate >= CONV_TARGET;
        const tip = tipOf(w.label + (w.current ? ' · this week so far' : ''), [
          ['Bookings', int(c.bookings)], ['Leads', int(c.leads)], ['Conversion', pct(c.rate)],
          ['Target ' + pct(CONV_TARGET), ok ? '▲ reached' : '▼ below'],
        ]);
        cols.push(`<button class="lcol${on ? ' sel' : ''}" data-week="${attr(w.start)}" ${tip}><span class="lval">${on ? pct(c.rate) : ''}</span><span class="lstack thin" style="height:${Math.max(2, (c.rate / top) * H)}px"><i class="lseg ${ok ? 'cv-ok' : 'cv-low'}" style="flex:1"></i></span></button>`);
      }
      const m = dayOf(w.start).getUTCMonth();
      axis.push(`<span class="${on ? 'on' : ''}">${m !== lastMonth ? PT_MONTHS_SHORT[m] : '&nbsp;'}</span>`);
      lastMonth = m;
    }
    const line = `<div class="ltgt" style="--c:var(--tgt-leads);bottom:${(CONV_TARGET / top) * H}px"><span>${pct(CONV_TARGET).replace('.0', '')} TARGET</span></div>`;
    const grid = `<div class="lgl" style="bottom:${H}px"><span>${Math.round(top * 100)}%</span></div>`;
    return `<div class="lscroll"><div class="lchart"><div class="lplot gut tg" style="height:${H + 20}px">${grid}${line}${cols.join('')}</div><div class="laxis lweeks gut tg">${axis.join('')}</div></div></div>
      <div class="lleg">
        <span><i style="background:var(--q-high)"></i>▲ ${pct(CONV_TARGET).replace('.0', '')} or more</span>
        <span><i style="background:var(--q-low)"></i>▼ Under ${pct(CONV_TARGET).replace('.0', '')}</span>
        <span><span class="ltl" style="--c:var(--tgt-leads)"></span>Target ${pct(CONV_TARGET).replace('.0', '')}</span>
      </div>`;
  }

  function weeklyChart(weeks, sel) {
    const H = 150;
    const top = niceTop(Math.max(1, ...weeks.map((w) => w.total || 0)));
    const peak = Math.max(0, ...weeks.map((w) => w.total || 0));
    let lastMonth = -1;
    const cols = [];
    const axis = [];
    for (const w of weeks) {
      const on = w.start === sel.start;
      const rows = splits(w.total, w.ig, w.wa)
        ? [['WhatsApp', int(w.wa)], ['Instagram', int(w.ig)], ['Total', int(w.total)]]
        : [['IG + WA', int(w.total)]];
      const note = w.issues.length ? w.issues[0] : (w.source === 'daily' && w.current ? 'Weekly report not filled in yet, so this is the days logged so far' : '');
      // Values only where they earn it: the selected week and the peak.
      const val = on || (w.total === peak && peak > 0) ? int(w.total) : '';
      cols.push(`<button class="lcol${on ? ' sel' : ''}" data-week="${attr(w.start)}" ${tipOf(w.label + (w.current ? ' · this week' : ''), rows, note)}><span class="lval">${val}</span>${leadStack(w.total, w.ig, w.wa, (w.total / top) * H, true)}</button>`);
      const m = dayOf(w.start).getUTCMonth();
      axis.push(`<span class="${on ? 'on' : ''}">${m !== lastMonth ? PT_MONTHS_SHORT[m] : '&nbsp;'}</span>`);
      lastMonth = m;
    }
    const grid = `<div class="lgl" style="bottom:${H}px"><span>${int(top)}</span></div><div class="lgl" style="bottom:${H / 2}px"><span>${int(top / 2)}</span></div>`;
    return `<div class="lscroll"><div class="lchart"><div class="lplot gut" style="height:${H + 20}px">${grid}${cols.join('')}</div><div class="laxis lweeks gut">${axis.join('')}</div></div></div>`;
  }

  // Bookings taken per lead project between two Muscat dates (inclusive),
  // from the Report's events, which carry each trip's destination (pd) and
  // programme (pg) code. A lead code "ZNZ|BL" matches both; "SL" (no
  // programme in Marina's code) matches the destination alone; "NA" named
  // no trip, so it has nothing to match. Charters are left out, as on the
  // Report. Null until the Report data has loaded.
  // `only` (a Set of days) limits the bookings to the days whose leads are
  // counted, so conversion never divides bookings from days with no leads
  // logged (today, or before ManyChat started) by the leads it has
  // (Anton, 22 Oct 2026: "make sure that the Conversion % is accurate").
  function leadBookings(start, end, only) {
    if (!report || !report.events) return null;
    const out = { all: 0, by: (code) => {
      if (!code || code === 'NA') return null;
      const [d, g] = String(code).split('|');
      let n = 0;
      for (const e of out.rows) if (e.pd === d && (!g || e.pg === g)) n += e.n;
      return n;
    }, rows: [] };
    for (const e of report.events) {
      if (e.x || !e.n) continue;
      const day = new Date(Date.parse(e.at) + 4 * 3600 * 1000).toISOString().slice(0, 10);
      if (day < start || day > end) continue;
      if (only && !only.has(day)) continue;
      out.all += e.n;
      out.rows.push(e);
    }
    return out;
  }

  function renderLeads() {
    if (!leads) return;
    const p = leadsSrc === 'mc' ? mcAsLeads() : leads;
    if (!p) {
      $('leadsWrap').innerHTML = `${leadsSrcBar()}<div class="panel"><div class="msg">${mcData ? 'ManyChat hasn\'t sent any leads yet.' : 'Loading ManyChat…'}</div></div>`;
      bindLeadsSrc();
      return;
    }
    if (p.error && !p.weeks) {
      $('leadsWrap').innerHTML = `<div class="msg err">Could not load leads: ${esc(p.error)}</div>`;
      return;
    }
    const weeks = p.weeks || [];
    if (!weeks.length) {
      $('leadsWrap').innerHTML = '<div class="msg">No leads in the sheet yet.</div>';
      return;
    }
    const current = weeks.find((w) => w.current) || weeks[weeks.length - 1];
    const sel = weeks.find((w) => w.start === leadsWeek) || current;
    const today = p.today;

    // ---- headline figures for the week on screen ----
    const logged = (sel.days || []).filter((d) => d.recorded && !d.future);
    const best = logged.reduce((b, d) => (!b || d.total > b.total ? d : b), null);
    const todayDay = (sel.days || []).find((d) => d.date === today);
    const spanDays = Math.round((dayOf(sel.end) - dayOf(sel.start)) / 86400000) + 1;
    // Averaged from the same number the headline shows: the weekly report's
    // total over the whole week once there is one, otherwise the days logged
    // so far. Mixing the two would print an average that doesn't multiply
    // back to the total above it.
    const perDay = sel.source === 'report'
      ? sel.total / spanDays
      : (logged.length ? sel.dailyTotal / logged.length : null);
    const split = splits(sel.total, sel.ig, sel.wa);

    const selConv = weekConv(sel);
    const second = sel.current
      ? `<div class="bv-side">
          <div class="bv-lab"><span ${hlp('leadsToday')}>Today</span></div>
          <div class="bv-n">${todayDay && todayDay.recorded ? int(todayDay.total) : '—'}</div>
          <div class="bv-s">${todayDay && todayDay.recorded ? esc(dayName(today)) : 'not logged yet'}</div>
        </div>`
      : `<div class="bv-side">
          <div class="bv-lab"><span ${hlp('leadsBest')}>Busiest day</span></div>
          <div class="bv-n">${best ? int(best.total) : '—'}</div>
          <div class="bv-s">${best ? esc(dayName(best.date)) : 'days not logged'}</div>
        </div>`;

    // A tapped day only counts if it's a logged day in the week on screen.
    const day = leadsDay && sel.days ? sel.days.find((d) => d.date === leadsDay && d.recorded && !d.future) || null : null;
    if (!day) leadsDay = null;

    const daily = sel.days
      ? `${dailyChart(sel, today, day && day.date)}<div class="pnote">Tap a day to see its breakdown below.</div>`
      : `<div class="pnote">Only the weekly total was recorded for this week, not the daily numbers.</div>`;

    // ---- the breakdown table: the tapped day, or the whole week ----
    // The count comes straight after the name, so it's on screen even on a
    // phone where the table scrolls. WhatsApp/Instagram columns only appear
    // when the sheet splits every project: columns of dashes read as "no
    // breakdown at all" and hid the numbers that do exist.
    const src = day || sel;
    const scope = day ? 'day' : 'week';
    const srcLabel = day ? dayName(day.date) : sel.label;
    const srcSplit = splits(src.total, src.ig, src.wa);
    const projSplit = src.projects.length > 0 && src.projects.every((x) => x.ig != null && x.wa != null);
    const hpKnown = src.hp != null;
    // High potential per channel (Anton, 8 Oct 2026) when every HP in the
    // period names its channel; otherwise the single overall column.
    const hpSplit = hpKnown && src.hpWa != null && src.hpIg != null;
    const hpPill = (n) => (n ? `<span class="lhp">${int(n)}</span>` : '<span class="rv-na">0</span>');
    const projCols = (projSplit ? 6 : 4) + (hpKnown ? (hpSplit ? 2 : 1) : 0);
    // Bookings in the same week (or the day picked) beside the leads, and the
    // conversion between them (Anton, 5 Oct 2026).
    const bk = leadBookings(day ? day.date : sel.start, day ? day.date : sel.end, day ? null : leadDaysOf(sel));
    const convCell = (b, l) => {
      if (b == null || !l) return '<td class="abar-cell"><span class="rv-na">—</span></td>';
      const r = b / l;
      // No minimum width at 0%, so an empty bar never shows a green dot.
      return `<td class="abar-cell"><div class="abar"><div class="abar-fill" style="width:${Math.min(100, r * 100).toFixed(1)}%;background:var(--fill-full)${r ? '' : ';min-width:0'}"></div></div><span class="abar-pct"><b>${pct(r)}</b></span></td>`;
    };
    const projRows = src.projects.map((x) => {
      const b = bk ? bk.by(x.code) : null;
      return `
      <tr>
        <td class="cname">${esc(x.code === 'NA' ? 'NA (no trip given)' : x.code)}</td>
        <td class="num"><b>${int(x.total)}</b></td>
        ${hpSplit ? `<td class="num">${hpPill(x.hpWa)}</td><td class="num">${hpPill(x.hpIg)}</td>` : hpKnown ? `<td class="num">${hpPill(x.hp)}</td>` : ''}
        ${projSplit ? `<td class="num">${int(x.wa)}</td><td class="num">${int(x.ig)}</td>` : ''}
        <td class="num">${b == null ? '<span class="rv-na">—</span>' : int(b)}</td>
        ${convCell(b, x.total)}
      </tr>`;
    }).join('');
    // The channel split, said in words when the sheet has it for the total
    // but not project by project, so it's never only in a hover tooltip.
    const splitLine = srcSplit && !projSplit
      ? `<div class="lsplit"><span><i style="background:var(--lead-wa)"></i>WhatsApp <b>${int(src.wa)}</b></span><span><i style="background:var(--lead-ig)"></i>Instagram <b>${int(src.ig)}</b></span></div>`
      : '';
    const splitNote = !srcSplit && src.projects.length
      ? `<div class="pnote">WhatsApp vs Instagram isn't split in the sheet for this ${scope} yet, so it can't be shown here.</div>`
      : '';

    // The week picker (Anton, 6 Oct 2026, instead of Prev / This week / Next):
    // newest first, each labelled with its weekdays. Weeks since 23 Sep run
    // Sunday to Saturday like the Report; older ones follow Marina's weekly
    // reports, which don't, so they say so.
    const sunSat = (w) => dayOf(w.start).getUTCDay() === 0 && dayOf(w.end).getUTCDay() === 6;
    const weekOptions = [...weeks].reverse().map((w) => {
      const tag = w.current ? ' · this week' : (!sunSat(w) && w.source === 'report' ? ' · weekly report' : '');
      return `<option value="${w.current ? '' : attr(w.start)}"${w === sel ? ' selected' : ''}>${esc(dayName(w.start))} – ${esc(dayName(w.end))}${tag}</option>`;
    }).join('');

    const anyCombined = weeks.some((w) => w.total && !splits(w.total, w.ig, w.wa));

    const fromMc = p.source === 'manychat';
    const mcSince = fromMc ? ovDate(p.first) : '';
    $('leadsWrap').innerHTML = `
      ${leadsSrcBar()}
      ${p.stale ? `<div class="msg err">Showing the last copy of the sheet — ${esc(p.error || 'OneDrive unreachable')}</div>` : ''}

      <div class="panel">
        <div class="lhead">
          <div class="ptitle">Daily leads · ${esc(sel.label)}${sel.current ? ' · this week' : ''}${fromMc ? ' · ManyChat' : ''}</div>
          <div class="efilter"><span class="efl">Week</span><select class="fselect" id="leadsWeekSel" aria-label="Choose a week">${weekOptions}</select></div>
        </div>
        <div class="bvhero">
          <div class="bv-side">
            <div class="bv-lab"><span ${hlp('leadsWeek')}>${sel.current ? 'Leads this week' : 'Leads'}</span></div>
            <div class="bv-n bv-act">${int(sel.total)}</div>
            <div class="bv-s">${split ? `WhatsApp ${int(sel.wa)} · Instagram ${int(sel.ig)}` : 'WhatsApp + Instagram'}</div>
          </div>
          ${fromMc ? `<div class="bv-side">
            <div class="bv-lab"><span ${hlp('leadsRet')}>Returning</span></div>
            <div class="bv-n">${int(sel.ret || 0)}</div>
            <div class="bv-s">${int(sel.total - (sel.ret || 0))} new · ${int(sel.ret || 0)} returning</div>
          </div>` : ''}
          <div class="bv-side">
            <div class="bv-lab"><span ${hlp('leadsHp')}>High potential</span></div>
            <div class="bv-n">${sel.hp == null ? '—' : int(sel.hp)}</div>
            <div class="bv-s">${sel.hp == null ? 'not recorded this week' : sel.hpWa != null && sel.hpIg != null ? `WhatsApp ${int(sel.hpWa)} · Instagram ${int(sel.hpIg)}` : sel.total ? `${pct(sel.hp / sel.total)} of leads` : 'HP leads'}</div>
          </div>
          ${second}
          <div class="bv-side">
            <div class="bv-lab"><span ${hlp('leadsConvAll')}>Conversion</span></div>
            <div class="bv-n ${selConv ? (selConv.rate >= CONV_TARGET ? 'cv-up' : 'cv-down') : ''}">${selConv ? `${selConv.rate >= CONV_TARGET ? '▲' : '▼'} ${pct(selConv.rate)}` : '—'}</div>
            <div class="bv-s">${selConv ? `${int(selConv.bookings)} bookings ÷ ${int(selConv.leads)} leads · target ${pct(CONV_TARGET).replace('.0', '')}` : 'bookings still loading'}</div>
          </div>
          <div class="bv-side">
            <div class="bv-lab"><span ${hlp('leadsAvg')}>Per day</span></div>
            <div class="bv-n">${perDay == null ? '—' : perDay.toFixed(1).replace(/\.0$/, '')}</div>
            <div class="bv-s">average</div>
          </div>
        </div>
        ${daily}
        ${sel.issues.map((t) => `<div class="pnote warn">⚠ ${esc(t)} — worth checking in the sheet.</div>`).join('')}
      </div>

      <div class="panel" id="leadsBreakdown">
        <div class="lhead">
          <div class="ptitle">Leads by project · ${esc(srcLabel)}</div>
          ${day ? '<div class="lnav"><button data-day-clear>Whole week</button></div>' : ''}
        </div>
        ${splitLine}
        <div class="tscroll">
          <table class="ctable">
            <thead><tr>
              ${hcol('project', 'Project')}${hcol('leadsTotal', 'Leads')}${hpSplit ? hcol('leadsHpWa', 'HP · WhatsApp') + hcol('leadsHpIg', 'HP · Instagram') : hpKnown ? hcol('leadsHp', 'HP') : ''}
              ${projSplit ? hcol('leadsWa', 'WhatsApp') + hcol('leadsIg', 'Instagram') : ''}
              ${hcol('leadsBooked', 'Bookings')}${hcol('leadsConv', 'Conversion')}
            </tr></thead>
            <tbody>${projRows || `<tr><td class="cname" colspan="${projCols}">No leads logged for this ${scope} yet.</td></tr>`}</tbody>
            <tfoot><tr>
              <td class="cname">TOTAL</td>
              <td class="num">${int(src.total)}</td>
              ${hpSplit ? `<td class="num"><span class="lhp">${int(src.hpWa)}</span></td><td class="num"><span class="lhp">${int(src.hpIg)}</span></td>` : hpKnown ? `<td class="num"><span class="lhp">${int(src.hp)}</span></td>` : ''}
              ${projSplit ? `<td class="num">${srcSplit ? int(src.wa) : '—'}</td><td class="num">${srcSplit ? int(src.ig) : '—'}</td>` : ''}
              <td class="num">${bk ? int(bk.all) : '—'}</td>
              ${convCell(bk ? bk.all : null, src.total)}
            </tr></tfoot>
          </table>
        </div>
        ${splitNote}
        ${hpKnown && src.hpOther ? `<div class="pnote">${int(src.hpOther)} high-potential lead${src.hpOther === 1 ? '' : 's'} named a project with no leads in this ${scope}, or none, so ${src.hpOther === 1 ? 'it is' : 'they are'} only in the TOTAL.</div>` : ''}
        ${!hpKnown ? `<div class="pnote">High-potential (HP) leads weren't recorded for this ${scope} in the sheet.</div>` : ''}
      </div>

      <div class="panel">
        <div class="ptitle"><span ${hlp('leadsConvAll')}>Weekly conversion · all bookings ÷ all leads</span></div>
        ${convChart(weeks, sel)}
      </div>

      <div class="panel">
        <div class="ptitle">Weekly leads · ${fromMc ? `ManyChat since ${esc(mcSince)}` : esc(String(p.year))} · ${int(p.totals.leads)} so far</div>
        ${weeklyChart(weeks, sel)}
        <div class="lleg">
          <span><i style="background:var(--lead-wa)"></i>WhatsApp</span>
          <span><i style="background:var(--lead-ig)"></i>Instagram</span>
          ${anyCombined ? '<span><i style="background:var(--lead-all)"></i>WhatsApp + Instagram together (the sheet has no clean split)</span>' : ''}
        </div>
      </div>`;

    // On a phone the weekly chart scrolls sideways and opened on January,
    // with the week that matters off to the right. Bring the selected week
    // into view, but only when it isn't already, so clicking a visible week
    // doesn't make the chart jump.
    // Both weekly charts (conversion and leads) scroll this way.
    $('leadsWrap').querySelectorAll('.lscroll').forEach((sc) => {
      const selCol = sc.querySelector('.lcol.sel');
      if (selCol && sc.scrollWidth > sc.clientWidth) {
        const x = selCol.getBoundingClientRect().left - sc.getBoundingClientRect().left;
        if (x < 0 || x + selCol.offsetWidth > sc.clientWidth) {
          sc.scrollLeft += x - sc.clientWidth + selCol.offsetWidth * 3;
        }
      }
    });

    bindHelp($('leadsWrap'));

    // A new week always opens on its whole-week breakdown.
    bindLeadsSrc();
    $('leadsWrap').querySelectorAll('[data-week]').forEach((b) => {
      b.addEventListener('click', () => { leadsWeek = b.dataset.week; leadsDay = null; renderLeads(); });
    });
    const weekSel = $('leadsWrap').querySelector('#leadsWeekSel');
    if (weekSel) weekSel.addEventListener('change', () => { leadsWeek = weekSel.value || null; leadsDay = null; renderLeads(); });
    // Tapping a day shows its breakdown; tapping it again goes back to the
    // week. The table is brought into view (only as far as needed), since on
    // a phone it can sit below the fold.
    const showBreakdown = () => {
      const t = $('leadsBreakdown');
      if (t && typeof t.scrollIntoView === 'function') t.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    };
    $('leadsWrap').querySelectorAll('[data-day]').forEach((b) => {
      b.addEventListener('click', () => {
        leadsDay = leadsDay === b.dataset.day ? null : b.dataset.day;
        renderLeads();
        showBreakdown();
      });
    });
    const clear = $('leadsWrap').querySelector('[data-day-clear]');
    if (clear) clear.addEventListener('click', () => { leadsDay = null; renderLeads(); });
  }

  async function loadMc(force) {
    try {
      const r = await fetch('/api/sheets?name=manychat' + (force ? '&refresh=1' : ''));
      mcData = await r.json();
    } catch (e) {
      mcData = { error: e.message };
    }
    if (leads) renderLeads();
    ovSoon();
  }

  async function loadLeads(force) {
    if (!mcData || force) loadMc(force);
    try {
      const res = await fetch('/api/sheets?name=leads' + (force ? '&refresh=1' : ''));
      const p = await res.json();
      if (!res.ok && !p.weeks) throw new Error(p.error || `HTTP ${res.status}`);
      leads = p;
      renderLeads();
      ovSoon();
    } catch (err) {
      if (!leads) $('leadsWrap').innerHTML = `<div class="msg err">Could not load leads: ${esc(err.message)}</div>`;
    }
  }

  /* ================= engagements tab (Maryam's sheet) ================= */

  let engagements = null;
  // 'all' or a 'YYYY-MM' month key.
  let engMonth = 'all';
  // 'all' or a content type as Maryam writes it (Reel, Carousel...). Posts
  // only: stories have a poll type instead, so they follow the month alone.
  // How the Posts table is ordered (Anton, 5 Oct 2026): "newest" by default,
  // else "<field>-desc" / "<field>-asc". A post with no value for the field
  // always goes last, whichever way it's sorted.
  let engSort = 'newest';
  // Posts | Stories (Anton, 5 Oct 2026: "I only want to show Posts and
  // Stories", in place of the content-type filter) and the stories' own sort.
  let engSub = 'posts';
  let storySort = 'newest';
  const STORY_SORTS = [
    ['newest', 'Newest first'], ['oldest', 'Oldest first'],
    ['rate-desc', 'Top performing (response rate)'], ['rate-asc', 'Lowest response rate'],
    ['views-desc', 'Views: high to low'], ['views-asc', 'Views: low to high'],
    ['responses-desc', 'Responses: high to low'], ['responses-asc', 'Responses: low to high'],
  ];
  const ENG_SORTS = [
    ['newest', 'Newest first'], ['oldest', 'Oldest first'],
    ['views-desc', 'Views: high to low'], ['views-asc', 'Views: low to high'],
    ['engagement-desc', 'Top performing (engagement)'], ['engagement-asc', 'Lowest engagement'],
    ['likes-desc', 'Likes: high to low'], ['likes-asc', 'Likes: low to high'],
    ['comments-desc', 'Comments: high to low'], ['comments-asc', 'Comments: low to high'],
    ['shares-desc', 'Shares: high to low'], ['shares-asc', 'Shares: low to high'],
    ['saves-desc', 'Saves: high to low'], ['saves-asc', 'Saves: low to high'],
  ];

  const shortDay = (day) => {
    const d = dayOf(day);
    return `${d.getUTCDate()} ${PT_MONTHS_SHORT[d.getUTCMonth()]}`;
  };
  const pctOf = (v) => (v == null ? '—' : `${(v * 100).toFixed(2)}%`);

  // Views per post, one bar each in date order. A single series, so the
  // panel title names it and there's no legend; values sit on the peak and
  // the latest post only, the rest are in the tooltips.
  function engChart(posts) {
    const H = 150;
    const top = niceTop(Math.max(1, ...posts.map((x) => x.views || 0)));
    const peak = Math.max(0, ...posts.map((x) => x.views || 0));
    let lastMonth = -1;
    const cols = [];
    const axis = [];
    posts.forEach((x, i) => {
      const rows = [['Views', int(x.views)], ['Engagement', pctOf(x.engagement)], ['Likes', int(x.likes)], ['Comments', int(x.comments)], ['Shares', int(x.shares)]];
      if (x.saves != null) rows.push(['Saves', int(x.saves)]);
      const label = x.views === peak || i === posts.length - 1 ? int(x.views) : '';
      const px = Math.max(2, ((x.views || 0) / top) * H);
      cols.push(`<div class="lcol" ${tipOf(`${x.name} · ${x.type || ''} · ${x.date ? shortDay(x.date) : x.dateText}`, rows)}><span class="lval">${label}</span><span class="lstack thin" style="height:${px}px"><i class="lseg eng" style="flex:1"></i></span></div>`);
      const m = x.date ? dayOf(x.date).getUTCMonth() : lastMonth;
      axis.push(`<span>${m !== lastMonth ? PT_MONTHS_SHORT[m] : '&nbsp;'}</span>`);
      lastMonth = m;
    });
    const grid = `<div class="lgl" style="bottom:${H}px"><span>${compactNum(top)}</span></div><div class="lgl" style="bottom:${H / 2}px"><span>${compactNum(top / 2)}</span></div>`;
    // Wide enough for thin bars, and no wider: a month's handful of posts
    // fits a phone, the whole quarter scrolls. (The Leads chart's fixed
    // 620px minimum is sized for 39 weeks.)
    const minW = Math.max(240, posts.length * 18 + 40);
    return `<div class="lscroll"><div class="lchart" style="min-width:${minW}px"><div class="lplot gut" style="height:${H + 20}px">${grid}${cols.join('')}</div><div class="laxis gut">${axis.join('')}</div></div></div>`;
  }
  // "16,477" -> "16k" for the gridline labels only; values elsewhere stay exact.
  const compactNum = (n) => (n >= 1000 ? `${(n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, '')}k` : int(n));

  function renderEngagements() {
    const p = engagements;
    if (!p) return;
    if (p.error && !p.posts) {
      $('engagementsWrap').innerHTML = `<div class="msg err">Could not load engagements: ${esc(p.error)}</div>`;
      return;
    }
    if (engMonth !== 'all' && !p.months.includes(engMonth)) engMonth = 'all';
    const inMonth = (x) => engMonth === 'all' || (x.date || '').slice(0, 7) === engMonth;
    const posts = p.posts.filter(inMonth);
    const stories = p.stories.filter(inMonth);
    const period = engMonth === 'all'
      ? (p.months.length ? `${PT_MONTHS_SHORT[Number(p.months[0].slice(5)) - 1]} – ${PT_MONTHS_SHORT[Number(p.months[p.months.length - 1].slice(5)) - 1]} ${p.year}` : String(p.year))
      : `${PT_MONTHS[Number(engMonth.slice(5)) - 1]} ${engMonth.slice(0, 4)}`;

    const sum = (list, key) => list.reduce((acc, x) => acc + (x[key] || 0), 0);
    const views = sum(posts, 'views');
    const interactions = sum(posts, 'interactions');
    const rate = views ? interactions / views : null;
    const best = posts.reduce((b, x) => (x.engagement != null && (!b || x.engagement > b.engagement) ? x : b), null);

    const pills = ['all', ...p.months].map((m) => `<button data-eng-month="${attr(m)}" aria-pressed="${m === engMonth}">${m === 'all' ? 'All' : PT_MONTHS_SHORT[Number(m.slice(5)) - 1]}</button>`).join('');
    const maxRate = Math.max(0.0001, ...posts.map((x) => x.engagement || 0));
    if (!ENG_SORTS.some(([k]) => k === engSort)) engSort = 'newest';
    const sortedPosts = [...posts]; // posts arrive oldest first
    if (engSort === 'newest') sortedPosts.reverse();
    else if (engSort !== 'oldest') {
      const [field, dir] = engSort.split('-');
      const sign = dir === 'asc' ? 1 : -1;
      sortedPosts.sort((a, b) => {
        const av = a[field];
        const bv = b[field];
        if (av == null && bv == null) return 0;
        if (av == null) return 1;
        if (bv == null) return -1;
        return (av - bv) * sign || String(a.date || '').localeCompare(String(b.date || ''));
      });
    }
    const postRows = sortedPosts.map((x) => `
      <tr>
        <td class="cname"><span dir="auto">${esc(x.name)}</span><span class="esub"><span class="etype-sub">${esc(x.type || '—')} · </span>${esc([x.date ? shortDay(x.date) : x.dateText, x.language].filter(Boolean).join(' · '))}</span></td>
        <td class="etype">${esc(x.type || '—')}</td>
        <td class="num"><b>${int(x.views)}</b></td>
        <td class="abar-cell"><div class="abar"><div class="abar-fill eng" style="width:${(((x.engagement || 0) / maxRate) * 100).toFixed(1)}%"></div></div><span class="abar-pct">${pctOf(x.engagement)}</span></td>
        <td class="num">${int(x.likes)}</td>
        <td class="num">${int(x.comments)}</td>
        <td class="num">${int(x.shares)}</td>
        <td class="num">${x.saves == null ? '—' : int(x.saves)}</td>
        <td>${esc(x.ctaPresent === 'Open' || !x.ctaWord ? (x.ctaPresent || '—') : x.ctaWord)}</td>
      </tr>`).join('');

    const maxResp = Math.max(0.0001, ...stories.map((x) => (x.views ? (x.responses || 0) / x.views : 0)));
    const rateOf = (x) => (x.views ? (x.responses || 0) / x.views : null);
    if (!STORY_SORTS.some(([k]) => k === storySort)) storySort = 'newest';
    const sortedStories = [...stories]; // oldest first
    if (storySort === 'newest') sortedStories.reverse();
    else if (storySort !== 'oldest') {
      const [field, dir] = storySort.split('-');
      const sign = dir === 'asc' ? 1 : -1;
      const val = (x) => (field === 'rate' ? rateOf(x) : x[field]);
      sortedStories.sort((a, b) => {
        const av = val(a);
        const bv = val(b);
        if (av == null && bv == null) return 0;
        if (av == null) return 1;
        if (bv == null) return -1;
        return (av - bv) * sign || String(a.date || '').localeCompare(String(b.date || ''));
      });
    }
    const storyRows = sortedStories.map((x) => {
      const r = x.views ? (x.responses || 0) / x.views : null;
      return `
      <tr>
        <td class="cname"><span dir="auto">${esc(x.name)}</span><span class="esub">${esc([x.kind, x.date ? shortDay(x.date) : x.dateText, x.language].filter(Boolean).join(' · '))}</span>${x.question ? `<span class="esub" dir="auto">“${esc(x.question)}”</span>` : ''}</td>
        <td class="num"><b>${int(x.views)}</b></td>
        <td class="num">${x.responses == null ? '—' : int(x.responses)}${x.responsesUnit ? `<span class="esub">${esc(x.responsesUnit)}</span>` : ''}</td>
        <td class="abar-cell"><div class="abar"><div class="abar-fill eng" style="width:${(((r || 0) / maxResp) * 100).toFixed(1)}%"></div></div><span class="abar-pct">${r == null ? '—' : pct(r)}</span></td>
        <td class="eres" dir="auto">${esc(x.result || '—')}</td>
      </tr>`;
    }).join('');
    const sViews = sum(stories, 'views');
    const sResp = sum(stories, 'responses');

    // Top performing: the three best by engagement (posts) or response rate
    // (stories), each with a bar scaled to the best of the three.
    const topList = (rows, label, valueOf, sub) => {
      const top = rows.filter((x) => valueOf(x) != null && valueOf(x) > 0).sort((a, b) => valueOf(b) - valueOf(a) || (b.views || 0) - (a.views || 0)).slice(0, 3);
      if (!top.length) return '';
      const best3 = valueOf(top[0]);
      return `
      <div class="panel">
        <div class="ptitle">Top performing · ${esc(label)} · ${esc(period)}</div>
        <div class="et-list">${top.map((x, k) => `
          <div class="et-row">
            <span class="et-rank">${k + 1}</span>
            <div class="et-main"><div class="et-name" dir="auto">${esc(x.name)}</div><div class="et-sub">${esc(sub(x))}</div></div>
            <div class="abar"><div class="abar-fill eng" style="width:${((valueOf(x) / best3) * 100).toFixed(1)}%"></div></div>
            <b class="et-val">${pct(valueOf(x))}</b>
          </div>`).join('')}</div>
      </div>`;
    };
    const postSub = (x) => [x.type, x.date ? shortDay(x.date) : x.dateText, `${int(x.views)} views`].filter(Boolean).join(' · ');
    const storySub = (x) => [x.kind, x.date ? shortDay(x.date) : x.dateText, `${int(x.views)} views`].filter(Boolean).join(' · ');

    const subtabs = `
      <div class="seg subtabs" role="tablist" aria-label="Engagement sections">
        <button role="tab" data-eng-sub="posts" aria-pressed="${engSub === 'posts'}" aria-selected="${engSub === 'posts'}">Posts <span class="ecount">${int(posts.length)}</span></button>
        <button role="tab" data-eng-sub="stories" aria-pressed="${engSub === 'stories'}" aria-selected="${engSub === 'stories'}">Stories <span class="ecount">${int(stories.length)}</span></button>
      </div>`;
    const sortSelect = (id, list, cur) => `<div class="efilter"><span class="efl">Sort by</span><select class="fselect" id="${id}" aria-label="Sort">${list.map(([k, l]) => `<option value="${k}"${k === cur ? ' selected' : ''}>${l}</option>`).join('')}</select></div>`;

    const postsHtml = `
      <div class="panel">
        <div class="ptitle">Instagram posts · ${esc(period)}</div>
        <div class="efilters">
          <div class="efilter"><span class="efl">Month</span><div class="seg">${pills}</div></div>
        </div>
        <div class="bvhero">
          <div class="bv-side">
            <div class="bv-lab"><span ${hlp('engPosts')}>Posts</span></div>
            <div class="bv-n">${int(posts.length)}</div>
          </div>
          <div class="bv-side">
            <div class="bv-lab"><span ${hlp('engViews')}>Views</span></div>
            <div class="bv-n bv-act">${int(views)}</div>
            <div class="bv-s">${int(interactions)} interactions</div>
          </div>
          <div class="bv-side">
            <div class="bv-lab"><span ${hlp('engRate')}>Engagement</span></div>
            <div class="bv-n">${pctOf(rate)}</div>
            <div class="bv-s">of views</div>
          </div>
          <div class="bv-side">
            <div class="bv-lab"><span ${hlp('engBest')}>Best post</span></div>
            <div class="bv-n">${best ? pctOf(best.engagement) : '—'}</div>
            <div class="bv-s" dir="auto">${best ? esc(best.name) : ''}</div>
          </div>
        </div>
        ${posts.length ? `<div class="ptitle" style="margin-top:16px">Views per post</div>${engChart(posts)}` : '<div class="pnote">No posts in this month.</div>'}
      </div>

      ${topList(posts, 'posts', (x) => x.engagement, postSub)}

      <div class="panel">
        <div class="lhead"><div class="ptitle">Posts · ${esc(period)}</div>${sortSelect('engSortSel', ENG_SORTS, engSort)}</div>
        <div class="tscroll">
          <table class="ctable">
            <thead><tr>
              ${hcol('engPosts', 'Post')}<th class="etype"><span ${hlp('engType')}>Type</span></th>${hcol('engViews', 'Views')}${hcol('engRate', 'Engagement')}
              ${hcol('engLikes', 'Likes')}${hcol('engComments', 'Comments')}${hcol('engShares', 'Shares')}
              ${hcol('engSaves', 'Saves')}${hcol('engCta', 'CTA')}
            </tr></thead>
            <tbody>${postRows || '<tr><td class="cname" colspan="9">No posts in this month.</td></tr>'}</tbody>
            <tfoot><tr>
              <td class="cname">TOTAL</td>
              <td class="etype"></td>
              <td class="num">${int(views)}</td>
              <td class="abar-cell"><span class="abar-pct">${pctOf(rate)}</span></td>
              <td class="num">${int(sum(posts, 'likes'))}</td>
              <td class="num">${int(sum(posts, 'comments'))}</td>
              <td class="num">${int(sum(posts, 'shares'))}</td>
              <td class="num">${int(sum(posts, 'saves'))}</td>
              <td></td>
            </tr></tfoot>
          </table>
        </div>
      </div>`;

    const storiesHtml = `
      <div class="panel">
        <div class="ptitle">Instagram stories · ${esc(period)}</div>
        <div class="efilters">
          <div class="efilter"><span class="efl">Month</span><div class="seg">${pills}</div></div>
        </div>
        <div class="bvhero">
          <div class="bv-side"><div class="bv-lab"><span ${hlp('engPosts')}>Stories</span></div><div class="bv-n">${int(stories.length)}</div></div>
          <div class="bv-side"><div class="bv-lab"><span ${hlp('stViews')}>Views</span></div><div class="bv-n bv-act">${int(sViews)}</div></div>
          <div class="bv-side"><div class="bv-lab"><span ${hlp('stResponses')}>Responses</span></div><div class="bv-n">${int(sResp)}</div></div>
          <div class="bv-side"><div class="bv-lab"><span ${hlp('stRate')}>Response rate</span></div><div class="bv-n">${sViews ? pct(sResp / sViews) : '—'}</div></div>
        </div>
      </div>

      ${topList(stories, 'stories', rateOf, storySub)}

      <div class="panel">
        <div class="lhead"><div class="ptitle">Stories · ${esc(period)}</div>${sortSelect('storySortSel', STORY_SORTS, storySort)}</div>
        ${stories.length ? `
        <div class="tscroll">
          <table class="ctable">
            <thead><tr>
              ${hcol('engPosts', 'Story')}${hcol('stViews', 'Views')}${hcol('stResponses', 'Responses')}
              ${hcol('stRate', 'Response rate')}${hcol('stResult', 'Result')}
            </tr></thead>
            <tbody>${storyRows}</tbody>
            <tfoot><tr>
              <td class="cname">TOTAL</td>
              <td class="num">${int(sViews)}</td>
              <td class="num">${int(sResp)}</td>
              <td class="abar-cell"><span class="abar-pct">${sViews ? pct(sResp / sViews) : '—'}</span></td>
              <td></td>
            </tr></tfoot>
          </table>
        </div>` : '<div class="pnote">No stories in the sheet for this month.</div>'}
      </div>`;

    $('engagementsWrap').innerHTML = `
      ${p.stale ? `<div class="msg err">Showing the last copy of the sheet — ${esc(p.error || 'OneDrive unreachable')}</div>` : ''}
      ${subtabs}
      ${engSub === 'stories' ? storiesHtml : postsHtml}`;

    bindHelp($('engagementsWrap'));
    $('engagementsWrap').querySelectorAll('[data-eng-month]').forEach((b) => {
      b.addEventListener('click', () => { engMonth = b.dataset.engMonth; renderEngagements(); });
    });
    $('engagementsWrap').querySelectorAll('[data-eng-sub]').forEach((b) => {
      b.addEventListener('click', () => { engSub = b.dataset.engSub; renderEngagements(); });
    });
    const sortSel = $('engagementsWrap').querySelector('#engSortSel');
    if (sortSel) sortSel.addEventListener('change', () => { engSort = sortSel.value; renderEngagements(); });
    const storySel = $('engagementsWrap').querySelector('#storySortSel');
    if (storySel) storySel.addEventListener('change', () => { storySort = storySel.value; renderEngagements(); });
  }

  async function loadEngagements(force) {
    try {
      const res = await fetch('/api/sheets?name=engagements' + (force ? '&refresh=1' : ''));
      const p = await res.json();
      if (!res.ok && !p.posts) throw new Error(p.error || `HTTP ${res.status}`);
      engagements = p;
      renderEngagements();
      ovSoon();
    } catch (err) {
      if (!engagements) $('engagementsWrap').innerHTML = `<div class="msg err">Could not load engagements: ${esc(err.message)}</div>`;
    }
  }

  /* ================= trips tab (Trip Decision Dashboard sheet) ================= */

  let tripsData = null;
  // Which sub-tab of Trips is open: 'overview' or 'products'.
  let tripsSub = 'overview';
  const tripFilter = { region: 'all', quality: 'all', status: 'all' };
  // Trips whose analysis/actions row is open, by name, so it survives a
  // filter change and the 5-minute refresh.
  const tripsOpen = new Set();

  const Q_ORDER = ['High', 'Medium', 'Low', 'R&D'];
  const Q_STYLE = {
    High: { c: 'var(--q-high)', g: '▲' },
    Medium: { c: 'var(--q-med)', g: '■' },
    Low: { c: 'var(--q-low)', g: '▼' },
    'R&D': { c: 'var(--q-rd)', g: '◆' },
  };
  const qStyle = (q) => Q_STYLE[q] || { c: 'var(--q-none)', g: '○' };
  // A status colour as text is blended with the strongest ink so it reads in
  // both themes (amber on white was 1.8:1).
  const qGlyph = (q) => `<i style="color:color-mix(in srgb, ${qStyle(q).c} 50%, var(--strong))">${qStyle(q).g}</i>`;
  const qPill = (q) => (q ? `<span class="trp-pill" style="background:color-mix(in srgb, ${qStyle(q).c} 22%, transparent)">${qGlyph(q)}${esc(q)}</span>` : '—');
  const usd = (n) => (n == null ? '—' : `$${int(n)}`);

  function renderTrips() {
    const p = tripsData;
    if (!p) return;
    if (p.error && !p.trips) {
      $('tripsWrap').innerHTML = `<div class="msg err">Could not load trips: ${esc(p.error)}</div>`;
      return;
    }
    const t = p.totals;

    // ---- where the weeks go ----
    const rated = p.byQuality.filter((q) => q.trips > 0 || Q_ORDER.includes(q.quality));
    const segs = rated.filter((q) => q.weeks > 0).map((q) => `
      <div class="trp-seg" style="flex:${q.weeks};background:${qStyle(q.quality).c}" ${tipOf(q.quality, [['Trips', int(q.trips)], ['Weeks', int(q.weeks)], ['Share of weeks', pct(q.share)]], q.whatToDo)}>${q.share >= 0.08 ? int(q.weeks) : ''}</div>`).join('');
    const legend = rated.map((q) => `<span class="trp-q">${qGlyph(q.quality)}${esc(q.quality)} <b>${int(q.weeks)}</b> wk · ${pct(q.share)}</span>`).join('');
    const guideRows = rated.map((q) => `
      <tr>
        <td class="trp-l">${qPill(q.quality)}</td>
        <td class="trp-txt">${esc(q.meaning || '')}</td>
        <td class="num">${int(q.trips)}</td>
        <td class="num">${int(q.weeks)}</td>
        <td class="abar-cell"><div class="abar"><div class="abar-fill" style="width:${(q.share * 100).toFixed(1)}%;background:${qStyle(q.quality).c}"></div></div><span class="abar-pct">${pct(q.share)}</span></td>
        <td class="trp-txt">${esc(q.whatToDo || '')}</td>
      </tr>`).join('');

    // ---- quality by region ----
    const regionRows = p.byRegion.map((r) => {
      const mini = Q_ORDER.filter((q) => r[`${q}Weeks`] > 0).map((q) => `<div style="flex:${r[`${q}Weeks`]};background:${qStyle(q).c}"></div>`).join('');
      return `
      <tr>
        <td class="cname">${esc(r.region)}</td>
        ${Q_ORDER.map((q) => `<td class="num">${r[q] ? int(r[q]) : '<span style="color:var(--text-3)">0</span>'}</td>`).join('')}
        <td class="num"><b>${int(r.trips)}</b></td>
        <td class="num">${int(r.weeks)}</td>
        <td ${tipOf(r.region, Q_ORDER.map((q) => [q, `${int(r[`${q}Weeks`])} wk`]))}>${r.weeks ? `<div class="trp-mini">${mini}</div>` : '<span style="color:var(--text-3)">no weeks yet</span>'}</td>
      </tr>`;
    }).join('');

    // ---- R&D pipeline, as a board ----
    // One column per stage, left to right the way a product moves through
    // R&D, with On hold set apart since it's off the main path. Stages get a
    // stepper and one accent rather than colours of their own: green, yellow
    // and red already mean High/Medium/Low quality on this tab.
    const STAGES = [
      { key: 'Not Started', label: 'Not started', steps: 0 },
      { key: 'In Progress', label: 'In progress', steps: 2 },
      { key: 'Complete', label: 'Complete', steps: 3 },
      { key: 'On Hold', label: 'On hold', steps: 1, hold: true },
    ];
    const stageOf = (x) => STAGES.find((st) => st.key.toLowerCase() === String(x.rdStatus || '').toLowerCase()) || null;
    // "Not sure (unknown)" is the sheet's placeholder for no PIC yet.
    const ownerOf = (x) => (x.pic && !/not sure|unknown/i.test(x.pic) ? x.pic : null);
    const rdCard = (x, st) => {
      const owner = ownerOf(x);
      const steps = [0, 1, 2].map((i) => `<i class="${i < st.steps ? 'on' : ''}"></i>`).join('');
      return `
        <div class="trp-card${st.hold ? ' hold' : ''}">
          <div class="trp-card-top">
            <div class="trp-card-name">${esc(x.name)}</div>
            ${x.year ? `<span class="trp-year${x.year === Number(String(p.asOf).slice(0, 4)) ? ' now' : ''}">${x.year}</span>` : ''}
          </div>
          <div class="trp-sub">${esc([x.category, x.region, x.destination].filter(Boolean).join(' · '))}</div>
          <div class="trp-stepper${st.key === 'Complete' ? ' done' : ''}${st.hold ? ' paused' : ''}" ${tipOf(x.name, [['R&D status', st.label]])}>${steps}<span>${st.key === 'Complete' ? '✓ ' : st.hold ? '⏸ ' : ''}${esc(st.label)}</span></div>
          <div class="trp-owner">${owner ? `<b>${esc(owner.charAt(0).toUpperCase())}</b>${esc(owner)}` : '<em>No owner yet</em>'}</div>
          ${x.rdNext ? `<div class="trp-next"><span>Next step</span>${esc(x.rdNext)}</div>` : ''}
        </div>`;
    };
    const rdCols = STAGES.map((st) => {
      const list = p.rd.filter((x) => stageOf(x) === st).sort((a, b) => (a.year || 9999) - (b.year || 9999) || a.name.localeCompare(b.name));
      return `
        <div class="trp-col${st.hold ? ' hold' : ''}">
          <div class="trp-col-head">${esc(st.label)} <span class="ecount">${list.length}</span></div>
          ${list.map((x) => rdCard(x, st)).join('') || '<div class="trp-col-empty">None</div>'}
        </div>`;
    }).join('');
    // Anything with a status the board doesn't know still shows, in a row
    // of its own, rather than silently dropping off.
    const rdOther = p.rd.filter((x) => !stageOf(x));
    const byYear = [...new Set(p.rd.map((x) => x.year).filter(Boolean))].sort().map((y) => `${y}: <b>${p.rd.filter((x) => x.year === y).length}</b>`).join(' · ');
    const stageStrip = STAGES.map((st) => {
      const n = p.rd.filter((x) => stageOf(x) === st).length;
      const cls = st.key === 'Complete' ? ' done' : st.hold ? ' paused' : st.steps === 0 ? ' idle' : '';
      return n ? `<div class="trp-strip-seg${cls}" style="flex:${n}" ${tipOf(st.label, [['Trips', int(n)]])}>${n}<span>&nbsp;${esc(st.label.toLowerCase())}</span></div>` : '';
    }).join('');

    // ---- all products, filtered ----
    const opts = (key) => [...new Set(p.trips.map((x) => x[key]).filter(Boolean))];
    const regions = p.byRegion.map((r) => r.region);
    const qualities = Q_ORDER.filter((q) => p.trips.some((x) => x.quality === q));
    const statuses = opts('status');
    for (const [key, list] of [['region', regions], ['quality', qualities], ['status', statuses]]) {
      if (tripFilter[key] !== 'all' && !list.includes(tripFilter[key])) tripFilter[key] = 'all';
    }
    const passes = (x, skip) => ['region', 'quality', 'status'].every((k) => k === skip || tripFilter[k] === 'all' || x[k] === tripFilter[k]);
    const shown = p.trips.filter((x) => passes(x));
    // Each button counts what it would show given the other two filters.
    const pills = (key, list) => ['all', ...list].map((v) => {
      const n = p.trips.filter((x) => passes(x, key) && (v === 'all' || x[key] === v)).length;
      return `<button data-trip-f="${key}" data-trip-v="${attr(v)}" aria-pressed="${tripFilter[key] === v}">${v === 'all' ? 'All' : (key === 'quality' ? qGlyph(v) + ' ' : '') + esc(v)} <span class="ecount">${n}</span></button>`;
    }).join('');

    const COLS = 9;
    const productRows = shown.map((x) => {
      const hasDetail = x.analysis || x.actions || x.notes || x.rdNext;
      const open = hasDetail && tripsOpen.has(x.name);
      const priceSub = x.oldPrice != null && x.newPrice != null && x.oldPrice !== x.newPrice
        ? `was ${usd(x.oldPrice)} · ${x.priceChange != null ? `${x.priceChange > 0 ? '+' : ''}${(x.priceChange * 100).toFixed(1)}%` : ''}`
        : (x.oldPrice != null && x.newPrice == null ? 'existing price' : (x.newPrice != null ? 'no change' : ''));
      const detail = open ? `
        <tr class="trp-detail"><td colspan="${COLS}"><dl class="trp-dl" dir="auto">
          ${x.analysis ? `<dt>Detailed analysis</dt><dd>${esc(x.analysis)}</dd>` : ''}
          ${x.actions ? `<dt>Corrective actions</dt><dd>${esc(x.actions)}</dd>` : ''}
          ${x.notes ? `<dt>Additional notes</dt><dd>${esc(x.notes)}</dd>` : ''}
          ${x.rdNext ? `<dt>R&amp;D next step</dt><dd>${esc(x.rdNext)}</dd>` : ''}
        </dl></td></tr>` : '';
      return `
      <tr>
        <td class="cname">${esc(x.name)}<span class="trp-sub">${esc([x.category, x.destination].filter(Boolean).join(' · '))}</span>${hasDetail ? `<button class="trp-toggle" data-trip-open="${attr(x.name)}" aria-expanded="${!!open}">${open ? 'Hide details' : 'Details'}</button>` : ''}</td>
        <td class="trp-l">${esc(x.region || '—')}</td>
        <td class="num">${x.weeks == null ? '—' : int(x.weeks)}</td>
        <td class="num">${x.days == null ? '—' : int(x.days)}</td>
        <td class="num"><b>${usd(x.newPrice ?? x.oldPrice)}</b>${priceSub ? `<span class="trp-sub nw">${esc(priceSub)}</span>` : ''}</td>
        <td class="trp-l">${qPill(x.quality)}</td>
        <td class="trp-l">${esc(x.status || '—')}</td>
        <td class="trp-txt trp-dec">${esc(x.decision || '—')}</td>
        <td class="trp-l">${esc(x.pic || '—')}</td>
      </tr>${detail}`;
    }).join('');

    // Two sub-tabs, so the page isn't one long scroll: the decision overview
    // (tiles, quality guide, regions, R&D), and the full product list with
    // its filters. Filters and opened Details are kept across switches.
    const overviewHtml = `
      <div class="panel">
        <div class="ptitle">Trip decisions · which products to grow, optimise, or stop</div>
        <div class="bvhero trp-tiles">
          <div class="bv-side"><div class="bv-lab"><span ${hlp('trProducts')}>Trip products</span></div><div class="bv-n">${int(t.trips)}</div></div>
          <div class="bv-side"><div class="bv-lab"><span ${hlp('trWeeks')}>Departure weeks</span></div><div class="bv-n bv-act">${int(t.weeks)}</div></div>
          ${Q_ORDER.map((q) => `<div class="bv-side"><div class="bv-lab"><span class="trp-q">${qGlyph(q)}${esc(q)}</span></div><div class="bv-n">${int(t[q] || 0)}</div><div class="bv-s">trips</div></div>`).join('')}
        </div>
        <div class="trp-bar" role="img" aria-label="Departure weeks by quality">${segs}</div>
        <div class="trp-leg">${legend}</div>
        <div class="tscroll" style="margin-top:14px">
          <table class="ctable">
            <thead><tr>
              <th class="trp-l"><span ${hlp('trQuality')}>Rating</span></th><th class="trp-l"><span ${hlp('trMeaning')}>What it means</span></th>
              ${hcol('trTrips', 'Trips')}${hcol('trWeeks', 'Weeks')}${hcol('trShare', '% of weeks')}<th class="trp-l"><span ${hlp('trTodo')}>What we do</span></th>
            </tr></thead>
            <tbody>${guideRows}</tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="ptitle">Quality by region</div>
        <div class="tscroll">
          <table class="ctable">
            <thead><tr>
              ${hcol('trRegion', 'Region')}${Q_ORDER.map((q) => `<th><span class="trp-q">${qGlyph(q)}${esc(q)}</span></th>`).join('')}
              ${hcol('trTrips', 'Trips')}${hcol('trWeeks', 'Weeks')}<th class="trp-l"><span ${hlp('trMix')}>Weeks by quality</span></th>
            </tr></thead>
            <tbody>${regionRows}</tbody>
            <tfoot><tr>
              <td class="cname">TOTAL</td>
              ${Q_ORDER.map((q) => `<td class="num">${int(t[q] || 0)}</td>`).join('')}
              <td class="num">${int(t.trips)}</td><td class="num">${int(t.weeks)}</td><td></td>
            </tr></tfoot>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="ptitle">R&amp;D pipeline · ${int(p.rd.length)} trip${p.rd.length === 1 ? '' : 's'}</div>
        ${p.rd.length ? `
        <div class="trp-strip-wrap">
          <div class="trp-strip">${stageStrip}</div>
          <div class="trp-leg"><span>Launching ${byYear}</span></div>
        </div>
        <div class="trp-board">${rdCols}</div>
        ${rdOther.length ? `<div class="trp-board">${rdOther.map((x) => rdCard(x, { key: x.rdStatus || '', label: x.rdStatus || 'No status', steps: 0 })).join('')}</div>` : ''}`
          : '<div class="pnote">Nothing in R&amp;D right now.</div>'}
      </div>
`;
    const productsHtml = `
      <div class="panel">
        <div class="ptitle">All products · ${int(shown.length)} of ${int(p.trips.length)}</div>
        <div class="efilters">
          <div class="efilter"><span class="efl">Region</span><div class="seg">${pills('region', regions)}</div></div>
          <div class="efilter"><span class="efl">Quality</span><div class="seg">${pills('quality', qualities)}</div></div>
          <div class="efilter"><span class="efl">Status</span><div class="seg">${pills('status', statuses)}</div></div>
        </div>
        <div class="tscroll">
          <table class="ctable">
            <thead><tr>
              ${hcol('trTrip', 'Trip')}<th class="trp-l"><span ${hlp('trRegion')}>Region</span></th>${hcol('trWeeks', 'Weeks')}${hcol('trDays', 'Days')}
              ${hcol('trPrice', 'Price')}<th class="trp-l"><span ${hlp('trQuality')}>Quality</span></th><th class="trp-l"><span ${hlp('trStatus')}>Status</span></th>
              <th class="trp-l"><span ${hlp('trDecision')}>Decision</span></th><th class="trp-l"><span ${hlp('trPic')}>PIC</span></th>
            </tr></thead>
            <tbody>${productRows || `<tr><td class="cname" colspan="${COLS}">No trips match these filters.</td></tr>`}</tbody>
          </table>
        </div>
      </div>`;
    const subtabs = `
      <div class="seg subtabs" role="tablist" aria-label="Trips sections">
        <button role="tab" data-trip-sub="overview" aria-pressed="${tripsSub === 'overview'}" aria-selected="${tripsSub === 'overview'}">Overview</button>
        <button role="tab" data-trip-sub="products" aria-pressed="${tripsSub === 'products'}" aria-selected="${tripsSub === 'products'}">All products <span class="ecount">${int(p.trips.length)}</span></button>
      </div>`;

    $('tripsWrap').innerHTML = `
      ${p.stale ? `<div class="msg err">Showing the last copy of the sheet — ${esc(p.error || 'OneDrive unreachable')}</div>` : ''}

      ${subtabs}
      ${tripsSub === 'products' ? productsHtml : overviewHtml}`;

    bindHelp($('tripsWrap'));
    $('tripsWrap').querySelectorAll('[data-trip-sub]').forEach((b) => {
      b.addEventListener('click', () => {
        if (tripsSub === b.dataset.tripSub) return;
        tripsSub = b.dataset.tripSub;
        renderTrips();
        // Switching from far down the page shouldn't leave you mid-way into
        // the other section: bring the tab bar back into view.
        const bar = $('tripsWrap').querySelector('.subtabs');
        if (bar && bar.getBoundingClientRect().top < 0 && typeof bar.scrollIntoView === 'function') bar.scrollIntoView({ block: 'start' });
      });
    });
    $('tripsWrap').querySelectorAll('[data-trip-f]').forEach((b) => {
      b.addEventListener('click', () => { tripFilter[b.dataset.tripF] = b.dataset.tripV; renderTrips(); });
    });
    $('tripsWrap').querySelectorAll('[data-trip-open]').forEach((b) => {
      b.addEventListener('click', () => {
        const n = b.dataset.tripOpen;
        if (tripsOpen.has(n)) tripsOpen.delete(n); else tripsOpen.add(n);
        renderTrips();
      });
    });
  }

  async function loadTrips(force) {
    try {
      const res = await fetch('/api/sheets?name=trips' + (force ? '&refresh=1' : ''));
      const p = await res.json();
      if (!res.ok && !p.trips) throw new Error(p.error || `HTTP ${res.status}`);
      tripsData = p;
      renderTrips();
    } catch (err) {
      if (!tripsData) $('tripsWrap').innerHTML = `<div class="msg err">Could not load trips: ${esc(err.message)}</div>`;
    }
  }

  /* ================= feedback tab (trip survey sheet) ================= */

  let feedback = null;
  // Which sub-tab of Feedback is open: 'overview', 'ratings' or 'comments'.
  let fbSub = 'overview';
  // Year / month / programme / trip, shared by Overview, Ratings and Comments.
  const fbF = { year: 'all', month: 'all', prog: 'all', trip: 'all' };
  const fbFilter = { prog: 'all', kind: 'all' };
  // Trips whose scores are open, by id, so they survive the 5-minute refresh.
  const fbOpen = new Set();

  // The sheet's own bands for a 1-5 score.
  const fbBand = (v) => (v >= 4 ? 'var(--q-high)' : v >= 3 ? 'var(--q-med)' : 'var(--q-low)');
  const fbNum = (v) => (Number.isInteger(v) ? String(v) : v.toFixed(2).replace(/0$/, ''));
  const fbMonth = (key) => {
    const [y, m] = String(key).split('-').map(Number);
    return y && m ? new Date(Date.UTC(y, m - 1, 1)).toLocaleString('en-US', { month: 'short', year: 'numeric', timeZone: 'UTC' }) : String(key);
  };
  const fbBar = (v, color, max = 5) => `<div class="abar"><div class="abar-fill" style="width:${Math.max(0, Math.min(100, (v / max) * 100)).toFixed(1)}%;background:${color}"></div></div>`;
  const fbScore = (label, sub, v) => `<div class="fb-score"><span>${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ''}</span>${fbBar(v, fbBand(v))}<b>${fbNum(v)}</b></div>`;
  // The sheet has four surveys (Building / Medical, Teaching, Wellness,
  // Explorer); the tab shows three groups (Anton, 5 Oct 2026: "only show and
  // filter Volunteering, Wellness, and Explore ... no need to split per
  // programme"). Building, Medical and Teaching are Volunteering.
  const FB_GROUPS = ['Volunteering', 'Wellness', 'Explore'];
  const fbGroupName = (name) => {
    const n = String(name || '');
    if (/building|medical|teach|volunt/i.test(n)) return 'Volunteering';
    if (/wellness/i.test(n)) return 'Wellness';
    if (/explor/i.test(n)) return 'Explore';
    return n || 'Other';
  };
  // Concerns and suggestions ahead of praise, as the sheet orders them.
  const FB_KINDS = ['Concern', 'Suggestion', 'Praise', 'Testimonial'];

  function renderFeedback() {
    const p = feedback;
    if (!p) return;
    if (p.error && !p.trips) {
      $('feedbackWrap').innerHTML = `<div class="msg err">Could not load feedback: ${esc(p.error)}</div>`;
      return;
    }
    // ---- filters: year, month, programme, trip (Anton, 19 Oct 2026) ----
    // Shared by all three views. Options come from the trips in the sheet,
    // each counted given the other filters, so nothing empty is offered.
    const progName = (x) => fbGroupName(x.template || x.programme);
    const ym = (x) => String(x.month || '');
    const fbPass = (x, skip) => (skip === 'year' || fbF.year === 'all' || ym(x).slice(0, 4) === fbF.year)
      && (skip === 'month' || fbF.month === 'all' || ym(x) === fbF.month)
      && (skip === 'prog' || fbF.prog === 'all' || progName(x) === fbF.prog)
      && (skip === 'trip' || fbF.trip === 'all' || x.id === fbF.trip);
    const optsFor = (key, valOf, labelOf, order) => {
      const seen = new Map();
      for (const x of p.trips) {
        if (!fbPass(x, key)) continue;
        const v = valOf(x);
        if (v) seen.set(v, (seen.get(v) || 0) + 1);
      }
      if (fbF[key] !== 'all' && !seen.has(fbF[key])) fbF[key] = 'all';
      return [...seen].sort(order).map(([v, n]) => `<option value="${attr(v)}"${fbF[key] === v ? ' selected' : ''}>${esc(labelOf(v))} (${n})</option>`).join('');
    };
    const desc = (a, b) => b[0].localeCompare(a[0]);
    const tripLabel = new Map(p.trips.map((x) => [x.id, `${x.name} · ${fbMonth(x.month)}`]));
    const fbSelect = (key, label, all, opts) => `<label class="fb-fl"><span>${label}</span><select data-fb-sel="${key}">
      <option value="all"${fbF[key] === 'all' ? ' selected' : ''}>${all}</option>${opts}</select></label>`;
    // Each select is built after the ones it depends on have dropped any
    // value that no longer exists.
    const yearOpts = optsFor('year', (x) => ym(x).slice(0, 4), (v) => v, desc);
    const monthOpts = optsFor('month', ym, (v) => fbMonth(v), desc);
    const progOpts = optsFor('prog', progName, (v) => v, (a, b) => FB_GROUPS.indexOf(a[0]) - FB_GROUPS.indexOf(b[0]));
    const tripOpts = optsFor('trip', (x) => x.id, (v) => tripLabel.get(v) || v, () => 0);
    const filtered = Object.values(fbF).some((v) => v !== 'all');
    const fbFilterBar = `<div class="fb-filters">
      ${fbSelect('year', 'Year', 'All years', yearOpts)}
      ${fbSelect('month', 'Month', 'All months', monthOpts)}
      ${fbSelect('prog', 'Programme', 'All programmes', progOpts)}
      ${fbSelect('trip', 'Trip', 'All trips', tripOpts)}
      ${filtered ? '<button class="btn" type="button" data-fb-clear>Clear</button>' : ''}
    </div>`;
    const trips = p.trips.filter((x) => fbPass(x));
    const tripIds = new Set(trips.map((x) => x.id));

    const t = p.totals;
    const escTrips = trips.filter((x) => x.escalations > 0);
    const ofMatch = (v) => /^(\d+) of (\d+)$/.exec(String(v || ''));

    // ---- overview: tiles ----
    // Unfiltered: the sheet's own figures. Filtered: recomputed from the
    // trips shown, satisfaction weighted by responses (which is how the
    // sheet's year-to-date figure is made: it matches it exactly).
    let sat = t.satisfaction;
    let reported = ofMatch(t.tripsReported);
    let counted = ofMatch(t.responsesCounted);
    let escN = t.escalations;
    if (filtered) {
      const rated = trips.filter((x) => x.satisfaction != null && x.responses);
      const resp = rated.reduce((a, x) => a + x.responses, 0);
      sat = resp ? rated.reduce((a, x) => a + x.satisfaction * x.responses, 0) / resp : null;
      reported = [null, trips.filter((x) => x.overall != null).length, trips.length];
      const r = trips.reduce((a, x) => a + (x.responses || 0), 0);
