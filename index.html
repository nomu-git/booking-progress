      const step = Math.ceil(n / 8);
      const show = n <= 8 || i % step === 0 || i === n - 1;
      return `<span>${show ? esc(p.label) : ''}</span>`;
    }).join('');

    return `
      <div class="vz">
        <div class="lwrap">
          <div class="lscale">
            <div>${o.fmt ? o.fmt(top) : compact(top)}</div>
            <div>${o.fmt ? o.fmt(top / 2) : compact(top / 2)}</div>
            <div>0</div>
          </div>
          <div class="lplot">
            <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">
              <defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="${o.color || '#f5b935'}" stop-opacity=".22"/>
                <stop offset="100%" stop-color="${o.color || '#f5b935'}" stop-opacity="0"/>
              </linearGradient></defs>
              ${grid}${area}
              <path d="${path(solid)}" fill="none" stroke="${stroke}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
              ${tail}
              <line class="lcross" x1="0" y1="0" x2="0" y2="${H}" stroke="${stroke}" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke" opacity="0"/>
              ${hits}
            </svg>
            <div class="laxis">${axis}</div>
          </div>
        </div>
      </div>`;
  }

  // Horizontal bars — the right form when the category names are long.
  function barRows(items) {
    const top = Math.max(0, ...items.map((i) => i.v)) || 1;
    return `<div class="vz"><div class="vzrows">${items.map((i) => `
      <div class="vzrow">
        <div class="vzlabel" title="${attr(i.label)}">${esc(i.label)}</div>
        <div class="vzval">${esc(i.value)}</div>
        <div class="vztrack">
          <div class="vzfill" style="width:${((i.v / top) * 100).toFixed(2)}%;background:${i.color || 'var(--fill)'}" data-tip="${attr(i.tip)}"></div>
        </div>
      </div>`).join('')}</div></div>`;
  }

  // Part-to-whole. Legend is always present and every segment is direct-labeled
  // with its share, so identity never rests on color alone.
  function stackedBar(segments, total) {
    const bar = segments.map((s) =>
      `<div class="vzseg" style="width:${((s.v / (total || 1)) * 100).toFixed(2)}%;background:${s.color}" data-tip="${attr(s.tip)}"></div>`).join('');
    const legend = segments.map((s) =>
      `<span><i style="background:${s.color}"></i>${esc(s.label)} <b>${esc(s.value)}</b> · ${pct(ratio(s.v, total))}</span>`).join('');
    return `<div class="vz"><div class="vzstack">${bar}</div><div class="vzlegend">${legend}</div></div>`;
  }

  /* ---------------- weekly planning view ---------------- */

  // Direction, with the sign that matters: for cost-style metrics a fall is
  // the good outcome, so `lowerIsBetter` flips which way earns the green.
  function deltaChip(v, lowerIsBetter) {
    if (v == null) return '<span class="th-d d-flat">—</span>';
    const flat = Math.abs(v) < 0.02;
    const good = lowerIsBetter ? v < 0 : v > 0;
    const cls = flat ? 'd-flat' : (good ? 'd-up' : 'd-down');
    const arrow = flat ? '→' : (v > 0 ? '↑' : '↓');
    return `<span class="th-d ${cls}">${arrow} ${Math.abs(v * 100).toFixed(0)}%</span>`;
  }

  function trendPanel(label, weeks, pick, fmt, headline, delta, lowerIsBetter) {
    const points = weeks.map((w) => ({
      v: pick(w),
      label: w.label,
      partial: w.partial,
      tip: tipRows(`Week of ${w.label}${w.partial ? ' (in progress)' : ''}`, [
        [label, fmt(pick(w))],
        ['Cost', 'SAR ' + money(w.spend)],
        ['Results', int(w.results)],
        ['Impressions', int(w.impressions)],
        ['Link clicks', int(w.linkClicks)],
      ]),
    }));
    return `
      <div class="panel">
        <div class="trendhead">
          <span class="th-l">${esc(label)}</span>
          <span class="th-n">${headline}</span>
          ${deltaChip(delta, lowerIsBetter)}
        </div>
        ${lineChart(points, { fmt: (v) => fmt(v) })}
      </div>`;
  }

  function weeklySection(p) {
    const wk = p.weekly;
    if (!wk || !wk.weeks || wk.weeks.length < 2) {
      return `<div class="panel"><div class="ptitle">Weekly performance</div>
        <div class="msg">Not enough delivery history yet to show a weekly trend.</div></div>`;
    }

    const weeks = wk.weeks;
    const complete = weeks.filter((w) => !w.partial);
    const last = complete[complete.length - 1];
    const prior = complete[complete.length - 2];

    const cprOf = (w) => (w && w.results ? w.spend / w.results : null);
    const ctrOf = (w) => (w && w.impressions ? w.linkClicks / w.impressions : null);
    const cpmOfW = (w) => (w && w.impressions ? (w.spend / w.impressions) * 1000 : null);

    const trends = [
      trendPanel('Cost per result', weeks, (w) => cprOf(w) || 0,
        (v) => (v ? money(v) : '—'),
        show(cprOf(last), money), change(cprOf(last), cprOf(prior)), true),
      trendPanel('Weekly cost', weeks, (w) => w.spend,
        (v) => money(v), money(last ? last.spend : 0),
        change(last && last.spend, prior && prior.spend), false),
      trendPanel('Results', weeks, (w) => w.results,
        (v) => int(v), int(last ? last.results : 0),
        change(last && last.results, prior && prior.results), false),
      trendPanel('Link CTR', weeks, (w) => (ctrOf(w) || 0) * 100,
        (v) => v.toFixed(2) + '%',
        show(ctrOf(last), pct), change(ctrOf(last), ctrOf(prior)), false),
    ].join('');

    const rows = wk.campaigns.map((c) => {
      const cur = c.current, prev = c.previous;
      return `
        <div class="sigrow">
          <div>
            <div class="sig-name">${esc(c.name)}</div>
            <div class="sig-sub">${esc(c.objective || '')}${c.status ? ' · ' + esc(c.status) : ''}</div>
          </div>
          <div><span class="sigpill sig-${esc(c.signal)}">${esc(c.signal)}</span></div>
          <div class="sig-num"><b>${money(cur.spend)}</b><div class="sig-sub">${deltaChip(c.change.spend, false)}</div></div>
          <div class="sig-num"><b>${int(cur.results)}</b><div class="sig-sub">${deltaChip(c.change.results, false)}</div></div>
          <div class="sig-num"><b>${show(cur.costPerResult, money)}</b><div class="sig-sub">${deltaChip(c.change.costPerResult, true)}</div></div>
          <div class="sig-num"><b>${show(cur.ctr, pct)}</b><div class="sig-sub">${deltaChip(c.change.ctr, false)}</div></div>
          <div class="sig-why">${c.reasons.length ? esc(c.reasons.join(' · ')) : '<span style="color:#6c7f9c">steady</span>'}</div>
        </div>`;
    }).join('');

    const counts = ['fix', 'watch', 'scale', 'new', 'idle']
      .map((k) => ({ k, n: wk.campaigns.filter((c) => c.signal === k).length }))
      .filter((x) => x.n);

    return `
      <div class="panel">
        <div class="ptitle">Weekly trend · last ${weeks.length} weeks</div>
        <div class="tzbadge">📅 Weeks run <b>Sunday to Saturday</b>, the same boundary the booking Report uses. The final point is the week in progress — drawn dashed and hollow, because it is a part-week and will keep rising.</div>
        <div class="trendgrid">${trends}</div>
      </div>

      <div class="panel">
        <div class="ptitle">What to adjust · week of ${esc(last ? last.label : '—')} vs ${esc(prior ? prior.label : '—')}</div>
        <div class="vzlegend" style="margin:0 0 12px">
          ${counts.map((x) => `<span><span class="sigpill sig-${x.k}">${x.k}</span> <b>${x.n}</b></span>`).join('')}
        </div>
        <div class="tscroll">
          <div style="min-width:760px">
            <div class="sigrow sighead">
              <div>Campaign</div><div>Signal</div><div class="sig-num">Cost</div>
              <div class="sig-num">Results</div><div class="sig-num">Cost / result</div>
              <div class="sig-num">Link CTR</div><div>Why</div>
            </div>
            ${rows || '<div class="msg">No campaigns delivered in that week.</div>'}
          </div>
        </div>
        <div class="plan-foot" style="margin-top:12px">
          Compares the last <b>complete</b> week against the one before it, so a Monday reading never looks like a crash.
          <b>fix</b> = cost per result up more than 25%, link CTR under 0.5%, or spend with no results ·
          <b>scale</b> = cost per result down more than 15% ·
          <b>idle</b> = under SAR 50 in both weeks, too little to read.
        </div>
      </div>`;
  }

  /* ================= campaigns tab (current year) ================= */

  function campaignRow(c, totalSpend) {
    const cpr = ratio(c.spend, c.results);
    const cpm = cpmOf(c.spend, c.impressions);
    const freq = ratio(c.impressions, c.reach);
    const share = ratio(c.spend, totalSpend) || 0;
    const cCtr = ratio(c.linkClicks, c.impressions);
    const range = c.firstMonth
      ? `${c.firstMonth}${c.lastMonth && c.lastMonth !== c.firstMonth ? ' – ' + c.lastMonth : ''}`
      : '';

    return `
      <tr>
        <td class="cname">
          ${esc(c.name)}
          <div class="cobj"><i class="odot" style="background:${objColor(c.objective)}"></i>${esc(c.objective)}${range ? ' · ' + esc(range) : ''}</div>
        </td>
        <td><span class="cpill ${c.status === 'Active' ? 'on' : 'off'}">${esc(c.status)}</span></td>
        <td class="num">${c.dailyBudget ? money(c.dailyBudget) + '<div class="cobj">' + (c.activeAdSets || 0) + ' ad set' + (c.activeAdSets === 1 ? '' : 's') + '</div>' : '—'}</td>
        <td class="num">${money(c.spend)}</td>
        <td class="num">${int(c.results)}${c.noResults ? ' <span class="flag" title="Spend recorded but no results attributed">!</span>' : ''}</td>
        <td class="num">${show(cpr, money)}</td>
        <td class="num ${cCtr == null ? '' : cCtr < CTR_POOR ? 'cell-bad' : cCtr >= CTR_HEALTHY ? 'cell-good' : ''}">${show(cCtr, pct)}</td>
        <td class="num">${int(c.impressions)}</td>
        <td class="num">${int(c.reach)}</td>
        <td class="num">${show(cpm, dec)}</td>
        <td class="num ${freq == null ? '' : freq >= FREQ_FATIGUE ? 'cell-bad' : freq >= FREQ_WATCH ? 'cell-watch' : ''}">${show(freq, dec)}</td>
        <td class="num">${int(c.purchases)}</td>
        <td class="num sharecell"><div class="sharebar" style="width:${(share * 100).toFixed(0)}%"></div><span>${pct(share)}</span></td>
      </tr>`;
  }

  function renderCampaigns() {
    const p = campaigns;
    if (!p) return;
    if (p.error && !p.campaigns) {
      $('campaignsWrap').innerHTML = `<div class="msg err">Could not load campaign data: ${esc(p.error)}</div>`;
      return;
    }

    const t = p.totals;
    const cur = esc(p.currency);
    const totalCpr = ratio(t.spend, t.results);
    const totalCpm = cpmOf(t.spend, t.impressions);
    const totalFreq = ratio(t.impressions, t.reach);
    const active = t.active != null ? t.active : p.campaigns.filter((c) => c.status === 'Active').length;
    const linkCtr = ratio(t.linkClicks, t.impressions);
    const costPerClick = ratio(t.spend, t.linkClicks);
    // Daily commitment projected out, so the tile answers "what does this cost
    // us a month if nothing changes" rather than making everyone multiply.
    const monthlyRun = t.dailyBudget == null ? null : t.dailyBudget * 30;
    const flagged = p.noResultCampaigns || [];

    const monthPoints = (p.months || []).map((m) => ({
      v: m.spend,
      label: m.label,
      tip: tipRows(`${m.label} ${p.year}`, [
        ['Spend', `${cur} ${money(m.spend)}`],
        ['Impressions', int(m.impressions)],
        ['Share of year', pct(ratio(m.spend, t.spend))],
      ]),
    }));

    // Top 8 by spend, remainder folded into one "Other" row rather than a
    // 40-bar chart nobody can read from across the room.
    const ranked = [...p.campaigns].sort((a, b) => b.spend - a.spend);
    const shown = ranked.slice(0, 8);
    const rest = ranked.slice(8);
    const barItems = shown.map((c) => ({
      v: c.spend,
      label: c.name,
      value: money(c.spend),

      tip: tipRows(c.name, [
        ['Objective', c.objective],
        ['Spend', `${cur} ${money(c.spend)}`],
        ['Results', int(c.results)],
        ['Cost / result', show(ratio(c.spend, c.results), money)],
        ['Share of spend', pct(ratio(c.spend, t.spend))],
      ]),
    }));
    if (rest.length) {
      const otherSpend = rest.reduce((sum, c) => sum + c.spend, 0);
      barItems.push({
        v: otherSpend, label: `Other (${rest.length} campaigns)`, value: money(otherSpend),

    const segs = p.byObjective.map((o) => ({

    const objRows = p.byObjective.map((o) => `

        <td class="num">${show(ratio(o.linkClicks, o.impressions), pct)}</td>
        <td class="num">${int(o.impressions)}</td>

        <td class="num">${int(o.reach)}</td>

    $('campaignsWrap').innerHTML = `

                  <td class="num">${money(c.spend)}</td>

                <td class="num">${int(y.impressions)}</td>
                <td class="num">${int(y.reach)}</td>
                <td class="num">${show(cpmOf(y.spend, y.impressions), dec)}</td>

    $('historyWrap').innerHTML = `

  async function loadHistory(force) {
    try {
      const res = await fetch('/api/campaign-history' + (force ? '?refresh=1' : ''));
      const p = await res.json();
      if (!res.ok && !p.years) throw new Error(p.error || `HTTP ${res.status}`);
      adHistory = p;
      // Newest year open by default — that's the one people came to read.
      if (!openYears.size && p.years && p.years.length) openYears.add(p.years[0].year);
      renderHistory();
    } catch (err) {
      if (!adHistory) {
        $('historyWrap').innerHTML = `<div class="msg err">Could not load campaign history: ${esc(err.message)}</div>`;
      }
    }
  }

  /* ================= SA media plan (the plan, not measured data) ================= */

  let mediaPlan = null;

  // The plan writes "Purchase" where Ads Manager reports "Purchases". Same
  // thing, and it has to wear the same hue as on the Campaigns tab or the two
  // views would colour the identical objective differently.
  const PLAN_OBJ_ALIAS = {
    Purchase: 'Purchases',
    'Landing Page Views / Engagement': 'Link Clicks',
  };
  const planObjColor = (name) => objColor(PLAN_OBJ_ALIAS[name] || name);

  // Plan budgets are whole dollars; money() would render $750.00. Decimals are
  // kept if a figure ever has them, but nothing in the plan currently does.
  const usd = (n) => '$' + (Number.isInteger(Number(n)) ? int(n) : money(n));

  /* ---- benchmark thresholds ----
     Published 2026 Meta benchmarks, used only to colour a tile and add one
     line of plain English. They are industry-wide averages, not NomuHub
     targets, so nothing here changes a number — it only says whether a number
     is in the range advertisers generally consider healthy.
       Link CTR : most industries land 2–3%; under 0.5% signals a creative or
                  targeting problem worth acting on.
       Frequency: above 4 is the fatigue line, especially alongside a falling
                  CTR and a rising CPM. */
  const CTR_HEALTHY = 0.02;
  const CTR_POOR = 0.005;
  const FREQ_FATIGUE = 4;
  const FREQ_WATCH = 3;

  const ctrClass = (v) => (v == null ? '' : v < CTR_POOR ? 'skpi-bad' : v >= CTR_HEALTHY ? 'skpi-good' : 'skpi-watch');
  const ctrNote = (v) => (v == null ? 'no impressions yet'
    : v < CTR_POOR ? 'below 0.5% — creative or targeting'
    : v >= CTR_HEALTHY ? 'healthy (2–3% typical)'
    : 'under the 2% typical range');

  const freqClass = (v) => (v == null ? '' : v >= FREQ_FATIGUE ? 'skpi-bad' : v >= FREQ_WATCH ? 'skpi-watch' : 'skpi-good');
  const freqNote = (v) => (v == null ? 'no reach yet'
    : v >= FREQ_FATIGUE ? 'above 4 — refresh creative'
    : v >= FREQ_WATCH ? 'approaching fatigue'
    : 'comfortable');

  function renderPlan() {
    const p = mediaPlan;
    if (!p) return;
    if (p.error) {
      $('planWrap').innerHTML = `<div class="msg err">Could not load the media plan: ${esc(p.error)}</div>`;
      return;
    }

    const t = p.totals;
    const MONTH_FULL = {
      Jan: 'January', Feb: 'February', Mar: 'March', Apr: 'April', May: 'May', Jun: 'June',
      Jul: 'July', Aug: 'August', Sep: 'September', Oct: 'October', Nov: 'November', Dec: 'December',
    };

    const trips = p.lines.filter((l) => l.kind === 'prospecting');
    const always = p.lines.filter((l) => l.kind !== 'prospecting');
    const maxEst = Math.max(...trips.map((l) => l.resultCount || 0), 1);

    // The retargeting and traffic lines run every month, so they belong inside
    // each month rather than in a block of their own — a month's real outlay is
    // its trips plus the always-on spend, and that's the number used to plan.
    const alwaysUsd = always.reduce((sum, l) => sum + l.budgetUsd, 0);

    const months = p.byMonth.map((m) => {
      const flights = trips.filter((l) => l.startMonth === m.index);
      if (!flights.length) return '';
      const tripUsd = flights.reduce((sum, l) => sum + l.budgetUsd, 0);
      return `
        <div class="plan-month">
          <div class="pm-head">
            <span class="pm-name">${esc(MONTH_FULL[m.month] || m.month)}</span>
            <span class="pm-meta">${flights.length} trip campaign${flights.length === 1 ? '' : 's'} + ${always.length} always-on</span>
            <span class="pm-total">${usd(tripUsd + alwaysUsd)}</span>
          </div>
          ${flights.map((l) => `
            <div class="pflight">
              <div class="pf-trip">${esc(l.program)}</div>
              <div class="pf-date">${esc(l.dates)}</div>
              <div class="pf-est">
                <div class="pf-track"><div class="pf-fill" style="width:${(((l.resultCount || 0) / maxEst) * 100).toFixed(1)}%"></div></div>
                <span class="pf-estn">${int(l.resultCount)} msgs</span>
              </div>
              <div class="pf-num">${esc(String(l.costPerResult).replace(' / Message', ''))}</div>
              <div class="pf-num"><b>${usd(l.budgetUsd)}</b></div>
            </div>`).join('')}
          ${always.map((l) => `
            <div class="pflight pf-always">
              <div class="pf-trip">${esc(l.program)} <span class="pf-tag">always-on</span></div>
              <div class="pf-date">every month</div>
              <div class="pf-est"><span class="pf-estn">${esc(l.objective)}</span></div>
              <div class="pf-num">${esc(l.costPerResult === 'Optimize for Purchase' ? '—' : l.costPerResult)}</div>
              <div class="pf-num"><b>${usd(l.budgetUsd)}</b></div>
            </div>`).join('')}
          <div class="pm-foot">
            <span>${flights.length} trip${flights.length === 1 ? '' : 's'} ${usd(tripUsd)}</span>
            <span>+ always-on ${usd(alwaysUsd)}</span>
            <span class="pm-foot-tot">= ${usd(tripUsd + alwaysUsd)} in ${esc(MONTH_FULL[m.month] || m.month)}</span>
          </div>
        </div>`;
    }).join('');

    // Four months of trips, but always-on recurs in every one of them. The
    // plan's own headline counts it once; both readings are shown rather than
    // silently picking whichever is larger.
    const runMonths = p.byMonth.length;
    const fullRunUsd = t.prospectingUsd + alwaysUsd * runMonths;

    const detailRows = p.lines.map((l) => `
      <tr>
        <td class="cname">${esc(l.program)}
          <div class="cobj"><i class="odot" style="background:${planObjColor(l.objective)}"></i>${esc(l.objective)}</div>
        </td>
        <td class="num">${esc(l.dates)}</td>
        <td class="num">${esc(l.market)}</td>
        <td class="num">${usd(l.budgetUsd)}</td>
        <td class="num">${money(l.budgetSar)}</td>
        <td class="num">${l.cpm == null ? '—' : dec(l.cpm)}</td>
        <td class="num">${l.impressions == null ? '—' : int(l.impressions)}</td>
        <td class="num">${esc(l.costPerResult)}</td>
        <td class="num">${esc(l.results)}</td>
      </tr>`).join('');

    // The document's own summary lines, quoted rather than recomputed.
    const summaryLine = p.summary
      .map((r) => `<b>${esc(r.label)}${r.objective && r.label.startsWith('Total Media') ? ` (${esc(r.objective)})` : ''}</b> ${usd(r.budgetUsd)}`)
      .join(' · ');

    $('planWrap').innerHTML = `
      <div class="panel">
        <div class="ptitle">Saudi Arabia media plan · monthly</div>
        <div class="vhero">
          <span class="vh-c">USD</span><span class="vh-n">${money(t.allUsd)}</span>
          <span class="vh-s">per month · ≈ SAR ${money(t.allUsd * p.usdSar)} · ${int(t.flights)} campaigns · ~${int(t.results)} messages expected</span>
        </div>
        <div class="plan-split">
          <div class="plan-chip">
            <div class="pc-n">${usd(t.prospectingUsd)}</div>
            <div class="pc-l">Prospecting</div>
            <div class="pc-s">${trips.length} trip campaigns × ${usd(trips.length ? trips[0].budgetUsd : 0)}</div>
          </div>
          <div class="plan-chip" style="border-left-color:${planObjColor('Purchase')}">
            <div class="pc-n">${usd(t.retargetingUsd)}</div>
            <div class="pc-l">Retargeting</div>
            <div class="pc-s">website, purchase-optimised</div>
          </div>
          <div class="plan-chip" style="border-left-color:${planObjColor('Landing Page Views / Engagement')}">
            <div class="pc-n">${usd(t.trafficUsd)}</div>
            <div class="pc-l">Traffic &amp; engagement</div>
            <div class="pc-s">website, ${esc((always.find((l) => l.kind === 'traffic') || {}).costPerResult || '')}</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="ptitle">Campaign schedule</div>
        ${months}
        <div class="plan-foot" style="margin-top:4px">
          Every month carries the two always-on lines (${always.map((l) => esc(l.program) + ' ' + usd(l.budgetUsd)).join(' · ')}) on top of that month's trip campaigns.
          Across all ${runMonths} months that is <b>${usd(fullRunUsd)}</b> in total —
          the plan's own headline of <b>${usd(t.allUsd)}</b> counts the always-on lines once, as a single month's cost.
        </div>
      </div>

      <div class="panel">
        <div class="ptitle">Full plan detail</div>
        <div class="tscroll">
          <table class="ctable">
            <thead><tr>
              <th>Program / Campaign</th><th>Date</th><th>Market</th>
              <th>Budget (USD)</th><th>Budget (SAR)</th><th>Est. CPM</th>
              <th>Est. Impressions</th><th>Est. Cost / Result</th><th>Est. Results</th>
            </tr></thead>
            <tbody>${detailRows}</tbody>
            <tfoot><tr>
              <td class="cname">TOTAL</td><td></td><td></td>
              <td class="num">${usd(t.allUsd)}</td>
              <td class="num">${money(t.allUsd * p.usdSar)}</td>
              <td></td>
              <td class="num">${int(t.impressions)}</td>
              <td></td>
              <td class="num">${int(t.results)}</td>
            </tr></tfoot>
          </table>
        </div>
        <div class="plan-foot" style="margin-top:12px">
          As written in the plan: ${summaryLine}.<br>
          Source: <b>${esc(p.source)}</b> · all objectives target <b>${esc(p.market)}</b> · budgets are USD, SAR converted at <b>${dec(p.usdSar)}</b>.
          These are planned and estimated figures, not measured results — see <b>Campaigns</b> and <b>History</b> for what actually ran.
        </div>
      </div>`;

    bindViz($('planWrap'));
  }

  async function loadPlan() {
    try {
      const res = await fetch('/api/media-plan');
      const p = await res.json();
      if (!res.ok) throw new Error(p.error || `HTTP ${res.status}`);
      mediaPlan = p;
      renderPlan();
    } catch (err) {
      $('planWrap').innerHTML = `<div class="msg err">Could not load the media plan: ${esc(err.message)}</div>`;
    }
  }

  /* ================= view switching ================= */

  // Explicit target, not a toggle — Dashboard is always one click away from
  // Report, rather than requiring "click the same tab again to go back."
  function setView(next) {
    view = next;
    $('viewSeg').querySelectorAll('button').forEach((b) => {
      b.setAttribute('aria-pressed', String(b.dataset.view === view));
    });
    $('board').hidden = view !== 'board';
    $('legend').hidden = view !== 'board';
    applyAnnouncement();
    // The board's status line and footnotes describe bookings only, so they
    // travel with the board rather than sitting under whichever tab is open.
    $('msg').hidden = view !== 'board';
    $('notes').hidden = view !== 'board';
    $('reportWrap').hidden = view !== 'report';
    $('campaignsWrap').hidden = view !== 'campaigns';
    $('historyWrap').hidden = view !== 'history';
    $('planWrap').hidden = view !== 'plan';
    if (view === 'report') {
      if (!report) $('reportWrap').innerHTML = '<div class="msg">Loading report…</div>';
      loadReport(false);
    }
    // Meta data is fetched only once someone actually opens the tab — unlike
    // the booking report, nothing outside this tab depends on it.
    if (view === 'campaigns') {
      if (!campaigns) $('campaignsWrap').innerHTML = '<div class="msg">Loading campaign data…</div>';
      loadCampaigns(false);
    }
    // Three years of month-by-month insights is a slow first call, so it waits
    // for someone to actually ask for it and then caches for half an hour.
    if (view === 'history') {
      if (!adHistory) $('historyWrap').innerHTML = '<div class="msg">Loading campaign history…</div>';
      loadHistory(false);
    }
    // Static reference data, so it's fetched once and kept — a plan doesn't move.
    if (view === 'plan' && !mediaPlan) {
      $('planWrap').innerHTML = '<div class="msg">Loading media plan…</div>';
      loadPlan();
    }
    // Keep the address bar in step, so a reload or a copied link lands on the
    // same tab. replaceState rather than the hash property: no history entry
    // per tab click, so Back still leaves the dashboard.
    try {
      if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
    } catch (e) { /* file:// or a sandboxed frame — the tab still switches */ }
    saveViewState();
  }

  $('viewSeg').querySelectorAll('button').forEach((b) => {
    b.addEventListener('click', () => setView(b.dataset.view));
  });
  $('refreshBtn').addEventListener('click', () => {
    load(true);
    loadReport(true);
    if (campaigns) loadCampaigns(true);
    if (adHistory) loadHistory(true);
  });

  // Restore whichever tab/filter/period the screen was showing before this
  // load, so a refresh (or the wall display losing power overnight) picks up
  // where it left off instead of resetting to the very beginning.
  loadViewState();

  // A #hash beats stored state, so a wall display can be pointed straight at
  // one tab by URL and stay there through reboots, and any tab can be linked.
  const VIEWS = ['board', 'report', 'campaigns', 'history', 'plan'];
  const viewFromHash = () => {
    const h = String(location.hash || '').replace(/^#/, '');
    return VIEWS.includes(h) ? h : null;
  };
  const hashView = viewFromHash();
  if (hashView) view = hashView;
  addEventListener('hashchange', () => {
    const next = viewFromHash();
    if (next && next !== view) setView(next);
  });

  setView(view);

  load(false);
  loadReport(false);
  loadAnnouncement();
  setInterval(() => load(false), POLL_MS);
  // Picks up a banner edited in Vercel without anyone touching the display.
  setInterval(loadAnnouncement, POLL_MS);
  // Unconditional now — the header stats need report data on every tab, not
  // just while the Report tab itself is open.
  setInterval(() => loadReport(false), 120000);
  // Meta's numbers move far slower than bookings and the Graph API is rate
  // limited per app, so 10 minutes, and only once the tab has been opened.
  setInterval(() => { if (campaigns) loadCampaigns(false); }, 600000);
  // Re-render between fetches so a highlight lapses at its own 24h mark and the
  // "3h ago" text stays honest, without waiting on the server cache.
  setInterval(() => { if (latest) render(latest); }, 20000);
</script>
</body>
</html>
