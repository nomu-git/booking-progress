  }

  /* ================= engagements tab (Maryam's sheet) ================= */

  let engagements = null;
  // 'all' or a 'YYYY-MM' month key.
  let engMonth = 'all';
  // 'all' or a content type as Maryam writes it (Reel, Carousel...). Posts
  // only: stories have a poll type instead, so they follow the month alone.
  // How the Posts table is ordered (Anton, 5 Oct 2026): "newest" by default,
  // else "<field>-desc" / "<field>-asc". A post with no value for the field
  // always goes last, whichever way it's sorted.
  let engSort = 'newest';
  // Posts | Stories (Anton, 5 Oct 2026: "I only want to show Posts and
  // Stories", in place of the content-type filter) and the stories' own sort.
  let engSub = 'posts';
  let storySort = 'newest';
  const STORY_SORTS = [
    ['newest', 'Newest first'], ['oldest', 'Oldest first'],
    ['rate-desc', 'Top performing (response rate)'], ['rate-asc', 'Lowest response rate'],
    ['views-desc', 'Views: high to low'], ['views-asc', 'Views: low to high'],
    ['responses-desc', 'Responses: high to low'], ['responses-asc', 'Responses: low to high'],
  ];
  const ENG_SORTS = [
    ['newest', 'Newest first'], ['oldest', 'Oldest first'],
    ['views-desc', 'Views: high to low'], ['views-asc', 'Views: low to high'],
    ['engagement-desc', 'Top performing (engagement)'], ['engagement-asc', 'Lowest engagement'],
    ['likes-desc', 'Likes: high to low'], ['likes-asc', 'Likes: low to high'],
    ['comments-desc', 'Comments: high to low'], ['comments-asc', 'Comments: low to high'],
    ['shares-desc', 'Shares: high to low'], ['shares-asc', 'Shares: low to high'],
    ['saves-desc', 'Saves: high to low'], ['saves-asc', 'Saves: low to high'],
  ];

  const shortDay = (day) => {
    const d = dayOf(day);
    return `${d.getUTCDate()} ${PT_MONTHS_SHORT[d.getUTCMonth()]}`;
  };
  const pctOf = (v) => (v == null ? '—' : `${(v * 100).toFixed(2)}%`);

  // Views per post, one bar each in date order. A single series, so the
  // panel title names it and there's no legend; values sit on the peak and
  // the latest post only, the rest are in the tooltips.
  function engChart(posts) {
    const H = 150;
    const top = niceTop(Math.max(1, ...posts.map((x) => x.views || 0)));
    const peak = Math.max(0, ...posts.map((x) => x.views || 0));
    let lastMonth = -1;
    const cols = [];
    const axis = [];
    posts.forEach((x, i) => {
      const rows = [['Views', int(x.views)], ['Engagement', pctOf(x.engagement)], ['Likes', int(x.likes)], ['Comments', int(x.comments)], ['Shares', int(x.shares)]];
      if (x.saves != null) rows.push(['Saves', int(x.saves)]);
      const label = x.views === peak || i === posts.length - 1 ? int(x.views) : '';
      const px = Math.max(2, ((x.views || 0) / top) * H);
      cols.push(`<div class="lcol" ${tipOf(`${x.name} · ${x.type || ''} · ${x.date ? shortDay(x.date) : x.dateText}`, rows)}><span class="lval">${label}</span><span class="lstack thin" style="height:${px}px"><i class="lseg eng" style="flex:1"></i></span></div>`);
      const m = x.date ? dayOf(x.date).getUTCMonth() : lastMonth;
      axis.push(`<span>${m !== lastMonth ? PT_MONTHS_SHORT[m] : '&nbsp;'}</span>`);
      lastMonth = m;
    });
    const grid = `<div class="lgl" style="bottom:${H}px"><span>${compactNum(top)}</span></div><div class="lgl" style="bottom:${H / 2}px"><span>${compactNum(top / 2)}</span></div>`;
    // Wide enough for thin bars, and no wider: a month's handful of posts
    // fits a phone, the whole quarter scrolls. (The Leads chart's fixed
    // 620px minimum is sized for 39 weeks.)
    const minW = Math.max(240, posts.length * 18 + 40);
    return `<div class="lscroll"><div class="lchart" style="min-width:${minW}px"><div class="lplot gut" style="height:${H + 20}px">${grid}${cols.join('')}</div><div class="laxis gut">${axis.join('')}</div></div></div>`;
  }
  // "16,477" -> "16k" for the gridline labels only; values elsewhere stay exact.
  const compactNum = (n) => (n >= 1000 ? `${(n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, '')}k` : int(n));

  function renderEngagements() {
    const p = engagements;
    if (!p) return;
    if (p.error && !p.posts) {
      $('engagementsWrap').innerHTML = `<div class="msg err">Could not load engagements: ${esc(p.error)}</div>`;
      return;
    }
    if (engMonth !== 'all' && !p.months.includes(engMonth)) engMonth = 'all';
    const inMonth = (x) => engMonth === 'all' || (x.date || '').slice(0, 7) === engMonth;
    const posts = p.posts.filter(inMonth);
    const stories = p.stories.filter(inMonth);
    const period = engMonth === 'all'
      ? (p.months.length ? `${PT_MONTHS_SHORT[Number(p.months[0].slice(5)) - 1]} – ${PT_MONTHS_SHORT[Number(p.months[p.months.length - 1].slice(5)) - 1]} ${p.year}` : String(p.year))
      : `${PT_MONTHS[Number(engMonth.slice(5)) - 1]} ${engMonth.slice(0, 4)}`;

    const sum = (list, key) => list.reduce((acc, x) => acc + (x[key] || 0), 0);
    const views = sum(posts, 'views');
    const interactions = sum(posts, 'interactions');
    const rate = views ? interactions / views : null;
    const best = posts.reduce((b, x) => (x.engagement != null && (!b || x.engagement > b.engagement) ? x : b), null);

    const pills = ['all', ...p.months].map((m) => `<button data-eng-month="${attr(m)}" aria-pressed="${m === engMonth}">${m === 'all' ? 'All' : PT_MONTHS_SHORT[Number(m.slice(5)) - 1]}</button>`).join('');
    const maxRate = Math.max(0.0001, ...posts.map((x) => x.engagement || 0));
    if (!ENG_SORTS.some(([k]) => k === engSort)) engSort = 'newest';
    const sortedPosts = [...posts]; // posts arrive oldest first
    if (engSort === 'newest') sortedPosts.reverse();
    else if (engSort !== 'oldest') {
      const [field, dir] = engSort.split('-');
      const sign = dir === 'asc' ? 1 : -1;
      sortedPosts.sort((a, b) => {
        const av = a[field];
        const bv = b[field];
        if (av == null && bv == null) return 0;
        if (av == null) return 1;
        if (bv == null) return -1;
        return (av - bv) * sign || String(a.date || '').localeCompare(String(b.date || ''));
      });
    }
    const postRows = sortedPosts.map((x) => `
      <tr>
        <td class="cname"><span dir="auto">${esc(x.name)}</span><span class="esub"><span class="etype-sub">${esc(x.type || '—')} · </span>${esc([x.date ? shortDay(x.date) : x.dateText, x.language].filter(Boolean).join(' · '))}</span></td>
        <td class="etype">${esc(x.type || '—')}</td>
        <td class="num"><b>${int(x.views)}</b></td>
        <td class="abar-cell"><div class="abar"><div class="abar-fill eng" style="width:${(((x.engagement || 0) / maxRate) * 100).toFixed(1)}%"></div></div><span class="abar-pct">${pctOf(x.engagement)}</span></td>
        <td class="num">${int(x.likes)}</td>
        <td class="num">${int(x.comments)}</td>
        <td class="num">${int(x.shares)}</td>
        <td class="num">${x.saves == null ? '—' : int(x.saves)}</td>
        <td>${esc(x.ctaPresent === 'Open' || !x.ctaWord ? (x.ctaPresent || '—') : x.ctaWord)}</td>
      </tr>`).join('');

    const maxResp = Math.max(0.0001, ...stories.map((x) => (x.views ? (x.responses || 0) / x.views : 0)));
    const rateOf = (x) => (x.views ? (x.responses || 0) / x.views : null);
    if (!STORY_SORTS.some(([k]) => k === storySort)) storySort = 'newest';
    const sortedStories = [...stories]; // oldest first
    if (storySort === 'newest') sortedStories.reverse();
    else if (storySort !== 'oldest') {
      const [field, dir] = storySort.split('-');
      const sign = dir === 'asc' ? 1 : -1;
      const val = (x) => (field === 'rate' ? rateOf(x) : x[field]);
      sortedStories.sort((a, b) => {
        const av = val(a);
        const bv = val(b);
        if (av == null && bv == null) return 0;
        if (av == null) return 1;
        if (bv == null) return -1;
        return (av - bv) * sign || String(a.date || '').localeCompare(String(b.date || ''));
      });
    }
    const storyRows = sortedStories.map((x) => {
      const r = x.views ? (x.responses || 0) / x.views : null;
      return `
      <tr>
        <td class="cname"><span dir="auto">${esc(x.name)}</span><span class="esub">${esc([x.kind, x.date ? shortDay(x.date) : x.dateText, x.language].filter(Boolean).join(' · '))}</span>${x.question ? `<span class="esub" dir="auto">“${esc(x.question)}”</span>` : ''}</td>
        <td class="num"><b>${int(x.views)}</b></td>
        <td class="num">${x.responses == null ? '—' : int(x.responses)}${x.responsesUnit ? `<span class="esub">${esc(x.responsesUnit)}</span>` : ''}</td>
        <td class="abar-cell"><div class="abar"><div class="abar-fill eng" style="width:${(((r || 0) / maxResp) * 100).toFixed(1)}%"></div></div><span class="abar-pct">${r == null ? '—' : pct(r)}</span></td>
        <td class="eres" dir="auto">${esc(x.result || '—')}</td>
      </tr>`;
    }).join('');
    const sViews = sum(stories, 'views');
    const sResp = sum(stories, 'responses');

    // Top performing: the three best by engagement (posts) or response rate
    // (stories), each with a bar scaled to the best of the three.
    const topList = (rows, label, valueOf, sub) => {
      const top = rows.filter((x) => valueOf(x) != null && valueOf(x) > 0).sort((a, b) => valueOf(b) - valueOf(a) || (b.views || 0) - (a.views || 0)).slice(0, 3);
      if (!top.length) return '';
      const best3 = valueOf(top[0]);
      return `
      <div class="panel">
        <div class="ptitle">Top performing · ${esc(label)} · ${esc(period)}</div>
        <div class="et-list">${top.map((x, k) => `
          <div class="et-row">
            <span class="et-rank">${k + 1}</span>
            <div class="et-main"><div class="et-name" dir="auto">${esc(x.name)}</div><div class="et-sub">${esc(sub(x))}</div></div>
            <div class="abar"><div class="abar-fill eng" style="width:${((valueOf(x) / best3) * 100).toFixed(1)}%"></div></div>
            <b class="et-val">${pct(valueOf(x))}</b>
          </div>`).join('')}</div>
      </div>`;
    };
    const postSub = (x) => [x.type, x.date ? shortDay(x.date) : x.dateText, `${int(x.views)} views`].filter(Boolean).join(' · ');
    const storySub = (x) => [x.kind, x.date ? shortDay(x.date) : x.dateText, `${int(x.views)} views`].filter(Boolean).join(' · ');

    const subtabs = `
      <div class="seg subtabs" role="tablist" aria-label="Engagement sections">
        <button role="tab" data-eng-sub="posts" aria-pressed="${engSub === 'posts'}" aria-selected="${engSub === 'posts'}">Posts <span class="ecount">${int(posts.length)}</span></button>
        <button role="tab" data-eng-sub="stories" aria-pressed="${engSub === 'stories'}" aria-selected="${engSub === 'stories'}">Stories <span class="ecount">${int(stories.length)}</span></button>
      </div>`;
    const sortSelect = (id, list, cur) => `<div class="efilter"><span class="efl">Sort by</span><select class="fselect" id="${id}" aria-label="Sort">${list.map(([k, l]) => `<option value="${k}"${k === cur ? ' selected' : ''}>${l}</option>`).join('')}</select></div>`;

    const postsHtml = `
      <div class="panel">
        <div class="ptitle">Instagram posts · ${esc(period)}</div>
        <div class="efilters">
          <div class="efilter"><span class="efl">Month</span><div class="seg">${pills}</div></div>
        </div>
        <div class="bvhero">
          <div class="bv-side">
            <div class="bv-lab"><span ${hlp('engPosts')}>Posts</span></div>
            <div class="bv-n">${int(posts.length)}</div>
          </div>
          <div class="bv-side">
            <div class="bv-lab"><span ${hlp('engViews')}>Views</span></div>
            <div class="bv-n bv-act">${int(views)}</div>
            <div class="bv-s">${int(interactions)} interactions</div>
          </div>
          <div class="bv-side">
            <div class="bv-lab"><span ${hlp('engRate')}>Engagement</span></div>
            <div class="bv-n">${pctOf(rate)}</div>
            <div class="bv-s">of views</div>
          </div>
          <div class="bv-side">
            <div class="bv-lab"><span ${hlp('engBest')}>Best post</span></div>
            <div class="bv-n">${best ? pctOf(best.engagement) : '—'}</div>
            <div class="bv-s" dir="auto">${best ? esc(best.name) : ''}</div>
          </div>
        </div>
        ${posts.length ? `<div class="ptitle" style="margin-top:16px">Views per post</div>${engChart(posts)}` : '<div class="pnote">No posts in this month.</div>'}
      </div>

      ${topList(posts, 'posts', (x) => x.engagement, postSub)}

      <div class="panel">
        <div class="lhead"><div class="ptitle">Posts · ${esc(period)}</div>${sortSelect('engSortSel', ENG_SORTS, engSort)}</div>
        <div class="tscroll">
          <table class="ctable">
            <thead><tr>
              ${hcol('engPosts', 'Post')}<th class="etype"><span ${hlp('engType')}>Type</span></th>${hcol('engViews', 'Views')}${hcol('engRate', 'Engagement')}
              ${hcol('engLikes', 'Likes')}${hcol('engComments', 'Comments')}${hcol('engShares', 'Shares')}
              ${hcol('engSaves', 'Saves')}${hcol('engCta', 'CTA')}
            </tr></thead>
            <tbody>${postRows || '<tr><td class="cname" colspan="9">No posts in this month.</td></tr>'}</tbody>
            <tfoot><tr>
              <td class="cname">TOTAL</td>
              <td class="etype"></td>
              <td class="num">${int(views)}</td>
              <td class="abar-cell"><span class="abar-pct">${pctOf(rate)}</span></td>
              <td class="num">${int(sum(posts, 'likes'))}</td>
              <td class="num">${int(sum(posts, 'comments'))}</td>
              <td class="num">${int(sum(posts, 'shares'))}</td>
              <td class="num">${int(sum(posts, 'saves'))}</td>
              <td></td>
            </tr></tfoot>
          </table>
        </div>
      </div>`;

    const storiesHtml = `
      <div class="panel">
        <div class="ptitle">Instagram stories · ${esc(period)}</div>
        <div class="efilters">
          <div class="efilter"><span class="efl">Month</span><div class="seg">${pills}</div></div>
        </div>
        <div class="bvhero">
          <div class="bv-side"><div class="bv-lab"><span ${hlp('engPosts')}>Stories</span></div><div class="bv-n">${int(stories.length)}</div></div>
          <div class="bv-side"><div class="bv-lab"><span ${hlp('stViews')}>Views</span></div><div class="bv-n bv-act">${int(sViews)}</div></div>
          <div class="bv-side"><div class="bv-lab"><span ${hlp('stResponses')}>Responses</span></div><div class="bv-n">${int(sResp)}</div></div>
          <div class="bv-side"><div class="bv-lab"><span ${hlp('stRate')}>Response rate</span></div><div class="bv-n">${sViews ? pct(sResp / sViews) : '—'}</div></div>
        </div>
      </div>

      ${topList(stories, 'stories', rateOf, storySub)}

      <div class="panel">
        <div class="lhead"><div class="ptitle">Stories · ${esc(period)}</div>${sortSelect('storySortSel', STORY_SORTS, storySort)}</div>
        ${stories.length ? `
        <div class="tscroll">
          <table class="ctable">
            <thead><tr>
              ${hcol('engPosts', 'Story')}${hcol('stViews', 'Views')}${hcol('stResponses', 'Responses')}
              ${hcol('stRate', 'Response rate')}${hcol('stResult', 'Result')}
            </tr></thead>
            <tbody>${storyRows}</tbody>
            <tfoot><tr>
              <td class="cname">TOTAL</td>
              <td class="num">${int(sViews)}</td>
              <td class="num">${int(sResp)}</td>
              <td class="abar-cell"><span class="abar-pct">${sViews ? pct(sResp / sViews) : '—'}</span></td>
              <td></td>
            </tr></tfoot>
          </table>
        </div>` : '<div class="pnote">No stories in the sheet for this month.</div>'}
      </div>`;

    $('engagementsWrap').innerHTML = `
      ${p.stale ? `<div class="msg err">Showing the last copy of the sheet — ${esc(p.error || 'OneDrive unreachable')}</div>` : ''}
      ${subtabs}
      ${engSub === 'stories' ? storiesHtml : postsHtml}`;

    bindHelp($('engagementsWrap'));
    $('engagementsWrap').querySelectorAll('[data-eng-month]').forEach((b) => {
      b.addEventListener('click', () => { engMonth = b.dataset.engMonth; renderEngagements(); });
    });
    $('engagementsWrap').querySelectorAll('[data-eng-sub]').forEach((b) => {
      b.addEventListener('click', () => { engSub = b.dataset.engSub; renderEngagements(); });
    });
    const sortSel = $('engagementsWrap').querySelector('#engSortSel');
    if (sortSel) sortSel.addEventListener('change', () => { engSort = sortSel.value; renderEngagements(); });
    const storySel = $('engagementsWrap').querySelector('#storySortSel');
    if (storySel) storySel.addEventListener('change', () => { storySort = storySel.value; renderEngagements(); });
  }

  async function loadEngagements(force) {

  /* ================= trips tab (Trip Decision Dashboard sheet) ================= */

  let tripsData = null;
  // Which sub-tab of Trips is open: 'overview' or 'products'.
  let tripsSub = 'overview';
  const tripFilter = { region: 'all', quality: 'all', status: 'all' };
  // Trips whose analysis/actions row is open, by name, so it survives a
  // filter change and the 5-minute refresh.
  const tripsOpen = new Set();

  const Q_ORDER = ['High', 'Medium', 'Low', 'R&D'];
  const Q_STYLE = {
    High: { c: 'var(--q-high)', g: '▲' },
    Medium: { c: 'var(--q-med)', g: '■' },
    Low: { c: 'var(--q-low)', g: '▼' },
    'R&D': { c: 'var(--q-rd)', g: '◆' },
  };
  const qStyle = (q) => Q_STYLE[q] || { c: 'var(--q-none)', g: '○' };
  const qGlyph = (q) => `<i style="color:${qStyle(q).c}">${qStyle(q).g}</i>`;
  const qPill = (q) => (q ? `<span class="trp-pill" style="background:color-mix(in srgb, ${qStyle(q).c} 22%, transparent)">${qGlyph(q)}${esc(q)}</span>` : '—');
  const usd = (n) => (n == null ? '—' : `$${int(n)}`);

  function renderTrips() {
    const p = tripsData;
    if (!p) return;
    if (p.error && !p.trips) {
      $('tripsWrap').innerHTML = `<div class="msg err">Could not load trips: ${esc(p.error)}</div>`;
      return;
    }
    const t = p.totals;

    // ---- where the weeks go ----
    const rated = p.byQuality.filter((q) => q.trips > 0 || Q_ORDER.includes(q.quality));
    const segs = rated.filter((q) => q.weeks > 0).map((q) => `
      <div class="trp-seg" style="flex:${q.weeks};background:${qStyle(q.quality).c}" ${tipOf(q.quality, [['Trips', int(q.trips)], ['Weeks', int(q.weeks)], ['Share of weeks', pct(q.share)]], q.whatToDo)}>${q.share >= 0.08 ? int(q.weeks) : ''}</div>`).join('');
    const legend = rated.map((q) => `<span class="trp-q">${qGlyph(q.quality)}${esc(q.quality)} <b>${int(q.weeks)}</b> wk · ${pct(q.share)}</span>`).join('');
    const guideRows = rated.map((q) => `
      <tr>
        <td class="trp-l">${qPill(q.quality)}</td>
        <td class="trp-txt">${esc(q.meaning || '')}</td>
        <td class="num">${int(q.trips)}</td>
        <td class="num">${int(q.weeks)}</td>
        <td class="abar-cell"><div class="abar"><div class="abar-fill" style="width:${(q.share * 100).toFixed(1)}%;background:${qStyle(q.quality).c}"></div></div><span class="abar-pct">${pct(q.share)}</span></td>
        <td class="trp-txt">${esc(q.whatToDo || '')}</td>
      </tr>`).join('');

    // ---- quality by region ----
    const regionRows = p.byRegion.map((r) => {
      const mini = Q_ORDER.filter((q) => r[`${q}Weeks`] > 0).map((q) => `<div style="flex:${r[`${q}Weeks`]};background:${qStyle(q).c}"></div>`).join('');
      return `
      <tr>
        <td class="cname">${esc(r.region)}</td>
        ${Q_ORDER.map((q) => `<td class="num">${r[q] ? int(r[q]) : '<span style="color:var(--text-3)">0</span>'}</td>`).join('')}
        <td class="num"><b>${int(r.trips)}</b></td>
        <td class="num">${int(r.weeks)}</td>
        <td ${tipOf(r.region, Q_ORDER.map((q) => [q, `${int(r[`${q}Weeks`])} wk`]))}>${r.weeks ? `<div class="trp-mini">${mini}</div>` : '<span style="color:var(--text-3)">no weeks yet</span>'}</td>
      </tr>`;
    }).join('');

    // ---- R&D pipeline, as a board ----
    // One column per stage, left to right the way a product moves through
    // R&D, with On hold set apart since it's off the main path. Stages get a
    // stepper and one accent rather than colours of their own: green, yellow
    // and red already mean High/Medium/Low quality on this tab.
    const STAGES = [
      { key: 'Not Started', label: 'Not started', steps: 0 },
      { key: 'In Progress', label: 'In progress', steps: 2 },
      { key: 'Complete', label: 'Complete', steps: 3 },
      { key: 'On Hold', label: 'On hold', steps: 1, hold: true },
    ];
    const stageOf = (x) => STAGES.find((st) => st.key.toLowerCase() === String(x.rdStatus || '').toLowerCase()) || null;
    // "Not sure (unknown)" is the sheet's placeholder for no PIC yet.
    const ownerOf = (x) => (x.pic && !/not sure|unknown/i.test(x.pic) ? x.pic : null);
    const rdCard = (x, st) => {
      const owner = ownerOf(x);
      const steps = [0, 1, 2].map((i) => `<i class="${i < st.steps ? 'on' : ''}"></i>`).join('');
      return `
        <div class="trp-card${st.hold ? ' hold' : ''}">
          <div class="trp-card-top">
            <div class="trp-card-name">${esc(x.name)}</div>
            ${x.year ? `<span class="trp-year${x.year === Number(String(p.asOf).slice(0, 4)) ? ' now' : ''}">${x.year}</span>` : ''}
          </div>
          <div class="trp-sub">${esc([x.category, x.region, x.destination].filter(Boolean).join(' · '))}</div>
          <div class="trp-stepper${st.key === 'Complete' ? ' done' : ''}${st.hold ? ' paused' : ''}" ${tipOf(x.name, [['R&D status', st.label]])}>${steps}<span>${st.key === 'Complete' ? '✓ ' : st.hold ? '⏸ ' : ''}${esc(st.label)}</span></div>
          <div class="trp-owner">${owner ? `<b>${esc(owner.charAt(0).toUpperCase())}</b>${esc(owner)}` : '<em>No owner yet</em>'}</div>
          ${x.rdNext ? `<div class="trp-next"><span>Next step</span>${esc(x.rdNext)}</div>` : ''}
        </div>`;
    };
    const rdCols = STAGES.map((st) => {
      const list = p.rd.filter((x) => stageOf(x) === st).sort((a, b) => (a.year || 9999) - (b.year || 9999) || a.name.localeCompare(b.name));
      return `
        <div class="trp-col${st.hold ? ' hold' : ''}">
          <div class="trp-col-head">${esc(st.label)} <span class="ecount">${list.length}</span></div>
          ${list.map((x) => rdCard(x, st)).join('') || '<div class="trp-col-empty">None</div>'}
        </div>`;
    }).join('');
    // Anything with a status the board doesn't know still shows, in a row
    // of its own, rather than silently dropping off.
    const rdOther = p.rd.filter((x) => !stageOf(x));
    const byYear = [...new Set(p.rd.map((x) => x.year).filter(Boolean))].sort().map((y) => `${y}: <b>${p.rd.filter((x) => x.year === y).length}</b>`).join(' · ');
    const stageStrip = STAGES.map((st) => {
      const n = p.rd.filter((x) => stageOf(x) === st).length;
      const cls = st.key === 'Complete' ? ' done' : st.hold ? ' paused' : st.steps === 0 ? ' idle' : '';
      return n ? `<div class="trp-strip-seg${cls}" style="flex:${n}" ${tipOf(st.label, [['Trips', int(n)]])}>${n}<span>&nbsp;${esc(st.label.toLowerCase())}</span></div>` : '';
    }).join('');

    // ---- all products, filtered ----
    const opts = (key) => [...new Set(p.trips.map((x) => x[key]).filter(Boolean))];
    const regions = p.byRegion.map((r) => r.region);
    const qualities = Q_ORDER.filter((q) => p.trips.some((x) => x.quality === q));
    const statuses = opts('status');
    for (const [key, list] of [['region', regions], ['quality', qualities], ['status', statuses]]) {
      if (tripFilter[key] !== 'all' && !list.includes(tripFilter[key])) tripFilter[key] = 'all';
    }
    const passes = (x, skip) => ['region', 'quality', 'status'].every((k) => k === skip || tripFilter[k] === 'all' || x[k] === tripFilter[k]);
    const shown = p.trips.filter((x) => passes(x));
    // Each button counts what it would show given the other two filters.
    const pills = (key, list) => ['all', ...list].map((v) => {
      const n = p.trips.filter((x) => passes(x, key) && (v === 'all' || x[key] === v)).length;
      return `<button data-trip-f="${key}" data-trip-v="${attr(v)}" aria-pressed="${tripFilter[key] === v}">${v === 'all' ? 'All' : (key === 'quality' ? qGlyph(v) + ' ' : '') + esc(v)} <span class="ecount">${n}</span></button>`;
    }).join('');

    const COLS = 9;
    const productRows = shown.map((x) => {
      const hasDetail = x.analysis || x.actions || x.notes || x.rdNext;
      const open = hasDetail && tripsOpen.has(x.name);
      const priceSub = x.oldPrice != null && x.newPrice != null && x.oldPrice !== x.newPrice
        ? `was ${usd(x.oldPrice)} · ${x.priceChange != null ? `${x.priceChange > 0 ? '+' : ''}${(x.priceChange * 100).toFixed(1)}%` : ''}`
        : (x.oldPrice != null && x.newPrice == null ? 'existing price' : (x.newPrice != null ? 'no change' : ''));
      const detail = open ? `
        <tr class="trp-detail"><td colspan="${COLS}"><dl class="trp-dl" dir="auto">
          ${x.analysis ? `<dt>Detailed analysis</dt><dd>${esc(x.analysis)}</dd>` : ''}
          ${x.actions ? `<dt>Corrective actions</dt><dd>${esc(x.actions)}</dd>` : ''}
          ${x.notes ? `<dt>Additional notes</dt><dd>${esc(x.notes)}</dd>` : ''}
          ${x.rdNext ? `<dt>R&amp;D next step</dt><dd>${esc(x.rdNext)}</dd>` : ''}
        </dl></td></tr>` : '';
      return `
      <tr>
        <td class="cname">${esc(x.name)}<span class="trp-sub">${esc([x.category, x.destination].filter(Boolean).join(' · '))}</span>${hasDetail ? `<button class="trp-toggle" data-trip-open="${attr(x.name)}" aria-expanded="${!!open}">${open ? 'Hide details' : 'Details'}</button>` : ''}</td>
        <td class="trp-l">${esc(x.region || '—')}</td>
        <td class="num">${x.weeks == null ? '—' : int(x.weeks)}</td>
        <td class="num">${x.days == null ? '—' : int(x.days)}</td>
        <td class="num"><b>${usd(x.newPrice ?? x.oldPrice)}</b>${priceSub ? `<span class="trp-sub nw">${esc(priceSub)}</span>` : ''}</td>
        <td class="trp-l">${qPill(x.quality)}</td>
        <td class="trp-l">${esc(x.status || '—')}</td>
        <td class="trp-txt trp-dec">${esc(x.decision || '—')}</td>
        <td class="trp-l">${esc(x.pic || '—')}</td>
      </tr>${detail}`;
    }).join('');

    // Two sub-tabs, so the page isn't one long scroll: the decision overview
    // (tiles, quality guide, regions, R&D), and the full product list with
    // its filters. Filters and opened Details are kept across switches.
    const overviewHtml = `
      <div class="panel">
        <div class="ptitle">Trip decisions · which products to grow, optimise, or stop</div>
        <div class="bvhero trp-tiles">
          <div class="bv-side"><div class="bv-lab"><span ${hlp('trProducts')}>Trip products</span></div><div class="bv-n">${int(t.trips)}</div></div>
          <div class="bv-side"><div class="bv-lab"><span ${hlp('trWeeks')}>Departure weeks</span></div><div class="bv-n bv-act">${int(t.weeks)}</div></div>
          ${Q_ORDER.map((q) => `<div class="bv-side"><div class="bv-lab"><span class="trp-q">${qGlyph(q)}${esc(q)}</span></div><div class="bv-n">${int(t[q] || 0)}</div><div class="bv-s">trips</div></div>`).join('')}
        </div>
        <div class="trp-bar" role="img" aria-label="Departure weeks by quality">${segs}</div>
        <div class="trp-leg">${legend}</div>
        <div class="tscroll" style="margin-top:14px">
          <table class="ctable">
            <thead><tr>
              <th class="trp-l"><span ${hlp('trQuality')}>Rating</span></th><th class="trp-l"><span ${hlp('trMeaning')}>What it means</span></th>
              ${hcol('trTrips', 'Trips')}${hcol('trWeeks', 'Weeks')}${hcol('trShare', '% of weeks')}<th class="trp-l"><span ${hlp('trTodo')}>What we do</span></th>
            </tr></thead>
            <tbody>${guideRows}</tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="ptitle">Quality by region</div>
        <div class="tscroll">
          <table class="ctable">
            <thead><tr>
              ${hcol('trRegion', 'Region')}${Q_ORDER.map((q) => `<th><span class="trp-q">${qGlyph(q)}${esc(q)}</span></th>`).join('')}
              ${hcol('trTrips', 'Trips')}${hcol('trWeeks', 'Weeks')}<th class="trp-l"><span ${hlp('trMix')}>Weeks by quality</span></th>
            </tr></thead>
            <tbody>${regionRows}</tbody>
            <tfoot><tr>
              <td class="cname">TOTAL</td>
              ${Q_ORDER.map((q) => `<td class="num">${int(t[q] || 0)}</td>`).join('')}
              <td class="num">${int(t.trips)}</td><td class="num">${int(t.weeks)}</td><td></td>
            </tr></tfoot>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="ptitle">R&amp;D pipeline · ${int(p.rd.length)} trip${p.rd.length === 1 ? '' : 's'}</div>
        ${p.rd.length ? `
        <div class="trp-strip-wrap">
          <div class="trp-strip">${stageStrip}</div>
          <div class="trp-leg"><span>Launching ${byYear}</span></div>
        </div>
        <div class="trp-board">${rdCols}</div>
        ${rdOther.length ? `<div class="trp-board">${rdOther.map((x) => rdCard(x, { key: x.rdStatus || '', label: x.rdStatus || 'No status', steps: 0 })).join('')}</div>` : ''}`
          : '<div class="pnote">Nothing in R&amp;D right now.</div>'}
      </div>
`;
    const productsHtml = `
      <div class="panel">
        <div class="ptitle">All products · ${int(shown.length)} of ${int(p.trips.length)}</div>
        <div class="efilters">
          <div class="efilter"><span class="efl">Region</span><div class="seg">${pills('region', regions)}</div></div>
          <div class="efilter"><span class="efl">Quality</span><div class="seg">${pills('quality', qualities)}</div></div>
          <div class="efilter"><span class="efl">Status</span><div class="seg">${pills('status', statuses)}</div></div>
        </div>
        <div class="tscroll">
          <table class="ctable">
            <thead><tr>
              ${hcol('trTrip', 'Trip')}<th class="trp-l"><span ${hlp('trRegion')}>Region</span></th>${hcol('trWeeks', 'Weeks')}${hcol('trDays', 'Days')}
              ${hcol('trPrice', 'Price')}<th class="trp-l"><span ${hlp('trQuality')}>Quality</span></th><th class="trp-l"><span ${hlp('trStatus')}>Status</span></th>
              <th class="trp-l"><span ${hlp('trDecision')}>Decision</span></th><th class="trp-l"><span ${hlp('trPic')}>PIC</span></th>
            </tr></thead>
            <tbody>${productRows || `<tr><td class="cname" colspan="${COLS}">No trips match these filters.</td></tr>`}</tbody>
          </table>
        </div>
      </div>`;
    const subtabs = `
      <div class="seg subtabs" role="tablist" aria-label="Trips sections">
        <button role="tab" data-trip-sub="overview" aria-pressed="${tripsSub === 'overview'}" aria-selected="${tripsSub === 'overview'}">Overview</button>
        <button role="tab" data-trip-sub="products" aria-pressed="${tripsSub === 'products'}" aria-selected="${tripsSub === 'products'}">All products <span class="ecount">${int(p.trips.length)}</span></button>
      </div>`;

    $('tripsWrap').innerHTML = `
      ${p.stale ? `<div class="msg err">Showing the last copy of the sheet — ${esc(p.error || 'OneDrive unreachable')}</div>` : ''}

      ${subtabs}
      ${tripsSub === 'products' ? productsHtml : overviewHtml}`;

    bindHelp($('tripsWrap'));
    $('tripsWrap').querySelectorAll('[data-trip-sub]').forEach((b) => {
      b.addEventListener('click', () => {
        if (tripsSub === b.dataset.tripSub) return;
        tripsSub = b.dataset.tripSub;
        renderTrips();
        // Switching from far down the page shouldn't leave you mid-way into
        // the other section: bring the tab bar back into view.
        const bar = $('tripsWrap').querySelector('.subtabs');
        if (bar && bar.getBoundingClientRect().top < 0 && typeof bar.scrollIntoView === 'function') bar.scrollIntoView({ block: 'start' });
      });
    });
    $('tripsWrap').querySelectorAll('[data-trip-f]').forEach((b) => {
      b.addEventListener('click', () => { tripFilter[b.dataset.tripF] = b.dataset.tripV; renderTrips(); });
    });
    $('tripsWrap').querySelectorAll('[data-trip-open]').forEach((b) => {
      b.addEventListener('click', () => {
        const n = b.dataset.tripOpen;
        if (tripsOpen.has(n)) tripsOpen.delete(n); else tripsOpen.add(n);
        renderTrips();
      });
    });
  }

  async function loadTrips(force) {
    try {
      const res = await fetch('/api/sheets?name=trips' + (force ? '&refresh=1' : ''));
      const p = await res.json();
      if (!res.ok && !p.trips) throw new Error(p.error || `HTTP ${res.status}`);
      tripsData = p;
      renderTrips();
    } catch (err) {
      if (!tripsData) $('tripsWrap').innerHTML = `<div class="msg err">Could not load trips: ${esc(err.message)}</div>`;
    }
  }

  /* ================= feedback tab (trip survey sheet) ================= */

  let feedback = null;
  // Which sub-tab of Feedback is open: 'overview', 'ratings' or 'comments'.
  let fbSub = 'overview';
  const fbFilter = { prog: 'all', kind: 'all' };
  // Trips whose scores are open, by id, so they survive the 5-minute refresh.
  const fbOpen = new Set();

  // The sheet's own bands for a 1-5 score.
  const fbBand = (v) => (v >= 4 ? 'var(--q-high)' : v >= 3 ? 'var(--q-med)' : 'var(--q-low)');
  const fbNum = (v) => (Number.isInteger(v) ? String(v) : v.toFixed(2).replace(/0$/, ''));
  const fbMonth = (key) => {
    const [y, m] = String(key).split('-').map(Number);
    return y && m ? new Date(Date.UTC(y, m - 1, 1)).toLocaleString('en-US', { month: 'short', year: 'numeric', timeZone: 'UTC' }) : String(key);
  };
  const fbBar = (v, color, max = 5) => `<div class="abar"><div class="abar-fill" style="width:${Math.max(0, Math.min(100, (v / max) * 100)).toFixed(1)}%;background:${color}"></div></div>`;
  const fbScore = (label, sub, v) => `<div class="fb-score"><span>${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ''}</span>${fbBar(v, fbBand(v))}<b>${fbNum(v)}</b></div>`;
  // The sheet has four surveys (Building / Medical, Teaching, Wellness,
  // Explorer); the tab shows three groups (Anton, 5 Oct 2026: "only show and
  // filter Volunteering, Wellness, and Explore ... no need to split per
  // programme"). Building, Medical and Teaching are Volunteering.
  const FB_GROUPS = ['Volunteering', 'Wellness', 'Explore'];
  const fbGroupName = (name) => {
    const n = String(name || '');
    if (/building|medical|teach|volunt/i.test(n)) return 'Volunteering';
    if (/wellness/i.test(n)) return 'Wellness';
    if (/explor/i.test(n)) return 'Explore';
    return n || 'Other';
  };
  // Concerns and suggestions ahead of praise, as the sheet orders them.
  const FB_KINDS = ['Concern', 'Suggestion', 'Praise', 'Testimonial'];

  function renderFeedback() {
    const p = feedback;
    if (!p) return;
    if (p.error && !p.trips) {
      $('feedbackWrap').innerHTML = `<div class="msg err">Could not load feedback: ${esc(p.error)}</div>`;
      return;
    }
    const t = p.totals;
    const escTrips = p.trips.filter((x) => x.escalations > 0);
    const ofMatch = (v) => /^(\d+) of (\d+)$/.exec(String(v || ''));

    // ---- overview: tiles ----
    const reported = ofMatch(t.tripsReported);
    const counted = ofMatch(t.responsesCounted);
    const tiles = `
      <div class="bvhero trp-tiles">
        <div class="bv-side"><div class="bv-lab"><span ${hlp('fbSat')}>Satisfaction</span></div><div class="bv-n bv-act">${t.satisfaction == null ? '—' : pct(t.satisfaction)}</div>
          ${t.satisfaction == null ? '' : `<div class="abar fb-hbar"><div class="abar-fill" style="width:${(t.satisfaction * 100).toFixed(1)}%;background:${fbBand(t.satisfaction * 5)}"></div></div>`}<div class="bv-s">year to date</div></div>
        <div class="bv-side"><div class="bv-lab"><span ${hlp('fbTrips')}>Trips reported</span></div><div class="bv-n">${reported ? int(reported[1]) : esc(t.tripsReported || '—')}</div><div class="bv-s">${reported ? `of ${int(reported[2])} surveyed` : ''}</div></div>
        <div class="bv-side"><div class="bv-lab"><span ${hlp('fbResp')}>Responses</span></div><div class="bv-n">${counted ? int(counted[1]) : esc(t.responsesCounted || '—')}</div><div class="bv-s">${counted ? `of ${int(counted[2])} counted` : ''}</div></div>
      </div>
      ${t.escalations ? `<div class="fb-alert"><b>⚑ ${int(t.escalations)} comment${t.escalations === 1 ? '' : 's'} flagged to escalate</b> · ${escTrips.map((x) => esc(`${x.name}, ${fbMonth(x.month)}`)).join('; ')} <button class="trp-toggle" data-fb-sub="comments">Read ${t.escalations === 1 ? 'it' : 'them'}</button></div>` : ''}`;

    // ---- overview: trips by month ----
    // Overall comes straight after the name so it's on screen on a phone.
    // Response rate is a neutral slate, not the brand fill: amber on this tab
    // already means a 3.0-3.9 score.
    const COLS = 5;
    let lastMonth = null;
    const tripRows = p.trips.map((x) => {
      const hasDetail = x.scores.length || x.items.length || x.facts.length || x.noComments;
      const open = hasDetail && fbOpen.has(x.id);
      const monthRow = x.month !== lastMonth ? `<tr class="fb-month"><td colspan="${COLS}">${esc(fbMonth(x.month))}</td></tr>` : '';
      lastMonth = x.month;
      const detail = open ? `
        <tr class="trp-detail"><td colspan="${COLS}"><div class="fb-detail">
          ${x.scores.length ? `<div class="fb-dh">Scores · 1 to 5${x.template ? ` · ${esc(fbGroupName(x.template))} survey` : ''}</div><div class="fb-scores">${x.scores.map((s) => fbScore(s.q, null, s.v)).join('')}</div>` : ''}
          ${x.items.length ? `<div class="fb-dh">Hotels and activities</div><div class="fb-scores">${x.items.filter((s) => s.score != null).map((s) => fbScore(s.item, s.type, s.score)).join('')}</div>` : ''}
          ${x.facts.length ? `<dl class="trp-dl">${x.facts.map((f) => `<dt>${esc(f.q)}</dt><dd>${esc(f.text)}</dd>`).join('')}</dl>` : ''}
          ${x.noComments ? `<div class="pnote">${esc(x.noComments)}</div>` : ''}
        </div></td></tr>` : '';
      return `${monthRow}
      <tr>
        <td class="cname">${esc(x.name)}<span class="trp-sub">${esc(fbGroupName(x.template || x.programme))}</span>${hasDetail ? `<button class="trp-toggle" data-fb-open="${attr(x.id)}" aria-expanded="${!!open}">${open ? 'Hide scores' : 'Details'}</button>` : ''}</td>
        <td class="abar-cell">${x.overall == null ? '<span class="fb-na">no answers</span>' : `${fbBar(x.overall, fbBand(x.overall))}<span class="abar-pct">${fbNum(x.overall)}</span>`}</td>
        <td class="num">${esc(x.responsesText || '—')}</td>
        <td class="abar-cell">${x.responseRate == null ? '<span class="fb-na">N/A</span>' : `${fbBar(x.responseRate, 'var(--text-3)', 1)}<span class="abar-pct">${pct(x.responseRate)}</span>`}</td>
        <td class="num">${int(x.comments)}${x.escalations ? `<span class="fb-flag" title="Flagged to escalate">⚑ ${int(x.escalations)}</span>` : ''}</td>
      </tr>${detail}`;
    }).join('');

    // ---- overview: lowest scores ----
    const lows = [];
    for (const x of p.trips) {
      const where = `${x.name} · ${fbMonth(x.month)}`;
      for (const s of x.scores) if (s.v < 4) lows.push({ label: s.q, where, v: s.v });
      for (const s of x.items) if (s.score != null && s.score < 4) lows.push({ label: `${s.item}${s.type ? ` (${s.type.toLowerCase()})` : ''}`, where, v: s.score });
    }
    lows.sort((a, b) => a.v - b.v);

    const overviewHtml = `
      <div class="panel">
        <div class="ptitle">Trip feedback · ${esc(String(p.trips[0]?.month || p.asOf).slice(0, 4))}</div>
        ${tiles}
      </div>

      <div class="panel">
        <div class="ptitle">By trip · most recent first</div>
        <div class="tscroll">
          <table class="ctable">
            <thead><tr>
              ${hcol('fbTrip', 'Trip')}${hcol('fbOverall', 'Overall (1–5)')}${hcol('fbResponses', 'Responses')}${hcol('fbRate', 'Response rate')}${hcol('fbComments', 'Comments')}
            </tr></thead>
            <tbody>${tripRows || `<tr><td class="cname" colspan="${COLS}">No surveys in the sheet yet.</td></tr>`}</tbody>
          </table>
        </div>
      </div>

      ${lows.length ? `
      <div class="panel">
        <div class="ptitle"><span ${hlp('fbLow')}>Lowest scores</span> · under 4.0</div>
        <div class="fb-low">${lows.map((l) => fbScore(l.label, l.where, l.v)).join('')}</div>
      </div>` : ''}`;

    // ---- ratings: every question, trip by trip ----
    // One table per group, a row per question and a column per trip. The
    // sheet's own layout turned on its side, so a phone scrolls down it
    // rather than across 20 columns. A group's questions are those of every
    // survey in it, in the sheet's order; a trip not asked one shows "Not
    // asked" (Teaching has no Trip Manual, for example).
    const groups = FB_GROUPS.concat(p.programmes.map((g) => fbGroupName(g.name)).filter((n) => !FB_GROUPS.includes(n)))
      .filter((v, i, a) => a.indexOf(v) === i)
      .map((name) => {
        const members = p.programmes.filter((g) => fbGroupName(g.name) === name);
        const questions = [];
        for (const g of members) for (const q of g.questions || []) if (!questions.includes(q)) questions.push(q);
        return { name, questions, summary: members.map((g) => g.summary).filter(Boolean).join(' ') };
      })
      .filter((g) => p.programmes.some((m) => fbGroupName(m.name) === g.name));
    const ratingsHtml = groups.map((g) => {
      const answered = (x) => x.scores.length || x.facts.length;
      const trips = p.trips.filter((x) => fbGroupName(x.template || x.programme) === g.name && answered(x));
      const silent = p.trips.filter((x) => fbGroupName(x.template || x.programme) === g.name && !answered(x));
      if (!trips.length && !silent.length) return '';
      const cell = (x, q) => {
        const sc = x.scores.find((a) => a.q === q);
        if (sc) return `<td class="fb-cell">${fbBar(sc.v, fbBand(sc.v))}<b>${fbNum(sc.v)}</b></td>`;
        const f = x.facts.find((a) => a.q === q);
        if (f) return `<td class="fb-txt">${esc(f.text)}</td>`;
        // "Not asked" when the trip's own survey doesn't have the question at
        // all (a Teaching trip has no Giving questions); a dash when it does
        // but nobody answered.
        const own = (p.programmes.find((m) => m.name === x.template) || {}).questions;
        return `<td class="fb-cell fb-na">${x.notAsked.includes(q) || (own && !own.includes(q)) ? 'Not asked' : '—'}</td>`;
      };
      // A question none of these trips was asked is left out, not shown as
      // a row of "Not asked".
      const qs = (g.questions || []).filter((q) => trips.some((x) => x.scores.some((a) => a.q === q) || x.facts.some((a) => a.q === q)));
      const overall = `<tr class="fb-overall"><td class="fb-q">Overall satisfaction</td>${trips.map((x) => (x.overall == null ? '<td class="fb-cell fb-na">—</td>' : `<td class="fb-cell">${fbBar(x.overall, fbBand(x.overall))}<b>${fbNum(x.overall)}</b></td>`)).join('')}</tr>`;
      const rows = qs.map((q) => `<tr><td class="fb-q">${esc(q)}</td>${trips.map((x) => cell(x, q)).join('')}</tr>`).join('');
      return `
      <div class="panel">
        <div class="ptitle">${esc(g.name)} · ${int(trips.length)} trip${trips.length === 1 ? '' : 's'}</div>
        ${trips.length ? `
        <div class="tscroll">
          <table class="ctable fb-matrix">
            <thead><tr>
              <th class="fb-l"><span ${hlp('fbQuestion')}>Question</span></th>
              ${trips.map((x) => `<th class="fb-trip-h">${esc(x.name)}<small>${esc(fbMonth(x.month))} · ${esc(x.responsesText || '')}</small></th>`).join('')}
            </tr></thead>
            <tbody>${overall}${rows}</tbody>
          </table>
        </div>` : ''}
        ${silent.length ? `<div class="pnote">No answers yet: ${silent.map((x) => esc(`${x.name}, ${fbMonth(x.month)}`)).join('; ')}.</div>` : ''}
      </div>`;
    }).join('') || '<div class="msg">No ratings in the sheet yet.</div>';

    // ---- what people wrote ----
    const progOf = new Map(p.trips.map((x) => [x.id, fbGroupName(x.template || x.programme)]));
    const progs = groups.map((g) => g.name);
    const kinds = [...FB_KINDS.filter((k) => p.comments.some((c) => c.kind === k)), ...new Set(p.comments.map((c) => c.kind).filter((k) => !FB_KINDS.includes(k)))];
    if (fbFilter.prog !== 'all' && !progs.includes(fbFilter.prog)) fbFilter.prog = 'all';
    if (fbFilter.kind !== 'all' && !kinds.includes(fbFilter.kind)) fbFilter.kind = 'all';
    const passes = (c, skip) => (skip === 'prog' || fbFilter.prog === 'all' || progOf.get(c.trip) === fbFilter.prog)
      && (skip === 'kind' || fbFilter.kind === 'all' || c.kind === fbFilter.kind);
    // Each button counts what it would show given the other filter.
    const pills = (key, list) => ['all', ...list].map((v) => {
      const n = p.comments.filter((c) => passes(c, key) && (v === 'all' || (key === 'prog' ? progOf.get(c.trip) === v : c.kind === v))).length;
      return `<button data-fb-f="${key}" data-fb-v="${attr(v)}" aria-pressed="${fbFilter[key] === v}">${v === 'all' ? 'All' : esc(v)} <span class="ecount">${n}</span></button>`;
    }).join('');
    const shownComments = p.comments.filter((c) => passes(c));
    const commentCard = (c) => `
      <div class="fb-c${c.escalate ? ' fb-c-esc' : ''}">
        <div class="fb-c-head"><span class="fb-kind fb-k-${attr(String(c.kind).toLowerCase())}">${esc(c.kind)}</span>${c.source ? `<span>${esc(c.source)}</span>` : ''}${c.escalate ? '<span class="fb-flag">⚑ Escalate</span>' : ''}</div>
        <div dir="auto">${esc(c.text || '')}</div>
      </div>`;
    const progBlocks = progs.map((name) => {
      const list = shownComments.filter((c) => progOf.get(c.trip) === name);
      if (!list.length) return '';
      const g = groups.find((x) => x.name === name);
      const tripIds = [...new Set(list.map((c) => c.trip))];
      return `
        <div class="fb-prog">
          <h3>${esc(name)} <span class="ecount">${list.length}</span></h3>
          ${g && g.summary && fbFilter.kind === 'all' ? `<div class="fb-ask" dir="auto">${esc(g.summary)}</div>` : ''}
          ${tripIds.map((id) => {
            const mine = list.filter((c) => c.trip === id);
            return `<div class="fb-trip">${esc(mine[0].tripName)} · ${esc(fbMonth(mine[0].month))}</div>${mine.map(commentCard).join('')}`;
          }).join('')}
        </div>`;
    }).join('');
    const commentsHtml = `
      <div class="panel">
        <div class="ptitle">What people wrote · ${int(shownComments.length)} of ${int(p.comments.length)}</div>
        <div class="efilters">
          <div class="efilter"><span class="efl">Type of trip</span><div class="seg">${pills('prog', progs)}</div></div>
          <div class="efilter"><span class="efl">Type</span><div class="seg">${pills('kind', kinds)}</div></div>
        </div>
        ${progBlocks || '<div class="pnote">No comments match these filters.</div>'}
      </div>`;

    const subtabs = `
      <div class="seg subtabs" role="tablist" aria-label="Feedback sections">
        <button role="tab" data-fb-sub="overview" aria-pressed="${fbSub === 'overview'}" aria-selected="${fbSub === 'overview'}">Overview</button>
        <button role="tab" data-fb-sub="ratings" aria-pressed="${fbSub === 'ratings'}" aria-selected="${fbSub === 'ratings'}">Ratings</button>
        <button role="tab" data-fb-sub="comments" aria-pressed="${fbSub === 'comments'}" aria-selected="${fbSub === 'comments'}">What people wrote <span class="ecount">${int(p.comments.length)}</span></button>
      </div>`;

    $('feedbackWrap').innerHTML = `
      ${p.stale ? `<div class="msg err">Showing the last copy of the sheet — ${esc(p.error || 'OneDrive unreachable')}</div>` : ''}
      ${subtabs}
      ${fbSub === 'comments' ? commentsHtml : fbSub === 'ratings' ? ratingsHtml : overviewHtml}`;

    bindHelp($('feedbackWrap'));
    $('feedbackWrap').querySelectorAll('[data-fb-sub]').forEach((b) => {
      b.addEventListener('click', () => {
        if (fbSub === b.dataset.fbSub) return;
        fbSub = b.dataset.fbSub;
        renderFeedback();
        const bar = $('feedbackWrap').querySelector('.subtabs');
        if (bar && bar.getBoundingClientRect().top < 0 && typeof bar.scrollIntoView === 'function') bar.scrollIntoView({ block: 'start' });
      });
    });
    $('feedbackWrap').querySelectorAll('[data-fb-f]').forEach((b) => {
      b.addEventListener('click', () => { fbFilter[b.dataset.fbF] = b.dataset.fbV; renderFeedback(); });
    });
    $('feedbackWrap').querySelectorAll('[data-fb-open]').forEach((b) => {
      b.addEventListener('click', () => {
        const id = b.dataset.fbOpen;
        if (fbOpen.has(id)) fbOpen.delete(id); else fbOpen.add(id);
        renderFeedback();
      });
    });
  }

  async function loadFeedback(force) {
    try {
      const res = await fetch('/api/sheets?name=feedback' + (force ? '&refresh=1' : ''));
      const p = await res.json();
      if (!res.ok && !p.trips) throw new Error(p.error || `HTTP ${res.status}`);
      feedback = p;
      renderFeedback();
    } catch (err) {
      if (!feedback) $('feedbackWrap').innerHTML = `<div class="msg err">Could not load feedback: ${esc(err.message)}</div>`;
    }
  }

  /* ================= trip revenue tab (revenue sheet) ================= */

  let revData = null;
  // Which sub-tab of Trip Revenue is open: 'overview' or 'trips'.
  let rvSub = 'overview';
  const rvFilter = { programme: 'all', result: 'all' };

  // Muatasam, 4 Oct 2026: percentages only, no amounts, nothing per person.
  // The API sends no amount at all, and the page no longer has a column or a
  // word for one (Anton, 5 Oct: remove "Hidden" entirely).
  // A true minus, matching the rest of the dashboard.
  const rvPct = (n) => (n == null ? '—' : pct(n).replace('-', '−'));
  const rvMonth = (key) => {
    const [y, m] = String(key).split('-').map(Number);
    return y && m ? new Date(Date.UTC(y, m - 1, 1)).toLocaleString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' }) : 'No month';
  };
  // "6 Sep" by hand: en-GB spells September "Sept".
  const RV_MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const rvDay = (iso) => `${Number(iso.slice(8, 10))} ${RV_MON[Number(iso.slice(5, 7)) - 1]}`;
  const rvDates = (t) => (t.start && t.end ? `${rvDay(t.start)} – ${rvDay(t.end)}` : '');
  const RV_RESULT = {
    Gain: { c: 'var(--q-high)', g: '▲' },
    Loss: { c: 'var(--q-low)', g: '▼' },
    'Break-even': { c: 'var(--q-none)', g: '■' },
  };
  // Suggestion levels, in the status colours with a glyph and a word, so
  // colour is never the only signal.
  const RV_SUG = {
    fix: { c: 'var(--q-low)', g: '▼', l: 'Fix' },
    improve: { c: 'var(--q-med)', g: '■', l: 'Improve' },
    keep: { c: 'var(--q-high)', g: '▲', l: 'Keep doing' },
    note: { c: 'var(--q-none)', g: '○', l: 'Note' },
  };
  const rvResult = (r) => {
    if (!r) return '<span class="rv-na">—</span>';
    const st = RV_RESULT[r];
    return st ? `<span class="rv-res"><i style="color:${st.c}">${st.g}</i>${esc(r)}</span>` : `<span class="rv-res rv-na">○ ${esc(r)}</span>`;
  };

  // The row's own revenue as a full bar, split by its margin: expenses
  // (1 - margin) plus profit (margin). On a loss the expenses run past
  // revenue, so the bar is the expenses and the red part is the overrun.
  // Every row is its own 100%, so the bar shows no amounts and no row's
  // size against another's.
  function rvBar(g, name, big) {
    const m = g.margin;
    if (!g.figures || m == null) return big ? '' : '<span class="rv-na">no figures</span>';
    const w = (v) => `${Math.max(0, v * 100).toFixed(2)}%`;
    const lab = (v, text) => (big && v >= 0.12 ? `${text} ${rvPct(v)}` : '');
    const tip = m >= 0
      ? tipOf(name, [['Expenses', `${rvPct(1 - m)} of revenue`], ['Profit', `${rvPct(m)} of revenue`]])
      : tipOf(name, [['Expenses', `${rvPct(1 - m)} of revenue`], ['Loss', `${rvPct(-m)} of revenue`]]);
    const segs = m >= 0
      ? `<div class="rv-exp" style="width:${w(1 - m)}">${lab(1 - m, 'Expenses')}</div>${m > 0 ? `<div class="rv-pro" style="width:${w(m)}">${lab(m, 'Profit')}</div>` : ''}`
      : `<div class="rv-exp" style="width:${w(1 / (1 - m))}">${lab(1 / (1 - m), 'Revenue')}</div><div class="rv-loss" style="width:${w(-m / (1 - m))}">${lab(-m / (1 - m), 'Loss')}</div>`;
    return `<div class="rv-bar${big ? ' big' : ''}" ${tip}>${segs}</div>`;
  }

  function renderRevenue() {
    const p = revData;
    if (!p) return;
    if (p.error && !p.trips) {
      $('revenueWrap').innerHTML = `<div class="msg err">Could not load trip revenue: ${esc(p.error)}</div>`;
      return;
    }
    const t = p.totals;
    const today = String(p.asOf).slice(0, 10);
    // Trips that have finished but whose figures aren't in yet: the ones to
    // chase, and the reason recent months read low.
    const overdue = p.trips.filter((x) => /not entered/i.test(x.result || '') && x.end && x.end < today);
    const notEntered = p.trips.filter((x) => /not entered/i.test(x.result || '')).length;

    const groupTable = (title, helpKey, head, rows, labelOf) => {
      const body = rows.map((g) => `
        <tr>
          <td class="cname">${esc(labelOf(g))}</td>
          <td class="num"><b>${g.margin == null ? '—' : rvPct(g.margin)}</b></td>
          <td class="rv-l">${rvBar(g, labelOf(g))}</td>
          <td class="num">${int(g.trips)}</td>
        </tr>`).join('');
      return `
      <div class="panel">
        <div class="ptitle">${title}</div>
        <div class="tscroll">
          <table class="ctable">
            <thead><tr>
              ${hcol(helpKey, head)}${hcol('rvMargin', 'Margin')}
              <th class="rv-l"><span ${hlp('rvSplit')}>Expenses and profit</span></th>${hcol('rvTrips', 'Trips')}
            </tr></thead>
            <tbody>${body}</tbody>
            <tfoot><tr>
              <td class="cname">TOTAL</td><td class="num">${t.margin == null ? '—' : rvPct(t.margin)}</td><td></td><td class="num">${int(t.trips)}</td>
            </tr></tfoot>
          </table>
        </div>
      </div>`;
    };
    // Highest margin first; groups with no figures last.
    const byMargin = (a, b) => (a.key == null) - (b.key == null) || (b.margin ?? -Infinity) - (a.margin ?? -Infinity);

    const overviewHtml = `
      <div class="panel">
        <div class="ptitle">Trip revenue · ${esc(String((p.byMonth[0] && p.byMonth[0].key) || p.asOf).slice(0, 4))}</div>
        <div class="bvhero trp-tiles">
          <div class="bv-side"><div class="bv-lab"><span ${hlp('rvMargin')}>Margin</span></div><div class="bv-n bv-act">${t.margin == null ? '—' : rvPct(t.margin)}</div></div>
          <div class="bv-side"><div class="bv-lab"><span ${hlp('rvTrips')}>Trips</span></div><div class="bv-n">${int(t.trips)}</div><div class="bv-s">${int(notEntered)} not entered yet</div></div>
        </div>
        ${rvBar(t, 'Year to date', true)}
        ${t.margin == null ? '' : `<div class="rv-leg"><span><i class="rv-exp"></i>Expenses <b>${rvPct(1 - t.margin)}</b> of revenue</span><span><i class="${t.margin < 0 ? 'rv-loss' : 'rv-pro'}"></i>${t.margin < 0 ? 'Loss' : 'Profit'} <b>${rvPct(Math.abs(t.margin))}</b> of revenue</span></div>`}
        ${overdue.length ? `<div class="rv-alert"><b>${int(overdue.length)} trip${overdue.length === 1 ? ' has' : 's have'} ended with no figures entered</b> · ${overdue.map((x) => esc(`${x.name} (${rvDates(x)})`)).join('; ')}</div>` : ''}
      </div>
      ${(p.suggestions || []).length ? `
      <div class="panel">
        <div class="ptitle"><span ${hlp('rvSuggest')}>Suggestions</span> · what to improve</div>
        <div class="rv-sug">${p.suggestions.map((x) => {
          const st = RV_SUG[x.level] || RV_SUG.note;
          return `<div class="rv-s" style="border-left-color:${st.c}"><div class="rv-s-head"><span class="rv-s-tag" style="color:${st.c}"><i>${st.g}</i> ${st.l}</span><b>${esc(x.title)}</b></div><div class="rv-s-text">${esc(x.text)}</div></div>`;
        }).join('')}</div>
      </div>` : ''}
      ${groupTable('By month', 'rvMonth', 'Month', p.byMonth, (g) => rvMonth(g.key))}
      ${groupTable('By programme', 'rvProgramme', 'Programme', [...p.byProgramme].sort(byMargin), (g) => g.key || 'No programme')}`;

    // ---- all trips ----
    const valOf = (x, key) => x[key] || '—';
    const opts = (key) => {
      const list = [...new Set(p.trips.map((x) => valOf(x, key)))];
      if (key === 'result') {
        const order = ['Gain', 'Loss', 'Break-even', 'Not entered'];
        return list.sort((a, b) => ((order.indexOf(a) + 1) || 99) - ((order.indexOf(b) + 1) || 99));
      }
      return list.sort((a, b) => a.localeCompare(b));
    };
    const lists = { programme: opts('programme'), result: opts('result') };
    for (const k of Object.keys(lists)) if (rvFilter[k] !== 'all' && !lists[k].includes(rvFilter[k])) rvFilter[k] = 'all';
    const passes = (x, skip) => Object.keys(lists).every((k) => k === skip || rvFilter[k] === 'all' || valOf(x, k) === rvFilter[k]);
    // Each button counts what it would show given the other filter.
    const pills = (key) => ['all', ...lists[key]].map((v) => {
      const n = p.trips.filter((x) => passes(x, key) && (v === 'all' || valOf(x, key) === v)).length;
      return `<button data-rv-f="${key}" data-rv-v="${attr(v)}" aria-pressed="${rvFilter[key] === v}">${v === 'all' ? 'All' : esc(v)} <span class="ecount">${n}</span></button>`;
    }).join('');
    const shown = p.trips.filter((x) => passes(x));
    const COLS = 4;
    let month = null;
    const tripRows = shown.map((x) => {
      const head = x.month !== month ? `<tr class="rv-month"><td colspan="${COLS}">${esc(rvMonth(x.month))}</td></tr>` : '';
      month = x.month;
      return `${head}
      <tr>
        <td class="cname">${esc(x.name)}<span class="trp-sub">${esc([x.destination, x.programme, rvDates(x)].filter(Boolean).join(' · '))}</span></td>
        <td class="num"><b>${x.margin == null ? '—' : rvPct(x.margin)}</b></td>
        <td class="rv-l">${x.figures ? rvBar(x, x.name) : ''}</td>
        <td class="rv-l">${rvResult(x.result)}</td>
      </tr>`;
    }).join('');
    const tripsHtml = `
      <div class="panel">
        <div class="ptitle">All trips · ${int(shown.length)} of ${int(p.trips.length)}</div>
        <div class="efilters">
          <div class="efilter"><span class="efl">Programme</span><div class="seg">${pills('programme')}</div></div>
          <div class="efilter"><span class="efl">Result</span><div class="seg">${pills('result')}</div></div>
        </div>
        <div class="tscroll">
          <table class="ctable">
            <thead><tr>
              ${hcol('rvTrip', 'Trip')}${hcol('rvMargin', 'Margin')}
              <th class="rv-l"><span ${hlp('rvSplit')}>Expenses and profit</span></th>
              <th class="rv-l"><span ${hlp('rvResult')}>Result</span></th>
            </tr></thead>
            <tbody>${tripRows || `<tr><td class="cname" colspan="${COLS}">No trips match these filters.</td></tr>`}</tbody>
          </table>
        </div>
      </div>`;

    const subtabs = `
      <div class="seg subtabs" role="tablist" aria-label="Trip revenue sections">
        <button role="tab" data-rv-sub="overview" aria-pressed="${rvSub === 'overview'}" aria-selected="${rvSub === 'overview'}">Overview</button>
        <button role="tab" data-rv-sub="trips" aria-pressed="${rvSub === 'trips'}" aria-selected="${rvSub === 'trips'}">All trips <span class="ecount">${int(p.trips.length)}</span></button>
      </div>`;

    $('revenueWrap').innerHTML = `
      ${p.stale ? `<div class="msg err">Showing the last copy of the sheet — ${esc(p.error || 'OneDrive unreachable')}</div>` : ''}
      ${subtabs}
      ${rvSub === 'trips' ? tripsHtml : overviewHtml}`;

    bindHelp($('revenueWrap'));
    $('revenueWrap').querySelectorAll('[data-rv-sub]').forEach((b) => {
      b.addEventListener('click', () => {
        if (rvSub === b.dataset.rvSub) return;
        rvSub = b.dataset.rvSub;
        renderRevenue();
        const bar = $('revenueWrap').querySelector('.subtabs');
        if (bar && bar.getBoundingClientRect().top < 0 && typeof bar.scrollIntoView === 'function') bar.scrollIntoView({ block: 'start' });
      });
    });
    $('revenueWrap').querySelectorAll('[data-rv-f]').forEach((b) => {
      b.addEventListener('click', () => { rvFilter[b.dataset.rvF] = b.dataset.rvV; renderRevenue(); });
    });
  }

  async function loadRevenue(force) {
    try {
      const res = await fetch('/api/sheets?name=revenue' + (force ? '&refresh=1' : ''));
      const p = await res.json();
      if (!res.ok && !p.trips) throw new Error(p.error || `HTTP ${res.status}`);
      revData = p;
      renderRevenue();
    } catch (err) {
      if (!revData) $('revenueWrap').innerHTML = `<div class="msg err">Could not load trip revenue: ${esc(err.message)}</div>`;
    }
  }

  /* ================= pending task tab (monday.com) ================= */

  let monData = null;
  // Which workspace tab is open: 'all' or a workspace name.
  let monTab = 'Marketing';
  // Tabs (Anton, 5 Oct 2026): Sales is the "Sales" group on the Marketing &
  // Sales board only; Marketing is the rest of that board; Operations is the
  // Operations workspace. Any other workspace gets a tab of its own.
  const MON_TABS = ['Marketing', 'Sales', 'Operations'];
  const monSection = (i) => (i.workspace === 'Marketing & Sales'
    ? (/^sales$/i.test(String(i.group || '').trim()) ? 'Sales' : 'Marketing')
    : i.workspace || 'Other');
  const MON_MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const monDay = (iso) => `${Number(iso.slice(8, 10))} ${MON_MON[Number(iso.slice(5, 7)) - 1]}${iso.slice(0, 4) !== String(new Date().getFullYear()) ? ` ${iso.slice(0, 4)}` : ''}`;
  // monday's own status colour, passed through only if it's a plain hex.
  const monColor = (c) => (/^#[0-9a-f]{3,8}$/i.test(String(c || '')) ? c : 'var(--q-none)');
  // One colour per person, light enough for dark initials on the navy cards.
  // Assigned in alphabetical order over everyone on the boards, so a person
  // keeps their colour on every tab; names are always written beside it.
  const MON_PEOPLE = ['#5fb0f0', '#7fd8a4', '#f39a8f', '#c3a1f5', '#ffbe85', '#6ed8d4', '#ee9fcb', '#bccf72', '#a8b6ff', '#e6c56b', '#8fd0ff', '#d6a4a4'];
  const monInitials = (n) => String(n).trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();

  // Who the "Show" filter is set to: 'all', a person, or MON_NOBODY.
  let monWho = 'all';
  const MON_NOBODY = '__none__';

  function renderPending() {
    const p = monData;
    if (!p) return;
    if (p.error && !p.items) {
      $('pendingWrap').innerHTML = `<div class="msg err">Could not load monday.com: ${esc(p.error)}</div>`;
      return;
    }
    const everyone = [...new Set(p.items.flatMap((i) => i.people))].sort((a, b) => a.localeCompare(b));
    const colorOf = new Map(everyone.map((n, k) => [n, MON_PEOPLE[k % MON_PEOPLE.length]]));
    // No "All" tab (Anton, 5 Oct 2026): it opens on Marketing.
    const tabs = [...MON_TABS, ...[...new Set(p.items.map(monSection))].filter((w) => !MON_TABS.includes(w))];
    if (!tabs.includes(monTab)) monTab = tabs[0];
    if (monWho !== 'all' && monWho !== MON_NOBODY && !everyone.includes(monWho)) monWho = 'all';
    const inTab = (i) => monSection(i) === monTab;
    const isWho = (i) => monWho === 'all' || (monWho === MON_NOBODY ? !i.people.length : i.people.includes(monWho));
    // Grouped by first assignee, so each person's colour runs together;
    // unassigned last.
    const tabItems = p.items.filter(inTab);
    const whoCount = (n) => tabItems.filter((i) => (n === MON_NOBODY ? !i.people.length : i.people.includes(n))).length;
    // Someone picked in Show who has nothing on this tab: back to Everyone,
    // rather than an empty list under a menu that no longer lists them.
    if (monWho !== 'all' && !whoCount(monWho)) monWho = 'all';
    const shown = p.items.filter((i) => inTab(i) && isWho(i)).sort((a, b) =>
      (!a.people.length) - (!b.people.length)
      || String(a.people[0] || '').localeCompare(String(b.people[0] || ''))
      || String(a.board).localeCompare(String(b.board)));
    const options = [
      `<option value="all"${monWho === 'all' ? ' selected' : ''}>Everyone (${tabItems.length})</option>`,
      ...everyone.filter((n) => whoCount(n)).map((n) => `<option value="${attr(n)}"${monWho === n ? ' selected' : ''}>${esc(n)} (${whoCount(n)})</option>`),
      whoCount(MON_NOBODY) ? `<option value="${MON_NOBODY}"${monWho === MON_NOBODY ? ' selected' : ''}>No one assigned (${whoCount(MON_NOBODY)})</option>` : '',
    ].join('');

    const avatars = (i) => {
      if (!i.people.length) return `<span class="mon-av" ${tipOf('Assigned to', [['', 'No one yet']])}><i class="none">?</i></span>`;
      const max = 3;
      const faces = i.people.slice(0, max).map((n) => `<i style="--who:${colorOf.get(n)}">${esc(monInitials(n))}</i>`).join('');
      const more = i.people.length > max ? `<i class="more">+${i.people.length - max}</i>` : '';
      return `<span class="mon-av" ${tipOf('Assigned to', i.people.map((n) => ['', n]))}>${faces}${more}</span>`;
    };
    const row = (i) => `
      <div class="mon-row">
        <div class="mon-task" title="${attr(i.name)}">${esc(i.name)}</div>
        <div class="mon-stc"><span class="mon-st" style="--st:${monColor(i.statusColor)}">${esc(i.status || 'Not Started')}</span></div>
        <div class="mon-due${i.due ? '' : ' none'}">${i.due ? (i.overdue ? `<span class="mon-late">▼ ${esc(monDay(i.due))}</span>` : esc(monDay(i.due))) : '—'}</div>
        <div class="mon-where">${esc(i.group || '')}</div>
        ${avatars(i)}
        ${i.url ? `<a class="mon-open" href="${attr(i.url)}" target="_blank" rel="noopener" title="Open in monday">↗</a>` : '<span></span>'}
      </div>`;

    $('pendingWrap').innerHTML = `
      ${p.stale ? `<div class="msg err">Showing the last copy from monday.com — ${esc(p.error || 'monday unreachable')}</div>` : ''}
      <div class="mon-top">
        <div>
          <h2>Pending Tasks<small>${int(shown.length)} task${shown.length === 1 ? '' : 's'} · live from monday.com</small></h2>
          <div class="mon-tabs" role="tablist" aria-label="Workspaces">
            ${tabs.map((w) => `<button role="tab" data-mon-tab="${attr(w)}" aria-pressed="${monTab === w}" aria-selected="${monTab === w}">${esc(w)}<span>${int(p.items.filter((i) => monSection(i) === w).length)}</span></button>`).join('')}
          </div>
        </div>
        <label class="mon-show">Show <select id="monWho">${options}</select></label>
      </div>
      ${shown.length ? `
      <div class="mon-headrow"><span>Task</span><span>Status</span><span>Due date</span><span>Board</span><span style="text-align:right">Assignees</span><span></span></div>
      <div class="mon-list">${shown.map(row).join('')}</div>` : '<div class="mon-empty">Nothing pending here.</div>'}`;

    bindHelp($('pendingWrap'));
    $('pendingWrap').querySelectorAll('[data-mon-tab]').forEach((b) => {
      b.addEventListener('click', () => { monTab = b.dataset.monTab; renderPending(); });
    });
    const sel = $('pendingWrap').querySelector('#monWho');
    if (sel) sel.addEventListener('change', () => { monWho = sel.value; renderPending(); });
  }

  async function loadPending(force) {
    try {
      const res = await fetch('/api/sheets?name=pending' + (force ? '&refresh=1' : ''));
      const p = await res.json();
      if (!res.ok && !p.items) throw new Error(p.error || `HTTP ${res.status}`);
      monData = p;
      renderPending();
    } catch (err) {
      if (!monData) $('pendingWrap').innerHTML = `<div class="msg err">Could not load monday.com: ${esc(err.message)}</div>`;
    }
  }

  /* ================= view switching ================= */

  // Explicit target, not a toggle — Dashboard is always one click away from
  // Report, rather than requiring "click the same tab again to go back."
  function setView(next) {
    view = next;
    $('viewSeg').querySelectorAll('button').forEach((b) => {
      // History is a sub-tab of Ads, so Ads stays lit while it's open.
      const lit = b.dataset.view === view || (b.dataset.view === 'campaigns' && view === 'history')
        || (b.dataset.view === 'board' && view === 'previous');
      b.setAttribute('aria-pressed', String(lit));
    });
    $('board').hidden = view !== 'board';
    $('legend').hidden = view !== 'board';
    applyAnnouncement();
    // The board's status line and footnotes describe bookings only, so they
    // travel with the board rather than sitting under whichever tab is open.
    $('msg').hidden = view !== 'board';
    $('notes').hidden = view !== 'board';
    $('reportWrap').hidden = view !== 'report';
    $('previousWrap').hidden = view !== 'previous';
    $('campaignsWrap').hidden = view !== 'campaigns';
    $('historyWrap').hidden = view !== 'history';
    $('adsSub').hidden = view !== 'campaigns' && view !== 'history';
    $('bookSub').hidden = view !== 'board' && view !== 'previous';
    $('bookSub').querySelectorAll('[data-book-sub]').forEach((b) => {
      const on = b.dataset.bookSub === view;
      b.setAttribute('aria-pressed', String(on));
      b.setAttribute('aria-selected', String(on));
    });
    $('adsSub').querySelectorAll('[data-ads-sub]').forEach((b) => {
      const on = b.dataset.adsSub === view;
      b.setAttribute('aria-pressed', String(on));
      b.setAttribute('aria-selected', String(on));
    });
    $('leadsWrap').hidden = view !== 'leads';
    $('engagementsWrap').hidden = view !== 'engagements';
    $('tripsWrap').hidden = view !== 'trips';
    $('feedbackWrap').hidden = view !== 'feedback';
    $('revenueWrap').hidden = view !== 'revenue';
    $('pendingWrap').hidden = view !== 'pending';
    if (view === 'report') {
      if (!report) $('reportWrap').innerHTML = '<div class="msg">Loading report…</div>';
      loadReport(false);
    }
    if (view === 'previous' && !previousTrips) {
      $('previousWrap').innerHTML = '<div class="msg">Loading previous projects…</div>';
      loadPreviousTrips(false);
    }
    // Meta data is fetched only once someone actually opens the tab — unlike
    // the booking report, nothing outside this tab depends on it.
    if (view === 'campaigns') {
      if (!campaigns) $('campaignsWrap').innerHTML = '<div class="msg">Loading campaign data…</div>';
      loadCampaigns(false);
    }
    // Three years of month-by-month insights is a slow first call, so it waits
    // for someone to actually ask for it and then caches for half an hour.
    if (view === 'history') {
      if (!adHistory) $('historyWrap').innerHTML = '<div class="msg">Loading campaign history…</div>';
      loadHistory(false);
    }
    if (view === 'leads') {
      if (!leads) $('leadsWrap').innerHTML = '<div class="msg">Loading leads…</div>';
      loadLeads(false);
    }
    if (view === 'engagements') {
      if (!engagements) $('engagementsWrap').innerHTML = '<div class="msg">Loading engagements…</div>';
      loadEngagements(false);
    }
    if (view === 'trips') {
      if (!tripsData) $('tripsWrap').innerHTML = '<div class="msg">Loading trips…</div>';
      loadTrips(false);
    }
    if (view === 'feedback') {
      if (!feedback) $('feedbackWrap').innerHTML = '<div class="msg">Loading feedback…</div>';
      loadFeedback(false);
    }
    if (view === 'revenue') {
      if (!revData) $('revenueWrap').innerHTML = '<div class="msg">Loading trip revenue…</div>';
      loadRevenue(false);
    }
    if (view === 'pending') {
      if (!monData) $('pendingWrap').innerHTML = '<div class="msg">Loading pending tasks…</div>';
      loadPending(false);
    }
    // Keep the address bar in step, so a reload or a copied link lands on the
    // same tab. replaceState rather than the hash property: no history entry
    // per tab click, so Back still leaves the dashboard.
    try {
      if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
    } catch (e) { /* file:// or a sandboxed frame — the tab still switches */ }
    saveViewState();
  }

  $('viewSeg').querySelectorAll('button').forEach((b) => {
    b.addEventListener('click', () => setView(b.dataset.view));
  });
  $('bookSub').querySelectorAll('[data-book-sub]').forEach((b) => {
    b.addEventListener('click', () => { if (view !== b.dataset.bookSub) setView(b.dataset.bookSub); });
  });
  $('adsSub').querySelectorAll('[data-ads-sub]').forEach((b) => {
    b.addEventListener('click', () => { if (view !== b.dataset.adsSub) setView(b.dataset.adsSub); });
  });
  $('refreshBtn').addEventListener('click', () => {
    load(true);
    loadReport(true);
    if (previousTrips) loadPreviousTrips(true);
    if (campaigns) loadCampaigns(true);
    if (adHistory) loadHistory(true);
    if (leads) loadLeads(true);
    if (engagements) loadEngagements(true);
    if (tripsData) loadTrips(true);
    if (feedback) loadFeedback(true);
    if (revData) loadRevenue(true);
    if (monData) loadPending(true);
  });

  /* ================= sidebar ================= */

  // Wide screens: the toggle docks or collapses the sidebar to an icon rail,
  // and the choice is kept (the class itself is applied by the snippet at the
  // top of <body>, before first paint). Narrow screens: the sidebar is a
  // drawer, opened by the header's menu button, and the same toggle closes it.
  const SB_KEY = 'nomuSidebarCollapsed';
  const narrow = matchMedia('(max-width: 900px)');
  const docEl = document.documentElement;

  function syncSidebar() {
    const open = docEl.classList.contains('sb-open');
    const collapsed = docEl.classList.contains('sb-collapsed');
    const toggle = $('sbToggle');
    if (narrow.matches) {
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', 'Close menu');
    } else {
      toggle.setAttribute('aria-expanded', String(!collapsed));
      toggle.setAttribute('aria-label', collapsed ? 'Expand sidebar' : 'Collapse sidebar');
    }
    $('sbMenu').setAttribute('aria-expanded', String(open));
  }
  const closeDrawer = () => { docEl.classList.remove('sb-open'); syncSidebar(); };

  $('sbToggle').addEventListener('click', () => {
    if (narrow.matches) { closeDrawer(); return; }
    const collapsed = docEl.classList.toggle('sb-collapsed');
    try { localStorage.setItem(SB_KEY, collapsed ? '1' : '0'); } catch (e) { /* not remembered, still works */ }
    syncSidebar();
  });
  $('sbMenu').addEventListener('click', () => {
    docEl.classList.add('sb-open');
    syncSidebar();
    // Straight to the current tab, so a keyboard user lands inside the menu.
    const current = $('viewSeg').querySelector('[aria-pressed="true"]');
    if (current) current.focus();
  });
  $('sbBackdrop').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && docEl.classList.contains('sb-open')) closeDrawer();
  });
  // Picking a tab from the drawer is the end of the errand, so it closes.
  $('viewSeg').querySelectorAll('button').forEach((b) => {
    b.addEventListener('click', () => { if (narrow.matches) closeDrawer(); });
  });
  // A tablet rotated across the breakpoint shouldn't keep a drawer open over
  // what is now a docked layout.
  narrow.addEventListener('change', () => { docEl.classList.remove('sb-open'); syncSidebar(); });
  syncSidebar();

  // Restore whichever tab/filter/period the screen was showing before this
  // load, so a refresh (or the wall display losing power overnight) picks up
  // where it left off instead of resetting to the very beginning.
  loadViewState();

  // A #hash beats stored state, so a wall display can be pointed straight at
  // one tab by URL and stay there through reboots, and any tab can be linked.
  const VIEWS = ['board', 'report', 'previous', 'trips', 'feedback', 'revenue', 'campaigns', 'history', 'leads', 'engagements', 'pending'];
  const viewFromHash = () => {
    const h = String(location.hash || '').replace(/^#/, '');
    return VIEWS.includes(h) ? h : null;
  };
  const hashView = viewFromHash();
  if (hashView) view = hashView;
  addEventListener('hashchange', () => {
    const next = viewFromHash();
    if (next && next !== view) setView(next);
  });

  setView(view);

  load(false);
  loadReport(false);
  loadAnnouncement();
  setInterval(() => load(false), POLL_MS);
  // Picks up a banner edited in Vercel without anyone touching the display.
  setInterval(loadAnnouncement, POLL_MS);
  // Unconditional now — the header stats need report data on every tab, not
  // just while the Report tab itself is open.
  setInterval(() => loadReport(false), 120000);
  // Meta's numbers move far slower than bookings and the Graph API is rate
  // limited per app, so 10 minutes, and only once the tab has been opened.
  setInterval(() => { if (campaigns) loadCampaigns(false); }, 600000);
  // Marina updates the sheet through the day; every 5 minutes keeps the tab
  // close behind her without hammering OneDrive (the API caches a minute).
  setInterval(() => { if (leads) loadLeads(false); }, 300000);
  setInterval(() => { if (engagements) loadEngagements(false); }, 300000);
  setInterval(() => { if (tripsData) loadTrips(false); }, 300000);
  setInterval(() => { if (feedback) loadFeedback(false); }, 300000);
  setInterval(() => { if (revData) loadRevenue(false); }, 300000);
  setInterval(() => { if (monData) loadPending(false); }, 300000);
  // Re-render between fetches so a highlight lapses at its own 24h mark and the
  // "3h ago" text stays honest, without waiting on the server cache.
  setInterval(() => { if (latest) render(latest); }, 20000);
</script>
</body>
</html>
