        <button class="sb-item" data-view="feedback" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg><span class="sb-label">Feedback</span></button>
        <button class="sb-item" data-view="revenue" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/></svg><span class="sb-label">Trip Revenue</span></button>
      </div>
      <div class="sb-group">
        <div class="sb-cat">Marketing</div>
        <button class="sb-item" data-view="campaigns" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10v4a1 1 0 0 0 1 1h2.5L16 19.5V4.5L6.5 9H4a1 1 0 0 0-1 1z"/><path d="M7 15.2l1.6 4.4a1 1 0 0 0 .94.66h1.1a1 1 0 0 0 .92-1.38L10.4 16.8"/><path d="M19 8l2-1.5M19.5 12H22M19 16l2 1.5"/></svg><span class="sb-label">Campaign Ads</span></button>
        <button class="sb-item" data-view="engagements" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21.2l8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg><span class="sb-label">Engagements</span></button>
      </div>
      <div class="sb-group">
        <div class="sb-cat">Corporate</div>
        <button class="sb-item" data-view="pending" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 11l2 2 4-4M9 17h6"/></svg><span class="sb-label">Monday</span></button>
      </div>
    </nav>
  </aside>
  <div class="sb-backdrop" id="sbBackdrop"></div>

  <div class="shell">
  <div class="head">
    <button class="sb-btn sb-menu" id="sbMenu" aria-controls="sidebar" aria-expanded="false" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="titles">
      <h1 id="range">Booking Data</h1>
      <div class="asof">As of <b id="asof">—</b></div>
    </div>
    <div class="spacer"></div>
    <div class="headright">
      <div class="stats">
        <div class="stat" id="sNewWrap"><div class="n" id="sNew">—</div><div class="l">New in 24h</div></div>
        <div class="stat"><div class="n" id="sLastWeek">—</div><div class="l">Last Week</div></div>
        <div class="stat"><div class="n" id="sWeeklyTarget">—</div><div class="l">Weekly Target</div></div>
      </div>
      <span class="dot" id="dot" title="Live"></span>
      <button class="btn" id="refreshBtn">Refresh</button>
    </div>
  </div>

  <!-- Previous Sales is the Booking tab's second sub-tab (Muatasam, 5 Oct
       2026). Both keep their own view (#board / #previous). -->
  <div class="seg subtabs" id="bookSub" role="tablist" aria-label="Booking sections" hidden>
    <button role="tab" data-book-sub="board">Upcoming</button>
    <button role="tab" data-book-sub="previous">Previous Sales</button>
  </div>

  <div class="announce" id="announce" hidden>
    <div class="announce-icon" id="announceIcon">📢</div>
    <div>
      <div class="announce-title" id="announceTitle"></div>
      <div class="announce-body" id="announceBody"></div>
    </div>
  </div>

  <div class="legend" id="legend" hidden>
    <span><i style="background:#f5b935"></i>Booking</span>
    <span><i style="background:var(--soldout)"></i>Sold out</span>
    <span><i style="background:#16294a;border:1px solid #34517c"></i>Empty</span>
    <span><i style="background:#ef8b3c;width:3px"></i>Target marker</span>
    <span><i style="background:var(--fresh)"></i>New booking (last 24h)</span>
  </div>

  <div id="board"></div>
  <div id="reportWrap" hidden></div>
  <div id="previousWrap" hidden></div>
  <!-- History Campaign sits inside Ads as its second sub-tab. Both keep
       their own view (#campaigns / #history), so old links still land. -->
  <div class="seg subtabs" id="adsSub" role="tablist" aria-label="Ads sections" hidden>
    <button role="tab" data-ads-sub="campaigns">Campaigns</button>
    <button role="tab" data-ads-sub="history">History</button>
  </div>
  <div id="campaignsWrap" hidden></div>
  <div id="historyWrap" hidden></div>
  <div id="leadsWrap" hidden></div>
  <div id="engagementsWrap" hidden></div>
  <div id="tripsWrap" hidden></div>
  <div id="feedbackWrap" hidden></div>
  <div id="revenueWrap" hidden></div>
  <div id="pendingWrap" hidden></div>
  <div class="notes" id="notes"></div>
  <div class="msg" id="msg">Loading booking data…</div>
  </div>

  <div class="tip" id="tip" role="status"></div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="Close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

<script>
  const POLL_MS = 30000;   // server caches upstream calls, so this stays cheap
  const $ = (id) => document.getElementById(id);
  const esc = (s) => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
  // esc() goes through textContent, which escapes & < > but leaves quotes
  // alone — fine for text nodes, silently broken inside an attribute, where
  // the first embedded " ends the value early. Anything interpolated into an
  // attribute has to come through here instead.
  const attr = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  let view = 'board';   // 'board' | 'report'
  let latest = null;

  // Banner content comes from Vercel env vars via /api/announcement, so it can
  // be changed without touching code. Null means nothing is set, which renders
  // a quiet "no current announcement" placeholder rather than vanishing — a
  // disappearing element reads as broken, and keeps the layout from jumping.
  let announcement = null;
  async function loadAnnouncement() {
    try {
      const res = await fetch('/api/announcement');
      const a = await res.json();
      announcement = (a && (a.title || a.body)) ? a : null;
    } catch (e) {
      announcement = null;
    }
    applyAnnouncement();
  }
  function applyAnnouncement() {
    const has = !!announcement;
    const el = $('announce');
    el.classList.toggle('empty', !has);
    $('announceIcon').textContent = has ? '📢' : '🔕';
    $('announceTitle').textContent = has ? announcement.title : 'No current announcement';
    $('announceBody').textContent = has ? announcement.body : '';
    $('announceBody').hidden = !has;
    el.hidden = view !== 'board';
  }

  // Which tab and which Report period the screen was on — restored on load
  // so a refresh (or the wall display losing power overnight) doesn't reset
  // whoever's looking at it back to the very beginning.
  const STORAGE_KEY = 'bookingProgressView';
  function saveViewState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        view, rGran, rCount, selectedWeekStart, selectedMonthStart, ptYear, ptMonth,
      }));
    } catch (e) { /* storage unavailable (private mode, etc.) — just skip persisting */ }
  }
  function loadViewState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const s = JSON.parse(raw);
      // A browser that saved state before the Table tab was removed could
      // still have "table" stored — fall back to the dashboard rather than
      // restoring a view that no longer exists.
      if (['board', 'report', 'previous', 'trips', 'feedback', 'revenue', 'campaigns', 'history', 'leads', 'engagements', 'pending'].includes(s.view)) view = s.view;
      // Older saves stored 'all' or a numeric string; a plain finite number is
      // the only valid value now, anything else falls back to the latest year.
      if (s.ptYear != null && Number.isFinite(Number(s.ptYear)) && String(s.ptYear) !== 'all') {
        ptYear = Number(s.ptYear);
      }
      if (s.ptMonth) ptMonth = s.ptMonth;
      if (s.rGran) rGran = s.rGran;
      if (s.rCount) rCount = s.rCount;
      if (s.selectedWeekStart) selectedWeekStart = s.selectedWeekStart;
      if (s.selectedMonthStart) selectedMonthStart = s.selectedMonthStart;
    } catch (e) { /* corrupt or blocked storage — fall back to defaults */ }
  }

  const D = (iso) => new Date(iso + 'T00:00:00Z');
  const day = (iso) => D(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
  const range = (a, b) => day(a) + ' – ' + day(b);
  const monthKey = (iso) => iso.slice(0, 7);
  const monthName = (iso) => D(iso).toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
  const fmtStamp = (iso) => {
    const d = new Date(iso);
    return isNaN(d) ? '—' : d.toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
      + ', ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  };

  // "Week 2 (06 Sep - 12 Sep)" -> "Week 2"; the dates are shown separately.
  const weekName = (label) => String(label || '').replace(/\s*\(.*\)\s*$/, '').trim() || 'Week';

  // A booking stays highlighted for exactly 24h from the moment it was placed:
  // one taken at 2pm stops being new at 2pm the next day. Computed in the browser
  // against live time, so it expires on the minute rather than on the poll.
  const NEW_MS = 24 * 60 * 60 * 1000;
  // Lets the highlight be seen on demand, since real bookings are days old.
  const PREVIEW = new URLSearchParams(location.search).get('preview') === 'new';

  function freshness(week) {
    const now = Date.now();
    let count = 0;
    let newest = 0;
    for (const r of week.recent || []) {
      const at = Date.parse(r.at);
      if (!Number.isFinite(at)) continue;
      if (now - at < NEW_MS) {
        count += r.count || 0;
        if (at > newest) newest = at;
      }
    }
    return { count, newest };
  }

  function ago(ms) {
    const mins = Math.floor((Date.now() - ms) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    return hrs + 'h ago';
  }

  function meter(w, target) {
    // The track runs to whichever is larger, so a capacity below target visibly
    // falls short of the marker instead of quietly rescaling to look full.
    const scale = Math.max(target, w.capacity || 0, w.booked, 1);
    const pct = Math.min(100, (w.booked / scale) * 100);
    const soldOut = w.capacity != null && w.booked >= w.capacity && w.booked > 0;
    const state = w.booked === 0 ? 'none' : soldOut ? 'full' : '';
    const tickPct = Math.min(100, (target / scale) * 100);
    const f = freshness(w);

    return `
      <div class="wk ${f.count ? 'fresh' : ''}">
        <div>
          <span class="wlab">${esc(weekName(w.label))}</span><span class="wdate">${esc(range(w.start, w.end))}</span>
          ${f.count ? `<span class="wpill">+${f.count}</span>` : ''}
        </div>
        <div class="wnum ${state}">${w.booked}<span class="of"> / ${w.capacity ?? target}</span></div>
        <div class="track">
          <div class="fill ${state}" style="width:${pct}%"></div>
          <div class="tick" style="left:calc(${tickPct}% - 1px)" title="Target ${target}"></div>
        </div>
        ${f.count ? `<div class="cap wago">New booking ${esc(ago(f.newest))}</div>` : ''}
      </div>`;
  }

  function tripCard(t, target) {
    const soldOut = t.totalCapacity != null && t.totalBooked >= t.totalCapacity && t.totalBooked > 0;
    const newCount = t.weeks.reduce((sum, w) => sum + freshness(w).count, 0);
    const cls = [
      t.cancelled ? 'cancelled' : '',
      soldOut ? 'done' : '',
      newCount && !t.cancelled ? 'fresh' : '',
    ].filter(Boolean).join(' ');
    const numCls = t.totalBooked === 0 ? 'none' : soldOut ? 'full' : '';
    const many = t.weeks.length > 1;

    return `
      <div class="trip ${cls}">
        <div class="thead">
          <div class="tname">${esc(t.name)}${t.cancelled ? '<span class="tag">CANCELLED</span>' : ''}${
            soldOut && !t.cancelled ? '<span class="tag soldout">SOLD OUT</span>' : ''}${
            newCount && !t.cancelled
              ? `<span class="newbadge">${newCount} NEW</span>` : ''}</div>
          <div class="tnum">
            <div class="b ${numCls}">${t.totalBooked}</div>
            <div class="s">booked</div>
          </div>
        </div>
        <div class="tmeta">${esc(range(t.start, t.end))} · ${t.weeks.length} ${many ? 'weeks' : 'week'}${
          t.cancelledCount ? ' · ' + t.cancelledCount + ' cancelled' : ''}</div>
        <div class="weeks ${many ? '' : 'single'}">
          ${t.weeks.map((w) => meter(w, target)).join('')}
        </div>
      </div>`;
  }

  function render(p) {
    const trips = p.trips || [];
    if (!trips.length) {
      $('msg').textContent = 'No departures between today and ' + p.seasonEnd + '.';
      $('msg').hidden = view !== 'board'; $('board').hidden = true; $('legend').hidden = true; $('announce').hidden = true;
      return;
    }
    $('msg').hidden = true;
    // The board polls every 30s; without this it would pop back over the
    // Report or Table view on the next refresh.
    $('board').hidden = view !== 'board';
    $('legend').hidden = view !== 'board';
    applyAnnouncement();

    // group cards under the month they depart in, keeping date order
    const months = [];
    for (const t of trips) {
      const key = monthKey(t.start);
      const last = months[months.length - 1];
      if (last && last.key === key) last.trips.push(t);
      else months.push({ key, label: monthName(t.start), trips: [t] });
    }

    $('board').innerHTML = months.map((m) => {
      const booked = m.trips.reduce((s, t) => s + t.totalBooked, 0);
      return `<section class="month">
        <div class="mhead">${esc(m.label)}
          <span class="c">${m.trips.length} ${m.trips.length > 1 ? 'departures' : 'departure'} · ${booked} booked</span>
        </div>
        <div class="grid">${m.trips.map((t) => tripCard(t, p.target)).join('')}</div>
      </section>`;
    }).join('');

    // The header's New in 24h / Last Week / Weekly Target trio is now sourced
    // from the Report data (see applyHeaderStats), so it's identical whether
    // you're looking at the Dashboard or the Report tab — not a second,
    // slightly-different count computed from the board's own data.

    $('notes').innerHTML = (p.warnings || []).length
      ? '<b>Needs attention in WeTravel:</b> ' + p.warnings.map((w) => esc(w.title) + ' — ' + esc(w.issue)).join(' · ')
      : '';
  }

  // ?preview=new backdates a couple of bookings so the highlight can be judged
  // on demand. It only ever runs from that URL, never on the live board.
  function previewNew(p) {
    const targets = (p.trips || []).filter((t) => !t.cancelled).slice(0, 2);
    targets.forEach((t, i) => {
      const week = t.weeks[t.weeks.length > 1 ? 1 : 0];
      if (!week) return;
      week.recent = [{ at: new Date(Date.now() - (i ? 5 * 3600e3 : 12 * 60e3)).toISOString(), count: i ? 1 : 2 }];
    });
  }

  async function load(force) {
    try {
      const res = await fetch('/api/trips-progress' + (force ? '?refresh=1' : ''));
      const p = await res.json();
      if (!res.ok) throw new Error(p.error || 'request failed');

      if (PREVIEW) previewNew(p);
      latest = p;
      $('asof').textContent = fmtStamp(p.asOf);
      $('range').textContent = D(p.today).toLocaleDateString('en-US', { month: 'long', day: 'numeric', timeZone: 'UTC' })
        + ' to ' + D(p.seasonEnd).toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
      $('dot').className = 'dot' + (p.stale ? ' warn' : '');
      $('dot').title = p.stale ? 'Showing last known data' : 'Live';
      render(p);
    } catch (err) {
      if (!latest) {
        $('msg').textContent = 'Could not load booking data: ' + err.message;
        $('msg').className = 'msg err'; $('msg').hidden = view !== 'board'; $('board').hidden = true;
      }
      $('dot').className = 'dot warn';
    }
  }

  /* ================= REPORT ================= */

  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const RANGES = { daily: [14, 30], weekly: [4, 8, 12], monthly: [6, 12] };

  let report = null;
  let rGran = 'weekly';      // Muatasam's headline number is the weekly one
  let rCount = 4;            // "actual weekly for last 4 weeks"
  // Corporate/institutional charters (KUMSA, CISCO, University of Sharjah)
  // are always excluded from the target — one charter can book a dozen seats
  // in a single week and make it look like a retail target was hit when it
  // wasn't, so there's no toggle to turn this back on.
  const rCharters = false;

  // The week/month the hero panel, daily strip, and KPI panel are showing.
  // null means "not yet initialized" — renderReport() sets it to the real
  // current period on first run. Clicking a bar or a nav arrow changes these;
  // neither is ever allowed to move past the real current period.
  let selectedWeekStart = null;
  let selectedMonthStart = null;

  const iso = (d) => d.toISOString().slice(0, 10);
  const addDays = (d, n) => new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + n));
  const sundayOf = (d) => addDays(d, -d.getUTCDay());

  // Periods are built backwards from today, so the report never shows a future
  // bucket and rolls forward on its own as the days pass.
  function buckets(today) {
    const t = D(today);
    const out = [];
    for (let i = rCount - 1; i >= 0; i--) {
      let start, end;
      if (rGran === 'daily') {
        start = addDays(t, -i); end = start;
      } else if (rGran === 'weekly') {
        start = addDays(sundayOf(t), -i * 7); end = addDays(start, 6);
      } else {
        start = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() - i, 1));
        end = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + 1, 0));
      }
      out.push({ start, end, key: iso(start), current: i === 0 });
    }
    return out;
  }

  function bucketLabel(b) {
    if (rGran === 'daily') return `${DOW[b.start.getUTCDay()]}<br>${b.start.getUTCDate()} ${MON[b.start.getUTCMonth()]}`;
    if (rGran === 'weekly') {
      const sameMon = b.start.getUTCMonth() === b.end.getUTCMonth();
      return sameMon
        ? `${b.start.getUTCDate()}–${b.end.getUTCDate()} ${MON[b.start.getUTCMonth()]}`
        : `${b.start.getUTCDate()} ${MON[b.start.getUTCMonth()]}–<br>${b.end.getUTCDate()} ${MON[b.end.getUTCMonth()]}`;
    }
    return `${MON[b.start.getUTCMonth()]}<br>${b.start.getUTCFullYear()}`;
  }

  // Same period label as bucketLabel() but plain text, for attributes/titles.
  function bucketPlain(b) {
    if (rGran === 'daily') return `${DOW[b.start.getUTCDay()]}, ${b.start.getUTCDate()} ${MON[b.start.getUTCMonth()]}`;
    if (rGran === 'weekly') return `${b.start.getUTCDate()} ${MON[b.start.getUTCMonth()]} – ${b.end.getUTCDate()} ${MON[b.end.getUTCMonth()]}`;
    return `${MON[b.start.getUTCMonth()]} ${b.start.getUTCFullYear()}`;
  }

  // Oman is UTC+4 with no DST. WeTravel's created_at is UTC, so a booking at
  // 22:00 UTC already fell on the next calendar day in Muscat — shifting by
  // the offset before reading the date turns it into the correct local day.
  const OMAN_OFFSET_MS = 4 * 60 * 60 * 1000;
  const omanDay = (isoTimestamp) => {
    const ms = Date.parse(isoTimestamp);
    return Number.isFinite(ms) ? new Date(ms + OMAN_OFFSET_MS).toISOString().slice(0, 10) : isoTimestamp.slice(0, 10);
  };

  // Muscat wall-clock time for a single booking's timestamp, for the popup —
  // the bucketing math uses the +4h shift trick, but for display the browser's
  // built-in Intl timezone support reads more naturally.
  const fmtOman = (isoTimestamp) => new Date(isoTimestamp).toLocaleString('en-GB', {
    timeZone: 'Asia/Muscat', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', hour12: true,
  });

  // Which trips booked within this period, and how many each, plus the exact
  // timestamps — the hover tooltip uses the totals, the click popup uses all of it.
  function tripBreakdown(events, from, to, charters) {
    const a = iso(from), z = iso(to);
    const byTrip = new Map();
    for (const e of events) {
      if (omanDay(e.at) < a || omanDay(e.at) > z) continue;
      if (e.x && !charters) continue;
      if (!byTrip.has(e.t)) byTrip.set(e.t, { trip: e.t, n: 0, c: 0, charter: !!e.x, bookings: [] });
      const row = byTrip.get(e.t);
      row.n += e.n; row.c += e.c;
      if (e.n > 0) row.bookings.push({ at: e.at, n: e.n });
    }
    return Array.from(byTrip.values()).sort((x, y) => y.n - x.n);
  }

  // Bookings placed in the rolling 24h ending now — same "how recent" concept
  // as the board's freshness badge, but summed across the whole report window
  // rather than one trip's weeks.
  function last24hTotal(events) {
    const cutoff = Date.now() - 24 * 60 * 60 * 1000;
    let n = 0;
    for (const e of events) {
      if (e.x) continue;
      const at = Date.parse(e.at);
      if (Number.isFinite(at) && at >= cutoff && at <= Date.now()) n += e.n;
    }
    return n;
  }

  // The most recently FINISHED Sun-Sat week — always real, fixed to actual
  // "now", never affected by whatever week is navigated to in the Report
  // tab's hero panel. This is what the always-visible header bar uses,
  // deliberately decoupled from Report-tab navigation.
  function lastCompletedWeekTotal(p) {
    const start = addDays(D(p.weekStart), -7);
    const end = addDays(D(p.weekStart), -1);
    return tally(p.events, start, end, false).n;
  }

  // Three numbers, no table: Muatasam asked for this in place of the detailed
  // Volume/Key-Percentages breakdown. Unlike the header's fixed version, this
  // panel lives inside the Report tab right under the hero, so everything here
  // is relative to whichever week is navigated to there:
  //   "Last Week"     = the week BEFORE the selected one (not the selected
  //                     week itself — the hero right above already shows that,
  //                     so repeating it was both redundant and mislabelled).
  //   "Last 24 Hours" = real rolling 24h while on the current week; on a past
  //                     week it anchors to that week's own final day, since
  //                     today's live count says nothing about the period shown.
  // Each carries its date range so there's no ambiguity about what it covers.
  function buildSimpleKpi(p, wkStart, wkEnd, isCurrentWeek, target) {
    const prevStart = addDays(wkStart, -7);
    const prevEnd = addDays(wkStart, -1);
    const lastWeek = tally(p.events, prevStart, prevEnd, false).n;

    let last24h, last24hLabel;
    if (isCurrentWeek) {
      last24h = last24hTotal(p.events);
      last24hLabel = 'rolling, up to now';
    } else {
      const anchor = Date.parse(iso(addDays(wkEnd, 1))); // midnight right after that week ends
      const cutoff = anchor - 24 * 60 * 60 * 1000;
      last24h = 0;
      for (const e of p.events) {
        if (e.x) continue;
        const at = Date.parse(e.at);
        if (Number.isFinite(at) && at >= cutoff && at < anchor) last24h += e.n;
      }
      last24hLabel = `final day of ${day(iso(wkEnd))}`;
    }

    return `
      <div class="panel skpi-panel">
        <div class="skpi">
          <div class="skpi-n">${last24h}</div>
          <div class="skpi-l">Last 24 Hours</div>
          <div class="skpi-sub">${esc(last24hLabel)}</div>
        </div>
        <div class="skpi">
          <div class="skpi-n">${lastWeek}</div>
          <div class="skpi-l">Last Week</div>
          <div class="skpi-sub">${esc(range(iso(prevStart), iso(prevEnd)))}</div>
        </div>
        <div class="skpi">
          <div class="skpi-n">${target}</div>
          <div class="skpi-l">Weekly Target</div>
          <div class="skpi-sub">per week</div>
        </div>
      </div>`;
  }

  function tally(events, from, to, charters) {
    let n = 0, c = 0, ch = 0;
    const a = iso(from), z = iso(to);
    for (const e of events) {
      const day = omanDay(e.at);
      if (day < a || day > z) continue;
      if (e.x) { ch += e.n; if (!charters) continue; }
      n += e.n; c += e.c;
    }
    return { n, c, charter: ch };
  }

  function renderReport() {
    const p = report;
    if (!p) return;
    if (p.error && !p.events) {
      $('reportWrap').innerHTML = `<div class="msg err">Could not load report: ${esc(p.error)}</div>`;
      return;
    }

    const today = D(p.today);
    if (selectedWeekStart === null) selectedWeekStart = p.weekStart;
    if (selectedMonthStart === null) {
      selectedMonthStart = iso(new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), 1)));
    }

    const wkStart = D(selectedWeekStart);
    const wkEnd = addDays(wkStart, 6);
    const isCurrentWeek = selectedWeekStart === p.weekStart;
    const week = tally(p.events, wkStart, wkEnd, rCharters);
    const target = p.weeklyTarget;
    const pct = Math.min(100, (week.n / target) * 100);
    const hit = week.n >= target;

    // A past week is fully elapsed by definition; only the real current week
    // can be partway through, so only it gets "N days left" / pacing language.
    const elapsed = isCurrentWeek
      ? Math.max(1, Math.min(7, Math.round((today - wkStart) / 864e5) + 1))
      : 7;
    const left = isCurrentWeek ? 7 - elapsed : 0;
    const expected = (target / 7) * elapsed;
    const onPace = week.n >= expected;

    // How far back navigation is allowed to go — the server only scans
    // `lookbackDays` back, so earlier weeks would just show misleading zeros.
    const earliestIso = iso(addDays(today, -(p.lookbackDays || 300)));
    const canGoBackWeek = iso(addDays(wkStart, -7)) >= earliestIso;

    const dayCells = Array.from({ length: 7 }, (_, i) => {
      const d = addDays(wkStart, i);
      const v = tally(p.events, d, d, rCharters).n;
      const ahead = iso(d) > p.today;
      const isToday = iso(d) === p.today;
      const peak = Math.max(3, ...Array.from({ length: 7 }, (_, j) =>
        tally(p.events, addDays(wkStart, j), addDays(wkStart, j), rCharters).n));
      return `<div class="dcell ${ahead ? 'ahead' : ''} ${isToday ? 'today' : ''} ${v ? '' : 'zero'}"
                   data-start="${iso(d)}" data-end="${iso(d)}" data-label="${esc(DOW[i] + ', ' + d.getUTCDate() + ' ' + MON[d.getUTCMonth()])}">
        <div class="dbar-wrap"><div class="dbar" style="height:${(v / peak) * 100}%"></div></div>
        <div class="dnum">${v}</div>
        <div class="dlab">${DOW[i]}${isToday ? ' •' : ''}</div>
      </div>`;
    }).join('');

    const bs = buckets(p.today).map((b) => ({ ...b, ...tally(p.events, b.start, b.end, rCharters) }));
    const showTarget = rGran === 'weekly';
    const peak = Math.max(showTarget ? target : 0, ...bs.map((b) => b.n), 1);
    const max = Math.ceil((peak + 1) / 5) * 5;

    let chrome = '';
    for (let v = 0; v <= max; v += 5) {
      chrome += `<div class="crule" style="bottom:${(v / max) * 100}%"><span class="ct">${v}</span></div>`;
    }
    if (showTarget) {
      chrome += `<div class="ctarget" style="bottom:${(target / max) * 100}%">
        <span class="ctflag">TARGET ${target}/WEEK</span></div>`;
    }

    // Highlights whichever bar matches what the hero/KPI panel is currently
    // showing — the visual confirmation that clicking it actually did something.
    const selectedIso = rGran === 'weekly' ? selectedWeekStart : rGran === 'monthly' ? selectedMonthStart : null;
    const bars = bs.map((b) => `
      <div class="cslot ${b.n ? '' : 'zero'} ${showTarget && b.n >= target ? 'hit' : ''} ${b.current ? 'partial' : ''} ${iso(b.start) === selectedIso ? 'selected' : ''}"
           data-start="${iso(b.start)}" data-end="${iso(b.end)}" data-label="${esc(bucketPlain(b))}">
        <div class="cval">${b.n}</div>
        <div class="cbar" style="height:${(b.n / max) * 100}%"></div>
      </div>`).join('');

    const axis = bs.map((b) => `<div class="clab ${b.current ? 'partial' : ''}">
      ${bucketLabel(b)}${b.current ? '<br><span style="font-size:9px">so far</span>' : ''}</div>`).join('');

    const totalCharter = bs.reduce((s, b) => s + b.charter, 0);
    const kpiHtml = buildSimpleKpi(p, wkStart, wkEnd, isCurrentWeek, target);

    const subLabel = isCurrentWeek
      ? `Day <b>${elapsed}</b> of 7${left > 0 ? ` · ${left} day${left > 1 ? 's' : ''} left` : ' · final day'}`
      : 'Full week · completed';
    const paceLine = hit
      ? '✓ Target reached'
      : isCurrentWeek
        ? (onPace ? `On pace · ${(target - week.n)} to go` : `Behind pace · ${(target - week.n)} to go (expected ~${expected.toFixed(0)} by now)`)
        : `Target missed by ${target - week.n}`;
    const paceClass = hit ? 'ok' : (isCurrentWeek ? (onPace ? 'ok' : 'behind') : 'behind');

    $('reportWrap').innerHTML = `
      <div class="rtop">
        <div class="panel">
          <div class="pnav">
            <button class="navbtn" id="wkPrev" aria-label="Previous week" ${canGoBackWeek ? '' : 'disabled'}>‹</button>
            <div class="ptitle" style="margin:0">${isCurrentWeek ? 'This week' : 'Week of'} · ${wkStart.getUTCDate()} ${MON[wkStart.getUTCMonth()]} – ${wkEnd.getUTCDate()} ${MON[wkEnd.getUTCMonth()]}</div>
            <button class="navbtn" id="wkNext" aria-label="Next week" ${isCurrentWeek ? 'disabled' : ''}>›</button>
            ${isCurrentWeek ? '' : '<button class="navbtn navbtn-today" id="wkToday">Today</button>'}
          </div>
          <div class="hero ${hit ? 'hit' : ''}">
            <span class="big">${week.n}</span><span class="of">/ ${target} bookings</span>
          </div>
          <div class="htrack"><div class="hfill ${hit ? 'hit' : ''}" style="width:${pct}%"></div></div>
          <div class="hsub">${subLabel}</div>
          <div class="pace ${paceClass}">
            ${paceLine}
          </div>
        </div>

        <div class="panel">
          <div class="ptitle">${isCurrentWeek ? 'Daily progress this week' : 'Daily progress that week'}</div>
          <div class="days">${dayCells}</div>
        </div>
      </div>

      ${kpiHtml}

      <div class="panel">
        <div class="filters">
          <div class="seg" id="granSeg">
            ${['daily', 'weekly', 'monthly'].map((g) =>
              `<button data-g="${g}" aria-pressed="${g === rGran}">${g[0].toUpperCase() + g.slice(1)}</button>`).join('')}
          </div>
          <div class="seg" id="rangeSeg">
            ${RANGES[rGran].map((n) =>
              `<button data-n="${n}" aria-pressed="${n === rCount}">Last ${n}</button>`).join('')}
          </div>
          <div class="fnote">${p.tripsScanned} trips scanned${totalCharter ? ` · ${totalCharter} charter booking(s) excluded` : ''}</div>
        </div>
        <div class="tzbadge">🕐 All dates and times shown in <b>Muscat, Oman time (UTC+4)</b></div>
        <div class="chart">${chrome}<div class="cbars">${bars}</div></div>
        <div class="caxis">${axis}</div>
        <div class="rlegend">
          <span><i style="background:#f5b935"></i>Bookings taken</span>
          <span><i style="background:#56b98a"></i>Week hit target</span>
          <span><i style="background:repeating-linear-gradient(135deg,#f5b935 0 4px,rgba(245,185,53,.35) 4px 8px)"></i>Still in progress</span>
        </div>
      </div>`;

    bindReportInteractions(p);
    bindPeriodNav();

    $('granSeg').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      rGran = b.dataset.g;
      rCount = RANGES[rGran][0];
      renderReport();
    }));
    $('rangeSeg').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      rCount = Number(b.dataset.n); renderReport();
    }));

    // Every path that changes what Report is showing (filters, nav arrows,
    // clicking a bar) routes through a renderReport() call, so saving here
    // catches all of them in one place.
    saveViewState();
  }

  // Hover for a quick read, click for the full list — both driven by the same
  // per-period breakdown so they can never disagree with each other.
  function bindReportInteractions(p) {
    const tip = $('tip');

    function tipHtml(rows, label, charter, jumpHint) {
      const total = rows.reduce((s, r) => s + r.n, 0);
      if (!total) return `<div class="tt">${esc(label)}</div><div class="tk">No bookings in this period</div>`;
      const shown = rows.filter((r) => r.n > 0).slice(0, 5);
      const rest = rows.filter((r) => r.n > 0).length - shown.length;
      return `<div class="tt">${esc(label)}</div>
        <div class="tk">${total} booking${total > 1 ? 's' : ''} · ${rows.filter((r) => r.n > 0).length} trip${rows.filter((r) => r.n > 0).length > 1 ? 's' : ''}${charter ? ' · incl. charters' : ''}</div>
        ${shown.map((r) => `<div class="trow"><span>${esc(r.trip)}${r.charter ? ' 🏫' : ''}</span><b>+${r.n}</b></div>`).join('')}
        ${rest > 0 ? `<div class="more">+${rest} more trip${rest > 1 ? 's' : ''}</div>` : ''}
        <div class="hint">${jumpHint}</div>`;
    }

    function moveTip(e) {
      const pad = 14, r = tip.getBoundingClientRect();
      let x = e.clientX + pad, y = e.clientY + pad;
      if (x + r.width > innerWidth) x = e.clientX - r.width - pad;
      if (y + r.height > innerHeight) y = e.clientY - r.height - pad;
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    }

    // Bound to the bar shape itself (.cbar / .dbar), not the full-height column
    // it sits in — so the tooltip only appears when the cursor is actually
    // over the drawn bar, not the empty space above a short one.
    document.querySelectorAll('.cbar, .dbar').forEach((bar) => {
      const container = bar.closest('[data-start]');
      if (!container) return;
      const from = D(container.dataset.start), to = D(container.dataset.end);
      const rows = tripBreakdown(p.events, from, to, rCharters);
      const jumpHint = 'Click for full details';

      bar.addEventListener('mouseenter', () => {
        tip.innerHTML = tipHtml(rows, container.dataset.label, rCharters, jumpHint);
        tip.classList.add('on');
      });
      bar.addEventListener('mousemove', moveTip);
      bar.addEventListener('mouseleave', () => tip.classList.remove('on'));
      // Clicking a bar does two things at once: filters the hero/daily-strip/
      // KPI panel to that exact period in place, AND opens a popup with the
      // full per-trip, per-booking breakdown as extra detail on top of that.
      bar.addEventListener('click', () => {
        tip.classList.remove('on');
        if (rGran === 'monthly') {
          selectedMonthStart = container.dataset.start;
        } else if (rGran === 'weekly') {
          selectedWeekStart = container.dataset.start;
        } else {
          selectedWeekStart = iso(sundayOf(D(container.dataset.start)));
        }
        renderReport();
        openReportModal(container.dataset.label, rows, rCharters);
      });
    });
  }

  function openReportModal(label, rows, charter) {
    const withBookings = rows.filter((r) => r.n > 0);
    const total = withBookings.reduce((s, r) => s + r.n, 0);

    $('modalBody').innerHTML = `
      <div class="mtitle">${esc(label)}</div>
      <div class="msub">${total} booking${total !== 1 ? 's' : ''} across ${withBookings.length} trip${withBookings.length !== 1 ? 's' : ''}${charter ? ' (incl. charters)' : ' (retail only)'}</div>
      ${withBookings.length ? withBookings.map((r) => `
        <div class="mrow">
          <div class="mrow-top">
            <span class="mtrip">${esc(r.trip)}${r.charter ? ' 🏫' : ''}</span>
            <span class="mcount ${r.charter ? 'charter' : ''}">+${r.n}</span>
          </div>
          <div class="mwhen">${r.bookings.map((b) => esc(fmtOman(b.at)) + (b.n > 1 ? ` (+${b.n})` : '')).join(' · ')}</div>
          ${r.c ? `<div class="mcancel">${r.c} cancelled in this period</div>` : ''}
        </div>`).join('') : '<div class="mempty">No bookings in this period.</div>'}`;

    $('modalBackdrop').hidden = false;
  }

  function closeReportModal() { $('modalBackdrop').hidden = true; }
  $('modalClose').addEventListener('click', closeReportModal);
  $('modalBackdrop').addEventListener('click', (e) => { if (e.target.id === 'modalBackdrop') closeReportModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeReportModal(); });

  function bindPeriodNav() {
    const wkPrev = $('wkPrev'), wkNext = $('wkNext'), wkToday = $('wkToday');
    if (wkPrev) wkPrev.addEventListener('click', () => {
      selectedWeekStart = iso(addDays(D(selectedWeekStart), -7)); renderReport();
    });
    if (wkNext) wkNext.addEventListener('click', () => {
      selectedWeekStart = iso(addDays(D(selectedWeekStart), 7)); renderReport();
    });
    if (wkToday) wkToday.addEventListener('click', () => {
      selectedWeekStart = report.weekStart; renderReport();
    });
  }

  async function loadReport(force) {
    try {
      const res = await fetch('/api/booking-report' + (force ? '?refresh=1' : ''));
      const p = await res.json();
      if (!res.ok) throw new Error(p.error || 'request failed');
      report = p;
      renderReport();
      applyHeaderStats();
      // The Leads table's Bookings / Conversion columns come from this data.
      if (leads) renderLeads();
    } catch (err) {
      $('reportWrap').innerHTML = `<div class="msg err">Could not load report: ${esc(err.message)}</div>`;
    }
  }

  // Drives the header's New in 24h / Last Week / Weekly Target. Uses the same
  // lastCompletedWeekTotal() as the Report tab's panel, so the two can never
  // show different numbers for the same thing, and neither is affected by
  // whatever week is navigated to in the Report tab's hero panel.
  function applyHeaderStats() {
    if (!report) return;
    const last24h = last24hTotal(report.events);
    $('sNew').textContent = last24h;
    $('sNew').className = 'n' + (last24h > 0 ? ' fresh' : '');
    $('sLastWeek').textContent = lastCompletedWeekTotal(report);
    $('sWeeklyTarget').textContent = report.weeklyTarget;
  }

  /* ================= Meta Ads: shared formatting ================= */

  let campaigns = null;
  let adHistory = null;
  // Which year the History tab is showing. Null until the API answers, so the
  // first load takes whatever it considers current rather than guessing here.
  let historyYear = null;

  const nf0 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
  const nf2 = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const int = (n) => nf0.format(Math.round(Number(n) || 0));
  const dec = (n) => nf2.format(Number(n) || 0);

  // Precision follows magnitude: cost-per-result runs from under a riyal to
  // four figures across these campaigns, and neither end should look wrong.
  const money = (n) => {
    const v = Number(n) || 0;
    if (Math.abs(v) >= 1000) return int(v);
    if (Math.abs(v) >= 1) return dec(v);
    return v === 0 ? '0' : v.toFixed(3);
  };
  const pct = (n) => (Number.isFinite(n) ? (n * 100).toFixed(1) + '%' : '—');

  // Every derived figure in the spreadsheet was a division wrapped in IFERROR,
  // which blanks rather than showing a misleading zero. Same contract here.
  const ratio = (a, b) => (Number(b) ? Number(a) / Number(b) : null);
  const show = (v, fmt) => (v == null ? '—' : fmt(v));

  /* ---- what each column means ----
     Every figure on the ad tabs is either pulled from Meta or derived from
     the budget sheet, and which is which isn't obvious from a column header.
     Hovering any header says what the number is and how it got there, so the
     board can be read without someone having to explain it first. */
  const GLOSSARY = {
    campaign: ['Campaign', 'The campaign name exactly as it stands in Meta Ads Manager. Rename it there and it changes here on the next refresh.'],
    status: ['Status', 'Active means Meta is running this campaign right now. Inactive means it is paused, finished, or switched off.'],
    months: ['Months', 'The months this campaign actually delivered in. A campaign that ran in January and again in August shows both, not the gap between them.'],
    budget: ['Budget', 'What this campaign is allowed to spend. Taken from Updated Budget.xlsx where the campaign matches a plan line, otherwise $500 is assumed.'],
    budgetAssumed: ['Budget', 'There is no budget sheet for past years, so every campaign in History is measured against the same assumed $500.'],
    spend: ['Spend', 'Money actually spent, live from Meta. Accounts billed in USD are converted to SAR so every figure on the board reads in one currency.'],
    remaining: ['Remaining', 'Budget minus spend. A negative number means the campaign spent past its budget.'],
    results: ['Results', 'The main action the campaign was set up to get, so it means different things on different campaigns: conversations started on a Messages campaign, leads on a Leads campaign, purchases on a Sales campaign.'],
    costPerResult: ['Cost / Result', 'Spend divided by results — what one result cost on average. Blank when a campaign has no results yet, rather than showing a misleading zero.'],
    purchases: ['Purchases', 'Purchases Meta actually tracked, counted on every campaign whatever its objective. A Messages campaign can still drive sales, and Results would only show its message count, so those sales appear here instead.'],
    impressions: ['Impressions', 'How many times the ads were shown. The same person seeing an ad twice counts twice, so this runs higher than the number of people reached.'],
    spendVsBudget: ['Spend vs Budget', 'Spend as a percentage of budget. The bar fills as it gets closer, turns amber from 85%, and red once it is past 100%.'],
    actualSpend: ['Actual spend', 'Total spent across every campaign below, live from Meta, against the total budget beside it.'],
    leadsWeek: ['Leads', "Everyone who messaged us this week on WhatsApp or Instagram, from Marina's Leads Feedback & Report sheet. The weekly report's number where Marina has filled it in; otherwise the sum of the days logged so far."],
    leadsToday: ['Today', "Leads logged in the sheet for today. Reads 'not logged yet' until Marina enters the day, not zero."],
    leadsBest: ['Busiest day', 'The day with the most leads in this week.'],
    leadsAvg: ['Per day', 'Average leads per day: the days logged so far this week, or the whole week once it has passed.'],
    project: ['Project', 'The trip the lead asked about, as Marina tagged it. NA means they messaged without naming a trip.'],
    leadsIg: ['Instagram', 'Leads who came in through an Instagram DM.'],
    leadsWa: ['WhatsApp', 'Leads who came in through WhatsApp.'],

  // data-help carries HTML into an attribute, so it goes through attr() and
  // not esc() — esc() leaves quotes alone and the value would end early.
  const hlp = (key) => {
    const entry = GLOSSARY[key];
    if (!entry) return '';
    return `data-help="${attr(`<div class="tt">${esc(entry[0])}</div><div class="tk">${esc(entry[1])}</div>`)}"`;
  };

  // The trigger has to sit on the word itself. A <th> is a full-width cell
  // with padding either side, so hanging the tooltip off the cell fires it
  // when the pointer is nowhere near the label.
  const hcol = (key, label) => `<th><span ${hlp(key)}>${esc(label)}</span></th>`;

  // Scrolling moves the table out from under a pointer that never moves, so
  // the tooltip has to be dismissed on scroll too, not only on mouseleave.
  const hideTip = () => $('tip').classList.remove('on');
  addEventListener('scroll', hideTip, true);

  // One tooltip element for the page, same one the Report bars use.
  function bindHelp(root) {
    const tip = $('tip');
    // Re-rendering replaces the node the pointer is over, so its mouseleave
    // never arrives and the tooltip would stay up over a table it no longer
    // belongs to. Clearing on every bind is what closes that hole.
    hideTip();
    const move = (e) => {
      const pad = 14;
      const r = tip.getBoundingClientRect();
      let x = e.clientX + pad;
      let y = e.clientY + pad;
      if (x + r.width > innerWidth) x = e.clientX - r.width - pad;
      if (y + r.height > innerHeight) y = e.clientY - r.height - pad;
      tip.style.left = `${x}px`;
      tip.style.top = `${y}px`;
    };
    root.querySelectorAll('[data-help], [data-tip]').forEach((el) => {
      el.addEventListener('mouseenter', (e) => {
        tip.innerHTML = el.dataset.help || el.dataset.tip;
        tip.classList.add('on');
        move(e);
      });
      el.addEventListener('mousemove', move);
      el.addEventListener('mouseleave', hideTip);
    });
  }

  // Spend against budget, as one bar. Amber as it nears the budget, red once
  // it is past it — the percentage beside it says the same thing, so colour
  // is never carrying the meaning on its own.
  const barFor = (spend, budget) => {
    const usedPct = ratio(spend, budget);
    const width = Math.min(100, (usedPct || 0) * 100);
    const state = usedPct == null ? '' : usedPct > 1 ? ' over' : usedPct >= 0.85 ? ' near' : '';
    return `<div class="abar"><div class="abar-fill${state}" style="width:${width.toFixed(1)}%"></div></div>`
      + `<span class="abar-pct">${show(usedPct, pct)}</span>`;
  };

  /* ================= campaigns tab ================= */

  // Every 2026 campaign, each with its own budget to measure against. Budget
  // comes from Updated Budget.xlsx where the campaign ties to a plan line and
  // from a flat default where it doesn't; spend, names and status come live

  function renderCampaigns() {

    $('campaignsWrap').innerHTML = `

  async function loadCampaigns(force) {
    try {
      const res = await fetch('/api/campaigns' + (force ? '?refresh=1' : ''));
      const p = await res.json();
      if (!res.ok && !p.campaigns) throw new Error(p.error || `HTTP ${res.status}`);

      renderCampaigns();

      if (!campaigns) {
        $('campaignsWrap').innerHTML = `<div class="msg err">Could not load campaign data: ${esc(err.message)}</div>`;

  async function loadHistory(force) {
    const q = [];
    if (historyYear) q.push('year=' + historyYear);
    if (force) q.push('refresh=1');

      const res = await fetch('/api/campaign-history' + (q.length ? '?' + q.join('&') : ''));
      const p = await res.json();
      if (!res.ok && !p.campaigns) throw new Error(p.error || `HTTP ${res.status}`);

  /* ================= previous trips (Booking) ================= */

  let previousTrips = null;
  // Which year Previous Trips is showing. Null until the API answers — same
  // pattern as History's historyYear — so the first load takes the most
  // recent year with data rather than guessing here.
  let ptYear = null;
  let ptMonth = 'all';
  const ptOpenTrips = new Set();

  const PT_MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'];
  const PT_MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  const ptDate = (iso) => {
    const d = new Date(`${iso}T00:00:00Z`);
    return Number.isNaN(d.getTime()) ? '' : `${d.getUTCDate()} ${PT_MONTHS_SHORT[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  };

  function ptGroupTotals(rows) {
    return {
      booked: rows.reduce((sum, t) => sum + t.booked, 0),
      cancelled: rows.reduce((sum, t) => sum + t.cancelled, 0),
    };
  }

  // The dropdown only earns its place on a trip that actually has more than
  // one week to break down — a single-week trip's own date range already
  // says everything the expansion would, so it gets no button at all rather
  // than a "Weeks · 1" that opens onto one row identical to what's already
  // shown.
  function ptTripRow(t) {
    const weeks = t.weeks || [];
    const multi = weeks.length > 1;
    const cancelled = !!t.cancelledTrip;
    const open = ptOpenTrips.has(t.uuid);

    // An empty cell still fills its grid column, so Booked/Cancelled stay
    // aligned whether or not this row has a button in it.
    const weeksCell = multi ? `
      <button class="pt-toggle" data-toggle="${esc(t.uuid)}" aria-expanded="${open}">

      </button>` : '<div></div>';

    const weeksPanel = multi && open ? `
      <div class="pt-weeks">
        ${weeks.map((w) => `
          <div class="pt-wrow${w.unavailable ? ' pt-cancelled-row' : ''}">

        ${t.unallocated ? `<div class="pt-unalloc">+${int(t.unallocated)} booked, week not specified</div>` : ''}

    return `
    <div class="pt-row${cancelled ? ' pt-cancelled-row' : ''}">

      <div class="pt-dates">${esc(ptDate(t.start))}${t.end && t.end !== t.start ? ' – ' + esc(ptDate(t.end)) : ''}</div>

  // One year on screen at a time — same approach as the History tab, so a
  // long booking history doesn't turn into one endless scroll of every year
  // stacked on top of each other. Trips within the chosen year still break
  // out by month, since that grouping is what makes a busy year scannable.
  // Previous Sales charts (Muatasam, 5 Oct 2026): bookings taken per month
  // from /api/previous-trips' `sales` (counted like the Report), the same
  // month across years, and the last 12/24/36 months.
  let psMonth = null; // 0-11, defaults to the current month
  let psRange = 12;
  const PS_MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const psKey = (y, m) => `${y}-${String(m + 1).padStart(2, '0')}`;

  // One bar chart in the Report's own style. Bars: [{ label, sub, n, partial, none, tip }].
  function psChart(bars) {
    const peak = Math.max(1, ...bars.map((b) => b.n || 0));
    const step = peak > 60 ? 20 : peak > 25 ? 10 : 5;
    const max = Math.ceil((peak + 1) / step) * step;
    let chrome = '';
    for (let v = 0; v <= max; v += step) chrome += `<div class="crule" style="bottom:${(v / max) * 100}%"><span class="ct">${v}</span></div>`;
    const slots = bars.map((b) => `
      <div class="cslot ${b.n ? '' : 'zero'} ${b.partial ? 'partial' : ''}" ${b.tip ? tipOf(b.tip[0], b.tip[1]) : ''}>
        <div class="cval">${b.none ? '—' : int(b.n)}</div>
        <div class="cbar" style="height:${b.none ? 0 : ((b.n || 0) / max) * 100}%"></div>
      </div>`).join('');
    const axis = bars.map((b) => `<div class="clab ${b.partial ? 'partial' : ''}">${esc(b.label)}${b.sub ? `<br><span style="font-size:9px">${esc(b.sub)}</span>` : ''}</div>`).join('');
    const minW = bars.length > 12 ? `style="min-width:${bars.length * 34 + 30}px"` : '';
    return `<div class="ps-scroll"><div ${minW}><div class="chart">${chrome}<div class="cbars">${slots}</div></div><div class="caxis">${axis}</div></div></div>`;
  }

  function psHtml(p) {
    const sales = p.sales;
    if (!sales || !sales.months) return '';
    const months = sales.months;
    const n = (y, m) => (months[psKey(y, m)] || { n: 0 }).n;
    const today = p.today;
    const ty = Number(today.slice(0, 4));
    const tm = Number(today.slice(5, 7)) - 1;
    const td = Number(today.slice(8, 10));
    const first = Object.keys(months).sort()[0] || today.slice(0, 7);
    const fy = Number(first.slice(0, 4));
    if (psMonth == null) psMonth = tm;
    const m = psMonth;

    // ---- same month, year on year ----
    const years = [];
    for (let y = fy; y <= ty; y++) years.push(y);
    const yoy = years.map((y) => {
      const key = psKey(y, m);
      const future = y === ty && m > tm;
      const before = key < first;
      const partial = y === ty && m === tm;
      const prev = y > fy ? n(y - 1, m) : null;
      const v = n(y, m);
      const rows = [['Bookings taken', future || before ? 'no data' : int(v)]];
      if (prev != null && !future && !before && !partial && prev) rows.push([`vs ${PS_MON[m]} ${y - 1}`, `${v >= prev ? '+' : '−'}${Math.round(Math.abs(v - prev) / prev * 100)}%`]);
      return { label: String(y), sub: partial ? 'so far' : '', n: future || before ? 0 : v, none: future || before, partial, tip: [`${PS_MON[m]} ${y}`, rows] };
    });
    const pctTxt = (a, b) => (b ? `<span class="${a >= b ? 'up' : 'down'}">${a >= b ? '▲ +' : '▼ −'}${Math.round(Math.abs(a - b) / b * 100)}%</span>` : '');
    let line = '';
    if (m === tm) {
      // This month isn't over, so it's compared with the same days last year.
      const sofar = n(ty, m);
      const lastByNow = ((months[psKey(ty - 1, m)] || {}).byDay || []).slice(0, td).reduce((a, b) => a + b, 0);
      const lastFull = n(ty - 1, m);
      line = `<b>${PS_MON[m]} ${ty}</b> so far: <b>${int(sofar)}</b> · ${PS_MON[m]} ${ty - 1} by ${td} ${PS_MON[m]}: <b>${int(lastByNow)}</b> ${pctTxt(sofar, lastByNow)} · full ${PS_MON[m]} ${ty - 1}: <b>${int(lastFull)}</b>`;
    } else {
      const y = m < tm ? ty : ty - 1;
      const cur = n(y, m);
      const prev = n(y - 1, m);
      const past = years.filter((x) => x < y && psKey(x, m) >= first).map((x) => n(x, m));
      const avg = past.length ? past.reduce((a, b) => a + b, 0) / past.length : null;
      line = `<b>${PS_MON[m]} ${y}</b>: <b>${int(cur)}</b> · ${PS_MON[m]} ${y - 1}: <b>${int(prev)}</b> ${pctTxt(cur, prev)}${avg != null ? ` · average of earlier years: <b>${avg.toFixed(0)}</b>` : ''}`;
    }

    // ---- last N months ----
    const recent = [];
    for (let k = psRange - 1; k >= 0; k--) {
      const d = new Date(Date.UTC(ty, tm - k, 1));
      const y = d.getUTCFullYear();
      const mm = d.getUTCMonth();
      const partial = y === ty && mm === tm;
      recent.push({ label: PS_MON[mm], sub: partial ? 'so far' : String(y), n: n(y, mm), partial, tip: [`${PS_MON[mm]} ${y}`, [['Bookings taken', int(n(y, mm))]]] });
    }

    return `
      <div class="panel">
        <div class="ptitle">Same month, year on year · bookings taken</div>
        <div class="filters"><div class="seg ps-months" id="psMonthSeg">${PS_MON.map((x, i) => `<button data-m="${i}" aria-pressed="${i === m}">${x}</button>`).join('')}</div></div>
        ${psChart(yoy)}
        <div class="ps-line">${line}</div>
        <div class="rlegend">
          <span><i style="background:#f5b935"></i>Bookings taken in ${PS_MON[m]}</span>
          <span><i style="background:repeating-linear-gradient(135deg,#f5b935 0 4px,rgba(245,185,53,.35) 4px 8px)"></i>Still in progress</span>
          ${sales.charterExcluded ? `<span>${int(sales.charterExcluded)} charter booking(s) excluded, as on the Report</span>` : ''}
        </div>
      </div>
      <div class="panel">
        <div class="ptitle">Bookings taken by month</div>
        <div class="filters"><div class="seg" id="psRangeSeg">${[12, 24, 36].map((x) => `<button data-n="${x}" aria-pressed="${x === psRange}">Last ${x}</button>`).join('')}</div></div>
        ${psChart(recent)}
      </div>`;
  }

  function renderPreviousTrips() {
    const p = previousTrips;
    if (!p) return;
    if (p.error && !p.trips) {
      $('previousWrap').innerHTML = `<div class="msg err">Could not load previous projects: ${esc(p.error)}</div>`;
      return;
    }

    if (ptYear == null || !p.years.includes(ptYear)) ptYear = p.years[0] ?? null;

    const inYear = p.trips.filter((t) => t.year === ptYear);
    const filtered = inYear.filter((t) => ptMonth === 'all' || t.month === Number(ptMonth));
    const yTotals = ptGroupTotals(filtered);

    const showMonths = ptMonth === 'all';
    let body;
    if (showMonths) {
      const byMonth = new Map();
      for (const t of filtered) {
        if (!byMonth.has(t.month)) byMonth.set(t.month, []);
        byMonth.get(t.month).push(t);
      }
      // Rows arrive already sorted most-recent-first, so months only need a
      // distinct-and-descending pass, not a second re-sort by date.
      const months = [...byMonth.keys()].sort((a, b) => b - a);
      body = months.map((month) => {
        const mRows = byMonth.get(month);
        const mTotals = ptGroupTotals(mRows);
        return `
          <div class="pt-month">
            <div class="pt-mhead">
              <span class="pt-mname">${esc(PT_MONTHS[month])}</span>
              <span class="pt-mmeta">${mRows.length} project${mRows.length === 1 ? '' : 's'}</span>
              <div class="pt-mnums">
                <span>Booked <b>${int(mTotals.booked)}</b></span>
                <span class="cancel">Cancelled <b>${int(mTotals.cancelled)}</b></span>
              </div>
            </div>
            ${mRows.map(ptTripRow).join('')}
          </div>`;
      }).join('');
    } else {
      body = filtered.map(ptTripRow).join('');
    }

    const yearTabs = p.years.map((y) =>
      `<button data-year="${y}" aria-pressed="${y === ptYear}">${y}</button>`).join('');
    const monthOptions = ['<option value="all">All months</option>']
      .concat(PT_MONTHS.map((m, i) => `<option value="${i}" ${String(i) === ptMonth ? 'selected' : ''}>${esc(m)}</option>`));

    $('previousWrap').innerHTML = `
      ${p.stale ? `<div class="msg err">Showing last known figures — ${esc(p.error || 'WeTravel unreachable')}</div>` : ''}

      ${psHtml(p)}

      <div class="panel">
        <div class="ptitle">Previous projects · ${ptYear ?? '—'}</div>
        <div class="filters"><div class="seg" id="ptYearSeg">${yearTabs}</div></div>
        <div class="vhero">
          <span class="vh-n">${int(filtered.length)}</span>
          <span class="vh-s">departed project${filtered.length === 1 ? '' : 's'} · <b style="color:#fff">${int(yTotals.booked)}</b> booked · <b style="color:var(--danger)">${int(yTotals.cancelled)}</b> cancelled</span>
        </div>
        <div class="filters" style="margin-top:12px">
          <select class="fselect" id="ptMonthSel">${monthOptions.join('')}</select>
          <div class="fnote">${p.trips.length} projects on record across ${p.years.length} year${p.years.length === 1 ? '' : 's'}</div>
        </div>
      </div>

      <div class="panel">
        ${body || '<div class="msg">No previous projects match this filter.</div>'}
      </div>`;

    $('previousWrap').querySelectorAll('#ptYearSeg button').forEach((b) => {
      b.addEventListener('click', () => {
        const year = Number(b.dataset.year);
        if (year === ptYear) return;
        ptYear = year;
        ptMonth = 'all';
        renderPreviousTrips();
        saveViewState();
      });
    });
    $('ptMonthSel').addEventListener('change', (e) => { ptMonth = e.target.value; renderPreviousTrips(); saveViewState(); });
    bindHelp($('previousWrap'));
    $('previousWrap').querySelectorAll('#psMonthSeg [data-m]').forEach((b) => {
      b.addEventListener('click', () => { psMonth = Number(b.dataset.m); renderPreviousTrips(); });
    });
    $('previousWrap').querySelectorAll('#psRangeSeg [data-n]').forEach((b) => {
      b.addEventListener('click', () => { psRange = Number(b.dataset.n); renderPreviousTrips(); });
    });
    $('previousWrap').querySelectorAll('[data-toggle]').forEach((b) => {
      b.addEventListener('click', () => {
        const uuid = b.dataset.toggle;
        if (ptOpenTrips.has(uuid)) ptOpenTrips.delete(uuid); else ptOpenTrips.add(uuid);
        renderPreviousTrips();
      });
    });
  }

  async function loadPreviousTrips(force) {
    try {
      const res = await fetch('/api/previous-trips' + (force ? '?refresh=1' : ''));
      const p = await res.json();
      if (!res.ok && !p.trips) throw new Error(p.error || `HTTP ${res.status}`);
      previousTrips = p;
      renderPreviousTrips();
    } catch (err) {
      if (!previousTrips) {
        $('previousWrap').innerHTML = `<div class="msg err">Could not load previous projects: ${esc(err.message)}</div>`;
      }
    }
  }

  /* ================= leads tab (Marina's sheet) ================= */

  let leads = null;
  // The week on screen, by its start date. Null means "whichever week is
  // current", so the tab rolls into the next week on its own, which is the
  // behaviour Muatasam asked for.
  let leadsWeek = null;
  // A day tapped in the daily chart, whose breakdown the table then shows.
  // Null means the table shows the whole week. Cleared whenever the week
  // changes, since the day belongs to the week it was picked from.
  let leadsDay = null;

  const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const dayOf = (day) => new Date(`${day}T00:00:00Z`);
  const dayName = (day) => {
    const d = dayOf(day);
    return `${WEEKDAYS[d.getUTCDay()]} ${d.getUTCDate()} ${PT_MONTHS_SHORT[d.getUTCMonth()]}`;
  };

  // Tooltip rows for a chart mark. attr(), not esc(): this goes inside an
  // attribute, and esc() would let a quote end it early.
  const tipOf = (title, rows, note) => `data-tip="${attr(
    `<div class="tt">${esc(title)}</div>`
    + rows.map(([k, v]) => `<div class="trow"><span class="tk">${esc(k)}</span><b>${esc(v)}</b></div>`).join('')
    + (note ? `<div class="more">${esc(note)}</div>` : ''),
  )}"`;

  // A "nice" chart top, so the gridline lands on a round number.
  function niceTop(v) {
    if (!(v > 0)) return 1;
    const mag = 10 ** Math.floor(Math.log10(v));
    const n = v / mag;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  }

  // IG and WA only stack when they genuinely add up to the total. When the
  // sheet has no split, or its split doesn't add up (a typo in one row), the
  // column is one combined block, so it never shows a breakdown that isn't
  // true.
  const splits = (total, ig, wa) => ig != null && wa != null && ig + wa === total;
  function leadStack(total, ig, wa, px, thin) {
    if (!total) return '';
    const inner = splits(total, ig, wa)
      ? `${wa ? `<i class="lseg wa" style="flex:${wa}"></i>` : ''}${ig ? `<i class="lseg ig" style="flex:${ig}"></i>` : ''}`
      : '<i class="lseg all" style="flex:1"></i>';
    return `<span class="lstack${thin ? ' thin' : ''}" style="height:${Math.max(2, px)}px">${inner}</span>`;
  }

  function dailyChart(w, today, picked) {
    const H = 130;
    const top = Math.max(1, ...w.days.map((d) => d.total || 0));
    const cols = w.days.map((d) => {
      const name = dayName(d.date) + (d.date === today ? ' (today)' : '');
      if (d.future) return `<div class="lcol future" ${tipOf(name, [['Status', 'Still to come']])}><span class="lval"></span></div>`;
      if (!d.recorded) return `<div class="lcol missing" ${tipOf(name, [['Status', 'Not logged in the sheet']])}><span class="lval">—</span></div>`;
      const rows = splits(d.total, d.ig, d.wa)
        ? [['WhatsApp', int(d.wa)], ['Instagram', int(d.ig)], ['Total', int(d.total)]]
        : [['IG + WA', int(d.total)]];
      const on = d.date === picked;
      return `<button class="lcol${on ? ' sel' : ''}" data-day="${attr(d.date)}" aria-pressed="${on}" ${tipOf(name, rows, on ? 'Tap again for the whole week' : 'Tap for this day\'s breakdown')}><span class="lval">${int(d.total)}</span>${leadStack(d.total, d.ig, d.wa, (d.total / top) * H)}</button>`;
    }).join('');
    const axis = w.days.map((d) => {
      const dt = dayOf(d.date);
      const cls = [d.date === today ? 'on' : '', d.date === picked ? 'pick' : ''].filter(Boolean).join(' ');
      return `<span class="${cls}">${WEEKDAYS[dt.getUTCDay()]}<b>${dt.getUTCDate()}</b></span>`;
    }).join('');
    return `<div class="lchart"><div class="lplot" style="height:${H + 20}px">${cols}</div><div class="laxis">${axis}</div></div>`;
  }

  function weeklyChart(weeks, sel) {
    const H = 150;
    const top = niceTop(Math.max(1, ...weeks.map((w) => w.total || 0)));
    const peak = Math.max(0, ...weeks.map((w) => w.total || 0));
    let lastMonth = -1;
    const cols = [];
    const axis = [];
    for (const w of weeks) {
      const on = w.start === sel.start;
      const rows = splits(w.total, w.ig, w.wa)
        ? [['WhatsApp', int(w.wa)], ['Instagram', int(w.ig)], ['Total', int(w.total)]]
        : [['IG + WA', int(w.total)]];
      const note = w.issues.length ? w.issues[0] : (w.source === 'daily' && w.current ? 'Weekly report not filled in yet, so this is the days logged so far' : '');
      // Values only where they earn it: the selected week and the peak.
      const val = on || (w.total === peak && peak > 0) ? int(w.total) : '';
      cols.push(`<button class="lcol${on ? ' sel' : ''}" data-week="${attr(w.start)}" ${tipOf(w.label + (w.current ? ' · this week' : ''), rows, note)}><span class="lval">${val}</span>${leadStack(w.total, w.ig, w.wa, (w.total / top) * H, true)}</button>`);
      const m = dayOf(w.start).getUTCMonth();
      axis.push(`<span class="${on ? 'on' : ''}">${m !== lastMonth ? PT_MONTHS_SHORT[m] : '&nbsp;'}</span>`);
      lastMonth = m;
    }
    const grid = `<div class="lgl" style="bottom:${H}px"><span>${int(top)}</span></div><div class="lgl" style="bottom:${H / 2}px"><span>${int(top / 2)}</span></div>`;
    return `<div class="lscroll"><div class="lchart"><div class="lplot gut" style="height:${H + 20}px">${grid}${cols.join('')}</div><div class="laxis lweeks gut">${axis.join('')}</div></div></div>`;
  }

  // Bookings taken per lead project between two Muscat dates (inclusive),
  // from the Report's events, which carry each trip's destination (pd) and
  // programme (pg) code. A lead code "ZNZ|BL" matches both; "SL" (no
  // programme in Marina's code) matches the destination alone; "NA" named
  // no trip, so it has nothing to match. Charters are left out, as on the
  // Report. Null until the Report data has loaded.
  function leadBookings(start, end) {
    if (!report || !report.events) return null;
    const out = { all: 0, by: (code) => {
      if (!code || code === 'NA') return null;
      const [d, g] = String(code).split('|');
      let n = 0;
      for (const e of out.rows) if (e.pd === d && (!g || e.pg === g)) n += e.n;
      return n;
    }, rows: [] };
    for (const e of report.events) {
      if (e.x || !e.n) continue;
      const day = new Date(Date.parse(e.at) + 4 * 3600 * 1000).toISOString().slice(0, 10);
      if (day < start || day > end) continue;
      out.all += e.n;
      out.rows.push(e);
    }
    return out;
  }

  function renderLeads() {
    const p = leads;
    if (!p) return;
    if (p.error && !p.weeks) {
      $('leadsWrap').innerHTML = `<div class="msg err">Could not load leads: ${esc(p.error)}</div>`;
      return;
    }
    const weeks = p.weeks || [];
    if (!weeks.length) {
      $('leadsWrap').innerHTML = '<div class="msg">No leads in the sheet yet.</div>';
      return;
    }
    const current = weeks.find((w) => w.current) || weeks[weeks.length - 1];
    const sel = weeks.find((w) => w.start === leadsWeek) || current;
    const at = weeks.indexOf(sel);
    const today = p.today;

    // ---- headline figures for the week on screen ----
    const logged = (sel.days || []).filter((d) => d.recorded && !d.future);
    const best = logged.reduce((b, d) => (!b || d.total > b.total ? d : b), null);
    const todayDay = (sel.days || []).find((d) => d.date === today);
    const spanDays = Math.round((dayOf(sel.end) - dayOf(sel.start)) / 86400000) + 1;
    // Averaged from the same number the headline shows: the weekly report's
    // total over the whole week once there is one, otherwise the days logged
    // so far. Mixing the two would print an average that doesn't multiply
    // back to the total above it.
    const perDay = sel.source === 'report'
      ? sel.total / spanDays
      : (logged.length ? sel.dailyTotal / logged.length : null);
    const split = splits(sel.total, sel.ig, sel.wa);

    const second = sel.current
      ? `<div class="bv-side">
          <div class="bv-lab"><span ${hlp('leadsToday')}>Today</span></div>
          <div class="bv-n">${todayDay && todayDay.recorded ? int(todayDay.total) : '—'}</div>
          <div class="bv-s">${todayDay && todayDay.recorded ? esc(dayName(today)) : 'not logged yet'}</div>
        </div>`
      : `<div class="bv-side">
          <div class="bv-lab"><span ${hlp('leadsBest')}>Busiest day</span></div>
          <div class="bv-n">${best ? int(best.total) : '—'}</div>
          <div class="bv-s">${best ? esc(dayName(best.date)) : 'days not logged'}</div>
        </div>`;

    // A tapped day only counts if it's a logged day in the week on screen.
    const day = leadsDay && sel.days ? sel.days.find((d) => d.date === leadsDay && d.recorded && !d.future) || null : null;
    if (!day) leadsDay = null;

    const daily = sel.days
      ? `${dailyChart(sel, today, day && day.date)}<div class="pnote">Tap a day to see its breakdown below.</div>`
      : `<div class="pnote">Only the weekly total was recorded for this week, not the daily numbers.</div>`;

    // ---- the breakdown table: the tapped day, or the whole week ----
    // The count comes straight after the name, so it's on screen even on a
    // phone where the table scrolls. WhatsApp/Instagram columns only appear
    // when the sheet splits every project: columns of dashes read as "no
    // breakdown at all" and hid the numbers that do exist.
    const src = day || sel;
    const scope = day ? 'day' : 'week';
    const srcLabel = day ? dayName(day.date) : sel.label;
    const srcSplit = splits(src.total, src.ig, src.wa);
    const projSplit = src.projects.length > 0 && src.projects.every((x) => x.ig != null && x.wa != null);
    const projMax = Math.max(1, ...src.projects.map((x) => x.total));
    // Shares are of the rows shown, so they always add up to 100%. When the
    // sheet's own total disagrees with its project cells (flagged above),
    // dividing by that total would print shares summing past 100%.
    const rowSum = src.projects.reduce((sum, x) => sum + x.total, 0);
    const projCols = projSplit ? 7 : 5;
    // Bookings in the same week (or the day picked) beside the leads, and the
    // conversion between them (Anton, 5 Oct 2026).
    const bk = leadBookings(day ? day.date : sel.start, day ? day.date : sel.end);
    const convCell = (b, l) => {
      if (b == null || !l) return '<td class="abar-cell"><span class="rv-na">—</span></td>';
      const r = b / l;
      // No minimum width at 0%, so an empty bar never shows a green dot.
      return `<td class="abar-cell"><div class="abar"><div class="abar-fill" style="width:${Math.min(100, r * 100).toFixed(1)}%;background:var(--fill-full)${r ? '' : ';min-width:0'}"></div></div><span class="abar-pct"><b>${pct(r)}</b></span></td>`;
    };
    const projRows = src.projects.map((x) => {
      const b = bk ? bk.by(x.code) : null;
      return `
      <tr>
        <td class="cname">${esc(x.code === 'NA' ? 'NA (no trip given)' : x.code)}</td>
        <td class="num"><b>${int(x.total)}</b></td>
        ${projSplit ? `<td class="num">${int(x.wa)}</td><td class="num">${int(x.ig)}</td>` : ''}
        <td class="abar-cell"><div class="abar"><div class="abar-fill lead" style="width:${((x.total / projMax) * 100).toFixed(1)}%"></div></div><span class="abar-pct">${show(ratio(x.total, rowSum), pct)}</span></td>
        <td class="num">${b == null ? '<span class="rv-na">—</span>' : int(b)}</td>
        ${convCell(b, x.total)}
      </tr>`;
    }).join('');
    // The channel split, said in words when the sheet has it for the total
    // but not project by project, so it's never only in a hover tooltip.
    const splitLine = srcSplit && !projSplit
      ? `<div class="lsplit"><span><i style="background:var(--lead-wa)"></i>WhatsApp <b>${int(src.wa)}</b></span><span><i style="background:var(--lead-ig)"></i>Instagram <b>${int(src.ig)}</b></span></div>`
      : '';
    const splitNote = !srcSplit && src.projects.length
      ? `<div class="pnote">WhatsApp vs Instagram isn't split in the sheet for this ${scope} yet, so it can't be shown here.</div>`
      : '';

    const anyCombined = weeks.some((w) => w.total && !splits(w.total, w.ig, w.wa));

    $('leadsWrap').innerHTML = `
      ${p.stale ? `<div class="msg err">Showing the last copy of the sheet — ${esc(p.error || 'OneDrive unreachable')}</div>` : ''}

      <div class="panel">
        <div class="lhead">
          <div class="ptitle">Daily leads · ${esc(sel.label)}${sel.current ? ' · this week' : ''}</div>
          <div class="lnav">
            <button data-step="-1" ${at <= 0 ? 'disabled' : ''} aria-label="Previous week">‹ Prev</button>
            <button data-step="0" ${sel === current ? 'disabled' : ''}>This week</button>
            <button data-step="1" ${at >= weeks.length - 1 ? 'disabled' : ''} aria-label="Next week">Next ›</button>
          </div>
        </div>
        <div class="bvhero">
          <div class="bv-side">
            <div class="bv-lab"><span ${hlp('leadsWeek')}>${sel.current ? 'Leads this week' : 'Leads'}</span></div>
            <div class="bv-n bv-act">${int(sel.total)}</div>

              ${hcol(day ? 'leadsShareDay' : 'leadsShare', day ? 'Share of day' : 'Share of week')}

              <td></td>

    // On a phone the weekly chart scrolls sideways and opened on January,
    // with the week that matters off to the right. Bring the selected week
    // into view, but only when it isn't already, so clicking a visible week
    // doesn't make the chart jump.
    const sc = $('leadsWrap').querySelector('.lscroll');
    const selCol = sc && sc.querySelector('.lcol.sel');
    if (sc && selCol && sc.scrollWidth > sc.clientWidth) {
      const x = selCol.getBoundingClientRect().left - sc.getBoundingClientRect().left;
      if (x < 0 || x + selCol.offsetWidth > sc.clientWidth) {
        sc.scrollLeft += x - sc.clientWidth + selCol.offsetWidth * 3;
      }
    }

    bindHelp($('leadsWrap'));

    // A new week always opens on its whole-week breakdown.
    $('leadsWrap').querySelectorAll('[data-week]').forEach((b) => {
      b.addEventListener('click', () => { leadsWeek = b.dataset.week; leadsDay = null; renderLeads(); });
    });
    $('leadsWrap').querySelectorAll('[data-step]').forEach((b) => {
      b.addEventListener('click', () => {
        const step = Number(b.dataset.step);
        if (step === 0) leadsWeek = null;
        else {
          const next = weeks[at + step];
          if (next) leadsWeek = next.current ? null : next.start;
        }
        leadsDay = null;
        renderLeads();
      });
    });
    // Tapping a day shows its breakdown; tapping it again goes back to the
    // week. The table is brought into view (only as far as needed), since on
    // a phone it can sit below the fold.
    const showBreakdown = () => {
      const t = $('leadsBreakdown');
      if (t && typeof t.scrollIntoView === 'function') t.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    };
    $('leadsWrap').querySelectorAll('[data-day]').forEach((b) => {

  async function loadLeads(force) {
    try {
      const res = await fetch('/api/sheets?name=leads' + (force ? '&refresh=1' : ''));
      const p = await res.json();
      if (!res.ok && !p.weeks) throw new Error(p.error || `HTTP ${res.status}`);
      leads = p;
      renderLeads();
    } catch (err) {
      if (!leads) $('leadsWrap').innerHTML = `<div class="msg err">Could not load leads: ${esc(err.message)}</div>`;
