<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NomuHub CRM</title>
<link rel="icon" type="image/jpeg" href="/favicon.jpg">
<style>
  :root {
    --navy: #1b3358;
    --card: #21406b;
    --card-2: #1a3459;
    --line: #34517c;
    --yellow: #f2b233;
    --fill: #f5b935;
    --fill-full: #56b98a;
    --fill-empty: #45618c;
    --track: #16294a;
    --target: #ef8b3c;
    --danger: #e0483d;
    --danger-bg: #3a2230;
    --soldout: #e0791f;
    --info: #4d9de0;
    --info-bg: rgba(77,157,224,.10);
    --info-line: rgba(77,157,224,.4);
    --fresh: #3ddc84;
    --fresh-bright: #8bf0b8;
    --fresh-dim: #1e5c3d;
    --fresh-wash: rgba(61,220,132,.20);
    --fresh-ink: #062d18;
    --text: #ffffff;
    --text-2: #b7c5d8;
    --text-3: #8698b4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0; padding: 16px 20px 26px;
    background: var(--navy); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- header ---------- */
  .head { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; padding-bottom: 16px; }
  .brand {
    display: flex; align-items: center; gap: 9px;
    font-size: 25px; font-weight: 800; color: var(--yellow); white-space: nowrap;
  }
  .brand svg { width: 29px; height: 29px; flex: none; }
  .titles h1 { margin: 0; font-size: 16px; font-weight: 700; }
  .asof { margin-top: 2px; font-size: 11.5px; color: var(--text-2); }
  .asof b { color: var(--yellow); font-weight: 600; }
  .spacer { flex: 1; }

  .stats { display: flex; gap: 24px; align-items: baseline; }
  .stat .n { font-size: 26px; font-weight: 700; line-height: 1; }
  .stat .l { font-size: 10.5px; color: var(--text-3); margin-top: 4px; }

  /* Desktop: everything on the right stacks as one column under the stats —
     the stats + live dot + refresh on top, the tab groups directly beneath
     them, both right-aligned so the tabs read as "belonging to" that block
     rather than sitting off on their own at the left edge. */
  .headright { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .headright-top { display: flex; align-items: center; gap: 16px; }
  @media (max-width: 900px) {
    .headright, .headright-top { align-items: flex-start; }
  }

  .btn {
    background: transparent; color: var(--text-2); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 11px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .btn:hover { background: var(--card); color: #fff; }
  .btn[aria-pressed="true"] { background: var(--yellow); border-color: var(--yellow); color: var(--navy); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #58c493; flex: none; }
  .dot.warn { background: var(--target); }

  /* ---------- month sections ---------- */
  .month { margin-bottom: 22px; }
  .mhead {
    display: flex; align-items: center; gap: 12px;
    font-size: 11px; font-weight: 700; letter-spacing: .13em;
    color: var(--yellow); text-transform: uppercase; margin-bottom: 10px;
  }
  .mhead::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .mhead .c { color: var(--text-3); font-weight: 600; letter-spacing: .04em; }

  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); }

  /* ---------- trip card ---------- */
  .trip {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 13px 14px 12px; position: relative;
  }
  /* Sold out is good news, not a faded/broken state — no dimming, a clear
     green badge instead, same treatment as the red CANCELLED tag. */
  .trip.done { border-color: var(--soldout); }
  .tag.soldout { background: var(--soldout); color: var(--navy); }
  .trip.cancelled {
    background: var(--danger-bg); border-color: var(--danger);
  }
  .trip.cancelled .tname { text-decoration: line-through; color: #f0b8b3; }
  .trip.cancelled .tmeta, .trip.cancelled .wlab, .trip.cancelled .wdate { color: #c98d87; }
  .trip.cancelled .tnum .b { color: #f0b8b3 !important; }
  .trip.cancelled .fill, .trip.cancelled .wnum { background: var(--danger) !important; color: #f0b8b3 !important; }
  .trip.cancelled .track { background: #2a1a22; }

  .thead { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 3px; }
  .tname { font-size: 14.5px; font-weight: 700; line-height: 1.25; flex: 1; min-width: 0; }
  .tnum { text-align: right; line-height: 1; white-space: nowrap; }
  .tnum .b { font-size: 22px; font-weight: 700; }
  .tnum .b.full { color: var(--soldout); }
  .tnum .b.none { color: var(--text-3); }
  .tnum .s { font-size: 10px; color: var(--text-3); margin-top: 3px; }
  .tmeta { font-size: 11px; color: var(--text-3); margin-bottom: 11px; }

  .tag {
    display: inline-block; font-size: 8.5px; font-weight: 700; letter-spacing: .09em;
    padding: 2px 6px; border-radius: 3px; vertical-align: 2px; margin-left: 6px;
    background: var(--danger); color: #fff;
  }

  /* ---------- week meters ---------- */
  .weeks { display: flex; flex-direction: column; gap: 8px; }
  .wk { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; align-items: baseline; }
  .wlab { font-size: 11.5px; font-weight: 600; color: var(--text); }
  .wdate { font-size: 10.5px; color: var(--text-3); font-weight: 400; margin-left: 5px; }
  .wnum { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .wnum .of { color: var(--text-3); font-weight: 500; }
  .wnum.full { color: var(--soldout); }
  .wnum.none { color: var(--text-3); }

  .track {
    grid-column: 1 / -1; position: relative; height: 9px;
    background: var(--track); border-radius: 5px; overflow: hidden;
  }
  .fill { height: 100%; border-radius: 5px; background: var(--fill); transition: width .35s ease; }
  .fill.full { background: var(--soldout); }
  .fill.none { background: transparent; }
  /* where the goal sits, so a short track reads as "can't get there" */
  .tick { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--target); }
  .cap {
    grid-column: 1 / -1; font-size: 9.5px; color: var(--text-3); margin-top: -1px;
  }

  .single .wlab { display: none; }

  /* ---------- new booking, first 24h ---------- */
  /* The whole card lights up — a bright wash plus a glowing border — so a new
     booking reads as "look here" from across the room, not just up close. */
  .trip.fresh {
    background:
      linear-gradient(155deg, var(--fresh-wash), transparent 60%),
      var(--card);
    border-color: var(--fresh);
    box-shadow: 0 0 0 1px var(--fresh);
  }

  .newbadge {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--fresh); color: var(--fresh-ink);
    font-size: 9.5px; font-weight: 800; letter-spacing: .06em;
    padding: 3px 8px; border-radius: 20px; margin-left: 7px; vertical-align: 2px;
    white-space: nowrap;
  }
  .newbadge::before {
    content: ""; width: 5px; height: 5px; border-radius: 50%;
    background: var(--fresh-ink); animation: breathe 1.4s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .2 } }
  @media (prefers-reduced-motion: reduce) {
    .newbadge::before { animation: none; }
  }

  .wk.fresh { background: var(--fresh-wash); border-radius: 8px; margin: -6px -8px; padding: 6px 8px; }
  .wk.fresh .wlab, .wk.fresh .wdate { color: var(--fresh-bright); }
  .wpill {
    font-size: 9.5px; font-weight: 800; color: var(--fresh-ink);
    background: var(--fresh); border-radius: 20px;
    padding: 1px 7px; margin-left: 6px; white-space: nowrap;
  }
  .wk.fresh .fill { background: var(--fresh); }
  .wago { font-size: 9.5px; color: var(--fresh-bright); font-weight: 600; }

  .stat .n.fresh { color: var(--fresh); }

  /* ---------- report ---------- */
  .rtop { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 12px; margin-bottom: 14px; }
  @media (max-width: 900px) { .rtop { grid-template-columns: 1fr; } }

  .panel {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 16px 15px;
  }
  .ptitle {
    font-size: 10.5px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase;
    color: var(--text-3); margin-bottom: 10px;
  }

  .hero { display: flex; align-items: baseline; gap: 8px; }
  .hero .big { font-size: 44px; font-weight: 700; line-height: 1; }
  .hero .of { font-size: 17px; color: var(--text-3); font-weight: 600; }
  .hero.hit .big { color: var(--fill-full); }
  .hsub { font-size: 11.5px; color: var(--text-2); margin-top: 7px; }
  .hsub b { color: var(--yellow); font-weight: 600; }
  .htrack { height: 10px; background: var(--track); border-radius: 5px; margin-top: 11px; position: relative; overflow: hidden; }
  .hfill { height: 100%; border-radius: 5px; background: var(--fill); transition: width .35s ease; }
  .hfill.hit { background: var(--fill-full); }
  .pace { font-size: 11px; margin-top: 8px; font-weight: 600; }
  .pace.ok { color: var(--fill-full); }
  .pace.behind { color: var(--target); }

  /* day strip for the current week */
  .days { display: flex; gap: 6px; }
  .dcell { flex: 1 1 0; text-align: center; }
  .dbar-wrap { height: 78px; display: flex; align-items: flex-end; justify-content: center; }
  .dbar {
    width: 70%; min-height: 3px; background: var(--fill);
    border-radius: 4px 4px 0 0; transition: height .3s ease;
  }
  .dcell.today .dbar { background: var(--fresh); }
  .dcell.ahead .dbar { background: #2c4a75; }
  .dnum { font-size: 13px; font-weight: 700; margin-top: 6px; }
  .dcell.ahead .dnum, .dcell.zero .dnum { color: var(--text-3); }
  .dlab { font-size: 9.5px; color: var(--text-3); margin-top: 2px; }
  .dcell.today .dlab { color: var(--fresh); font-weight: 700; }

  /* main report chart */
  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .seg { display: inline-flex; background: var(--track); border-radius: 8px; padding: 2px; }
  .seg button {
    background: transparent; border: 0; color: var(--text-2); cursor: pointer;
    font: inherit; font-size: 11.5px; padding: 5px 11px; border-radius: 6px;
  }
  .seg button[aria-pressed="true"] { background: var(--yellow); color: var(--navy); font-weight: 700; }

  /* Header tab switcher — two named categories (what the data is about),
     each holding its own pill of tabs (which view of it you're on). The
     category label answers "Booking or Ads?" before the reader even needs
     the tab names. */
  .segrow { display: flex; align-items: center; gap: 10px; }
  .seggroup { display: flex; align-items: center; gap: 7px; }
  .segcat {
    font-size: 9px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
    color: var(--text-3); white-space: nowrap;
  }
  .segdiv { width: 1px; height: 20px; background: var(--line); }
  @media (max-width: 980px) {
    .segrow { flex-wrap: wrap; row-gap: 6px; }
    .segdiv { display: none; }
  }
  .fnote { font-size: 11px; color: var(--text-3); margin-left: auto; }
  .tzbadge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(242,178,51,.14); border: 1px solid rgba(242,178,51,.35);
    color: var(--yellow); font-size: 12px; font-weight: 600;
    padding: 6px 12px; border-radius: 20px; margin-bottom: 14px;
  }
  .tzbadge b { font-weight: 800; }

  .chart { position: relative; height: 230px; padding-left: 30px; }
  .crule { position: absolute; left: 30px; right: 0; height: 1px; background: rgba(255,255,255,.07); }
  .crule .ct {
    position: absolute; left: -30px; top: -8px; width: 24px; text-align: right;
    font-size: 10.5px; color: var(--text-3); font-variant-numeric: tabular-nums;
  }
  .ctarget { position: absolute; left: 30px; right: 0; height: 2px; background: var(--target); }
  .ctflag {
    position: absolute; right: 0; top: -17px; font-size: 9px; font-weight: 700;
    letter-spacing: .07em; color: var(--target);
  }
  .cbars { position: relative; display: flex; height: 100%; gap: 10px; }
  .cslot {
    flex: 1 1 0; height: 100%; display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center; position: relative;
  }
  .cval { font-size: 13px; font-weight: 700; margin-bottom: 5px; }
  .cslot.zero .cval { color: var(--text-3); }
  .cslot.hit .cval { color: var(--fill-full); }
  .cbar {
    flex: 0 0 auto; width: 100%; max-width: 54px; min-height: 3px;
    background: var(--fill); border-radius: 5px 5px 0 0; transition: height .3s ease;
  }
  .cslot.hit .cbar { background: var(--fill-full); }
  /* The bar currently driving the hero/KPI panel above — a ring, not a color
     swap, so it stays legible whether the bar is also .zero, .hit, or .partial. */
  .cslot.selected .cbar { box-shadow: 0 0 0 2px var(--yellow); }
  .cslot.selected .cval { color: var(--yellow); }
  /* the in-progress period is drawn hollow so a partial week never reads as a miss */
  .cslot.partial .cbar {
    background: repeating-linear-gradient(135deg, var(--fill) 0 6px, rgba(245,185,53,.35) 6px 12px);
  }
  .cslot .charter {
    width: 100%; max-width: 54px; min-height: 0;
    background: #4d6a94; border-radius: 5px 5px 0 0; transition: height .3s ease;
  }
  .clab { font-size: 10px; color: var(--text-3); margin-top: 8px; text-align: center; line-height: 1.3; }
  .cslot.partial .clab { color: var(--yellow); }
  .caxis { display: flex; gap: 10px; padding-left: 30px; }
  .caxis > div { flex: 1 1 0; text-align: center; }

  .rlegend { display: flex; gap: 15px; flex-wrap: wrap; font-size: 10.5px; color: var(--text-3); margin-top: 12px; }
  .rlegend i { display: inline-block; width: 16px; height: 8px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }

  /* ---------- period navigation (This week hero panel) ---------- */
  .pnav { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .pnav .ptitle { flex: 1; }
  .navbtn {
    background: transparent; border: 1px solid var(--line); color: var(--text-2);
    width: 24px; height: 24px; border-radius: 6px; font-size: 14px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none;
  }
  .navbtn:hover:not(:disabled) { background: var(--card-2); color: #fff; }
  .navbtn:disabled { opacity: .3; cursor: default; }
  .navbtn-today {
    width: auto; padding: 0 9px; font-size: 10.5px; font-weight: 700;
  }

  /* ---------- simple 3-stat summary (Last 24h / Last week / Weekly target) ---------- */
  .skpi-panel { display: flex; gap: 0; }
  .skpi {
    flex: 1; text-align: center; padding: 4px 12px;
    border-right: 1px solid var(--line);
  }
  .skpi:last-child { border-right: 0; }
  .skpi-n { font-size: 32px; font-weight: 700; line-height: 1; color: #fff; }
  .skpi-l { font-size: 11.5px; color: var(--text-3); margin-top: 6px; }
  .skpi-sub { font-size: 10px; color: #6c7f9c; margin-top: 3px; }

  /* A tile earns a colour only when a published benchmark says the number is
     out of the usual range — never for the metric merely existing. The word
     underneath always carries the same meaning as the colour, so the signal
     survives colour-blindness and a black-and-white print alike. */
  .skpi-good .skpi-n  { color: var(--fresh); }
  .skpi-watch .skpi-n { color: var(--target); }
  .skpi-bad .skpi-n   { color: var(--danger); }
  .skpi-good .skpi-sub  { color: var(--fresh); }
  .skpi-watch .skpi-sub { color: var(--target); }
  .skpi-bad .skpi-sub   { color: var(--danger); }

  /* ---------- campaigns (Meta Ads) ---------- */

  /* Six tiles across on a wall display, folding to three then two as the
     window narrows — the KPI block is the part people read from a distance. */
  .mkpi { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; }
  .mkpi .skpi { border-bottom: 0; }
  @media (max-width: 1100px) { .mkpi { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 620px)  { .mkpi { grid-template-columns: repeat(2, 1fr); } }

  /* Wide tables scroll inside their own panel rather than pushing the page. */
  .tscroll { overflow-x: auto; }
  .ctable { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }
  .ctable th {
    text-align: right; font-weight: 600; color: var(--text-3);
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
    padding: 6px 10px; border-bottom: 1px solid var(--line);
  }
  .ctable th:first-child, .ctable td:first-child { text-align: left; }
  .ctable td { text-align: right; padding: 7px 10px; border-bottom: 1px solid rgba(52,81,124,.35); color: var(--text-2); }
  .ctable tbody tr:hover td { background: rgba(52,81,124,.18); }
  .ctable td.cname { color: #fff; font-weight: 600; white-space: normal; min-width: 190px; }
  .ctable tfoot td {
    border-top: 1px solid var(--line); border-bottom: 0;
    font-weight: 700; color: #fff; padding-top: 9px;
  }
  .ctable .num { font-variant-numeric: tabular-nums; }
  /* Same benchmark meaning as the tiles, applied per campaign so a single
     under-performing line is findable without reading every number. */
  .ctable td.cell-good  { color: var(--fresh); font-weight: 600; }
  .ctable td.cell-watch { color: var(--target); font-weight: 600; }
  .ctable td.cell-bad   { color: var(--danger); font-weight: 700; }

  /* Status and objective read as quiet labels, not as alarm colors — the
     booking board already owns green/yellow/red for capacity meaning. */
  .cpill {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 10px; font-weight: 600; letter-spacing: .02em;
  }
  .cpill.on  { background: rgba(61,220,132,.16); color: var(--fresh); }
  .cpill.off { background: rgba(134,152,180,.14); color: var(--text-3); }
  .cobj { font-size: 11px; color: var(--text-3); }
  /* Objective colour repeats here so the tables and the charts agree on
     identity — the dot is the same hue the campaign wears in every chart. */
  .odot { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }

  /* Share-of-spend bar sits behind the number so the table stays scannable. */
  .sharecell { position: relative; min-width: 90px; }
  .sharebar {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    height: 14px; border-radius: 3px; background: rgba(245,185,53,.22);
  }
  .sharecell span { position: relative; }

  /* ---------- charts (Meta Ads) ----------
     Marks sit on --track, not --card: the panel blue is too light to clear 3:1
     against the categorical hues, the inset track clears it for all but one
     slot, and that slot is covered by the direct labels + table view below. */

  .vz { background: var(--track); border-radius: 8px; padding: 14px 14px 8px; }
  .vz-tall { min-height: 150px; }

  /* Plot area carries the gridlines; columns sit on top of them. */
  .vzplot { position: relative; height: 150px; }
  .vzgrid { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; }
  .vzgrid i { display: block; border-top: 1px solid rgba(134,152,180,.13); }
  .vzcols { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 2px; }
  .vzcol { flex: 1; display: flex; align-items: flex-end; justify-content: center; height: 100%; min-width: 0; }

  /* 4px rounded data-end, anchored to the baseline. */
  .vzbar {
    width: 100%; max-width: 46px; border-radius: 4px 4px 0 0;
    background: var(--fill); cursor: pointer; transition: filter .12s;
    min-height: 2px;
  }
  .vzcol:hover .vzbar { filter: brightness(1.18); }
  .vzbar.dim { background: var(--fill-empty); }

  .vzaxis { display: flex; gap: 2px; margin-top: 7px; }
  .vzaxis span {
    flex: 1; text-align: center; font-size: 9.5px; color: var(--text-3);
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Year boundaries in the all-time timeline read as separators, not as data. */
  .vzaxis span.yr { color: var(--text-2); font-weight: 700; }

  .vzscale { display: flex; flex-direction: column; justify-content: space-between; height: 150px;
    font-size: 9.5px; color: var(--text-3); text-align: right; padding-right: 8px; min-width: 44px; }
  .vzwrap { display: flex; }
  .vzwrap > .vzplotwrap { flex: 1; min-width: 0; }

  /* Horizontal bars — the form for long campaign names. */
  .vzrows { display: flex; flex-direction: column; gap: 7px; }
  .vzrow { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; align-items: center; }
  .vzrow .vzlabel { font-size: 11.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vzrow .vzval { font-size: 11.5px; color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }
  .vzrow .vztrack { grid-column: 1 / -1; height: 9px; background: rgba(134,152,180,.10); border-radius: 4px; overflow: hidden; }
  .vzrow .vzfill { height: 100%; border-radius: 4px; background: var(--fill); cursor: pointer; min-width: 2px; }
  .vzrow:hover .vzfill { filter: brightness(1.18); }

  /* Part-to-whole. 2px surface gap between segments, per the mark spec. */
  .vzstack { display: flex; gap: 2px; height: 26px; border-radius: 5px; overflow: hidden; }
  .vzseg { cursor: pointer; min-width: 3px; transition: filter .12s; }
  .vzseg:hover { filter: brightness(1.18); }

  /* line chart */
  .lwrap { display: flex; }
  .lscale { display: flex; flex-direction: column; justify-content: space-between; height: 132px;
    font-size: 9.5px; color: var(--text-3); text-align: right; padding-right: 8px; min-width: 42px; }
  .lplot { flex: 1; min-width: 0; }
  .lplot svg { display: block; width: 100%; height: 132px; }
  .lhit { cursor: pointer; }
  .lhit:hover { fill: rgba(255,255,255,.045); }
  .laxis { display: flex; margin-top: 6px; }
  .laxis span { flex: 1; text-align: center; font-size: 9.5px; color: var(--text-3);
    min-width: 0; overflow: hidden; white-space: nowrap; }

  /* Small multiples: four trends read as one row, same shape, different measure. */
  .trendgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (max-width: 980px) { .trendgrid { grid-template-columns: 1fr; } }
  .trendhead { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .trendhead .th-l { font-size: 10.5px; font-weight: 700; letter-spacing: .09em;
    text-transform: uppercase; color: var(--text-3); }
  .trendhead .th-n { margin-left: auto; font-size: 17px; font-weight: 700; color: #fff;
    font-variant-numeric: tabular-nums; }
  .trendhead .th-d { font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Direction of change, coloured by whether it is good — which for a cost
     metric is the opposite of "up". The arrow and the sign carry it too. */
  .d-up   { color: var(--fresh); }
  .d-down { color: var(--danger); }
  .d-flat { color: var(--text-3); }

  /* weekly triage */
  .sigrow {
    display: grid; grid-template-columns: minmax(0,1.6fr) 84px repeat(4, minmax(0,1fr)) minmax(0,1.3fr);
    gap: 10px; align-items: center; padding: 9px 2px; font-size: 12px;
  }
  .sigrow + .sigrow { border-top: 1px solid rgba(52,81,124,.3); }
  .sighead { font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--text-3); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .sig-name { color: #fff; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sig-sub { font-size: 10.5px; color: var(--text-3); margin-top: 2px; }
  .sig-num { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }
  .sig-num b { color: #fff; }
  .sig-why { font-size: 11px; color: var(--text-3); }
  .sigpill {
    display: inline-block; padding: 3px 9px; border-radius: 999px;
    font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  }
  .sig-fix   { background: rgba(224,72,61,.16); color: #ff9d92; }
  .sig-watch { background: rgba(239,139,60,.16); color: var(--target); }
  .sig-scale { background: rgba(61,220,132,.16); color: var(--fresh); }
  .sig-new   { background: rgba(77,157,224,.16); color: var(--info); }
  .sig-idle  { background: rgba(134,152,180,.13); color: var(--text-3); }
  @media (max-width: 980px) {
    .sigrow { grid-template-columns: 1fr auto; row-gap: 5px; }
    .sig-why { grid-column: 1 / -1; }
    .sighead { display: none; }
  }

  .vzlegend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; font-size: 11px; color: var(--text-2); }
  .vzlegend span { display: inline-flex; align-items: center; gap: 6px; }
  .vzlegend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .vzlegend b { color: #fff; font-variant-numeric: tabular-nums; font-weight: 600; }

  /* Hero figure — the one number each tab leads with. */
  .vhero { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .vhero .vh-n { font-size: 46px; font-weight: 700; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; }
  .vhero .vh-c { font-size: 15px; color: var(--yellow); font-weight: 700; }
  .vhero .vh-s { font-size: 12px; color: var(--text-3); }

  #campaignsWrap > .panel, #historyWrap > .panel, #campaignsWrap > .vgrid2, #historyWrap > .vgrid2 { margin-bottom: 12px; }
  .vgrid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 900px) { .vgrid2 { grid-template-columns: 1fr; } }

  /* History: one collapsible block per year. */
  .yrhead {
    display: flex; align-items: center; gap: 12px; width: 100%; cursor: pointer;
    background: none; border: 0; padding: 4px 0; text-align: left; color: inherit; font: inherit;
  }
  .yrhead .yr-n { font-size: 20px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
  .yrhead .yr-s { font-size: 11.5px; color: var(--text-3); }
  .yrhead .yr-sp { margin-left: auto; font-size: 15px; font-weight: 700; color: var(--yellow); font-variant-numeric: tabular-nums; }
  .yrhead .yr-ar { color: var(--text-3); font-size: 12px; transition: transform .15s; }
  .yrhead[aria-expanded="true"] .yr-ar { transform: rotate(90deg); }
  .yrbody { margin-top: 12px; }
  .yrpill {
    display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 999px;
    background: rgba(77,157,224,.14); color: var(--info); font-size: 9.5px; font-weight: 600;
  }

  /* ---------- SA media plan ----------
     A plan is read as a schedule, so it's laid out as one: month, then the
     flights inside it. Deliberately plainer than the live tabs — there's no
     measurement here to interrogate, just what was decided. */

  .plan-split { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .plan-chip {
    flex: 1; min-width: 150px; background: var(--track); border-radius: 8px;
    padding: 11px 14px; border-left: 3px solid var(--fill);
  }
  .plan-chip .pc-n { font-size: 21px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
  .plan-chip .pc-l { font-size: 11px; color: var(--text-2); margin-top: 3px; font-weight: 600; }
  .plan-chip .pc-s { font-size: 10.5px; color: var(--text-3); margin-top: 2px; }

  .plan-month { margin-bottom: 18px; }
  .plan-month:last-child { margin-bottom: 0; }
  .pm-head {
    display: flex; align-items: baseline; gap: 10px;
    padding-bottom: 7px; margin-bottom: 9px; border-bottom: 1px solid var(--line);
  }
  .pm-name { font-size: 14px; font-weight: 700; color: var(--yellow); letter-spacing: .03em; }
  .pm-meta { font-size: 11px; color: var(--text-3); }
  .pm-total { margin-left: auto; font-size: 13px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }

  /* trip | dates | est. messages | cost each | budget */
  .pflight {
    display: grid; grid-template-columns: minmax(0,1.7fr) 100px minmax(0,1fr) 78px 78px;
    gap: 12px; align-items: center; padding: 7px 2px; font-size: 12.5px;
  }
  .pflight + .pflight { border-top: 1px solid rgba(52,81,124,.3); }
  .pf-trip { color: #fff; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pf-date { color: var(--text-3); font-size: 11.5px; white-space: nowrap; }
  .pf-num  { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); white-space: nowrap; }
  .pf-num b { color: #fff; font-weight: 700; }

  /* Budgets are a flat $750 across every trip, so the bar tracks the estimate
     that actually varies — expected messages — not the budget. */
  .pf-est { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .pf-track { flex: 1; height: 7px; background: rgba(134,152,180,.12); border-radius: 4px; overflow: hidden; min-width: 30px; }
  .pf-fill { height: 100%; background: var(--fill); border-radius: 4px; }
  .pf-estn { font-size: 11.5px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

  @media (max-width: 780px) {
    .pflight { grid-template-columns: 1fr auto; row-gap: 4px; }
    .pf-est { grid-column: 1 / -1; }
  }

  /* Always-on rows sit inside each month, dimmed so they read as recurring
     context rather than as another trip launching that month. */
  .pflight.pf-always .pf-trip { color: var(--text-2); font-weight: 500; }
  .pflight.pf-always .pf-num, .pflight.pf-always .pf-estn { color: var(--text-3); }
  .pflight.pf-always .pf-num b { color: var(--text-2); }
  .pf-tag {
    display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 999px;
    background: rgba(77,157,224,.14); color: var(--info);
    font-size: 9px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  }
  .pm-foot {
    display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 9px; padding-top: 8px;
    border-top: 1px dashed rgba(134,152,180,.25);
    font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums;
  }
  .pm-foot-tot { color: var(--yellow); font-weight: 700; margin-left: auto; }

  .plan-foot { font-size: 11.5px; color: var(--text-3); line-height: 1.6; }
  .plan-foot b { color: var(--text-2); }

  /* ---------- notes ---------- */

  .notes { margin-top: 6px; font-size: 11.5px; color: var(--text-3); line-height: 1.6; }
  .notes b { color: var(--target); font-weight: 600; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11px; color: var(--text-3); margin-bottom: 16px; }
  .legend i { display: inline-block; width: 20px; height: 8px; border-radius: 4px; vertical-align: -1px; margin-right: 5px; }

  /* Manual notices from Operations — a distinct blue so it never reads as a
     status color (green/yellow/red already mean sold out, new, cancelled).
     Bold on purpose: this has to win against a room full of trip cards. */
  .announce {
    display: flex; gap: 14px; align-items: flex-start;
    background: #ffffff;
    border: 1.5px solid var(--info);
    border-left: 6px solid var(--info);
    border-radius: 10px; padding: 16px 20px; margin-bottom: 18px;
    box-shadow: 0 0 0 1px rgba(77,157,224,.15), 0 6px 20px rgba(77,157,224,.18);
  }
  .announce-icon { font-size: 26px; line-height: 1.2; flex: none; }
  /* Dark ink on the white card — the opposite pairing from the rest of the
     (light-text-on-navy) page, so this needs its own colors, not the page's tokens. */
  .announce-title {
    font-weight: 800; font-size: 16.5px; color: #16294a; margin-bottom: 5px;
    letter-spacing: .01em;
  }
  .announce-body { font-size: 13.5px; color: #3d4a5c; line-height: 1.6; }

  /* Nothing to announce shouldn't shout. Same slot so the layout doesn't jump,
     but recedes into the page instead of demanding attention. */
  .announce.empty {
    background: transparent;
    border: 1px dashed var(--line);
    border-left: 1px dashed var(--line);
    box-shadow: none;
    padding: 11px 16px;
    align-items: center;
  }
  .announce.empty .announce-icon { font-size: 15px; opacity: .5; }
  .announce.empty .announce-title {
    font-weight: 600; font-size: 12.5px; color: var(--text-3); margin-bottom: 0;
  }

  [hidden] { display: none !important; }
  .msg { padding: 24px 4px; color: var(--text-2); font-size: 14px; }
  .msg.err { color: #ffbfa8; }
  /* Not an error — the numbers are real, one of them just needs a human eye. */
  .msg.warn {
    color: #ffd9a3; background: rgba(239,139,60,.10);
    border: 1px solid rgba(239,139,60,.35); border-radius: 8px;
    padding: 10px 13px; font-size: 12px; line-height: 1.55; margin-bottom: 12px;
  }
  .msg.warn b { color: var(--target); }
  .flag {
    display: inline-block; min-width: 15px; padding: 0 4px; border-radius: 4px;
    background: rgba(239,139,60,.20); color: var(--target);
    font-size: 10px; font-weight: 700; text-align: center; cursor: help;
  }

  /* ---------- shared tooltip (report bars + day cells) ---------- */
  .tip {
    position: fixed; z-index: 40; pointer-events: none; opacity: 0;
    background: #0d1c33; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font-size: 12px; line-height: 1.5; color: var(--text);
    box-shadow: 0 10px 26px rgba(0,0,0,.45); max-width: 280px; transition: opacity .12s;
  }
  .tip.on { opacity: 1; }
  .tip .tt { font-weight: 700; color: var(--yellow); margin-bottom: 5px; }
  .tip .tk { color: var(--text-3); }
  .tip .trow { display: flex; justify-content: space-between; gap: 10px; padding: 1px 0; }
  .tip .trow b { font-variant-numeric: tabular-nums; }
  .tip .more { color: var(--text-3); font-size: 11px; margin-top: 3px; }
  .tip .hint { color: var(--text-3); font-size: 10.5px; margin-top: 6px; border-top: 1px solid var(--line); padding-top: 6px; }

  /* Listeners bind to the bar shapes themselves, not the full-height column,
     so hovering empty space above a short bar doesn't trigger the tooltip. */
  .cbar, .dbar { cursor: pointer; }

  /* ---------- click popup: full breakdown for one period ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50; background: rgba(10,18,32,.6);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal {
    position: relative; width: 100%; max-width: 480px; max-height: 80vh; overflow-y: auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px 22px 18px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .modal-close {
    position: absolute; top: 12px; right: 14px; background: transparent; border: 0;
    color: var(--text-3); font-size: 22px; line-height: 1; cursor: pointer; padding: 4px;
  }
  .modal-close:hover { color: var(--text); }
  .mtitle { font-size: 16px; font-weight: 700; margin: 0 0 3px; padding-right: 20px; }
  .msub { font-size: 12px; color: var(--text-2); margin-bottom: 16px; }
  .mrow { padding: 10px 0; border-bottom: 1px solid #2a4568; }
  .mrow:last-child { border-bottom: 0; }
  .mrow-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .mtrip { font-weight: 700; font-size: 13.5px; }
  .mcount { font-weight: 700; font-size: 14px; color: var(--yellow); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mcount.charter { color: #8fb3e0; }
  .mwhen { font-size: 11px; color: var(--text-3); margin-top: 3px; }
  .mempty { color: var(--text-3); font-size: 13px; padding: 12px 0; }
  .mcancel { color: var(--danger); font-size: 11px; margin-top: 2px; }
</style>
</head>
<body>
  <div class="head">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16,13c1.66,0,2.99-1.34,2.99-3S17.66,7,16,7c-1.66,0-3,1.34-3,3S14.34,13,16,13z M8,13c1.66,0,2.99-1.34,2.99-3S9.66,7,8,7C6.34,7,5,8.34,5,10S6.34,13,8,13z M8,14.9c-2.03,0-6,1.02-6,3.05L2,20h6h2v-1.83c0-1.94,2.09-3.28,4-3.28c0.13,0,0.26,0.01,0.39,0.02C12.15,15.62,9.28,14.9,8,14.9z M16,14.9c-0.31,0-0.59,0.02-0.85,0.05C15.7,15.53,16,16.62,16,17.17V20h6v-2.05C22,15.92,18.03,14.9,16,14.9z"/></svg>
      NomuHub CRM
    </div>
    <div class="titles">
      <h1 id="range">Booking Data</h1>
      <div class="asof">As of <b id="asof">—</b></div>
    </div>
    <div class="spacer"></div>
    <div class="headright">
      <div class="headright-top">
        <div class="stats">
          <div class="stat" id="sNewWrap"><div class="n" id="sNew">—</div><div class="l">New in 24h</div></div>
          <div class="stat"><div class="n" id="sLastWeek">—</div><div class="l">Last Week</div></div>
          <div class="stat"><div class="n" id="sWeeklyTarget">—</div><div class="l">Weekly Target</div></div>
        </div>
        <span class="dot" id="dot" title="Live"></span>
        <button class="btn" id="refreshBtn">Refresh</button>
      </div>
      <div class="segrow" id="viewSeg">
        <div class="seggroup">
          <span class="segcat">Booking</span>
          <div class="seg">
            <button data-view="board" aria-pressed="true">Dashboard</button>
            <button data-view="report" aria-pressed="false">Report</button>
          </div>
        </div>
        <div class="segdiv"></div>
        <div class="seggroup">
          <span class="segcat">Ad Campaign</span>
          <div class="seg">
            <button data-view="campaigns" aria-pressed="false">Campaigns</button>
            <button data-view="history" aria-pressed="false">History</button>
            <button data-view="plan" aria-pressed="false">SA Media Plan</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="announce" id="announce" hidden>
    <div class="announce-icon" id="announceIcon">📢</div>
    <div>
      <div class="announce-title" id="announceTitle"></div>
      <div class="announce-body" id="announceBody"></div>
    </div>
  </div>

  <div class="legend" id="legend" hidden>
    <span><i style="background:#f5b935"></i>Booking</span>
    <span><i style="background:var(--soldout)"></i>Sold out</span>
    <span><i style="background:#16294a;border:1px solid #34517c"></i>Empty</span>
    <span><i style="background:#ef8b3c;width:3px"></i>Target marker</span>
    <span><i style="background:var(--fresh)"></i>New booking (last 24h)</span>
  </div>

  <div id="board"></div>
  <div id="reportWrap" hidden></div>
  <div id="campaignsWrap" hidden></div>
  <div id="historyWrap" hidden></div>
  <div id="planWrap" hidden></div>
  <div class="notes" id="notes"></div>
  <div class="msg" id="msg">Loading booking data…</div>
  <div class="tip" id="tip" role="status"></div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="Close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

<script>
  const POLL_MS = 30000;   // server caches upstream calls, so this stays cheap
  const $ = (id) => document.getElementById(id);
  const esc = (s) => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
  // esc() goes through textContent, which escapes & < > but leaves quotes
  // alone — fine for text nodes, silently broken inside an attribute, where
  // the first embedded " ends the value early. Anything interpolated into an
  // attribute has to come through here instead.
  const attr = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  let view = 'board';   // 'board' | 'report'
  let latest = null;

  // Banner content comes from Vercel env vars via /api/announcement, so it can
  // be changed without touching code. Null means nothing is set, which renders
  // a quiet "no current announcement" placeholder rather than vanishing — a
  // disappearing element reads as broken, and keeps the layout from jumping.
  let announcement = null;
  async function loadAnnouncement() {
    try {
      const res = await fetch('/api/announcement');
      const a = await res.json();
      announcement = (a && (a.title || a.body)) ? a : null;
    } catch (e) {
      announcement = null;
    }
    applyAnnouncement();
  }
  function applyAnnouncement() {
    const has = !!announcement;
    const el = $('announce');
    el.classList.toggle('empty', !has);
    $('announceIcon').textContent = has ? '📢' : '🔕';
    $('announceTitle').textContent = has ? announcement.title : 'No current announcement';
    $('announceBody').textContent = has ? announcement.body : '';
    $('announceBody').hidden = !has;
    el.hidden = view !== 'board';
  }

  // Which tab and which Report period the screen was on — restored on load
  // so a refresh (or the wall display losing power overnight) doesn't reset
  // whoever's looking at it back to the very beginning.
  const STORAGE_KEY = 'bookingProgressView';
  function saveViewState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        view, rGran, rCount, selectedWeekStart, selectedMonthStart,
      }));
    } catch (e) { /* storage unavailable (private mode, etc.) — just skip persisting */ }
  }
  function loadViewState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const s = JSON.parse(raw);
      // A browser that saved state before the Table tab was removed could
      // still have "table" stored — fall back to the dashboard rather than
      // restoring a view that no longer exists.
      if (['board', 'report', 'campaigns', 'history', 'plan'].includes(s.view)) view = s.view;
      if (s.rGran) rGran = s.rGran;
      if (s.rCount) rCount = s.rCount;
      if (s.selectedWeekStart) selectedWeekStart = s.selectedWeekStart;
      if (s.selectedMonthStart) selectedMonthStart = s.selectedMonthStart;
    } catch (e) { /* corrupt or blocked storage — fall back to defaults */ }
  }

  const D = (iso) => new Date(iso + 'T00:00:00Z');
  const day = (iso) => D(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
  const range = (a, b) => day(a) + ' – ' + day(b);
  const monthKey = (iso) => iso.slice(0, 7);
  const monthName = (iso) => D(iso).toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
  const fmtStamp = (iso) => {
    const d = new Date(iso);
    return isNaN(d) ? '—' : d.toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
      + ', ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  };

  // "Week 2 (06 Sep - 12 Sep)" -> "Week 2"; the dates are shown separately.
  const weekName = (label) => String(label || '').replace(/\s*\(.*\)\s*$/, '').trim() || 'Week';

  // A booking stays highlighted for exactly 24h from the moment it was placed:
  // one taken at 2pm stops being new at 2pm the next day. Computed in the browser
  // against live time, so it expires on the minute rather than on the poll.
  const NEW_MS = 24 * 60 * 60 * 1000;
  // Lets the highlight be seen on demand, since real bookings are days old.
  const PREVIEW = new URLSearchParams(location.search).get('preview') === 'new';

  function freshness(week) {
    const now = Date.now();
    let count = 0;
    let newest = 0;
    for (const r of week.recent || []) {
      const at = Date.parse(r.at);
      if (!Number.isFinite(at)) continue;
      if (now - at < NEW_MS) {
        count += r.count || 0;
        if (at > newest) newest = at;
      }
    }
    return { count, newest };
  }

  function ago(ms) {
    const mins = Math.floor((Date.now() - ms) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    return hrs + 'h ago';
  }

  function meter(w, target) {
    // The track runs to whichever is larger, so a capacity below target visibly
    // falls short of the marker instead of quietly rescaling to look full.
    const scale = Math.max(target, w.capacity || 0, w.booked, 1);
    const pct = Math.min(100, (w.booked / scale) * 100);
    const soldOut = w.capacity != null && w.booked >= w.capacity && w.booked > 0;
    const state = w.booked === 0 ? 'none' : soldOut ? 'full' : '';
    const tickPct = Math.min(100, (target / scale) * 100);
    const f = freshness(w);

    return `
      <div class="wk ${f.count ? 'fresh' : ''}">
        <div>
          <span class="wlab">${esc(weekName(w.label))}</span><span class="wdate">${esc(range(w.start, w.end))}</span>
          ${f.count ? `<span class="wpill">+${f.count}</span>` : ''}
        </div>
        <div class="wnum ${state}">${w.booked}<span class="of"> / ${w.capacity ?? target}</span></div>
        <div class="track">
          <div class="fill ${state}" style="width:${pct}%"></div>
          <div class="tick" style="left:calc(${tickPct}% - 1px)" title="Target ${target}"></div>
        </div>
        ${f.count ? `<div class="cap wago">New booking ${esc(ago(f.newest))}</div>` : ''}
      </div>`;
  }

  function tripCard(t, target) {
    const soldOut = t.totalCapacity != null && t.totalBooked >= t.totalCapacity && t.totalBooked > 0;
    const newCount = t.weeks.reduce((sum, w) => sum + freshness(w).count, 0);
    const cls = [
      t.cancelled ? 'cancelled' : '',
      soldOut ? 'done' : '',
      newCount && !t.cancelled ? 'fresh' : '',
    ].filter(Boolean).join(' ');
    const numCls = t.totalBooked === 0 ? 'none' : soldOut ? 'full' : '';
    const many = t.weeks.length > 1;

    return `
      <div class="trip ${cls}">
        <div class="thead">
          <div class="tname">${esc(t.name)}${t.cancelled ? '<span class="tag">CANCELLED</span>' : ''}${
            soldOut && !t.cancelled ? '<span class="tag soldout">SOLD OUT</span>' : ''}${
            newCount && !t.cancelled
              ? `<span class="newbadge">${newCount} NEW</span>` : ''}</div>
          <div class="tnum">
            <div class="b ${numCls}">${t.totalBooked}</div>
            <div class="s">booked</div>
          </div>
        </div>
        <div class="tmeta">${esc(range(t.start, t.end))} · ${t.weeks.length} ${many ? 'weeks' : 'week'}${
          t.cancelledCount ? ' · ' + t.cancelledCount + ' cancelled' : ''}</div>
        <div class="weeks ${many ? '' : 'single'}">
          ${t.weeks.map((w) => meter(w, target)).join('')}
        </div>
      </div>`;
  }

  function render(p) {
    const trips = p.trips || [];
    if (!trips.length) {
      $('msg').textContent = 'No departures between today and ' + p.seasonEnd + '.';
      $('msg').hidden = view !== 'board'; $('board').hidden = true; $('legend').hidden = true; $('announce').hidden = true;
      return;
    }
    $('msg').hidden = true;
    // The board polls every 30s; without this it would pop back over the
    // Report or Table view on the next refresh.
    $('board').hidden = view !== 'board';
    $('legend').hidden = view !== 'board';
    applyAnnouncement();

    // group cards under the month they depart in, keeping date order
    const months = [];
    for (const t of trips) {
      const key = monthKey(t.start);
      const last = months[months.length - 1];
      if (last && last.key === key) last.trips.push(t);
      else months.push({ key, label: monthName(t.start), trips: [t] });
    }

    $('board').innerHTML = months.map((m) => {
      const booked = m.trips.reduce((s, t) => s + t.totalBooked, 0);
      return `<section class="month">
        <div class="mhead">${esc(m.label)}
          <span class="c">${m.trips.length} ${m.trips.length > 1 ? 'departures' : 'departure'} · ${booked} booked</span>
        </div>
        <div class="grid">${m.trips.map((t) => tripCard(t, p.target)).join('')}</div>
      </section>`;
    }).join('');

    // The header's New in 24h / Last Week / Weekly Target trio is now sourced
    // from the Report data (see applyHeaderStats), so it's identical whether
    // you're looking at the Dashboard or the Report tab — not a second,
    // slightly-different count computed from the board's own data.

    $('notes').innerHTML = (p.warnings || []).length
      ? '<b>Needs attention in WeTravel:</b> ' + p.warnings.map((w) => esc(w.title) + ' — ' + esc(w.issue)).join(' · ')
      : '';
  }

  // ?preview=new backdates a couple of bookings so the highlight can be judged
  // on demand. It only ever runs from that URL, never on the live board.
  function previewNew(p) {
    const targets = (p.trips || []).filter((t) => !t.cancelled).slice(0, 2);
    targets.forEach((t, i) => {
      const week = t.weeks[t.weeks.length > 1 ? 1 : 0];
      if (!week) return;
      week.recent = [{ at: new Date(Date.now() - (i ? 5 * 3600e3 : 12 * 60e3)).toISOString(), count: i ? 1 : 2 }];
    });
  }

  async function load(force) {
    try {
      const res = await fetch('/api/trips-progress' + (force ? '?refresh=1' : ''));
      const p = await res.json();
      if (!res.ok) throw new Error(p.error || 'request failed');

      if (PREVIEW) previewNew(p);
      latest = p;
      $('asof').textContent = fmtStamp(p.asOf);
      $('range').textContent = D(p.today).toLocaleDateString('en-US', { month: 'long', day: 'numeric', timeZone: 'UTC' })
        + ' to ' + D(p.seasonEnd).toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
      $('dot').className = 'dot' + (p.stale ? ' warn' : '');
      $('dot').title = p.stale ? 'Showing last known data' : 'Live';
      render(p);
    } catch (err) {
      if (!latest) {
        $('msg').textContent = 'Could not load booking data: ' + err.message;
        $('msg').className = 'msg err'; $('msg').hidden = view !== 'board'; $('board').hidden = true;
      }
      $('dot').className = 'dot warn';
    }
  }

  /* ================= REPORT ================= */

  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const RANGES = { daily: [14, 30], weekly: [4, 8, 12], monthly: [6, 12] };

  let report = null;
  let rGran = 'weekly';      // Muatasam's headline number is the weekly one
  let rCount = 4;            // "actual weekly for last 4 weeks"
  // Corporate/institutional charters (KUMSA, CISCO, University of Sharjah)
  // are always excluded from the target — one charter can book a dozen seats
  // in a single week and make it look like a retail target was hit when it
  // wasn't, so there's no toggle to turn this back on.
  const rCharters = false;

  // The week/month the hero panel, daily strip, and KPI panel are showing.
  // null means "not yet initialized" — renderReport() sets it to the real
  // current period on first run. Clicking a bar or a nav arrow changes these;
  // neither is ever allowed to move past the real current period.
  let selectedWeekStart = null;
  let selectedMonthStart = null;

  const iso = (d) => d.toISOString().slice(0, 10);
  const addDays = (d, n) => new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + n));
  const sundayOf = (d) => addDays(d, -d.getUTCDay());

  // Periods are built backwards from today, so the report never shows a future
  // bucket and rolls forward on its own as the days pass.
  function buckets(today) {
    const t = D(today);
    const out = [];
    for (let i = rCount - 1; i >= 0; i--) {
      let start, end;
      if (rGran === 'daily') {
        start = addDays(t, -i); end = start;
      } else if (rGran === 'weekly') {
        start = addDays(sundayOf(t), -i * 7); end = addDays(start, 6);
      } else {
        start = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() - i, 1));
        end = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + 1, 0));
      }
      out.push({ start, end, key: iso(start), current: i === 0 });
    }
    return out;
  }

  function bucketLabel(b) {
    if (rGran === 'daily') return `${DOW[b.start.getUTCDay()]}<br>${b.start.getUTCDate()} ${MON[b.start.getUTCMonth()]}`;
    if (rGran === 'weekly') {
      const sameMon = b.start.getUTCMonth() === b.end.getUTCMonth();
      return sameMon
        ? `${b.start.getUTCDate()}–${b.end.getUTCDate()} ${MON[b.start.getUTCMonth()]}`
        : `${b.start.getUTCDate()} ${MON[b.start.getUTCMonth()]}–<br>${b.end.getUTCDate()} ${MON[b.end.getUTCMonth()]}`;
    }
    return `${MON[b.start.getUTCMonth()]}<br>${b.start.getUTCFullYear()}`;
  }

  // Same period label as bucketLabel() but plain text, for attributes/titles.
  function bucketPlain(b) {
    if (rGran === 'daily') return `${DOW[b.start.getUTCDay()]}, ${b.start.getUTCDate()} ${MON[b.start.getUTCMonth()]}`;
    if (rGran === 'weekly') return `${b.start.getUTCDate()} ${MON[b.start.getUTCMonth()]} – ${b.end.getUTCDate()} ${MON[b.end.getUTCMonth()]}`;
    return `${MON[b.start.getUTCMonth()]} ${b.start.getUTCFullYear()}`;
  }

  // Oman is UTC+4 with no DST. WeTravel's created_at is UTC, so a booking at
  // 22:00 UTC already fell on the next calendar day in Muscat — shifting by
  // the offset before reading the date turns it into the correct local day.
  const OMAN_OFFSET_MS = 4 * 60 * 60 * 1000;
  const omanDay = (isoTimestamp) => {
    const ms = Date.parse(isoTimestamp);
    return Number.isFinite(ms) ? new Date(ms + OMAN_OFFSET_MS).toISOString().slice(0, 10) : isoTimestamp.slice(0, 10);
  };

  // Muscat wall-clock time for a single booking's timestamp, for the popup —
  // the bucketing math uses the +4h shift trick, but for display the browser's
  // built-in Intl timezone support reads more naturally.
  const fmtOman = (isoTimestamp) => new Date(isoTimestamp).toLocaleString('en-GB', {
    timeZone: 'Asia/Muscat', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', hour12: true,
  });

  // Which trips booked within this period, and how many each, plus the exact
  // timestamps — the hover tooltip uses the totals, the click popup uses all of it.
  function tripBreakdown(events, from, to, charters) {
    const a = iso(from), z = iso(to);
    const byTrip = new Map();
    for (const e of events) {
      if (omanDay(e.at) < a || omanDay(e.at) > z) continue;
      if (e.x && !charters) continue;
      if (!byTrip.has(e.t)) byTrip.set(e.t, { trip: e.t, n: 0, c: 0, charter: !!e.x, bookings: [] });
      const row = byTrip.get(e.t);
      row.n += e.n; row.c += e.c;
      if (e.n > 0) row.bookings.push({ at: e.at, n: e.n });
    }
    return Array.from(byTrip.values()).sort((x, y) => y.n - x.n);
  }

  // Bookings placed in the rolling 24h ending now — same "how recent" concept
  // as the board's freshness badge, but summed across the whole report window
  // rather than one trip's weeks.
  function last24hTotal(events) {
    const cutoff = Date.now() - 24 * 60 * 60 * 1000;
    let n = 0;
    for (const e of events) {
      if (e.x) continue;
      const at = Date.parse(e.at);
      if (Number.isFinite(at) && at >= cutoff && at <= Date.now()) n += e.n;
    }
    return n;
  }

  // The most recently FINISHED Sun-Sat week — always real, fixed to actual
  // "now", never affected by whatever week is navigated to in the Report
  // tab's hero panel. This is what the always-visible header bar uses,
  // deliberately decoupled from Report-tab navigation.
  function lastCompletedWeekTotal(p) {
    const start = addDays(D(p.weekStart), -7);
    const end = addDays(D(p.weekStart), -1);
    return tally(p.events, start, end, false).n;
  }

  // Three numbers, no table: Muatasam asked for this in place of the detailed
  // Volume/Key-Percentages breakdown. Unlike the header's fixed version, this
  // panel lives inside the Report tab right under the hero, so everything here
  // is relative to whichever week is navigated to there:
  //   "Last Week"     = the week BEFORE the selected one (not the selected
  //                     week itself — the hero right above already shows that,
  //                     so repeating it was both redundant and mislabelled).
  //   "Last 24 Hours" = real rolling 24h while on the current week; on a past
  //                     week it anchors to that week's own final day, since
  //                     today's live count says nothing about the period shown.
  // Each carries its date range so there's no ambiguity about what it covers.
  function buildSimpleKpi(p, wkStart, wkEnd, isCurrentWeek, target) {
    const prevStart = addDays(wkStart, -7);
    const prevEnd = addDays(wkStart, -1);
    const lastWeek = tally(p.events, prevStart, prevEnd, false).n;

    let last24h, last24hLabel;
    if (isCurrentWeek) {
      last24h = last24hTotal(p.events);
      last24hLabel = 'rolling, up to now';
    } else {
      const anchor = Date.parse(iso(addDays(wkEnd, 1))); // midnight right after that week ends
      const cutoff = anchor - 24 * 60 * 60 * 1000;
      last24h = 0;
      for (const e of p.events) {
        if (e.x) continue;
        const at = Date.parse(e.at);
        if (Number.isFinite(at) && at >= cutoff && at < anchor) last24h += e.n;
      }
      last24hLabel = `final day of ${day(iso(wkEnd))}`;
    }

    return `
      <div class="panel skpi-panel">
        <div class="skpi">
          <div class="skpi-n">${last24h}</div>
          <div class="skpi-l">Last 24 Hours</div>
          <div class="skpi-sub">${esc(last24hLabel)}</div>
        </div>
        <div class="skpi">
          <div class="skpi-n">${lastWeek}</div>
          <div class="skpi-l">Last Week</div>
          <div class="skpi-sub">${esc(range(iso(prevStart), iso(prevEnd)))}</div>
        </div>
        <div class="skpi">
          <div class="skpi-n">${target}</div>
          <div class="skpi-l">Weekly Target</div>
          <div class="skpi-sub">per week</div>
        </div>
      </div>`;
  }

  function tally(events, from, to, charters) {
    let n = 0, c = 0, ch = 0;
    const a = iso(from), z = iso(to);
    for (const e of events) {
      const day = omanDay(e.at);
      if (day < a || day > z) continue;
      if (e.x) { ch += e.n; if (!charters) continue; }
      n += e.n; c += e.c;
    }
    return { n, c, charter: ch };
  }

  function renderReport() {
    const p = report;
    if (!p) return;
    if (p.error && !p.events) {
      $('reportWrap').innerHTML = `<div class="msg err">Could not load report: ${esc(p.error)}</div>`;
      return;
    }

    const today = D(p.today);
    if (selectedWeekStart === null) selectedWeekStart = p.weekStart;
    if (selectedMonthStart === null) {
      selectedMonthStart = iso(new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), 1)));
    }

    const wkStart = D(selectedWeekStart);
    const wkEnd = addDays(wkStart, 6);
    const isCurrentWeek = selectedWeekStart === p.weekStart;
    const week = tally(p.events, wkStart, wkEnd, rCharters);
    const target = p.weeklyTarget;
    const pct = Math.min(100, (week.n / target) * 100);
    const hit = week.n >= target;

    // A past week is fully elapsed by definition; only the real current week
    // can be partway through, so only it gets "N days left" / pacing language.
    const elapsed = isCurrentWeek
      ? Math.max(1, Math.min(7, Math.round((today - wkStart) / 864e5) + 1))
      : 7;
    const left = isCurrentWeek ? 7 - elapsed : 0;
    const expected = (target / 7) * elapsed;
    const onPace = week.n >= expected;

    // How far back navigation is allowed to go — the server only scans
    // `lookbackDays` back, so earlier weeks would just show misleading zeros.
    const earliestIso = iso(addDays(today, -(p.lookbackDays || 300)));
    const canGoBackWeek = iso(addDays(wkStart, -7)) >= earliestIso;

    const dayCells = Array.from({ length: 7 }, (_, i) => {
      const d = addDays(wkStart, i);
      const v = tally(p.events, d, d, rCharters).n;
      const ahead = iso(d) > p.today;
      const isToday = iso(d) === p.today;
      const peak = Math.max(3, ...Array.from({ length: 7 }, (_, j) =>
        tally(p.events, addDays(wkStart, j), addDays(wkStart, j), rCharters).n));
      return `<div class="dcell ${ahead ? 'ahead' : ''} ${isToday ? 'today' : ''} ${v ? '' : 'zero'}"
                   data-start="${iso(d)}" data-end="${iso(d)}" data-label="${esc(DOW[i] + ', ' + d.getUTCDate() + ' ' + MON[d.getUTCMonth()])}">
        <div class="dbar-wrap"><div class="dbar" style="height:${(v / peak) * 100}%"></div></div>
        <div class="dnum">${v}</div>
        <div class="dlab">${DOW[i]}${isToday ? ' •' : ''}</div>
      </div>`;
    }).join('');

    const bs = buckets(p.today).map((b) => ({ ...b, ...tally(p.events, b.start, b.end, rCharters) }));
    const showTarget = rGran === 'weekly';
    const peak = Math.max(showTarget ? target : 0, ...bs.map((b) => b.n), 1);
    const max = Math.ceil((peak + 1) / 5) * 5;

    let chrome = '';
    for (let v = 0; v <= max; v += 5) {
      chrome += `<div class="crule" style="bottom:${(v / max) * 100}%"><span class="ct">${v}</span></div>`;
    }
    if (showTarget) {
      chrome += `<div class="ctarget" style="bottom:${(target / max) * 100}%">
        <span class="ctflag">TARGET ${target}/WEEK</span></div>`;
    }

    // Highlights whichever bar matches what the hero/KPI panel is currently
    // showing — the visual confirmation that clicking it actually did something.
    const selectedIso = rGran === 'weekly' ? selectedWeekStart : rGran === 'monthly' ? selectedMonthStart : null;
    const bars = bs.map((b) => `
      <div class="cslot ${b.n ? '' : 'zero'} ${showTarget && b.n >= target ? 'hit' : ''} ${b.current ? 'partial' : ''} ${iso(b.start) === selectedIso ? 'selected' : ''}"
           data-start="${iso(b.start)}" data-end="${iso(b.end)}" data-label="${esc(bucketPlain(b))}">
        <div class="cval">${b.n}</div>
        <div class="cbar" style="height:${(b.n / max) * 100}%"></div>
      </div>`).join('');

    const axis = bs.map((b) => `<div class="clab ${b.current ? 'partial' : ''}">
      ${bucketLabel(b)}${b.current ? '<br><span style="font-size:9px">so far</span>' : ''}</div>`).join('');

    const totalCharter = bs.reduce((s, b) => s + b.charter, 0);
    const kpiHtml = buildSimpleKpi(p, wkStart, wkEnd, isCurrentWeek, target);

    const subLabel = isCurrentWeek
      ? `Day <b>${elapsed}</b> of 7${left > 0 ? ` · ${left} day${left > 1 ? 's' : ''} left` : ' · final day'}`
      : 'Full week · completed';
    const paceLine = hit
      ? '✓ Target reached'
      : isCurrentWeek
        ? (onPace ? `On pace · ${(target - week.n)} to go` : `Behind pace · ${(target - week.n)} to go (expected ~${expected.toFixed(0)} by now)`)
        : `Target missed by ${target - week.n}`;
    const paceClass = hit ? 'ok' : (isCurrentWeek ? (onPace ? 'ok' : 'behind') : 'behind');

    $('reportWrap').innerHTML = `
      <div class="rtop">
        <div class="panel">
          <div class="pnav">
            <button class="navbtn" id="wkPrev" aria-label="Previous week" ${canGoBackWeek ? '' : 'disabled'}>‹</button>
            <div class="ptitle" style="margin:0">${isCurrentWeek ? 'This week' : 'Week of'} · ${wkStart.getUTCDate()} ${MON[wkStart.getUTCMonth()]} – ${wkEnd.getUTCDate()} ${MON[wkEnd.getUTCMonth()]}</div>
            <button class="navbtn" id="wkNext" aria-label="Next week" ${isCurrentWeek ? 'disabled' : ''}>›</button>
            ${isCurrentWeek ? '' : '<button class="navbtn navbtn-today" id="wkToday">Today</button>'}
          </div>
          <div class="hero ${hit ? 'hit' : ''}">
            <span class="big">${week.n}</span><span class="of">/ ${target} bookings</span>
          </div>
          <div class="htrack"><div class="hfill ${hit ? 'hit' : ''}" style="width:${pct}%"></div></div>
          <div class="hsub">${subLabel}</div>
          <div class="pace ${paceClass}">
            ${paceLine}
          </div>
        </div>

        <div class="panel">
          <div class="ptitle">${isCurrentWeek ? 'Daily progress this week' : 'Daily progress that week'}</div>
          <div class="days">${dayCells}</div>
        </div>
      </div>

      ${kpiHtml}

      <div class="panel">
        <div class="filters">
          <div class="seg" id="granSeg">
            ${['daily', 'weekly', 'monthly'].map((g) =>
              `<button data-g="${g}" aria-pressed="${g === rGran}">${g[0].toUpperCase() + g.slice(1)}</button>`).join('')}
          </div>
          <div class="seg" id="rangeSeg">
            ${RANGES[rGran].map((n) =>
              `<button data-n="${n}" aria-pressed="${n === rCount}">Last ${n}</button>`).join('')}
          </div>
          <div class="fnote">${p.tripsScanned} trips scanned${totalCharter ? ` · ${totalCharter} charter booking(s) excluded` : ''}</div>
        </div>
        <div class="tzbadge">🕐 All dates and times shown in <b>Muscat, Oman time (UTC+4)</b></div>
        <div class="chart">${chrome}<div class="cbars">${bars}</div></div>
        <div class="caxis">${axis}</div>
        <div class="rlegend">
          <span><i style="background:#f5b935"></i>Bookings taken</span>
          <span><i style="background:#56b98a"></i>Week hit target</span>
          <span><i style="background:repeating-linear-gradient(135deg,#f5b935 0 4px,rgba(245,185,53,.35) 4px 8px)"></i>Still in progress</span>
        </div>
      </div>`;

    bindReportInteractions(p);
    bindPeriodNav();

    $('granSeg').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      rGran = b.dataset.g;
      rCount = RANGES[rGran][0];
      renderReport();
    }));
    $('rangeSeg').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      rCount = Number(b.dataset.n); renderReport();
    }));

    // Every path that changes what Report is showing (filters, nav arrows,
    // clicking a bar) routes through a renderReport() call, so saving here
    // catches all of them in one place.
    saveViewState();
  }

  // Hover for a quick read, click for the full list — both driven by the same
  // per-period breakdown so they can never disagree with each other.
  function bindReportInteractions(p) {
    const tip = $('tip');

    function tipHtml(rows, label, charter, jumpHint) {
      const total = rows.reduce((s, r) => s + r.n, 0);
      if (!total) return `<div class="tt">${esc(label)}</div><div class="tk">No bookings in this period</div>`;
      const shown = rows.filter((r) => r.n > 0).slice(0, 5);
      const rest = rows.filter((r) => r.n > 0).length - shown.length;
      return `<div class="tt">${esc(label)}</div>
        <div class="tk">${total} booking${total > 1 ? 's' : ''} · ${rows.filter((r) => r.n > 0).length} trip${rows.filter((r) => r.n > 0).length > 1 ? 's' : ''}${charter ? ' · incl. charters' : ''}</div>
        ${shown.map((r) => `<div class="trow"><span>${esc(r.trip)}${r.charter ? ' 🏫' : ''}</span><b>+${r.n}</b></div>`).join('')}
        ${rest > 0 ? `<div class="more">+${rest} more trip${rest > 1 ? 's' : ''}</div>` : ''}
        <div class="hint">${jumpHint}</div>`;
    }

    function moveTip(e) {
      const pad = 14, r = tip.getBoundingClientRect();
      let x = e.clientX + pad, y = e.clientY + pad;
      if (x + r.width > innerWidth) x = e.clientX - r.width - pad;
      if (y + r.height > innerHeight) y = e.clientY - r.height - pad;
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    }

    // Bound to the bar shape itself (.cbar / .dbar), not the full-height column
    // it sits in — so the tooltip only appears when the cursor is actually
    // over the drawn bar, not the empty space above a short one.
    document.querySelectorAll('.cbar, .dbar').forEach((bar) => {
      const container = bar.closest('[data-start]');
      if (!container) return;
      const from = D(container.dataset.start), to = D(container.dataset.end);
      const rows = tripBreakdown(p.events, from, to, rCharters);
      const jumpHint = 'Click for full details';

      bar.addEventListener('mouseenter', () => {
        tip.innerHTML = tipHtml(rows, container.dataset.label, rCharters, jumpHint);
        tip.classList.add('on');
      });
      bar.addEventListener('mousemove', moveTip);
      bar.addEventListener('mouseleave', () => tip.classList.remove('on'));
      // Clicking a bar does two things at once: filters the hero/daily-strip/
      // KPI panel to that exact period in place, AND opens a popup with the
      // full per-trip, per-booking breakdown as extra detail on top of that.
      bar.addEventListener('click', () => {
        tip.classList.remove('on');
        if (rGran === 'monthly') {
          selectedMonthStart = container.dataset.start;
        } else if (rGran === 'weekly') {
          selectedWeekStart = container.dataset.start;
        } else {
          selectedWeekStart = iso(sundayOf(D(container.dataset.start)));
        }
        renderReport();
        openReportModal(container.dataset.label, rows, rCharters);
      });
    });
  }

  function openReportModal(label, rows, charter) {
    const withBookings = rows.filter((r) => r.n > 0);
    const total = withBookings.reduce((s, r) => s + r.n, 0);

    $('modalBody').innerHTML = `
      <div class="mtitle">${esc(label)}</div>
      <div class="msub">${total} booking${total !== 1 ? 's' : ''} across ${withBookings.length} trip${withBookings.length !== 1 ? 's' : ''}${charter ? ' (incl. charters)' : ' (retail only)'}</div>
      ${withBookings.length ? withBookings.map((r) => `
        <div class="mrow">
          <div class="mrow-top">
            <span class="mtrip">${esc(r.trip)}${r.charter ? ' 🏫' : ''}</span>
            <span class="mcount ${r.charter ? 'charter' : ''}">+${r.n}</span>
          </div>
          <div class="mwhen">${r.bookings.map((b) => esc(fmtOman(b.at)) + (b.n > 1 ? ` (+${b.n})` : '')).join(' · ')}</div>
          ${r.c ? `<div class="mcancel">${r.c} cancelled in this period</div>` : ''}
        </div>`).join('') : '<div class="mempty">No bookings in this period.</div>'}`;

    $('modalBackdrop').hidden = false;
  }

  function closeReportModal() { $('modalBackdrop').hidden = true; }
  $('modalClose').addEventListener('click', closeReportModal);
  $('modalBackdrop').addEventListener('click', (e) => { if (e.target.id === 'modalBackdrop') closeReportModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeReportModal(); });

  function bindPeriodNav() {
    const wkPrev = $('wkPrev'), wkNext = $('wkNext'), wkToday = $('wkToday');
    if (wkPrev) wkPrev.addEventListener('click', () => {
      selectedWeekStart = iso(addDays(D(selectedWeekStart), -7)); renderReport();
    });
    if (wkNext) wkNext.addEventListener('click', () => {
      selectedWeekStart = iso(addDays(D(selectedWeekStart), 7)); renderReport();
    });
    if (wkToday) wkToday.addEventListener('click', () => {
      selectedWeekStart = report.weekStart; renderReport();
    });
  }

  async function loadReport(force) {
    try {
      const res = await fetch('/api/booking-report' + (force ? '?refresh=1' : ''));
      const p = await res.json();
      if (!res.ok) throw new Error(p.error || 'request failed');
      report = p;
      renderReport();
      applyHeaderStats();
    } catch (err) {
      $('reportWrap').innerHTML = `<div class="msg err">Could not load report: ${esc(err.message)}</div>`;
    }
  }

  // Drives the header's New in 24h / Last Week / Weekly Target. Uses the same
  // lastCompletedWeekTotal() as the Report tab's panel, so the two can never
  // show different numbers for the same thing, and neither is affected by
  // whatever week is navigated to in the Report tab's hero panel.
  function applyHeaderStats() {
    if (!report) return;
    const last24h = last24hTotal(report.events);
    $('sNew').textContent = last24h;
    $('sNew').className = 'n' + (last24h > 0 ? ' fresh' : '');
    $('sLastWeek').textContent = lastCompletedWeekTotal(report);
    $('sWeeklyTarget').textContent = report.weeklyTarget;
  }

  /* ================= Meta Ads: shared chart primitives ================= */

  let campaigns = null;
  let adHistory = null;
  const openYears = new Set();

  // Fixed categorical order, stepped for the dark chart surface and validated
  // as a set (CVD ΔE 8.4 worst adjacent, normal-vision 19.3). Never cycled: a
  // 7th objective folds into "Other" rather than inventing a hue.
  const SERIES = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300'];
  const OBJ_ORDER = ['Messages', 'Purchases', 'Leads', 'Link Clicks', 'Reach', 'Custom Conversion'];
  const objColor = (name) => {
    const i = OBJ_ORDER.indexOf(name);
    return i >= 0 && i < SERIES.length ? SERIES[i] : '#8698b4';
  };

  const nf0 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
  const nf2 = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const int = (n) => nf0.format(Math.round(Number(n) || 0));
  const dec = (n) => nf2.format(Number(n) || 0);

  // Precision follows magnitude: cost-per-result runs from under a riyal to
  // four figures across these campaigns, and neither end should look wrong.
  const money = (n) => {
    const v = Number(n) || 0;
    if (Math.abs(v) >= 1000) return int(v);
    if (Math.abs(v) >= 1) return dec(v);
    return v === 0 ? '0' : v.toFixed(3);
  };
  // Axis ticks and tiles need the short form or they collide.
  const compact = (n) => {
    const v = Math.abs(Number(n) || 0);
    if (v >= 1e6) return (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + 'M';
    if (v >= 1e3) return (v / 1e3).toFixed(v >= 1e4 ? 0 : 1) + 'k';
    return int(v);
  };
  const pct = (n) => (Number.isFinite(n) ? (n * 100).toFixed(1) + '%' : '—');

  // Every derived figure in the spreadsheet was a division wrapped in IFERROR,
  // which blanks rather than showing a misleading zero. Same contract here.
  const ratio = (a, b) => (Number(b) ? Number(a) / Number(b) : null);
  // Signed change against a prior figure; null when there is nothing to
  // compare to, since a rise from zero is not a percentage.
  const change = (now, before) => {
    if (!Number.isFinite(before) || before === 0 || !Number.isFinite(now)) return null;
    return (now - before) / before;
  };
  const show = (v, fmt) => (v == null ? '—' : fmt(v));
  // CPM is cost per *thousand* impressions — the sheet's =spend/impressions*1000.
  const cpmOf = (spend, impressions) => {
    const r = ratio(spend, impressions);
    return r == null ? null : r * 1000;
  };

  // One tooltip element for the whole page, already styled for the report bars.
  function bindViz(root) {
    const tip = $('tip');
    const move = (e) => {
      const pad = 14, r = tip.getBoundingClientRect();
      let x = e.clientX + pad, y = e.clientY + pad;
      if (x + r.width > innerWidth) x = e.clientX - r.width - pad;
      if (y + r.height > innerHeight) y = e.clientY - r.height - pad;
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    };
    root.querySelectorAll('[data-tip]').forEach((el) => {
      // A line chart's hit column also drives the crosshair in its own svg.
      const cross = el.dataset.cx ? el.closest('svg').querySelector('.lcross') : null;
      el.addEventListener('mouseenter', (e) => {
        tip.innerHTML = el.dataset.tip;
        tip.classList.add('on');
        if (cross) {
          cross.setAttribute('x1', el.dataset.cx);
          cross.setAttribute('x2', el.dataset.cx);
          cross.setAttribute('opacity', '0.75');
        }
        move(e);
      });
      el.addEventListener('mousemove', move);
      el.addEventListener('mouseleave', () => {
        tip.classList.remove('on');
        if (cross) cross.setAttribute('opacity', '0');
      });
    });
  }

  // Titles are campaign names straight from Meta, so they're escaped here as
  // text; the whole string is escaped again as an attribute at the call site.
  // Attribute decoding and innerHTML parsing each unwrap one layer, so the two
  // passes cancel out exactly rather than double-encoding.
  const tipRows = (title, rows) =>
    `<div class="tt">${esc(title)}</div>` +
    rows.map(([k, v]) => `<div class="trow"><span class="tk">${esc(k)}</span><b>${esc(v)}</b></div>`).join('');

  // A "nice" axis top, so gridlines land on round numbers instead of the raw max.
  function niceMax(v) {
    if (!(v > 0)) return 1;
    const mag = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v / mag;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  }

  // Column chart. One series, one hue — magnitude over time is a sequential
  // job, so no legend is needed; the panel title names the measure.
  function columnChart(points, opts) {
    const o = opts || {};
    const top = niceMax(Math.max(0, ...points.map((p) => p.v)));
    const cols = points.map((p) => {
      const h = top ? Math.max(p.v > 0 ? 2 : 0, (p.v / top) * 100) : 0;
      return `<div class="vzcol"><div class="vzbar${p.dim ? ' dim' : ''}" style="height:${h.toFixed(2)}%" data-tip="${attr(p.tip)}"></div></div>`;
    }).join('');
    const axis = points.map((p) =>
      `<span class="${p.mark ? 'yr' : ''}" title="${attr(p.label)}">${esc(p.label)}</span>`).join('');
    return `
      <div class="vz">
        <div class="vzwrap">
          <div class="vzscale">
            <div>${o.fmt ? o.fmt(top) : compact(top)}</div>
            <div>${o.fmt ? o.fmt(top / 2) : compact(top / 2)}</div>
            <div>0</div>
          </div>
          <div class="vzplotwrap">
            <div class="vzplot">
              <div class="vzgrid"><i></i><i></i><i></i></div>
              <div class="vzcols">${cols}</div>
            </div>
            <div class="vzaxis">${axis}</div>
          </div>
        </div>
      </div>`;
  }

  // Line chart — the form for a trend. One series, so no legend: the panel
  // title names the measure. A dashed tail marks a week still in progress, so
  // a partial figure never reads as a genuine fall.
  //
  // The plot is stretched to the panel width (preserveAspectRatio="none"),
  // which is right for a line but would squash a circle into an oval — so
  // there are no permanent dot markers. Hover draws a vertical crosshair
  // instead, which is the specified interaction for a line chart and is
  // immune to horizontal scaling.
  let lineSeq = 0;

  function lineChart(points, opts) {
    const o = opts || {};
    const uid = `lg${++lineSeq}`;
    const W = 600, H = 132, PADL = 4, PADR = 4, PADT = 10, PADB = 6;
    const val = (p) => (Number.isFinite(p.v) ? p.v : 0);
    const top = niceMax(Math.max(...points.map(val), 0)) || 1;
    const n = points.length;
    const x = (i) => (n <= 1 ? W / 2 : PADL + (i * (W - PADL - PADR)) / (n - 1));
    const y = (v) => PADT + (1 - v / top) * (H - PADT - PADB);

    const pts = points.map((p, i) => ({ ...p, x: x(i), y: y(val(p)) }));
    const solid = pts.filter((p) => !p.partial);
    const path = (list) => list.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const stroke = o.color || 'var(--fill)';

    const area = solid.length > 1
      ? `<path d="${path(solid)} L${solid[solid.length - 1].x.toFixed(1)},${(H - PADB).toFixed(1)} L${solid[0].x.toFixed(1)},${(H - PADB).toFixed(1)} Z" fill="url(#${uid})" stroke="none"/>`
      : '';
    // The in-progress week is joined by a dashed segment, never a solid one.
    const tail = pts.length > 1 && pts[pts.length - 1].partial
      ? `<path d="${path(pts.slice(-2))}" fill="none" stroke="${stroke}" stroke-width="2" stroke-dasharray="4 3" vector-effect="non-scaling-stroke" stroke-linecap="round"/>`
      : '';

    const hits = pts.map((p) => {
      const half = (n <= 1 ? W : (W - PADL - PADR) / (n - 1)) / 2;
      const left = Math.max(0, p.x - half);
      const width = Math.min(W - left, half * 2);
      return `<rect class="lhit" x="${left.toFixed(1)}" y="0" width="${width.toFixed(1)}" height="${H}" fill="transparent" data-tip="${attr(p.tip)}" data-cx="${p.x.toFixed(1)}"/>`;
    }).join('');

    const grid = [0, 0.5, 1].map((f) => {
      const gy = (PADT + f * (H - PADT - PADB)).toFixed(1);
      return `<line x1="0" y1="${gy}" x2="${W}" y2="${gy}" stroke="rgba(134,152,180,.13)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
    }).join('');

    const axis = points.map((p, i) => {
