      counted = [null, r, r];
      escN = trips.reduce((a, x) => a + (x.escalations || 0), 0);
    }
    const tiles = `
      <div class="bvhero trp-tiles">
        <div class="bv-side"><div class="bv-lab"><span ${hlp('fbSat')}>Satisfaction</span></div><div class="bv-n bv-act">${sat == null ? '—' : pct(sat)}</div>
          ${sat == null ? '' : `<div class="abar fb-hbar"><div class="abar-fill" style="width:${(sat * 100).toFixed(1)}%;background:${fbBand(sat * 5)}"></div></div>`}<div class="bv-s">${filtered ? 'for the trips shown' : 'year to date'}</div></div>
        <div class="bv-side"><div class="bv-lab"><span ${hlp('fbTrips')}>Trips reported</span></div><div class="bv-n">${reported ? int(reported[1]) : esc(t.tripsReported || '—')}</div><div class="bv-s">${reported ? `of ${int(reported[2])} surveyed` : ''}</div></div>
        <div class="bv-side"><div class="bv-lab"><span ${hlp('fbResp')}>Responses</span></div><div class="bv-n">${counted ? int(counted[1]) : esc(t.responsesCounted || '—')}</div><div class="bv-s">${counted ? `of ${int(counted[2])} counted` : ''}</div></div>
      </div>
      ${escN ? `<div class="fb-alert"><b>⚑ ${int(escN)} comment${escN === 1 ? '' : 's'} flagged to escalate</b> · ${escTrips.map((x) => esc(`${x.name}, ${fbMonth(x.month)}`)).join('; ')} <button class="trp-toggle" data-fb-sub="comments">Read ${escN === 1 ? 'it' : 'them'}</button></div>` : ''}`;

    // ---- overview: trips by month ----
    // Overall comes straight after the name so it's on screen on a phone.
    // Response rate is a neutral slate, not the brand fill: amber on this tab
    // already means a 3.0-3.9 score.
    const commentCard = (c) => `
      <div class="fb-c${c.escalate ? ' fb-c-esc' : ''}">
        <div class="fb-c-head"><span class="fb-kind fb-k-${attr(String(c.kind).toLowerCase())}">${esc(c.kind)}</span>${c.source ? `<span>${esc(c.source)}</span>` : ''}${c.escalate ? '<span class="fb-flag">⚑ Escalate</span>' : ''}</div>
        <div dir="auto">${esc(c.text || '')}</div>
      </div>`;
    const COLS = 5;
    let lastMonth = null;
    const tripRows = trips.map((x) => {
      const said = p.comments.filter((c) => c.trip === x.id);
      const hasDetail = x.scores.length || x.items.length || x.facts.length || x.noComments || said.length;
      const open = hasDetail && fbOpen.has(x.id);
      const monthRow = x.month !== lastMonth ? `<tr class="fb-month"><td colspan="${COLS}">${esc(fbMonth(x.month))}</td></tr>` : '';
      lastMonth = x.month;
      const detail = open ? `
        <tr class="trp-detail"><td colspan="${COLS}"><div class="fb-detail">
          ${x.scores.length ? `<div class="fb-dh">Scores · 1 to 5${x.template ? ` · ${esc(fbGroupName(x.template))} survey` : ''}</div><div class="fb-scores">${x.scores.map((s) => fbScore(s.q, null, s.v)).join('')}</div>` : ''}
          ${x.items.length ? `<div class="fb-dh">Hotels and activities</div><div class="fb-scores">${x.items.filter((s) => s.score != null).map((s) => fbScore(s.item, s.type, s.score)).join('')}</div>` : ''}
          ${x.facts.length ? `<dl class="trp-dl">${x.facts.map((f) => `<dt>${esc(f.q)}</dt><dd>${esc(f.text)}</dd>`).join('')}</dl>` : ''}
          ${said.length ? `<div class="fb-dh">What people wrote · ${said.length}</div><div class="fb-dc">${said.map(commentCard).join('')}</div>` : ''}
          ${x.noComments ? `<div class="pnote">${esc(x.noComments)}</div>` : ''}
        </div></td></tr>` : '';
      return `${monthRow}
      <tr>
        <td class="cname">${esc(x.name)}<span class="trp-sub">${esc(fbGroupName(x.template || x.programme))}</span>${hasDetail ? `<button class="trp-toggle" data-fb-open="${attr(x.id)}" aria-expanded="${!!open}">${open ? 'Hide details' : 'Details'}</button>` : ''}</td>
        <td class="abar-cell">${x.overall == null ? '<span class="fb-na">no answers</span>' : `${fbBar(x.overall, fbBand(x.overall))}<span class="abar-pct">${fbNum(x.overall)}</span>`}</td>
        <td class="num">${esc(x.responsesText || '—')}</td>
        <td class="abar-cell">${x.responseRate == null ? '<span class="fb-na">N/A</span>' : `${fbBar(x.responseRate, 'var(--text-3)', 1)}<span class="abar-pct">${pct(x.responseRate)}</span>`}</td>
        <td class="num">${int(x.comments)}${x.escalations ? `<span class="fb-flag" title="Flagged to escalate">⚑ ${int(x.escalations)}</span>` : ''}</td>
      </tr>${detail}`;
    }).join('');

    // ---- overview: lowest scores ----
    const lows = [];
    for (const x of trips) {
      const where = `${x.name} · ${fbMonth(x.month)}`;
      for (const s of x.scores) if (s.v < 4) lows.push({ label: s.q, where, v: s.v });
      for (const s of x.items) if (s.score != null && s.score < 4) lows.push({ label: `${s.item}${s.type ? ` (${s.type.toLowerCase()})` : ''}`, where, v: s.score });
    }
    lows.sort((a, b) => a.v - b.v);

    const overviewHtml = `
      <div class="panel">
        <div class="ptitle">Trip feedback · ${filtered ? `${int(trips.length)} trip${trips.length === 1 ? '' : 's'} shown` : esc(String(p.trips[0]?.month || p.asOf).slice(0, 4))}</div>
        ${tiles}
      </div>

      <div class="panel">
        <div class="ptitle">By trip · most recent first</div>
        <div class="tscroll">
          <table class="ctable">
            <thead><tr>
              ${hcol('fbTrip', 'Trip')}${hcol('fbOverall', 'Overall (1–5)')}${hcol('fbResponses', 'Responses')}${hcol('fbRate', 'Response rate')}${hcol('fbComments', 'Comments')}
            </tr></thead>
            <tbody>${tripRows || `<tr><td class="cname" colspan="${COLS}">${filtered ? 'No trips match these filters.' : 'No surveys in the sheet yet.'}</td></tr>`}</tbody>
          </table>
        </div>
      </div>

      ${lows.length ? `
      <div class="panel">
        <div class="ptitle"><span ${hlp('fbLow')}>Lowest scores</span> · under 4.0</div>
        <div class="fb-low">${lows.map((l) => fbScore(l.label, l.where, l.v)).join('')}</div>
      </div>` : ''}`;

    // ---- ratings: every question, trip by trip ----
    // One table per group, a row per question and a column per trip. The
    // sheet's own layout turned on its side, so a phone scrolls down it
    // rather than across 20 columns. A group's questions are those of every
    // survey in it, in the sheet's order; a trip not asked one shows "Not
    // asked" (Teaching has no Trip Manual, for example).
    const groups = FB_GROUPS.concat(p.programmes.map((g) => fbGroupName(g.name)).filter((n) => !FB_GROUPS.includes(n)))
      .filter((v, i, a) => a.indexOf(v) === i)
      .map((name) => {
        const members = p.programmes.filter((g) => fbGroupName(g.name) === name);
        const questions = [];
        for (const g of members) for (const q of g.questions || []) if (!questions.includes(q)) questions.push(q);
        return { name, questions, summary: members.map((g) => g.summary).filter(Boolean).join(' ') };
      })
      .filter((g) => p.programmes.some((m) => fbGroupName(m.name) === g.name));
    const ratingsHtml = groups.map((g) => {
      const answered = (x) => x.scores.length || x.facts.length;
      const shown = trips;
      const trips2 = shown.filter((x) => fbGroupName(x.template || x.programme) === g.name && answered(x));
      const silent = shown.filter((x) => fbGroupName(x.template || x.programme) === g.name && !answered(x));
      if (!trips2.length && !silent.length) return '';
      const cell = (x, q) => {
        const sc = x.scores.find((a) => a.q === q);
        if (sc) return `<td class="fb-cell">${fbBar(sc.v, fbBand(sc.v))}<b>${fbNum(sc.v)}</b></td>`;
        const f = x.facts.find((a) => a.q === q);
        if (f) return `<td class="fb-txt">${esc(f.text)}</td>`;
        // "Not asked" when the trip's own survey doesn't have the question at
        // all (a Teaching trip has no Giving questions); a dash when it does
        // but nobody answered.
        const own = (p.programmes.find((m) => m.name === x.template) || {}).questions;
        return `<td class="fb-cell fb-na">${x.notAsked.includes(q) || (own && !own.includes(q)) ? 'Not asked' : '—'}</td>`;
      };
      // A question none of these trips2 was asked is left out, not shown as
      // a row of "Not asked".
      const qs = (g.questions || []).filter((q) => trips2.some((x) => x.scores.some((a) => a.q === q) || x.facts.some((a) => a.q === q)));
      const overall = `<tr class="fb-overall"><td class="fb-q">Overall satisfaction</td>${trips2.map((x) => (x.overall == null ? '<td class="fb-cell fb-na">—</td>' : `<td class="fb-cell">${fbBar(x.overall, fbBand(x.overall))}<b>${fbNum(x.overall)}</b></td>`)).join('')}</tr>`;
      const rows = qs.map((q) => `<tr><td class="fb-q">${esc(q)}</td>${trips2.map((x) => cell(x, q)).join('')}</tr>`).join('');
      return `
      <div class="panel">
        <div class="ptitle">${esc(g.name)} · ${int(trips2.length)} trip${trips2.length === 1 ? '' : 's'}</div>
        ${trips2.length ? `
        <div class="tscroll">
          <table class="ctable fb-matrix">
            <thead><tr>
              <th class="fb-l"><span ${hlp('fbQuestion')}>Question</span></th>
              ${trips2.map((x) => `<th class="fb-trip-h">${esc(x.name)}<small>${esc(fbMonth(x.month))} · ${esc(x.responsesText || '')}</small></th>`).join('')}
            </tr></thead>
            <tbody>${overall}${rows}</tbody>
          </table>
        </div>` : ''}
        ${silent.length ? `<div class="pnote">No answers yet: ${silent.map((x) => esc(`${x.name}, ${fbMonth(x.month)}`)).join('; ')}.</div>` : ''}
      </div>`;
    }).join('') || `<div class="msg">${filtered ? 'No ratings for these filters.' : 'No ratings in the sheet yet.'}</div>`;

    // ---- what people wrote ----
    const progOf = new Map(p.trips.map((x) => [x.id, fbGroupName(x.template || x.programme)]));
    const progs = groups.map((g) => g.name);
    const kinds = [...FB_KINDS.filter((k) => p.comments.some((c) => c.kind === k)), ...new Set(p.comments.map((c) => c.kind).filter((k) => !FB_KINDS.includes(k)))];
    if (fbFilter.prog !== 'all' && !progs.includes(fbFilter.prog)) fbFilter.prog = 'all';
    if (fbFilter.kind !== 'all' && !kinds.includes(fbFilter.kind)) fbFilter.kind = 'all';
    const passes = (c, skip) => tripIds.has(c.trip)
      && (skip === 'kind' || fbFilter.kind === 'all' || c.kind === fbFilter.kind);
    // Each button counts what it would show given the other filter.
    const pills = (key, list) => ['all', ...list].map((v) => {
      const n = p.comments.filter((c) => passes(c, key) && (v === 'all' || (key === 'prog' ? progOf.get(c.trip) === v : c.kind === v))).length;
      return `<button data-fb-f="${key}" data-fb-v="${attr(v)}" aria-pressed="${fbFilter[key] === v}">${v === 'all' ? 'All' : esc(v)} <span class="ecount">${n}</span></button>`;
    }).join('');
    const shownComments = p.comments.filter((c) => passes(c));
    const progBlocks = progs.map((name) => {
      const list = shownComments.filter((c) => progOf.get(c.trip) === name);
      if (!list.length) return '';
      const g = groups.find((x) => x.name === name);
      const tripIds = [...new Set(list.map((c) => c.trip))];
      return `
        <div class="fb-prog">
          <h3>${esc(name)} <span class="ecount">${list.length}</span></h3>
          ${g && g.summary && fbFilter.kind === 'all' ? `<div class="fb-ask" dir="auto">${esc(g.summary)}</div>` : ''}
          ${tripIds.map((id) => {
            const mine = list.filter((c) => c.trip === id);
            return `<div class="fb-trip">${esc(mine[0].tripName)} · ${esc(fbMonth(mine[0].month))}</div>${mine.map(commentCard).join('')}`;
          }).join('')}
        </div>`;
    }).join('');
    const commentsHtml = `
      <div class="panel">
        <div class="ptitle">What people wrote · ${int(shownComments.length)} of ${int(p.comments.length)}</div>
        <div class="efilters">
          <div class="efilter"><span class="efl">Type</span><div class="seg">${pills('kind', kinds)}</div></div>
        </div>
        ${progBlocks || '<div class="pnote">No comments match these filters.</div>'}
      </div>`;

    const subtabs = `
      <div class="seg subtabs" role="tablist" aria-label="Feedback sections">
        <button role="tab" data-fb-sub="overview" aria-pressed="${fbSub === 'overview'}" aria-selected="${fbSub === 'overview'}">Overview</button>
        <button role="tab" data-fb-sub="ratings" aria-pressed="${fbSub === 'ratings'}" aria-selected="${fbSub === 'ratings'}">Ratings</button>
        <button role="tab" data-fb-sub="comments" aria-pressed="${fbSub === 'comments'}" aria-selected="${fbSub === 'comments'}">What people wrote <span class="ecount">${int(p.comments.length)}</span></button>
      </div>`;

    $('feedbackWrap').innerHTML = `
      ${p.stale ? `<div class="msg err">Showing the last copy of the sheet — ${esc(p.error || 'OneDrive unreachable')}</div>` : ''}
      ${subtabs}
      ${fbFilterBar}
      ${fbSub === 'comments' ? commentsHtml : fbSub === 'ratings' ? ratingsHtml : overviewHtml}`;

    bindHelp($('feedbackWrap'));
    $('feedbackWrap').querySelectorAll('[data-fb-sub]').forEach((b) => {
      b.addEventListener('click', () => {
        if (fbSub === b.dataset.fbSub) return;
        fbSub = b.dataset.fbSub;
        renderFeedback();
        const bar = $('feedbackWrap').querySelector('.subtabs');
        if (bar && bar.getBoundingClientRect().top < 0 && typeof bar.scrollIntoView === 'function') bar.scrollIntoView({ block: 'start' });

    $('feedbackWrap').querySelectorAll('[data-fb-sel]').forEach((el) => {
      el.addEventListener('change', () => { fbF[el.dataset.fbSel] = el.value; renderFeedback(); });
    });
    const clr = $('feedbackWrap').querySelector('[data-fb-clear]');
    if (clr) clr.addEventListener('click', () => { Object.keys(fbF).forEach((k) => { fbF[k] = 'all'; }); renderFeedback(); });
    $('feedbackWrap').querySelectorAll('[data-fb-f]').forEach((b) => {
      b.addEventListener('click', () => { fbFilter[b.dataset.fbF] = b.dataset.fbV; renderFeedback(); });
    });
    $('feedbackWrap').querySelectorAll('[data-fb-open]').forEach((b) => {
      b.addEventListener('click', () => {
        const id = b.dataset.fbOpen;

        renderFeedback();

  async function loadFeedback(force) {
    try {
      const res = await fetch('/api/sheets?name=feedback' + (force ? '&refresh=1' : ''));
      const p = await res.json();

      feedback = p;
      renderFeedback();
      ovSoon();
    } catch (err) {
      if (!feedback) $('feedbackWrap').innerHTML = `<div class="msg err">Could not load feedback: ${esc(err.message)}</div>`;

  /* ================= trip revenue tab (revenue sheet) ================= */

  let revData = null;
  // Which sub-tab of Trip Revenue is open: 'overview' or 'trips'.
  let rvSub = 'overview';
  const rvFilter = { programme: 'all', result: 'all' };

  // Muatasam, 4 Oct 2026: percentages only, no amounts, nothing per person.
  // The API sends no amount at all, and the page no longer has a column or a
  // word for one (Anton, 5 Oct: remove "Hidden" entirely).
  // A true minus, matching the rest of the dashboard.
  const rvPct = (n) => (n == null ? '—' : pct(n).replace('-', '−'));
  const rvMonth = (key) => {
    const [y, m] = String(key).split('-').map(Number);
    return y && m ? new Date(Date.UTC(y, m - 1, 1)).toLocaleString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' }) : 'No month';
  };
  // "6 Sep" by hand: en-GB spells September "Sept".
  const RV_MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const rvDay = (iso) => `${Number(iso.slice(8, 10))} ${RV_MON[Number(iso.slice(5, 7)) - 1]}`;
  const rvDates = (t) => (t.start && t.end ? `${rvDay(t.start)} – ${rvDay(t.end)}` : '');
  const RV_RESULT = {
    Gain: { c: 'var(--q-high)', g: '▲' },
    Loss: { c: 'var(--q-low)', g: '▼' },
    'Break-even': { c: 'var(--q-none)', g: '■' },
  };
  // Suggestion levels, in the status colours with a glyph and a word, so
  // colour is never the only signal.
  const RV_SUG = {
    fix: { c: 'var(--q-low)', g: '▼', l: 'Fix' },
    improve: { c: 'var(--q-med)', g: '■', l: 'Improve' },
    keep: { c: 'var(--q-high)', g: '▲', l: 'Keep doing' },
    note: { c: 'var(--q-none)', g: '○', l: 'Note' },
  };
  const rvResult = (r) => {
    if (!r) return '<span class="rv-na">—</span>';
    const st = RV_RESULT[r];
    return st ? `<span class="rv-res"><i style="color:color-mix(in srgb, ${st.c} 50%, var(--strong))">${st.g}</i>${esc(r)}</span>` : `<span class="rv-res rv-na">○ ${esc(r)}</span>`;
  };

  // The row's own revenue as a full bar, split by its margin: expenses
  // (1 - margin) plus profit (margin). On a loss the expenses run past
  // revenue, so the bar is the expenses and the red part is the overrun.
  // Every row is its own 100%, so the bar shows no amounts and no row's
  // size against another's.
  function rvBar(g, name, big) {
    const m = g.margin;
    if (!g.figures || m == null) return big ? '' : '<span class="rv-na">no figures</span>';
    const w = (v) => `${Math.max(0, v * 100).toFixed(2)}%`;
    const lab = (v, text) => (big && v >= 0.12 ? `${text} ${rvPct(v)}` : '');
    const tip = m >= 0
      ? tipOf(name, [['Expenses', `${rvPct(1 - m)} of revenue`], ['Profit', `${rvPct(m)} of revenue`]])
      : tipOf(name, [['Expenses', `${rvPct(1 - m)} of revenue`], ['Loss', `${rvPct(-m)} of revenue`]]);
    const segs = m >= 0
      ? `<div class="rv-exp" style="width:${w(1 - m)}">${lab(1 - m, 'Expenses')}</div>${m > 0 ? `<div class="rv-pro" style="width:${w(m)}">${lab(m, 'Profit')}</div>` : ''}`
      : `<div class="rv-exp" style="width:${w(1 / (1 - m))}">${lab(1 / (1 - m), 'Revenue')}</div><div class="rv-loss" style="width:${w(-m / (1 - m))}">${lab(-m / (1 - m), 'Loss')}</div>`;
    return `<div class="rv-bar${big ? ' big' : ''}" ${tip}>${segs}</div>`;
  }

  function renderRevenue() {
    const p = revData;
    if (!p) return;
    if (p.error && !p.trips) {
      $('revenueWrap').innerHTML = `<div class="msg err">Could not load trip revenue: ${esc(p.error)}</div>`;
      return;
    }
    const t = p.totals;
    const today = String(p.asOf).slice(0, 10);
    // Trips that have finished but whose figures aren't in yet: the ones to
    // chase, and the reason recent months read low.
    const overdue = p.trips.filter((x) => /not entered/i.test(x.result || '') && x.end && x.end < today);
    const notEntered = p.trips.filter((x) => /not entered/i.test(x.result || '')).length;

    const groupTable = (title, helpKey, head, rows, labelOf) => {
      const body = rows.map((g) => `
        <tr>
          <td class="cname">${esc(labelOf(g))}</td>
          <td class="num"><b>${g.margin == null ? '—' : rvPct(g.margin)}</b></td>
          <td class="rv-l">${rvBar(g, labelOf(g))}</td>
          <td class="num">${int(g.trips)}</td>
        </tr>`).join('');
      return `
      <div class="panel">
        <div class="ptitle">${title}</div>
        <div class="tscroll">
          <table class="ctable">
            <thead><tr>
              ${hcol(helpKey, head)}${hcol('rvMargin', 'Margin')}
              <th class="rv-l"><span ${hlp('rvSplit')}>Expenses and profit</span></th>${hcol('rvTrips', 'Trips')}
            </tr></thead>
            <tbody>${body}</tbody>
            <tfoot><tr>
              <td class="cname">TOTAL</td><td class="num">${t.margin == null ? '—' : rvPct(t.margin)}</td><td></td><td class="num">${int(t.trips)}</td>
            </tr></tfoot>
          </table>
        </div>
      </div>`;
    };
    // Highest margin first; groups with no figures last.
    const byMargin = (a, b) => (a.key == null) - (b.key == null) || (b.margin ?? -Infinity) - (a.margin ?? -Infinity);

    const overviewHtml = `
      <div class="panel">
        <div class="ptitle">Trip revenue · ${esc(String((p.byMonth[0] && p.byMonth[0].key) || p.asOf).slice(0, 4))}</div>
        <div class="bvhero trp-tiles">
          <div class="bv-side"><div class="bv-lab"><span ${hlp('rvMargin')}>Margin</span></div><div class="bv-n bv-act">${t.margin == null ? '—' : rvPct(t.margin)}</div></div>
          <div class="bv-side"><div class="bv-lab"><span ${hlp('rvTrips')}>Trips</span></div><div class="bv-n">${int(t.trips)}</div><div class="bv-s">${int(notEntered)} not entered yet</div></div>
        </div>
        ${rvBar(t, 'Year to date', true)}
        ${t.margin == null ? '' : `<div class="rv-leg"><span><i class="rv-exp"></i>Expenses <b>${rvPct(1 - t.margin)}</b> of revenue</span><span><i class="${t.margin < 0 ? 'rv-loss' : 'rv-pro'}"></i>${t.margin < 0 ? 'Loss' : 'Profit'} <b>${rvPct(Math.abs(t.margin))}</b> of revenue</span></div>`}
        ${overdue.length ? `<div class="rv-alert"><b>${int(overdue.length)} trip${overdue.length === 1 ? ' has' : 's have'} ended with no figures entered</b> · ${overdue.map((x) => esc(`${x.name} (${rvDates(x)})`)).join('; ')}</div>` : ''}
      </div>
      ${(p.suggestions || []).length ? `
      <div class="panel">
        <div class="ptitle"><span ${hlp('rvSuggest')}>Suggestions</span> · what to improve</div>
        <div class="rv-sug">${p.suggestions.map((x) => {
          const st = RV_SUG[x.level] || RV_SUG.note;
          return `<div class="rv-s" style="border-left-color:${st.c}"><div class="rv-s-head"><span class="rv-s-tag" style="color:color-mix(in srgb, ${st.c} 50%, var(--strong))"><i>${st.g}</i> ${st.l}</span><b>${esc(x.title)}</b></div><div class="rv-s-text">${esc(x.text)}</div></div>`;
        }).join('')}</div>
      </div>` : ''}
      ${groupTable('By month', 'rvMonth', 'Month', p.byMonth, (g) => rvMonth(g.key))}
      ${groupTable('By programme', 'rvProgramme', 'Programme', [...p.byProgramme].sort(byMargin), (g) => g.key || 'No programme')}`;

    // ---- all trips ----
    const valOf = (x, key) => x[key] || '—';
    const opts = (key) => {
      const list = [...new Set(p.trips.map((x) => valOf(x, key)))];
      if (key === 'result') {
        const order = ['Gain', 'Loss', 'Break-even', 'Not entered'];
        return list.sort((a, b) => ((order.indexOf(a) + 1) || 99) - ((order.indexOf(b) + 1) || 99));
      }
      return list.sort((a, b) => a.localeCompare(b));
    };
    const lists = { programme: opts('programme'), result: opts('result') };
    for (const k of Object.keys(lists)) if (rvFilter[k] !== 'all' && !lists[k].includes(rvFilter[k])) rvFilter[k] = 'all';
    const passes = (x, skip) => Object.keys(lists).every((k) => k === skip || rvFilter[k] === 'all' || valOf(x, k) === rvFilter[k]);
    // Each button counts what it would show given the other filter.
    const pills = (key) => ['all', ...lists[key]].map((v) => {
      const n = p.trips.filter((x) => passes(x, key) && (v === 'all' || valOf(x, key) === v)).length;
      return `<button data-rv-f="${key}" data-rv-v="${attr(v)}" aria-pressed="${rvFilter[key] === v}">${v === 'all' ? 'All' : esc(v)} <span class="ecount">${n}</span></button>`;
    }).join('');
    const shown = p.trips.filter((x) => passes(x));
    const COLS = 4;
    let month = null;
    const tripRows = shown.map((x) => {
      const head = x.month !== month ? `<tr class="rv-month"><td colspan="${COLS}">${esc(rvMonth(x.month))}</td></tr>` : '';
      month = x.month;
      return `${head}
      <tr>
        <td class="cname">${esc(x.name)}<span class="trp-sub">${esc([x.destination, x.programme, rvDates(x)].filter(Boolean).join(' · '))}</span></td>
        <td class="num"><b>${x.margin == null ? '—' : rvPct(x.margin)}</b></td>
        <td class="rv-l">${x.figures ? rvBar(x, x.name) : ''}</td>
        <td class="rv-l">${rvResult(x.result)}</td>
      </tr>`;
    }).join('');
    const tripsHtml = `
      <div class="panel">
        <div class="ptitle">All trips · ${int(shown.length)} of ${int(p.trips.length)}</div>
        <div class="efilters">
          <div class="efilter"><span class="efl">Programme</span><div class="seg">${pills('programme')}</div></div>
          <div class="efilter"><span class="efl">Result</span><div class="seg">${pills('result')}</div></div>
        </div>
        <div class="tscroll">
          <table class="ctable">
            <thead><tr>
              ${hcol('rvTrip', 'Trip')}${hcol('rvMargin', 'Margin')}
              <th class="rv-l"><span ${hlp('rvSplit')}>Expenses and profit</span></th>
              <th class="rv-l"><span ${hlp('rvResult')}>Result</span></th>
            </tr></thead>
            <tbody>${tripRows || `<tr><td class="cname" colspan="${COLS}">No trips match these filters.</td></tr>`}</tbody>
          </table>
        </div>
      </div>`;

    const subtabs = `
      <div class="seg subtabs" role="tablist" aria-label="Trip revenue sections">
        <button role="tab" data-rv-sub="overview" aria-pressed="${rvSub === 'overview'}" aria-selected="${rvSub === 'overview'}">Overview</button>
        <button role="tab" data-rv-sub="trips" aria-pressed="${rvSub === 'trips'}" aria-selected="${rvSub === 'trips'}">All trips <span class="ecount">${int(p.trips.length)}</span></button>
      </div>`;

    $('revenueWrap').innerHTML = `
      ${p.stale ? `<div class="msg err">Showing the last copy of the sheet — ${esc(p.error || 'OneDrive unreachable')}</div>` : ''}
      ${subtabs}
      ${rvSub === 'trips' ? tripsHtml : overviewHtml}`;

    bindHelp($('revenueWrap'));
    $('revenueWrap').querySelectorAll('[data-rv-sub]').forEach((b) => {
      b.addEventListener('click', () => {
        if (rvSub === b.dataset.rvSub) return;
        rvSub = b.dataset.rvSub;
        renderRevenue();
        const bar = $('revenueWrap').querySelector('.subtabs');
        if (bar && bar.getBoundingClientRect().top < 0 && typeof bar.scrollIntoView === 'function') bar.scrollIntoView({ block: 'start' });
      });
    });
    $('revenueWrap').querySelectorAll('[data-rv-f]').forEach((b) => {
      b.addEventListener('click', () => { rvFilter[b.dataset.rvF] = b.dataset.rvV; renderRevenue(); });
    });
  }

  async function loadRevenue(force) {
    try {
      const res = await fetch('/api/sheets?name=revenue' + (force ? '&refresh=1' : ''));
      const p = await res.json();
      if (!res.ok && !p.trips) throw new Error(p.error || `HTTP ${res.status}`);
      revData = p;
      renderRevenue();
      ovSoon();
    } catch (err) {
      if (!revData) $('revenueWrap').innerHTML = `<div class="msg err">Could not load trip revenue: ${esc(err.message)}</div>`;
    }
  }

  /* ================= impact tab (Operations) ================= */

  // The Impact workbook (Anton, 20 Oct 2026): every trip since 2017 and the
  // community work it did. Built in lib/tabs/impact.js; counts match the
  // workbook's own Summary.
  //
  // Made for finding things (Anton, 21 Oct 2026: "easy to navigate and easy
  // to use and filter ... not too complicated"): two tabs. Overview is the
  // headline figures and three charts, and EVERY bar, row and figure opens
  // the matching trips. Find a trip is one search box (school, village,
  // destination, trip code, officer, or any word of the impact), one-tap
  // region and status chips, three dropdowns, the active filters as pills
  // that remove with ×, and a compact list where a row opens to its full
  // impact text.
  let impData = null;
  let imSub = 'overview';
  const imF = { year: 'all', region: 'all', dest: 'all', theme: 'all', status: 'all' };
  let imQ = '';
  const imOpen = new Set();
  // Regions in the validated categorical slots the Leads charts use.
  const IM_COL = { Africa: 'var(--lead-wa)', Asia: 'var(--lead-all)', Other: 'var(--lead-ig)' };
  const IM_ST = { recorded: ['✓ Recorded', 'good'], none: ['○ No impact', 'na'], fill: ['! To fill in', 'warn'], other: ['? Unclear', 'na'] };
  const IM_ST_LABEL = { recorded: 'Recorded', none: 'No impact', fill: 'To fill in' };
  const imDate = (d, withYear) => (d ? new Date(d + 'T00:00:00Z').toLocaleDateString('en-GB', Object.assign({ day: 'numeric', month: 'short', timeZone: 'UTC' }, withYear ? { year: 'numeric' } : {})) : '');
  const imDates = (t) => (t.start && t.end ? `${imDate(t.start)} – ${imDate(t.end, true)}` : t.start ? imDate(t.start, true) : '');
  const imWords = () => imQ.toLowerCase().split(/\s+/).filter(Boolean);
  const imHay = (t) => [t.destination, t.code, t.place, t.officer, t.impact, t.theme, t.type, t.client, t.region, String(t.year)].join(' ').toLowerCase();

  // Every way in to the list goes through here: set the filters, open Find.
  function imGo(filters, q) {
    Object.keys(imF).forEach((k) => { imF[k] = 'all'; });
    Object.assign(imF, filters || {});
    imQ = q || '';
    imSub = 'find';
    renderImpact();
    const w = $('impactWrap');
    if (w.getBoundingClientRect().top < 0) scrollTo(0, w.getBoundingClientRect().top + scrollY - 70);
  }

  function imPass(t, skip) {
    const words = imWords();
    return (skip === 'year' || imF.year === 'all' || String(t.year) === imF.year)
      && (skip === 'region' || imF.region === 'all' || t.group === imF.region)
      && (skip === 'dest' || imF.dest === 'all' || t.destination === imF.dest)
      && (skip === 'theme' || imF.theme === 'all' || t.theme === imF.theme)
      && (skip === 'status' || imF.status === 'all' || t.kind === imF.status)
      && (!words.length || words.every((w) => imHay(t).includes(w)));
  }

  function imOverview(p) {
    const T = p.totals;
    const groups = p.groups || ['Africa', 'Asia', 'Other'];
    const regionTip = (r, title) => `data-tip="${attr(`<div class="tt">${esc(title)}</div>` + groups.map((g) => `<div class="trow"><span class="tk">${esc(g)}</span><b>${int(r[g])}</b></div>`).join('') + `<div class="trow"><span class="tk">Travellers</span><b>${int(r.travellers)}</b></div><div class="more">Tap to see these trips</div>`)}"`;
    const legend = `<div class="im-leg">${groups.map((g) => `<span><i style="background:${IM_COL[g]}"></i>${esc(g)}</span>`).join('')}</div>`;
    const maxYear = Math.max(1, ...p.byYear.map((r) => r.total));
    const yearCols = p.byYear.map((r) => `<button type="button" class="im-col" data-im-go="year" data-v="${r.key}" ${regionTip(r, String(r.key))}>
        <span class="v">${int(r.total)}</span>
        <span class="im-stack" style="height:${((r.total / maxYear) * 100).toFixed(1)}%">${groups.filter((g) => r[g]).map((g) => `<i style="flex:${r[g]};background:${IM_COL[g]}"></i>`).join('')}</span>
        <span class="y">${r.key}</span>
      </button>`).join('');
    const hbars = (list, kind, max) => list.map((r) => `<button type="button" class="im-hrow" data-im-go="${kind}" data-v="${attr(r.key)}" ${regionTip(r, r.key)}>
        <span class="im-hn">${esc(r.key)}</span>
        <span class="im-hb"><span style="width:${((r.total / max) * 100).toFixed(1)}%">${groups.filter((g) => r[g]).map((g) => `<i style="flex:${r[g]};background:${IM_COL[g]}"></i>`).join('')}</span></span>
        <b>${int(r.total)}</b>
      </button>`).join('');
    const dests = p.byDestination.filter((r) => r.key !== 'To confirm');
    return `
      <div class="panel">
        <div class="ptitle">Community impact · ${T.firstYear} – ${T.lastYear}</div>
        <form class="im-search" data-im-search-go>
          <input type="search" placeholder="Search a school, village, destination or trip code…" aria-label="Search the impact log">
          <button class="btn" type="submit">Search</button>
        </form>
        <div class="im-tiles">
          <button type="button" class="im-tile" data-im-go="all"><span>Trips</span><b>${int(T.trips)}</b><small>${int(T.recorded)} with impact recorded</small></button>
          <div class="im-tile"><span>Travellers</span><b>${int(T.travellers)}</b><small>on these trips</small></div>
          <div class="im-tile"><span>Schools &amp; villages</span><b>${int(T.places)}</b><small>named in the log</small></div>
          <div class="im-tile"><span>Destinations</span><b>${int(T.destinations)}</b><small>in Africa, Asia and beyond</small></div>
        </div>
        <div class="im-rec"><span>Impact recorded</span><div class="abar"><div class="abar-fill" style="width:${((T.recorded / Math.max(1, T.trips)) * 100).toFixed(1)}%;background:var(--q-high)"></div></div><b>${pct(T.recorded / Math.max(1, T.trips))}</b></div>
        ${T.toFill ? `<button type="button" class="im-fill" data-im-go="status" data-v="fill"><b>${int(T.toFill)} trip${T.toFill === 1 ? '' : 's'} still need${T.toFill === 1 ? 's' : ''} details</b><span>${[T.missingTrips ? `${int(T.missingTrips)} missing from the log` : '', T.missingImpact ? `${int(T.missingImpact)} with no impact written yet` : ''].filter(Boolean).join(', ')}</span><span class="im-arrow">See them ›</span></button>` : ''}
      </div>
      <div class="panel">
        <div class="im-ph"><div class="ptitle">Trips per year</div><span class="im-hint">Tap a bar to see that year's trips</span></div>
        <div class="im-chart"><div class="im-cols">${yearCols}</div></div>
        ${legend}
      </div>
      <div class="panel">
        <div class="im-ph"><div class="ptitle">By theme</div><span class="im-hint">Tap a theme to see its trips</span></div>
        <div class="im-hlist">${hbars(p.byTheme, 'theme', Math.max(1, ...p.byTheme.map((r) => r.total)))}</div>
        ${legend}
      </div>
      <div class="panel">
        <div class="im-ph"><div class="ptitle">By destination</div><span class="im-hint">Tap a destination to see its trips</span></div>
        <div class="im-hlist">${hbars(dests, 'dest', Math.max(1, ...dests.map((r) => r.total)))}</div>
      </div>`;
  }

  // The filter controls and the results, redrawn as you type or tap, without
  // touching the search box (so it keeps focus).
  function imResults(p) {
    const groups = p.groups || ['Africa', 'Asia', 'Other'];
    const count = (k, v) => p.trips.filter((t) => imPass(t, k) && (k === 'region' ? t.group === v : t.kind === v)).length;
    const chips = (k, list, labelOf) => `<div class="im-chips" role="group">${['all', ...list].map((v) => {
      const n = v === 'all' ? p.trips.filter((t) => imPass(t, k)).length : count(k, v);
      if (v !== 'all' && !n && imF[k] !== v) return '';
      return `<button type="button" data-im-chip="${k}" data-v="${attr(v)}" aria-pressed="${imF[k] === v}">${v === 'all' ? 'All' : esc(labelOf(v))} <span class="ecount">${n}</span></button>`;
    }).join('')}</div>`;
    const opts = (k, valOf, labelOf, sort) => {
      const m = new Map();
      for (const t of p.trips) if (imPass(t, k)) { const v = valOf(t); m.set(v, (m.get(v) || 0) + 1); }
      if (imF[k] !== 'all' && !m.has(imF[k])) m.set(imF[k], 0);
      return [...m].sort(sort).map(([v, n]) => `<option value="${attr(v)}"${imF[k] === v ? ' selected' : ''}>${esc(labelOf(v))} (${n})</option>`).join('');
    };
    const sel = (k, all, o) => `<select data-im-sel="${k}" aria-label="${all}"><option value="all"${imF[k] === 'all' ? ' selected' : ''}>${all}</option>${o}</select>`;
    const shown = p.trips.filter((t) => imPass(t));
    // What's filtering the list right now, each removable on its own.
    const active = [];
    if (imQ.trim()) active.push(['q', `“${imQ.trim()}”`]);
    if (imF.region !== 'all') active.push(['region', imF.region]);
    if (imF.status !== 'all') active.push(['status', IM_ST_LABEL[imF.status] || imF.status]);
    if (imF.year !== 'all') active.push(['year', imF.year]);
    if (imF.dest !== 'all') active.push(['dest', imF.dest]);
    if (imF.theme !== 'all') active.push(['theme', imF.theme]);
    const words = imWords();
    const mark = (s) => {
      let out = esc(s);
      for (const w of words) if (w.length > 1) out = out.replace(new RegExp(`(${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'), '<mark>$1</mark>');
      return out;
    };
    const row = (t) => {
      const [st, cls] = IM_ST[t.kind] || IM_ST.other;
      const open = imOpen.has(t.id);
      const theme = [t.type, t.theme].filter((x, i, a) => x && a.indexOf(x) === i && x !== 'To confirm').join(' · ');
      const detail = [imDates(t), t.code, t.client, t.officer ? `Led by ${t.officer}` : ''].filter(Boolean);
      const text = t.impact || (t.kind === 'none' ? 'No community impact on this trip.' : 'No impact written yet.');
      return `<div class="im-row${open ? ' open' : ''}" data-im-row="${attr(t.id)}" role="button" tabindex="0" aria-expanded="${open}">
        <div class="im-rh"><b>${mark(t.destination)}</b><span class="im-yr">${t.year}</span><span class="im-st ${cls}">${st}</span></div>
        <div class="im-meta">${[theme, t.travellers ? `${int(t.travellers)} travellers` : ''].filter(Boolean).map(esc).join(' · ')}</div>
        ${t.place ? `<div class="im-place">📍 ${mark(t.place)}</div>` : ''}
        <div class="im-txt${t.impact ? '' : ' none'}" dir="auto">${mark(text)}</div>
        ${open ? `<div class="im-more">${detail.map(mark).join(' · ')}</div>` : ''}
        ${t.impact && !open ? '<span class="im-read">Read more ▾</span>' : open ? '<span class="im-read">Show less ▴</span>' : ''}
      </div>`;
    };
    return `
      <div class="im-filters">
        ${chips('region', groups, (v) => v)}
        ${chips('status', ['recorded', 'none', 'fill'], (v) => IM_ST_LABEL[v])}
        <div class="im-sels">
          ${sel('year', 'Any year', opts('year', (t) => String(t.year), (v) => v, (a, b) => b[0].localeCompare(a[0])))}
          ${sel('dest', 'Any destination', opts('dest', (t) => t.destination, (v) => v, (a, b) => b[1] - a[1]))}
          ${sel('theme', 'Any theme', opts('theme', (t) => t.theme, (v) => v, (a, b) => b[1] - a[1]))}
        </div>
      </div>
      <div class="im-count"><b>${int(shown.length)}</b> of ${int(p.trips.length)} trips
        ${active.map(([k, l]) => `<button type="button" class="im-pill" data-im-x="${k}" aria-label="Remove ${attr(l)}">${esc(l)} <span>×</span></button>`).join('')}
        ${active.length > 1 ? '<button type="button" class="im-clear" data-im-clear>Clear all</button>' : ''}
      </div>
      <div class="im-list">${shown.map(row).join('') || `<div class="im-empty">No trips match${imQ.trim() ? ` “${esc(imQ.trim())}”` : ''}. ${active.length ? '<button type="button" class="im-clear" data-im-clear>Clear the filters</button>' : ''}</div>`}</div>`;
  }

  function imBindResults(p) {
    const box = $('imResults');
    if (!box) return;
    const redraw = () => { box.innerHTML = imResults(p); bindHelp(box); imBindResults(p); };
    box.querySelectorAll('[data-im-chip]').forEach((b) => b.addEventListener('click', () => { imF[b.dataset.imChip] = b.dataset.v; redraw(); }));
    box.querySelectorAll('[data-im-sel]').forEach((el) => el.addEventListener('change', () => { imF[el.dataset.imSel] = el.value; redraw(); }));
    box.querySelectorAll('[data-im-x]').forEach((b) => b.addEventListener('click', () => {
      const k = b.dataset.imX;
      if (k === 'q') { imQ = ''; const inp = $('imQ'); if (inp) inp.value = ''; } else imF[k] = 'all';
      redraw();
    }));
    box.querySelectorAll('[data-im-clear]').forEach((b) => b.addEventListener('click', () => {
      Object.keys(imF).forEach((k) => { imF[k] = 'all'; });
      imQ = '';
      const inp = $('imQ'); if (inp) inp.value = '';
      redraw();
    }));
    box.querySelectorAll('[data-im-row]').forEach((el) => {
      const flip = () => { const id = el.dataset.imRow; if (imOpen.has(id)) imOpen.delete(id); else imOpen.add(id); redraw(); };
      el.addEventListener('click', (e) => { if (!window.getSelection || String(window.getSelection()) === '') flip(); });
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
    });
  }

  function renderImpact() {
    const p = impData;
    if (!p) return;
    if (p.error && !p.trips) {
      $('impactWrap').innerHTML = `<div class="msg err">Could not load the impact sheet: ${esc(p.error)}</div>`;
      return;
    }
    const subtabs = `
      <div class="seg subtabs" role="tablist" aria-label="Impact sections">
        <button role="tab" data-im-sub="overview" aria-pressed="${imSub === 'overview'}" aria-selected="${imSub === 'overview'}">Overview</button>
        <button role="tab" data-im-sub="find" aria-pressed="${imSub === 'find'}" aria-selected="${imSub === 'find'}">Find a trip <span class="ecount">${int(p.trips.length)}</span></button>
      </div>`;
    const find = `
      <div class="panel">
        <div class="im-search">
          <input id="imQ" type="search" value="${attr(imQ)}" placeholder="Search a school, village, destination, trip code, officer or any word…" aria-label="Search the impact log" autocomplete="off">
        </div>
        <div id="imResults">${imResults(p)}</div>
      </div>`;
    $('impactWrap').innerHTML = `
      ${p.stale ? `<div class="msg err">Showing the last copy of the sheet — ${esc(p.error || 'SharePoint unreachable')}</div>` : ''}
      ${subtabs}
      ${imSub === 'find' ? find : imOverview(p)}`;
    const w = $('impactWrap');
    bindHelp(w);
    w.querySelectorAll('[data-im-sub]').forEach((b) => b.addEventListener('click', () => { if (imSub !== b.dataset.imSub) { imSub = b.dataset.imSub; renderImpact(); } }));
    // Overview: every bar, row and figure opens the matching trips.
    w.querySelectorAll('[data-im-go]').forEach((b) => b.addEventListener('click', () => {
      const k = b.dataset.imGo;
      imGo(k === 'all' ? {} : { [k]: b.dataset.v });
    }));
    const go = w.querySelector('[data-im-search-go]');
    if (go) go.addEventListener('submit', (e) => { e.preventDefault(); imGo({}, go.querySelector('input').value); setTimeout(() => { const i = $('imQ'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 0); });
    const q = $('imQ');
    if (q) {
      let timer = null;
      q.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(() => { imQ = q.value; const box = $('imResults'); box.innerHTML = imResults(p); bindHelp(box); imBindResults(p); }, 150);
      });
    }
    imBindResults(p);
  }

  async function loadImpact(force) {
    try {
      const res = await fetch('/api/sheets?name=impact' + (force ? '&refresh=1' : ''));
      const p = await res.json();
      if (!res.ok && !p.trips) throw new Error(p.error || `HTTP ${res.status}`);
      impData = p;
      renderImpact();
    } catch (err) {
      if (!impData) $('impactWrap').innerHTML = `<div class="msg err">Could not load the impact sheet: ${esc(err.message)}</div>`;
    }
  }

  /* ================= pending task tab (monday.com) ================= */

  let monData = null;
  // Which workspace tab is open: 'all' or a workspace name.
  let monTab = 'Marketing';
  // Tabs follow the monday workspaces (Anton, 13 Oct 2026: the sales tasks
  // moved to the Sales workspace, its General board): Marketing, Sales and
  // Operations. Any other workspace gets a tab of its own.
  const MON_TABS = ['Marketing', 'Sales', 'Operations'];
  const monSection = (i) => i.workspace || 'Other';
  const MON_MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const monDay = (iso) => `${Number(iso.slice(8, 10))} ${MON_MON[Number(iso.slice(5, 7)) - 1]}${iso.slice(0, 4) !== String(new Date().getFullYear()) ? ` ${iso.slice(0, 4)}` : ''}`;
  // monday's own status colour, passed through only if it's a plain hex.
  const monColor = (c) => (/^#[0-9a-f]{3,8}$/i.test(String(c || '')) ? c : 'var(--q-none)');
  // One colour per person, light enough for dark initials on the navy cards.
  // Assigned in alphabetical order over everyone on the boards, so a person
  // keeps their colour on every tab; names are always written beside it.
  const MON_PEOPLE = ['#5fb0f0', '#7fd8a4', '#f39a8f', '#c3a1f5', '#ffbe85', '#6ed8d4', '#ee9fcb', '#bccf72', '#a8b6ff', '#e6c56b', '#8fd0ff', '#d6a4a4'];
  const monInitials = (n) => String(n).trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();

  // Who the "Show" filter is set to: 'all', a person, or MON_NOBODY.
  let monWho = 'all';
  const MON_NOBODY = '__none__';

  function renderPending() {
    const p = monData;
    if (!p) return;
    if (p.error && !p.items) {
      $('pendingWrap').innerHTML = `<div class="msg err">Could not load monday.com: ${esc(p.error)}</div>`;
      return;
    }
    const everyone = [...new Set(p.items.flatMap((i) => i.people))].sort((a, b) => a.localeCompare(b));
    const colorOf = new Map(everyone.map((n, k) => [n, MON_PEOPLE[k % MON_PEOPLE.length]]));
    // No "All" tab (Anton, 5 Oct 2026): it opens on Marketing.
    const tabs = [...MON_TABS, ...[...new Set(p.items.map(monSection))].filter((w) => !MON_TABS.includes(w))];
    if (!tabs.includes(monTab)) monTab = tabs[0];
    if (monWho !== 'all' && monWho !== MON_NOBODY && !everyone.includes(monWho)) monWho = 'all';
    const inTab = (i) => monSection(i) === monTab;
    const isWho = (i) => monWho === 'all' || (monWho === MON_NOBODY ? !i.people.length : i.people.includes(monWho));
    // Grouped by first assignee, so each person's colour runs together;
    // unassigned last.
    const tabItems = p.items.filter(inTab);
    const whoCount = (n) => tabItems.filter((i) => (n === MON_NOBODY ? !i.people.length : i.people.includes(n))).length;
    // Someone picked in Show who has nothing on this tab: back to Everyone,
    // rather than an empty list under a menu that no longer lists them.
    if (monWho !== 'all' && !whoCount(monWho)) monWho = 'all';
    const shown = p.items.filter((i) => inTab(i) && isWho(i)).sort((a, b) =>
      (!a.people.length) - (!b.people.length)
      || String(a.people[0] || '').localeCompare(String(b.people[0] || ''))
      || String(a.board).localeCompare(String(b.board)));
    const options = [
      `<option value="all"${monWho === 'all' ? ' selected' : ''}>Everyone (${tabItems.length})</option>`,
      ...everyone.filter((n) => whoCount(n)).map((n) => `<option value="${attr(n)}"${monWho === n ? ' selected' : ''}>${esc(n)} (${whoCount(n)})</option>`),
      whoCount(MON_NOBODY) ? `<option value="${MON_NOBODY}"${monWho === MON_NOBODY ? ' selected' : ''}>No one assigned (${whoCount(MON_NOBODY)})</option>` : '',
    ].join('');

    const avatars = (i) => {
      if (!i.people.length) return `<span class="mon-av" ${tipOf('Assigned to', [['', 'No one yet']])}><i class="none">?</i></span>`;
      const max = 3;
      const faces = i.people.slice(0, max).map((n) => `<i style="--who:${colorOf.get(n)}">${esc(monInitials(n))}</i>`).join('');
      const more = i.people.length > max ? `<i class="more">+${i.people.length - max}</i>` : '';
      return `<span class="mon-av" ${tipOf('Assigned to', i.people.map((n) => ['', n]))}>${faces}${more}</span>`;
    };
    const row = (i) => `
      <div class="mon-row">
        <div class="mon-task" title="${attr(i.name)}">${esc(i.name)}</div>
        <div class="mon-stc"><span class="mon-st" style="--st:${monColor(i.statusColor)}">${esc(i.status || 'Not Started')}</span></div>
        <div class="mon-due${i.due ? '' : ' none'}">${i.due ? (i.overdue ? `<span class="mon-late">▼ ${esc(monDay(i.due))}</span>` : esc(monDay(i.due))) : '—'}</div>
        <div class="mon-where">${esc(i.group || '')}</div>
        ${avatars(i)}
        ${i.url ? `<a class="mon-open" href="${attr(i.url)}" target="_blank" rel="noopener" title="Open in monday">↗</a>` : '<span></span>'}
      </div>`;

    $('pendingWrap').innerHTML = `
      ${p.stale ? `<div class="msg err">Showing the last copy from monday.com — ${esc(p.error || 'monday unreachable')}</div>` : ''}
      <div class="mon-top">
        <div>
          <h2>Pending Tasks<small>${int(shown.length)} task${shown.length === 1 ? '' : 's'} · live from monday.com</small></h2>
          <div class="mon-tabs" role="tablist" aria-label="Workspaces">
            ${tabs.map((w) => `<button role="tab" data-mon-tab="${attr(w)}" aria-pressed="${monTab === w}" aria-selected="${monTab === w}">${esc(w)}<span>${int(p.items.filter((i) => monSection(i) === w).length)}</span></button>`).join('')}
          </div>
        </div>
        <label class="mon-show">Show <select id="monWho">${options}</select></label>
      </div>
      ${shown.length ? `
      <div class="mon-headrow"><span>Task</span><span>Status</span><span>Due date</span><span>Board</span><span style="text-align:right">Assignees</span><span></span></div>
      <div class="mon-list">${shown.map(row).join('')}</div>` : '<div class="mon-empty">Nothing pending here.</div>'}`;

    bindHelp($('pendingWrap'));
    $('pendingWrap').querySelectorAll('[data-mon-tab]').forEach((b) => {
      b.addEventListener('click', () => { monTab = b.dataset.monTab; renderPending(); });
    });
    const sel = $('pendingWrap').querySelector('#monWho');
    if (sel) sel.addEventListener('change', () => { monWho = sel.value; renderPending(); });
  }

  async function loadPending(force) {
    try {
      const res = await fetch('/api/sheets?name=pending' + (force ? '&refresh=1' : ''));
      const p = await res.json();
      if (!res.ok && !p.items) throw new Error(p.error || `HTTP ${res.status}`);
      monData = p;
      renderPending();
      ovSoon();
    } catch (err) {
      if (!monData) $('pendingWrap').innerHTML = `<div class="msg err">Could not load monday.com: ${esc(err.message)}</div>`;
    }
  }

  /* ================= KPIs (Corporate) ================= */

  // Every sales and marketing KPI as Passed or Failed, with why and what to
  // adjust (Muatasam, 12 Oct 2026: he only wants to see what passed and what
  // failed). Computed in lib/kpis.js from the same data as each tab.
  let kpiData = null;
  let kpOpen = false; // the campaign cost-per-result accordion
  const KP_STATUS = { pass: ['✓ Passed', 'pass'], fail: ['✗ Failed', 'fail'], na: ['○ Not checked', 'na'] };
  const KP_ORDER = { fail: 0, pass: 1, na: 2 };

  // Laid out calmly (Anton, 19 Oct 2026: "more clean and clear and not too
  // hurting to the eye"): a quiet summary, then one list, failed first, each
  // row its status, the KPI and target, why, and for a failure the next step.
  // No glowing boxes, no red/green strip; colour only on the small status.
  let kpShow = 'all'; // 'all' | 'fail' | 'pass'
  function renderKpis() {
    const p = kpiData;
    if (!p) return;
    if (p.error && !p.kpis) {
      $('kpisWrap').innerHTML = `<div class="msg err">Could not check the KPIs: ${esc(p.error)}</div>`;
      return;
    }
    const CPR = 'Cost per result';
    const statusOf = (list) => (list.some((k) => k.status === 'fail') ? 'fail' : list.every((k) => k.status === 'na') ? 'na' : 'pass');
    // The per-campaign cost rows count as one KPI, as the list shows them.
    const items = (area) => {
      const list = p.kpis.filter((k) => !area || k.area === area);
      const camps = list.filter((k) => k.group === CPR);
      const out = list.filter((k) => k.group !== CPR).map((k) => ({ k, status: k.status }));
      if (camps.length) out.push({ group: camps, status: statusOf(camps) });
      return out;
    };
    const all = items();
    const passed = all.filter((x) => x.status === 'pass').length;
    const failed = all.filter((x) => x.status === 'fail').length;
    const unchecked = all.filter((x) => x.status === 'na').length;
    const total = passed + failed;
    const rate = total ? passed / total : 0;

    const listTip = (k) => (k.details && k.details.length ? ` <span class="kp-more" data-tip="${attr(
      `<div class="tt">${esc(k.detailTitle || k.name)}</div>`
      + k.details.map((d) => `<div class="trow"><span class="tk">${esc(d.label)}</span><b>${esc(d.value)}</b></div>`).join(''),
    )}">See the list</span>` : '');
    const nameTip = (name, about) => (about
      ? `<span class="kp-name" data-tip="${attr(`<div class="tt">${esc(name)}</div><div class="more">${esc(about)}</div>`)}">${esc(name)}</span>`
      : esc(name));
    const ICON = { pass: '✓', fail: '✗', na: '○' };
    const WORD = { pass: 'Passed', fail: 'Failed', na: 'Not checked' };
    const rowHtml = (k, child) => {
      const camp = k.group === CPR;

      const bad = list.filter((k) => k.status === 'fail');

        <div class="kp-main">
          <div class="kp-n">${nameTip('Cost per result · running campaigns', list[0].about)}</div>

        </div>
        <div class="kp-body">
          <div class="kp-why">${bad.length ? `${bad.length} of ${list.length} running campaigns over ${esc(lim)}: ${esc(names.join(', '))}.` : `All ${list.length} running campaigns within ${esc(lim)}.`}</div>
          ${bad.length ? '<div class="kp-do"><b>Next step</b> Refresh the creative or narrow the audience of the ones over the limit, and pause any that stay over.</div>' : ''}
          <span class="kp-open">${kpOpen ? 'Hide' : 'Show'} the ${list.length} campaign${list.length === 1 ? '' : 's'} ${kpOpen ? '▴' : '▾'}</span>
        </div>
      </div>
      ${kpOpen ? `<div class="kp-sub">${list.slice().sort((x, y) => KP_ORDER[x.status] - KP_ORDER[y.status]).map((k) => rowHtml(k, true)).join('')}</div>` : ''}`;
    };
    const area = (name) => {

        .sort((x, y) => KP_ORDER[x.status] - KP_ORDER[y.status]);
      const mine = items(name);
      const ok = mine.filter((x) => x.status === 'pass').length;
      const n = mine.filter((x) => x.status !== 'na').length;
      return `<div class="panel">
        <div class="kp-ah"><div class="ptitle">${esc(name)}</div><span class="kp-ac">${ok} of ${n} passed</span></div>
        <div class="kp-list">${list.map((x) => (x.group ? groupHtml(x.group, x.status) : rowHtml(x.k))).join('') || '<div class="pnote">Nothing here with this filter.</div>'}</div>
      </div>`;
    };
    const day = new Date(`${p.today}T00:00:00Z`).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
    const bar = (name) => {
      const mine = items(name);
      const ok = mine.filter((x) => x.status === 'pass').length;
      const n = mine.filter((x) => x.status !== 'na').length;
      return `<div class="kp-area"><span>${esc(name)}</span><b>${ok}<small> of ${n}</small></b><i><u style="width:${n ? (ok / n) * 100 : 0}%"></u></i></div>`;
    };
    const chip = (v, label, n) => `<button data-kp-show="${v}" aria-pressed="${kpShow === v}">${label} <span class="ecount">${n}</span></button>`;
    $('kpisWrap').innerHTML = `
      ${p.stale ? `<div class="msg err">Showing the last check — ${esc(p.error || 'a source was unreachable')}</div>` : ''}
      <div class="panel">
        <div class="ptitle">KPIs · ${esc(day)} · sales and marketing</div>
        <div class="kp-hero">
          <div class="kp-ring">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <circle class="kp-ring-bg" cx="60" cy="60" r="52"/>
              <circle class="kp-ring-fg" cx="60" cy="60" r="52" stroke-dasharray="${(rate * 326.7).toFixed(1)} 326.7" transform="rotate(-90 60 60)"/>
            </svg>
            <div class="kp-ring-n"><b>${int(passed)}</b><span>of ${int(total)}</span></div>
          </div>
          <div class="kp-sum">
            <div class="kp-big">${total ? `${int(passed)} of ${int(total)} KPIs passed` : 'No KPI checked yet'}</div>
            <div class="kp-counts"><span class="kp-c pass">✓ ${int(passed)} passed</span><span class="kp-c fail">✗ ${int(failed)} failed</span>${unchecked ? `<span class="kp-c na">○ ${int(unchecked)} not checked</span>` : ''}</div>
          </div>
          <div class="kp-areas">${bar('Sales')}${bar('Marketing')}</div>
        </div>
      </div>
      <div class="kp-filter seg">${chip('all', 'All', all.length)}${chip('fail', 'Failed', failed)}${chip('pass', 'Passed', passed)}</div>
      ${area('Sales')}
      ${area('Marketing')}`;
    bindHelp($('kpisWrap'));
    $('kpisWrap').querySelectorAll('[data-kp-show]').forEach((b) => b.addEventListener('click', () => { kpShow = b.dataset.kpShow; renderKpis(); }));
    $('kpisWrap').querySelectorAll('[data-kp-toggle]').forEach((el) => {
      const go = () => { kpOpen = !kpOpen; renderKpis(); };
      el.addEventListener('click', (e) => { if (!e.target.closest('.kp-name, .kp-more')) go(); });
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
  }

      const p = await res.json();
      if (!res.ok && !p.kpis) throw new Error(p.error || `HTTP ${res.status}`);

  /* ================= theme + session ================= */

  // Light / dark switch, top right (Anton, 18 Oct 2026). Light is the
  // default; a device that picks dark keeps it (localStorage nomuTheme).
  (() => {
    const btn = $('themeToggle');
    const sync = () => {
      const light = document.documentElement.dataset.theme === 'light';

  (() => {

      const res = await realFetch(...args);

      if (res.status === 401 && url.startsWith('/api/') && !url.startsWith('/api/advisor') && !reloading) {

  /* ================= install as an app ================= */

  // Settings › Install app (Anton, 18 Oct 2026, instead of the .exe): installs
  // the dashboard as an app (a PWA) with its own icon and window. Chrome and
  // Edge show their install prompt; Safari and others get the steps. Hidden
  // when the dashboard is already running as the installed app. sw.js caches
  // nothing, so the app always shows the live site.
  (() => {
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
    const btn = $('installApp');
    const installed = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    if (!installed) btn.hidden = false;
    let deferred = null;
    addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; });
    addEventListener('appinstalled', () => { btn.hidden = true; });
    const steps = () => {
      const ua = navigator.userAgent;
      if (/iPhone|iPad|iPod/.test(ua)) return 'On iPhone or iPad: tap the Share button, then "Add to Home Screen".';
      if (/Safari/.test(ua) && !/Chrome|Chromium|Edg/.test(ua)) return 'In Safari on a Mac: open the File menu and choose "Add to Dock".';
      if (/Firefox/.test(ua)) return "Firefox can't install apps. Open the dashboard in Chrome, Edge or Safari to install it.";
      return 'Use the install icon at the right end of the address bar, or the browser menu, then "Install NomuHub CRM".';
