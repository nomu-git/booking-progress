  /* ================= AI Adviser ================= */

  // Chat with the dashboard adviser (api/advisor.js): dashboard and strategy
  // questions only, read-only, 10 questions a day shared (Anton, 15 Oct 2026).
  (() => {
    const wrap = $('adv');
    const panel = $('advPanel');
    const btn = $('advBtn');
    const msgs = $('advMsgs');
    const input = $('advInput');
    const send = $('advSend');
    const foot = $('advFoot');
    const STARTERS = [
      'What are our biggest problems right now?',
      'Which campaign should we fix or pause, and why?',
      'How can we get conversion above 10%?',
      'Summarise this week in 5 bullet points.',
    ];
    let history = [];
    try { history = JSON.parse(sessionStorage.getItem('nomuAdvisor') || '[]'); } catch (e) { history = []; }
    let busy = false;
    let left = null;
    let limit = 10;

    // A small, safe markdown subset: escape first, then **bold**, headings
    // and bullet lines.
    const md = (t) => esc(t).split('\n').map((line) => {
      let l = line.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
      if (/^#{1,4}\s+/.test(l)) return `<div class="adv-h">${l.replace(/^#{1,4}\s+/, '')}</div>`;
      if (/^\s*[-*•]\s+/.test(l)) return `<div class="adv-li">${l.replace(/^\s*[-*•]\s+/, '')}</div>`;
      if (/^\s*\d+[.)]\s+/.test(l)) return `<div class="adv-li num">${l.replace(/^\s*(\d+)[.)]\s+/, '<i>$1.</i> ')}</div>`;
      return l.trim() ? `<p>${l}</p>` : '';
    }).join('');

    const setFoot = () => {
      foot.textContent = left == null ? 'Reads every tab · read-only'
        : left > 0 ? `${left} of ${limit} questions left today · read-only`
          : `Today's ${limit} questions are used up · back at midnight (Muscat)`;
      const out = left === 0;
      input.disabled = out || busy;
      send.disabled = out || busy;
      foot.classList.toggle('out', out);
    };

    const render = (pending) => {
      const items = history.map((m) => `<div class="adv-m ${m.role === 'user' ? 'me' : 'ai'}${m.kind ? ` ${m.kind}` : ''}">${m.kind === 'deep' ? '<div class="adv-tag">Deep analysis</div>' : ''}${m.role === 'user' ? esc(m.content) : md(m.content)}</div>`);
      if (!history.length) {
        items.push(`<div class="adv-hi"><b>Hi! I read every tab of the dashboard.</b> Ask me what's working, what isn't, and what to improve. I can't change anything, I only advise.</div>`
          + `<div class="adv-chips">${STARTERS.map((q) => `<button type="button" data-q="${attr(q)}">${esc(q)}</button>`).join('')}</div>`);
      }
      if (pending) items.push('<div class="adv-m ai wait"><span></span><span></span><span></span> Reading the dashboard… detailed questions can take a minute or two.</div>');
      msgs.innerHTML = items.join('');
      msgs.querySelectorAll('[data-q]').forEach((b) => b.addEventListener('click', () => ask(b.dataset.q)));
      msgs.scrollTop = msgs.scrollHeight;
    };

    const save = () => { try { sessionStorage.setItem('nomuAdvisor', JSON.stringify(history.slice(-12))); } catch (e) { /* private mode */ } };

    async function refreshLeft() {
      try {
        const r = await fetch('/api/advisor');
        const j = await r.json();
        limit = j.limit || 10;
        left = j.connected ? j.remaining : 0;
        if (!j.connected) foot.textContent = 'The adviser is not connected yet.';
        else setFoot();
      } catch (e) { /* leave as is */ }
    }

    async function ask(q) {
      q = String(q || '').trim();
      if (!q || busy || left === 0) return;
      busy = true;
      const prior = history.filter((m) => m.kind !== 'error').slice(-6).map(({ role, content }) => ({ role, content }));
      history.push({ role: 'user', content: q });
      input.value = '';
      setFoot();
      render(true);
      try {
        const r = await fetch('/api/advisor', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q, history: prior }),
        });
        const j = await r.json().catch(() => ({}));
        if (j.remaining != null) left = j.remaining;
        if (r.ok && j.answer) history.push({ role: 'assistant', content: j.answer, kind: j.kind === 'answer' ? (j.deep ? 'deep' : '') : 'note' });
        // No JSON back means the platform cut the request off (it ran too
        // long), not a handled error; say so rather than "something went wrong".
        else history.push({ role: 'assistant', content: j.error || (r.status === 504 || r.status === 502
          ? 'That one took too long to answer. Try splitting it into two or three shorter questions.'
          : `The adviser could not answer (error ${r.status}). Please try again.`), kind: 'error' });
      } catch (e) {
        history.push({ role: 'assistant', content: 'Could not reach the adviser. Please try again.', kind: 'error' });
      }
      busy = false;
      save();
      setFoot();
      render(false);
      if (left !== 0) input.focus();
    }

    const setOpen = (on) => {
      panel.hidden = !on;
      wrap.classList.toggle('open', on);
      btn.setAttribute('aria-expanded', String(on));
      if (on) { render(false); refreshLeft(); setTimeout(() => input.focus(), 50); }
    };
    btn.addEventListener('click', () => setOpen(panel.hidden));
    $('advClose').addEventListener('click', () => { setOpen(false); btn.focus(); });
    // New chat: clears this conversation (it doesn't give back today's count).
    $('advNew').addEventListener('click', () => {
      if (busy) return;
      history = [];
      save();
      render(false);
      input.focus();
    });
    $('advForm').addEventListener('submit', (e) => { e.preventDefault(); ask(input.value); });
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(input.value); } });
    addEventListener('keydown', (e) => { if (e.key === 'Escape' && !panel.hidden) setOpen(false); });
    // A click on something a re-render just removed isn't "outside".
    document.addEventListener('click', (e) => { if (!panel.hidden && e.target.isConnected && !wrap.contains(e.target)) setOpen(false); });
  })();

  /* ================= Dashboard (executive overview) ================= */

  // What the executives check first (Anton, 19 Oct 2026, from his meeting
  // with Shakir, who built HASA's EMMS; Muatasam the same day: "Add daily,
  // weekly, monthly KPIs" and make it "executive and clear focused"). The
  // KPI scorecard comes first: each KPI judged for yesterday, this week and
  // this month. Then one card per area, then bookings by month and the next
  // departures. Every row and card opens the page with the details. Nothing
  // is fetched just for this page: it reads the data each page already
  // loads, so the two can never disagree. Trip Revenue stays percentages
  // only (Muatasam, 4 Oct 2026), so the margin card has no amount.
  let ovCat = 'all';
  let ovMonths = 12;
  let ovGran = 'month'; // bookings chart: 'month' | 'year' (Anton, 19 Oct 2026)
  let ovTimer = null;
  function ovSoon() {
    if (view !== 'overview') return;
    clearTimeout(ovTimer);
    ovTimer = setTimeout(renderOverview, 80);
  }

  const OV_DEST = { JP: 'Japan', ZNZ: 'Zanzibar', TH: 'Thailand', VN: 'Vietnam', KO: 'Korea', NP: 'Nepal', KN: 'Kenya', SAL: 'Salalah', SL: 'Sri Lanka', PH: 'Philippines', BA: 'Bali', SA: 'South Africa', MO: 'Morocco', ALAULA: 'AlUla' };
  const OV_PROG = { WL: 'Wellness', EX: 'Explore', BL: 'Building', TA: 'Teaching', MED: 'Medical' };
  const ovCatName = (key) => {
    if (key === 'Other') return 'Other (no destination in the title)';
    const [d, g] = key.split('|');
    return (OV_DEST[d] || d) + (g ? ' · ' + (OV_PROG[g] || g) : '');
  };

  const OV_ICON = {
    target: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>',
    wallet: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12.5h2M3 9h18"/>',
    smile: '<circle cx="12" cy="12" r="8.5"/><path d="M8.5 14a4 4 0 0 0 7 0"/><path d="M9 9.5h.01M15 9.5h.01"/>',
    percent: '<path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.3"/><circle cx="17" cy="17" r="2.3"/>',
    gauge: '<path d="M4 19h16"/><path d="M7 15l3-4 3 2 4-6"/><circle cx="17" cy="7" r="1.5"/>',
    tasks: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 11l2 2 4-4M9 17h6"/>',
  };
  const ovSvg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${OV_ICON[k]}</svg>`;

  const ovToday = () => new Date(Date.now() + 4 * 3600e3).toISOString().slice(0, 10);
  const ovAdd = (day, n) => new Date(Date.parse(day + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
  const ovDiff = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);
  const ovMon = (ym, long) => new Date(ym + '-01T00:00:00Z').toLocaleDateString('en-GB', { month: long ? 'long' : 'short', timeZone: 'UTC' });
  const ovDate = (day) => new Date(day + 'T00:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
  const ovWeekday = (day) => new Date(day + 'T00:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
  const ovPct = (x, dp) => (Number.isFinite(x) ? (x * 100).toFixed(dp == null ? 0 : dp) + '%' : '—');

  // Of the bookings taken between two days, how many came from repeat
  // customers (previous-trips' per-day repeat counts, which span any month).
  function ovRepeat(start, end) {
    const months = previousTrips && previousTrips.sales && previousTrips.sales.months;
    if (!months) return null;
    let n = 0;
    for (let d = start; d <= end; d = ovAdd(d, 1)) {
      const m = months[d.slice(0, 7)];
      if (m && m.repByDay) n += m.repByDay[Number(d.slice(8, 10)) - 1] || 0;
    }
    return n;
  }

  // Bookings taken between two days, charters out, as the Report counts them.
  function ovBooked(start, end) {
    if (!report || !report.events) return null;
    let n = 0;
    for (const e of report.events) {
      if (e.x || !e.n) continue;
      const d = omanDay(e.at);
      if (d >= start && d <= end) n += e.n;
    }
    return n;
  }

  // Leads and high potential leads Marina logged between two days. Days come
  // from the daily sheet; weeks only her weekly report covers (late July to
  // mid September) count whole, by their first day.
  // Since 25 Oct 2026 (Anton): ManyChat's automatic count from the day it
  // started counting (mcData.first, 21 Oct 2026), Marina's sheet for every day
  // before that, so past periods keep their history. ManyChat days are only
  // finished days; today counts only for the daily column's "Today so far"
  // (`withToday`). If ManyChat can't be read, the sheet covers everything.
  function ovLeads(start, end, withToday) {
    if (!leads || !leads.weeks) return null;
    if (mcData === null) return null; // still loading
    const mcFirst = mcData && mcData.first && Array.isArray(mcData.days) ? mcData.first : null;
    let n = 0, hp = 0, days = 0, hpDays = 0;
    const dates = new Set(); // the days these leads cover, for conversion
    const sheetEnd = mcFirst && mcFirst <= end ? ovAdd(mcFirst, -1) : end;
    for (const w of leads.weeks) {
      if (w.days && w.days.length) {
        for (const d of w.days) {
          if (!d.recorded || d.future || d.date < start || d.date > sheetEnd) continue;
          n += d.total || 0; days += 1; dates.add(d.date);
          if (d.hp != null) { hp += d.hp; hpDays += 1; }
        }
      } else if (w.start >= start && w.start <= sheetEnd) {
        const len = ovDiff(w.start, w.end) + 1;
        n += w.total || 0; days += len;
        for (let i = 0; i < len; i += 1) dates.add(ovAdd(w.start, i));
        if (w.hp != null) { hp += w.hp; hpDays += len; }
      }
    }
    if (mcFirst && mcFirst <= end) {
      const today = ovToday();
      const last = withToday ? today : ovAdd(today, -1);
      const by = new Map(mcData.days.map((d) => [d.date, d]));
      for (let d = start > mcFirst ? start : mcFirst; d <= end && d <= last; d = ovAdd(d, 1)) {
        const x = by.get(d) || {};
        n += x.leads || 0; hp += x.hp || 0; days += 1; hpDays += 1; dates.add(d);
      }
    }
    return { n, hp, days, hpDays, dates, mcFirst };
  }

  /* ---- KPI scorecard: daily, weekly, monthly ---- */

  // Daily is yesterday, the last whole day (and the one Marina has logged);
  // weekly and monthly are this week (Sunday to Saturday, as the Report) and
  // this month so far, judged on pace.
  // Each column can be set to a specific day, week or month (Anton, 19 Oct
  // 2026); null means the default (yesterday, this week, this month). A
  // finished period is judged against its whole target; the current one on
  // pace.
  let ovPickDay = null;
  let ovPickWeek = null;
  let ovPickMonth = null;
  const ovWeekStart = (day) => ovAdd(day, -new Date(day + 'T00:00:00Z').getUTCDay());
  const ovMonthEnd = (ym) => ovAdd(ovAdd(ym + '-01', 32).slice(0, 7) + '-01', -1);
  // How far back the pickers go: the Report's bookings reach about 300 days.
  const OV_BACK_WEEKS = 40;
  const OV_BACK_MONTHS = 12;
  function ovPeriods(today) {
    const y = ovAdd(today, -1);
    const day = ovPickDay && ovPickDay <= today ? ovPickDay : y;
    const curWs = ovWeekStart(today);
    const ws = ovPickWeek && ovPickWeek <= curWs ? ovPickWeek : curWs;
    const we = ovAdd(ws, 6);
    const m = ovPickMonth && ovPickMonth <= today.slice(0, 7) ? ovPickMonth : today.slice(0, 7);
    const ms = m + '-01';
    const me = ovMonthEnd(m);
    const clip = (e) => (e < today ? e : today);
    return [
      { key: 'd', head: 'Daily', start: day, end: day, len: 1, gone: 1, done: day < today, value: day },
      { key: 'w', head: 'Weekly', start: ws, end: clip(we), len: 7, gone: Math.min(7, ovDiff(ws, today) + 1), done: we < today, value: ws },
      { key: 'm', head: 'Monthly', start: ms, end: clip(me), len: ovDiff(ms, me) + 1, gone: Math.min(ovDiff(ms, me) + 1, ovDiff(ms, today) + 1), done: me < today, value: m },
    ];
  }
  // The picker in each column's heading.
  function ovPicker(p, today) {
    if (p.key === 'd') {
      return `<label class="ovk-pick"><select data-ovp="d" aria-label="Day">${[...Array(60)].map((_, i) => {
        const d = ovAdd(today, -i);
        const t = i === 0 ? 'Today so far' : i === 1 ? 'Yesterday' : ovWeekday(d);
        return `<option value="${d}"${d === p.value ? ' selected' : ''}>${esc(t)}</option>`;
      }).join('')}</select></label><small>${esc(ovWeekday(p.value))}</small>`;
    }
    if (p.key === 'w') {
      const cur = ovWeekStart(today);
      return `<label class="ovk-pick"><select data-ovp="w" aria-label="Week">${[...Array(OV_BACK_WEEKS)].map((_, i) => {
        const ws = ovAdd(cur, -7 * i);
        const span = `${ovDate(ws)} – ${ovDate(ovAdd(ws, 6))}`;
        const t = i === 0 ? 'This week' : i === 1 ? 'Last week' : span;
        return `<option value="${ws}"${ws === p.value ? ' selected' : ''}>${esc(t)}</option>`;
      }).join('')}</select></label><small>${esc(`${ovDate(p.value)} – ${ovDate(ovAdd(p.value, 6))}`)}</small>`;
    }
    let ym = today.slice(0, 7);
    const opts = [];
    for (let i = 0; i < OV_BACK_MONTHS; i += 1) {
      const t = i === 0 ? 'This month' : `${ovMon(ym)} ${ym.slice(0, 4)}`;
      opts.push(`<option value="${ym}"${ym === p.value ? ' selected' : ''}>${esc(t)}</option>`);
      ym = ovAdd(ym + '-01', -1).slice(0, 7);
    }
    return `<label class="ovk-pick"><select data-ovp="m" aria-label="Month">${opts.join('')}</select></label><small>${esc(`${ovMon(p.value, true)} ${p.value.slice(0, 4)}`)}</small>`;
  }

  // One cell: { v, of, ok, bar, mark, note } or { na: 'why' } or null while loading.
  function ovCell(c) {
    if (c == null) return '<div class="ovk-cell wait"><div class="ovk-v"><b>…</b></div><div class="ovk-n">Loading</div></div>';
    if (c.na) return `<div class="ovk-cell na"><div class="ovk-v"><b>—</b></div><div class="ovk-n">${esc(c.na)}</div></div>`;
    const st = c.ok ? 'good' : 'bad';
    const w = Math.max(0, Math.min(1, c.bar || 0)) * 100;
    const mark = c.mark != null && c.mark > 0 && c.mark < 1 ? `<b style="left:${(c.mark * 100).toFixed(1)}%"></b>` : '';
    return `<div class="ovk-cell ${st}">
      <div class="ovk-v"><b>${c.v}</b>${c.of != null ? `<small> of ${c.of}</small>` : ''}<span class="ovk-st">${c.ok ? '✓' : '✗'}</span></div>
      <div class="ov-track"><i class="${st}" style="width:${w.toFixed(1)}%"></i>${mark}</div>
      <div class="ovk-n">${c.note || ''}</div>
    </div>`;
  }

  function ovScore(today) {
    const P = ovPeriods(today);
    const W = (report && report.weeklyTarget) || 12;
    const LT = LEADS_DAILY_TARGET;
    const HT = HP_DAILY_TARGET;
    const fmt1 = (x) => (Math.round(x * 10) / 10).toString();
    const DAILY_BOOKINGS = 2;
    const rows = [];

    // Bookings: 12 a week, scaled to the period and judged on pace by today.
    const salesMonths = previousTrips && previousTrips.sales && previousTrips.sales.months;
    rows.push({ go: 'report', name: 'Bookings', target: `${DAILY_BOOKINGS} a day, ${W} a week`, extra: report && report.events ? `${int(last24hTotal(report.events))} in the last 24 hours` : '', cells: P.map((p) => {
      // A whole month comes from the monthly sales series (it reaches back
      // further than the Report's events); a day or week from the events.
      const n = p.key === 'm' && salesMonths ? ((salesMonths[p.value] || {}).n || 0) : ovBooked(p.start, p.end);
      if (n == null) return null;
      // Daily is a round 2 (Anton, 19 Oct 2026), not 12 ÷ 7.
      const target = p.key === 'd' ? DAILY_BOOKINGS : (W * p.len) / 7;
      const expected = p.key === 'd' || p.done ? target : (W * p.gone) / 7;
      const ok = n >= expected;
      const short = Math.ceil(target - n);
      const rp = n ? ovRepeat(p.start, p.end) : 0;
      const split = n && rp != null ? ` · ${int(n - rp)} new, ${int(rp)} repeat` : '';
      return { v: int(n), of: int(target), ok, bar: n / target, mark: p.key === 'd' || p.done ? null : expected / target,
        note: (p.key === 'd' || p.done ? (ok ? 'Target reached' : `${int(short)} short`) : `${ok ? 'On pace' : 'Behind pace'}: ${Math.ceil(expected)} by today`) + split };
    }) });

    // Leads and high potential: the daily target times the days logged.
    const L = P.map((p) => ovLeads(p.start, p.end, p.key === 'd' && p.value === ovToday()));
    const mcFrom = mcData && mcData.first ? ovDate(mcData.first) : null;
    rows.push({ go: 'leads', name: 'Leads', target: `${LT} a day`, extra: mcFrom ? `ManyChat from ${mcFrom}, Marina's sheet before` : '', cells: P.map((p, i) => {
      const l = L[i];
      if (!l) return null;
      if (!l.days) return { na: p.key === 'd' ? 'Not logged yet' : 'Nothing logged yet' };
      const t = LT * l.days;
      return { v: int(l.n), of: int(t), ok: l.n >= t, bar: l.n / t, note: p.key === 'd' ? `${l.n >= t ? 'Target reached' : `${int(t - l.n)} short`}` : `${fmt1(l.n / l.days)} a day · ${l.days} of ${p.len} day${p.len === 1 ? '' : 's'} logged` };
    }) });
    rows.push({ go: 'leads', name: 'High potential leads', target: `${HT} a day`, cells: P.map((p, i) => {
      const l = L[i];
      if (!l) return null;
      if (!l.hpDays) return { na: l.days ? 'Not recorded' : (p.key === 'd' ? 'Not logged yet' : 'Nothing logged yet') };
      const t = HT * l.hpDays;
      return { v: int(l.hp), of: int(t), ok: l.hp >= t, bar: l.hp / t, note: p.key === 'd' ? `${l.hp >= t ? 'Target reached' : `${int(t - l.hp)} short`}` : `${fmt1(l.hp / l.hpDays)} a day` };
    }) });

    // Conversion: same-period bookings ÷ leads. Daily added at Anton's
    // request (19 Oct 2026); one day's bookings rarely come from that day's
    // leads, so it swings far more than the weekly figure.
    rows.push({ go: 'leads', name: 'Conversion', target: `${ovPct(CONV_TARGET)} or more`, cells: P.map((p, i) => {
      const l = L[i];
      // Bookings on exactly the days these leads cover (see leadBookings).
      const ds = l ? [...l.dates].sort() : [];
      const lb = l ? leadBookings(ds[0] || p.start, ds[ds.length - 1] || p.end, l.dates) : null;
      if (!l || !lb) return null;
      if (!l.n) return { na: !l.days ? (p.key === 'd' ? 'Not logged yet' : 'Nothing logged yet') : '0 leads logged' };
      const c = lb.all / l.n;
      return { v: ovPct(c, 1), of: ovPct(CONV_TARGET), ok: c >= CONV_TARGET, bar: c / (2 * CONV_TARGET), mark: 0.5, note: `${int(lb.all)} booking${lb.all === 1 ? '' : 's'} ÷ ${int(l.n)} leads` };
    }) });

    const judged = rows.flatMap((r) => r.cells).filter((c) => c && !c.na);
    const good = judged.filter((c) => c.ok).length;
    return `<div class="panel ovk">
      <div class="ov-ph"><div class="ptitle">KPIs · daily, weekly, monthly</div>${judged.length ? `<span class="ovk-sum"><b>${good}</b> of ${judged.length} on target</span>` : ''}</div>
      <div class="ovk-grid">
        <div class="ovk-head"><span>KPI</span>${P.map((p) => `<span><b>${p.head}</b>${ovPicker(p, today)}</span>`).join('')}</div>
        ${rows.map((r) => `<a class="ovk-row" href="#${r.go}" data-go="${r.go}">
          <div class="ovk-name"><b>${esc(r.name)}</b><small>Target ${esc(r.target)}${r.extra ? ` · ${esc(r.extra)}` : ''}</small></div>
          ${r.cells.map((c, i) => `<div class="ovk-wrap"><span class="ovk-mob">${P[i].head}</span>${ovCell(c)}</div>`).join('')}
        </a>`).join('')}
      </div>
    </div>`;
  }

  /* ---- At a glance: one card per area ---- */

  function ovCard(o) {
    const w = Math.max(0, Math.min(1, o.bar || 0)) * 100;
    const mark = o.mark != null && o.mark > 0 && o.mark < 1 ? `<b style="left:${(o.mark * 100).toFixed(1)}%"></b>` : '';
    const visual = o.visual || `<div class="ov-track"><i class="${o.state || ''}" style="width:${w.toFixed(1)}%"></i>${mark}</div>`;
    return `<a class="ov-card" href="#${o.go}" data-go="${o.go}" title="${attr('Open ' + o.tab)}">
      <div class="ov-top"><span class="ov-ico ${o.tone || ''}">${ovSvg(o.icon)}</span><span class="ov-name">${esc(o.title)}</span><span class="ov-pill">${esc(o.pill)}</span></div>
      <div class="ov-mid"><div class="ov-num">${o.value}${o.of != null ? `<small> of ${o.of}</small>` : ''}</div>${o.pct ? `<span class="ov-pct ${o.state || ''}">${o.pct}</span>` : ''}</div>
      ${visual}
      <div class="ov-note">${o.note}</div>
    </a>`;
  }
  const ovWait = (o, what) => ovCard(Object.assign({ value: '—', bar: 0, note: `Loading ${what}…` }, o));

  function ovGlance(today) {
    const cards = [];
    const cp = { go: 'campaigns', tab: 'Campaign Ads', icon: 'target', title: 'Cost per result', pill: 'Running', tone: 'mkt' };
    const bu = { go: 'campaigns', tab: 'Campaign Ads', icon: 'wallet', title: 'Ad budget used', pill: 'Year', tone: 'mkt' };
    if (!campaigns || !campaigns.campaigns) cards.push(ovWait(cp, 'Meta'), ovWait(bu, 'Meta'));
    else {
      const cur = campaigns.currency || 'SAR';
      const lim = (campaigns.cprLimit && campaigns.cprLimit.report) || 25;
      const minR = (campaigns.cprLimit && campaigns.cprLimit.minResults) || 5;
      const running = campaigns.campaigns.filter((c) => c.status === 'Active');
      const over = running.filter((c) => c.cprOver);
      const early = running.filter((c) => !c.cprOver && (c.results || 0) < minR).length;
      const okN = running.length - over.length;
      cards.push(ovCard(Object.assign(cp, {
        value: int(okN), of: `${int(running.length)} within limit`, state: over.length ? 'bad' : 'good', bar: running.length ? okN / running.length : 0,
        note: (running.length
          ? (over.length
            ? `<span class="bad">▼ Over ${esc(cur)} ${int(lim)}:</span> ${over.map((c) => `${esc(c.name)} (${esc(money(c.costPerResult))})`).join(', ')}`
            : `<span class="good">▲</span> All within ${esc(cur)} ${int(lim)} a result`)
            + (early ? ` · ${early} with under ${minR} results yet` : '')
          : 'No campaign is running right now'),
      })));
      const t = campaigns.totals || {};
      const used = t.budget ? t.spend / t.budget : null;
      const y0 = today.slice(0, 4) + '-01-01';
      const yearGone = (ovDiff(y0, today) + 1) / (ovDiff(y0, today.slice(0, 4) + '-12-31') + 1);
      cards.push(ovCard(Object.assign(bu, {
        value: ovPct(used), of: `${esc(cur)} ${int(t.budget)}`, state: used != null && used > 1 ? 'bad' : '', bar: used, mark: yearGone,
        note: `<b>${esc(cur)} ${int(t.spend)}</b> spent · ${ovPct(yearGone)} of the year gone (the mark) · ${int(t.active)} running`,
      })));
    }

    const fb = { go: 'feedback', tab: 'Feedback', icon: 'smile', title: 'Guest satisfaction', pill: 'Year', tone: 'ops' };
    if (!feedback || !feedback.totals) cards.push(ovWait(fb, 'feedback'));
    else {
      const trips = (feedback.trips || []).filter((t) => t.overall != null && t.month);
      const lastM = trips.reduce((m, t) => (t.month > m ? t.month : m), '');
      const last = trips.filter((t) => t.month === lastM);
      const avg = last.length ? last.reduce((a, t) => a + t.overall, 0) / last.length : null;
      const escN = feedback.totals.escalations || 0;
      cards.push(ovCard(Object.assign(fb, {
        value: ovPct(feedback.totals.satisfaction, 1), pct: esc(feedback.totals.tripsReported || '') + ' trips', bar: feedback.totals.satisfaction,
        note: (lastM ? `Latest, ${ovMon(lastM, true)}: <b>${avg.toFixed(1)}</b> / 5 over ${last.length} trip${last.length === 1 ? '' : 's'}` : 'No trip surveyed yet')
          + (escN ? ` · <span class="bad">⚑ ${escN} escalated</span>` : ''),
      })));
    }

    // Margin only: no amount leaves the API for Trip Revenue.
    const mg = { go: 'revenue', tab: 'Trip Revenue', icon: 'percent', title: 'Trip margin', pill: 'Year', tone: 'ops' };
    if (!revData || !revData.totals) cards.push(ovWait(mg, 'trip revenue'));
    else {
      const m = revData.totals.margin;
      const st = m == null ? '' : m >= 0.3 ? 'good' : m >= 0.15 ? 'warn' : 'bad';
      cards.push(ovCard(Object.assign(mg, {
        value: ovPct(m, 1), pct: st === 'good' ? 'Healthy' : st === 'warn' ? 'Workable' : st === 'bad' ? 'Thin' : '', state: st, bar: m, mark: 0.3,
        note: `${int(revData.totals.entered)} of ${int(revData.totals.trips)} trips entered · 30%+ is healthy (the mark)`,
      })));
    }

    const kp = { go: 'kpis', tab: 'KPIs', icon: 'gauge', title: 'All KPI checks', pill: 'Today', tone: 'ops' };
    if (!kpiData || !kpiData.kpis) cards.push(ovWait(kp, 'the KPIs'));
    else {
      const camps = kpiData.kpis.filter((k) => k.group === 'Cost per result');
      const all = kpiData.kpis.filter((k) => k.group !== 'Cost per result');
      if (camps.length) all.push({ name: 'Cost per result', status: camps.some((k) => k.status === 'fail') ? 'fail' : camps.every((k) => k.status === 'na') ? 'na' : 'pass' });
      const passed = all.filter((k) => k.status === 'pass').length;
      const failed = all.filter((k) => k.status === 'fail');
      const total = passed + failed.length;
      const names = failed.slice(0, 3).map((k) => esc(k.name)).join(', ') + (failed.length > 3 ? ` +${failed.length - 3} more` : '');
      cards.push(ovCard(Object.assign(kp, {
        value: int(passed), of: `${int(total)} passed`, state: failed.length ? 'bad' : 'good', bar: total ? passed / total : 0,
        note: failed.length ? `<span class="bad">✗ Failing:</span> ${names}` : '<span class="good">✓</span> Every KPI passed',
      })));
    }

    const tk = { go: 'pending', tab: 'Monday Tasks', icon: 'tasks', title: 'Pending tasks', pill: 'Live', tone: 'ops' };
    if (!monData || !monData.items) cards.push(ovWait(tk, 'monday'));
    else {
      const by = new Map();
      for (const it of monData.items) {
        const k = it.status || 'Not Started';
        if (!by.has(k)) by.set(k, { n: 0, color: it.statusColor || '#757575' });
        by.get(k).n += 1;
      }
      const total = monData.items.length;
      const order = [...by.entries()].sort((x, y) => y[1].n - x[1].n);
      const stack = `<div class="ov-stack">${order.map(([k, v]) => `<i style="width:${((v.n / total) * 100).toFixed(1)}%;background:${attr(v.color)}" title="${attr(`${k}: ${v.n}`)}"></i>`).join('')}</div>`;
      const overdue = monData.items.filter((i) => i.overdue).length;
      cards.push(ovCard(Object.assign(tk, {
        value: int(total), visual: stack,
        note: order.slice(0, 3).map(([k, v]) => `${esc(k)} <b>${v.n}</b>`).join(' · ') + (overdue ? ` · <span class="bad">${overdue} overdue</span>` : ''),
      })));
    }
    return cards;
  }

  // Bookings taken per month, all trips or one destination / programme
  // (Shakir: "filter by category, like Thailand, last 12 or 9 months").
  function ovChart(today) {
    const months = previousTrips && previousTrips.sales && previousTrips.sales.months;
    const yearly = ovGran === 'year';
    const head = (extra) => `<div class="ov-ph"><div class="ptitle">Bookings by ${yearly ? 'year' : 'month'}</div><a class="ov-more" href="#previous" data-go="previous">View all ›</a></div>${extra}`;
    if (!months) return `<div class="panel">${head('')}<div class="msg">Loading bookings…</div></div>`;
    const cur = yearly ? today.slice(0, 4) : today.slice(0, 7);
    // Keys are months ("2026-10") or years ("2026"); a year sums its months.
    const list = [];
    if (yearly) {
      const first = Object.keys(months).sort()[0] || today;
      for (let y = Number(first.slice(0, 4)); y <= Number(cur); y += 1) list.push(String(y));
    } else {
      let ym = cur;
      for (let i = 0; i < ovMonths; i += 1) {
        list.unshift(ym);
        ym = ovAdd(ym + '-01', -1).slice(0, 7);
      }
    }
    const monthsOf = (k) => (yearly ? Object.keys(months).filter((m) => m.startsWith(k + '-')) : [k]);
    // Only categories with bookings in the window are offered.
    const seen = new Map();
    for (const k of list) for (const mk of monthsOf(k)) for (const [c, n] of Object.entries((months[mk] && months[mk].cats) || {})) seen.set(c, (seen.get(c) || 0) + n);
    const dests = new Map(), progs = new Map();
    for (const [c, n] of seen) {
      if (c === 'Other') continue;
      const [d, g] = c.split('|');
      dests.set(d, (dests.get(d) || 0) + n);
      if (g) progs.set(g, (progs.get(g) || 0) + n);
    }
    if (ovCat !== 'all' && !((ovCat.startsWith('d:') && dests.has(ovCat.slice(2))) || (ovCat.startsWith('p:') && progs.has(ovCat.slice(2))) || (ovCat.startsWith('c:') && seen.has(ovCat.slice(2))))) ovCat = 'all';
    const match = (c) => {
      if (ovCat === 'all') return true;
      const [d, g] = c.split('|');
      if (ovCat.startsWith('d:')) return d === ovCat.slice(2);
      if (ovCat.startsWith('p:')) return g === ovCat.slice(2);
      return c === ovCat.slice(2);
    };
    const byCount = (a, b) => b[1] - a[1];
    const opt = (v, label) => `<option value="${attr(v)}"${ovCat === v ? ' selected' : ''}>${esc(label)}</option>`;
    const select = `<select id="ovCat" aria-label="Trips">
      ${opt('all', 'All trips')}
      <optgroup label="Destination">${[...dests].sort(byCount).map(([d]) => opt('d:' + d, OV_DEST[d] || d)).join('')}</optgroup>
      <optgroup label="Programme">${[...progs].sort(byCount).map(([g]) => opt('p:' + g, OV_PROG[g] || g)).join('')}</optgroup>
      <optgroup label="Trip">${[...seen].filter(([c]) => c.includes('|')).sort(byCount).map(([c]) => opt('c:' + c, ovCatName(c))).join('')}</optgroup>
    </select>`;
    const gran = `<div class="seg">${[['month', 'Monthly'], ['year', 'Yearly']].map(([g, l]) => `<button data-ov-gran="${g}" aria-pressed="${ovGran === g}">${l}</button>`).join('')}</div>`;
    const seg = gran + (yearly ? '' : `<div class="seg">${[6, 12, 24].map((m) => `<button data-ov-months="${m}" aria-pressed="${ovMonths === m}">${m} months</button>`).join('')}</div>`);
    const W = (report && report.weeklyTarget) || 12;
    const rows = list.map((k) => {
      let n = 0;
      let rp = 0; // of which from repeat customers (buyer had booked 30+ days earlier)
      for (const mk of monthsOf(k)) {
        const m = months[mk];
        if (!m) continue;
        if (ovCat === 'all') { n += m.n; rp += m.rep || 0; }
        else {
          for (const [c, v] of Object.entries(m.cats || {})) if (match(c)) n += v;
          for (const [c, v] of Object.entries(m.repCats || {})) if (match(c)) rp += v;
        }
      }
      const days = yearly ? ovDiff(k + '-01-01', k + '-12-31') + 1 : ovDiff(k + '-01', ovMonthEnd(k)) + 1;
      return { k, n, rp, target: ovCat === 'all' ? Math.round((W * days) / 7) : null };
    });
    const max = Math.max(1, ...rows.map((x) => Math.max(x.n, x.target || 0)));
    const total = rows.reduce((a, x) => a + x.n, 0);
    const totalRep = rows.reduce((a, x) => a + x.rp, 0);
    const repShare = (a, b) => (b ? ` · ${Math.round((a / b) * 100)}% repeat` : '');
    const catLabel = ovCat === 'all' ? '' : ovCat.startsWith('c:') ? ovCatName(ovCat.slice(2)) : ovCat.startsWith('d:') ? OV_DEST[ovCat.slice(2)] || ovCat.slice(2) : OV_PROG[ovCat.slice(2)] || ovCat.slice(2);
    const cols = rows.map((x) => {
      const now = x.k === cur;
      const tip = `<div class="tt">${yearly ? x.k : `${esc(ovMon(x.k, true))} ${x.k.slice(0, 4)}`}${now ? ' · so far' : ''}</div><div class="trow"><span class="tk">New customers</span><b>${int(x.n - x.rp)}</b></div><div class="trow"><span class="tk">Repeat customers</span><b>${int(x.rp)}</b></div><div class="more">${int(x.n)} booking${x.n === 1 ? '' : 's'}${repShare(x.rp, x.n)}${catLabel ? ' · ' + esc(catLabel) : ''}${x.target ? ` · target ${int(x.target)} (${W} a week)` : ''}</div>`;
      return `<div class="ov-col" data-tip="${attr(tip)}">
        <span class="v">${x.n ? int(x.n) : ''}</span>
        <span class="b${now ? ' now' : ''}" style="height:${((x.n / max) * 100).toFixed(1)}%">${x.rp ? `<u class="rp" style="flex:${x.rp}"></u>` : ''}${x.n - x.rp > 0 ? `<u class="nw" style="flex:${x.n - x.rp}"></u>` : ''}</span>
        ${x.target ? `<i class="t" style="bottom:${((x.target / max) * 100).toFixed(1)}%"></i>` : ''}
      </div>`;
    }).join('');
    const axis = rows.map((x) => (yearly ? `<span>${x.k}</span>` : `<span>${esc(ovMon(x.k))}${x.k.slice(5) === '01' || x.k === rows[0].k ? `<small>${x.k.slice(0, 4)}</small>` : ''}</span>`)).join('');
    const minW = !yearly && ovMonths > 12 ? `style="min-width:${ovMonths * 30}px"` : '';
    const curN = (rows.find((x) => x.k === cur) || {}).n || 0;
    return `<div class="panel">
      ${head(`<div class="ov-filters">${select}${seg}</div>`)}
      <div class="ov-big">${yearly
        ? `<b>${int(curN)}</b><span>bookings in ${cur} so far${repShare((rows.find((x) => x.k === cur) || {}).rp || 0, curN)}${catLabel ? ' · ' + esc(catLabel) : ', charters left out'} · ${int(total)} since ${list[0]}${repShare(totalRep, total)}</span>`
        : `<b>${int(total)}</b><span>bookings in the last ${ovMonths} months${repShare(totalRep, total)}${catLabel ? ' · ' + esc(catLabel) : ', charters left out'}</span>`}</div>
      <div class="ov-chart"><div class="ov-chart-in" ${minW}>
        <div class="ov-cols">${cols}</div>
        <div class="ov-axis">${axis}</div>
      </div></div>
      <div class="ov-legend">
        <span><i style="background:var(--fill)"></i>New customers</span>
        <span><i style="background:var(--lead-all)"></i><span ${hlp('ovRepeat')}>Repeat customers</span></span>
        <span><i style="background:repeating-linear-gradient(135deg,var(--fill) 0 4px,rgba(var(--fill-rgb),.4) 4px 8px)"></i>This ${yearly ? 'year' : 'month'} so far</span>
        ${ovCat === 'all' ? `<span><i class="tl"></i>Target (${W} a week)</span>` : ''}
      </div>
    </div>`;
  }

  // Every upcoming departure week by where it stands, plus the next trips out.
  function ovDepartures(today) {
    const head = `<div class="ov-ph"><div class="ptitle">Upcoming departures</div><a class="ov-more" href="#board" data-go="board">View all ›</a></div>`;
    if (!latest || !latest.trips) return `<div class="panel">${head}<div class="msg">Loading departures…</div></div>`;
    const T = latest.target || 10;
    const k = { sold: 0, at: 0, below: 0, cancel: 0 };
    let booked = 0;
    for (const t of latest.trips) for (const w of t.weeks || []) {
      if (w.unavailable || t.cancelled) { k.cancel += 1; continue; }
      booked += w.booked || 0;
      if (w.capacity > 0 && w.booked >= w.capacity) k.sold += 1;
      else if (w.booked >= T) k.at += 1;
      else k.below += 1;
    }
    const total = k.sold + k.at + k.below + k.cancel;
    const parts = [
      ['sold', 'Sold out', 'var(--soldout)'],
      ['at', `At target (${T}+)`, 'var(--q-high)'],
      ['below', 'Below target', 'var(--fill)'],
      ['cancel', 'Cancelled', 'var(--q-low)'],
    ];
    const stack = total ? `<div class="ov-dstack">${parts.filter(([key]) => k[key]).map(([key, label, c]) => `<i style="width:${((k[key] / total) * 100).toFixed(1)}%;background:${c}" data-tip="${attr(`<div class="tt">${esc(label)}</div><div class="more">${k[key]} of ${total} weeks</div>`)}"></i>`).join('')}</div>` : '';
    const leg = parts.map(([key, label, c]) => `<span><i style="background:${c}"></i>${esc(label)}</span><b>${k[key]}</b>`).join('');
    const next = latest.trips
      .filter((t) => !t.cancelled && t.start >= today)
      .sort((a, b) => a.start.localeCompare(b.start))
      .slice(0, 4)
      .map((t) => {
        const live = (t.weeks || []).filter((w) => !w.unavailable);
        const b = live.reduce((a, w) => a + (w.booked || 0), 0);
        return `<div class="ov-trip"><span class="n">${esc(t.name)}</span><span class="c"><b>${int(b)}</b> booked</span><span class="d">${esc(ovDate(t.start))} · ${live.length} week${live.length === 1 ? '' : 's'}</span><span class="c">target ${int(T * live.length)}</span></div>`;
      }).join('');
    return `<div class="panel">${head}
      <div class="ov-big"><b>${int(booked)}</b><span>booked across ${total} departure week${total === 1 ? '' : 's'}</span></div>
      ${stack}
      <div class="ov-dleg">${leg}</div>
      ${next ? `<div class="ov-next"><div class="ptitle">Next departures</div>${next}</div>` : ''}
    </div>`;
  }

  function renderOverview() {
    if (view !== 'overview') return;
    const today = ovToday();
    $('overviewWrap').innerHTML = `
      <div class="ov-head">
        <div class="ov-sub">Live from WeTravel, Meta, the sheets and monday · tap a row or card for the details</div>
        <button class="btn ov-pdf" id="ovPdf" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>PDF</button>
      </div>
      ${ovScore(today)}
      <div class="ov-sec">At a glance</div>
      <div class="ov-grid">${ovGlance(today).join('')}</div>
      <div class="ov-low">${ovChart(today)}${ovDepartures(today)}</div>`;
    const root = $('overviewWrap');
    bindHelp(root);
    root.querySelectorAll('[data-go]').forEach((a) => a.addEventListener('click', (e) => {
      e.preventDefault();
      setView(a.dataset.go);
      scrollTo(0, 0);
    }));
    root.querySelectorAll('[data-ovp]').forEach((sel) => sel.addEventListener('change', () => {
      const k = sel.dataset.ovp;
      const t = ovToday();
      if (k === 'd') ovPickDay = sel.value === ovAdd(t, -1) ? null : sel.value;
      if (k === 'w') ovPickWeek = sel.value === ovWeekStart(t) ? null : sel.value;
      if (k === 'm') ovPickMonth = sel.value === t.slice(0, 7) ? null : sel.value;
      renderOverview();
    }));
    root.querySelectorAll('[data-ov-gran]').forEach((b) => b.addEventListener('click', () => {
      ovGran = b.dataset.ovGran;
      renderOverview();
    }));
    root.querySelectorAll('[data-ov-months]').forEach((b) => b.addEventListener('click', () => {
      ovMonths = Number(b.dataset.ovMonths);
      renderOverview();
    }));
    const sel = $('ovCat');
    if (sel) sel.addEventListener('change', () => { ovCat = sel.value; renderOverview(); });
    $('ovPdf').addEventListener('click', () => print());
  }


  /* ================= shorter pages ================= */

  // Anton, 19 Oct 2026: "make sure to avoid having long scrolls ... specially
  // the mobile version". Two things, applied after any page renders (a
  // MutationObserver, so no page's own code had to change):
  //  1. Page chips: a page made of several panels shows one part at a time.
  //     Leads and Previous Sales do this on every screen; the others on
  //     phones only, one chip per panel, named from its title.
  //  2. Long lists show their first rows and a "Show all" button.
  const PHONE = matchMedia('(max-width: 700px)');
  const PV = {
    leadsWrap: { always: true, groups: [['This week', [0, 1]], ['Trends', [2, 3]]] },
    previousWrap: { always: true, groups: [['Charts', [0, 1]], ['Projects', [2, 3]]] },
    campaignsWrap: { groups: [['Budget', [0]], ['Lead quality', [1]], ['Campaigns', [2]]] },
    overviewWrap: { sel: [['KPIs', '.ovk'], ['At a glance', '.ov-sec, .ov-grid'], ['Bookings', '.ov-low']] },
    reportWrap: { auto: true }, historyWrap: { auto: true }, engagementsWrap: { auto: true },
    tripsWrap: { auto: true }, feedbackWrap: { auto: true }, revenueWrap: { auto: true }, impactWrap: { auto: true }, kpisWrap: { auto: true },
  };
  // [container selector, item selector, show, phone only]
  const CLAMP = [
    ['table.ctable:not(.kp-table):not(.fb-matrix) > tbody', ':scope > tr:not(.trp-detail)', 10],
    ['.mon-list', ':scope > .mon-row', 10],
    ['#previousWrap .panel', ':scope > .pt-month', 3],
    ['.fb-prog', ':scope > .fb-trip', 3],
    ['.im-list', ':scope > .im-row', 10],
    ['#board', ':scope > .month', 1, true],
  ];
  const pvSel = {};
  const pvOpen = new Set();
  const pvTitle = (el) => {
    const t = el.querySelector('.ptitle') || el.querySelector(':scope > .lhead');
    return t ? t.textContent.replace(/\s+/g, ' ').split(' · ')[0].trim().slice(0, 24) : '';
  };

  function pvGroups(wrap, cfg) {
    const kids = [...wrap.children].filter((el) => !el.classList.contains('pv-bar') && !el.classList.contains('subtabs') && !el.classList.contains('msg'));
    const panels = kids.filter((el) => el.classList.contains('panel'));
    if (cfg.sel) return cfg.sel.map(([label, sel]) => [label, kids.filter((el) => el.matches(sel))]).filter(([, els]) => els.length);
    if (cfg.groups) return cfg.groups.map(([label, idx]) => [label, idx.map((i) => panels[i]).filter(Boolean)]).filter(([, els]) => els.length);
    // auto: one chip per titled panel; an untitled one joins the panel before it.
    const out = [];
    for (const el of panels) {
      const label = pvTitle(el);
      if (label || !out.length) out.push([label || 'Summary', [el]]);
      else out[out.length - 1][1].push(el);
    }
    return out;
  }

  function pvTidy(wrap) {
    const cfg = PV[wrap.id];
    // 1. page chips
    wrap.querySelectorAll(':scope > .pv-bar').forEach((b) => b.remove());
    wrap.querySelectorAll(':scope > .pv-off').forEach((el) => el.classList.remove('pv-off'));
    if (cfg && (cfg.always || PHONE.matches)) {
      const groups = pvGroups(wrap, cfg);
      if (groups.length > 1) {
        const labels = groups.map(([l]) => l);
        const key = wrap.id + '|' + labels.join('|');
        const sel = labels.includes(pvSel[key]) ? pvSel[key] : labels[0];
        for (const [label, els] of groups) if (label !== sel) els.forEach((el) => el.classList.add('pv-off'));
        const bar = document.createElement('div');
        bar.className = 'pv-bar';
        bar.setAttribute('role', 'tablist');
        bar.innerHTML = labels.map((l) => `<button type="button" aria-pressed="${l === sel}">${esc(l)}</button>`).join('');
        bar.querySelectorAll('button').forEach((b, i) => b.addEventListener('click', () => {
          pvSel[key] = labels[i];
          pvTidy(wrap);
          const top = wrap.getBoundingClientRect().top + scrollY - 70;
          if (scrollY > top) scrollTo(0, Math.max(0, top));
        }));
        groups[0][1][0].before(bar);
      }
    }
    // 2. long lists
    wrap.querySelectorAll('.pv-more').forEach((b) => b.remove());
    const scope = wrap.id === 'board' ? wrap.parentNode : wrap;
    CLAMP.forEach(([csel, isel, show, phoneOnly], ci) => {
      scope.querySelectorAll(csel).forEach((box, bi) => {
        if (!wrap.contains(box) && box !== wrap) return;
        const items = [...box.querySelectorAll(isel)];
        items.forEach((el) => el.classList.remove('pv-hide'));
        // Long lists only fold when it hides more than a couple of rows.
        if ((phoneOnly && !PHONE.matches) || items.length <= show + (show >= 5 ? 2 : 0)) return;
        const key = `${wrap.id}|${ci}|${bi}`;
        const open = pvOpen.has(key);
        // An opened "Details" row goes with its own row.
        box.querySelectorAll(':scope > tr.trp-detail').forEach((el) => el.classList.remove('pv-hide'));
        const real = items.filter((el) => !/(^|\s)\S*-month(\s|$)/.test(el.className)).length;
        if (!open) {
          items.slice(show).forEach((el) => el.classList.add('pv-hide'));
          box.querySelectorAll(':scope > tr.trp-detail').forEach((el) => { if (el.previousElementSibling && el.previousElementSibling.classList.contains('pv-hide')) el.classList.add('pv-hide'); });
          // A month heading with none of its rows left showing goes too.
          for (let i = show - 1; i >= 0 && /(^|\s)\S*-month(\s|$)/.test(items[i].className); i -= 1) items[i].classList.add('pv-hide');
        }
        const more = document.createElement('button');
        more.type = 'button';
        more.className = 'pv-more';
        more.textContent = open ? 'Show fewer ▴' : `Show all ${real} ▾`;
        more.addEventListener('click', () => {
          if (open) pvOpen.delete(key); else pvOpen.add(key);
          pvTidy(wrap);
        });
        const after = box.tagName === 'TBODY' ? (box.closest('.tscroll') || box.closest('table')) : box === wrap ? null : box.lastElementChild;
        if (box === wrap || box.id === 'board') wrap.appendChild(more);
        else if (box.tagName === 'TBODY') after.after(more);
        else box.appendChild(more);
      });
    });
  }

  const pvWraps = ['overviewWrap', 'board', 'reportWrap', 'previousWrap', 'campaignsWrap', 'historyWrap', 'leadsWrap', 'engagementsWrap', 'tripsWrap', 'feedbackWrap', 'revenueWrap', 'impactWrap', 'kpisWrap', 'pendingWrap'];
  const pvQueue = new Set();
  let pvFrame = 0;
  const pvObserver = new MutationObserver((records) => {
    for (const r of records) {
      // Our own bars and buttons don't count as a re-render.
      const ours = [...r.addedNodes, ...r.removedNodes].every((n) => n.nodeType === 1 && (n.classList.contains('pv-bar') || n.classList.contains('pv-more')));
      if (ours) continue;
      const w = r.target.closest && pvWraps.map((id) => $(id)).find((x) => x && x.contains(r.target));
      if (w) pvQueue.add(w);
    }
    // A timer, not requestAnimationFrame: rAF doesn't run in a background tab.
    if (pvQueue.size && !pvFrame) pvFrame = setTimeout(() => {
      pvFrame = 0;
      const list = [...pvQueue];
      pvQueue.clear();
      list.forEach(pvTidy);
      pvObserver.takeRecords();
    }, 0);
  });
  pvWraps.forEach((id) => pvObserver.observe($(id), { childList: true, subtree: true }));
  PHONE.addEventListener('change', () => pvWraps.forEach((id) => pvTidy($(id))));

  /* ================= view switching ================= */

  // The sidebar is the Dashboard plus four sections; each section's pages
  // are tabs across its top. Every page keeps its own view name and #hash,
  // so old links still land where they did.
  const SECTIONS = [
    { key: 'overview', name: 'Dashboard', views: [['overview', 'Dashboard']] },
    { key: 'sales', name: 'Sales', views: [['board', 'Booking'], ['previous', 'Previous Sales'], ['report', 'Report'], ['leads', 'Leads']] },
    { key: 'marketing', name: 'Marketing', views: [['campaigns', 'Campaign Ads'], ['history', 'Campaign History'], ['engagements', 'Engagements']] },
    { key: 'operations', name: 'Operations', views: [['trips', 'Trips & R&D'], ['feedback', 'Feedback'], ['revenue', 'Trip Revenue'], ['impact', 'Impact']] },
    { key: 'corporate', name: 'Corporate', views: [['kpis', 'KPIs'], ['pending', 'Monday Tasks']] },
  ];
  const sectionOf = (v) => SECTIONS.find((sec) => sec.views.some(([k]) => k === v)) || SECTIONS[0];
  // The page each section last showed, so going back to it lands there.
  const secLast = {};

  function setView(next) {
    view = next;
    const sec = sectionOf(view);
    secLast[sec.key] = view;
    document.querySelectorAll('button[data-section]').forEach((b) => {
      b.setAttribute('aria-pressed', String(b.dataset.section === sec.key));
    });
    $('pageTitle').textContent = sec.name;
    $('secTabs').hidden = sec.views.length < 2;
    $('secTabs').innerHTML = sec.views.map(([k, label]) => `<button role="tab" data-sec-view="${k}" aria-selected="${k === view}">${esc(label)}</button>`).join('');
    $('secTabs').querySelectorAll('[data-sec-view]').forEach((b) => b.addEventListener('click', () => {
      if (view !== b.dataset.secView) setView(b.dataset.secView);
    }));
    // The booking figures in the header belong to the sales pages.
    $('headStats').hidden = !['board', 'previous', 'report'].includes(view);
    $('rangeWrap').hidden = view !== 'board';
    $('board').hidden = view !== 'board';
    $('legend').hidden = view !== 'board';
    applyAnnouncement();
    // The board's status line and footnotes describe bookings only, so they
    // travel with the board rather than sitting under whichever tab is open.
    $('msg').hidden = view !== 'board';
    $('notes').hidden = view !== 'board';
    $('reportWrap').hidden = view !== 'report';
    $('previousWrap').hidden = view !== 'previous';
    $('campaignsWrap').hidden = view !== 'campaigns';
    $('historyWrap').hidden = view !== 'history';
    $('leadsWrap').hidden = view !== 'leads';
    $('engagementsWrap').hidden = view !== 'engagements';
    $('tripsWrap').hidden = view !== 'trips';
    $('feedbackWrap').hidden = view !== 'feedback';
    $('revenueWrap').hidden = view !== 'revenue';
    $('impactWrap').hidden = view !== 'impact';
    $('pendingWrap').hidden = view !== 'pending';
    $('kpisWrap').hidden = view !== 'kpis';
    $('overviewWrap').hidden = view !== 'overview';
    // The Dashboard reads every tab's data, so opening it loads whatever
    // hasn't been loaded yet; each card fills in as its source arrives.
    if (view === 'overview') {
      if (!leads) loadLeads(false);
      if (!mcData) loadMc(false);
      if (!campaigns) loadCampaigns(false);
      if (!feedback) loadFeedback(false);
      if (!revData) loadRevenue(false);
      if (!monData) loadPending(false);
      if (!kpiData) loadKpis(false);
      if (!previousTrips) loadPreviousTrips(false);
      renderOverview();
    }
    if (view === 'report') {
      if (!report) $('reportWrap').innerHTML = '<div class="msg">Loading report…</div>';
      loadReport(false);
    }
    if (view === 'previous' && !previousTrips) {
      $('previousWrap').innerHTML = '<div class="msg">Loading previous projects…</div>';
      loadPreviousTrips(false);
    }
    // Meta data is fetched only once someone actually opens the tab — unlike
    // the booking report, nothing outside this tab depends on it.
    if (view === 'campaigns') {
      if (!campaigns) $('campaignsWrap').innerHTML = '<div class="msg">Loading campaign data…</div>';
      loadCampaigns(false);
    }
    // Three years of month-by-month insights is a slow first call, so it waits
    // for someone to actually ask for it and then caches for half an hour.
    if (view === 'history') {
      if (!adHistory) $('historyWrap').innerHTML = '<div class="msg">Loading campaign history…</div>';
      loadHistory(false);
    }
    if (view === 'leads') {
      if (!leads) $('leadsWrap').innerHTML = '<div class="msg">Loading leads…</div>';
      loadLeads(false);
    }
    if (view === 'engagements') {
      if (!engagements) $('engagementsWrap').innerHTML = '<div class="msg">Loading engagements…</div>';
      loadEngagements(false);
    }
    if (view === 'trips') {
      if (!tripsData) $('tripsWrap').innerHTML = '<div class="msg">Loading trips…</div>';
      loadTrips(false);
    }
    if (view === 'feedback') {
      if (!feedback) $('feedbackWrap').innerHTML = '<div class="msg">Loading feedback…</div>';
      loadFeedback(false);
    }
    if (view === 'revenue') {
      if (!revData) $('revenueWrap').innerHTML = '<div class="msg">Loading trip revenue…</div>';
      loadRevenue(false);
    }
    if (view === 'impact') {
      if (!impData) $('impactWrap').innerHTML = '<div class="msg">Loading impact…</div>';
      loadImpact(false);
    }
    if (view === 'pending') {
      if (!monData) $('pendingWrap').innerHTML = '<div class="msg">Loading pending tasks…</div>';
      loadPending(false);
    }
    if (view === 'kpis') {
      if (!kpiData) $('kpisWrap').innerHTML = '<div class="msg">Checking every KPI… this reads WeTravel, Meta, the sheets and monday, so it takes a few seconds.</div>';
      loadKpis(false);
    }
    // Keep the address bar in step, so a reload or a copied link lands on the
    // same tab. replaceState rather than the hash property: no history entry
    // per tab click, so Back still leaves the dashboard.
    try {
      if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
    } catch (e) { /* file:// or a sandboxed frame — the tab still switches */ }
    saveViewState();
  }

  document.querySelectorAll('button[data-section]').forEach((b) => {
    b.addEventListener('click', () => {
      const sec = SECTIONS.find((x) => x.key === b.dataset.section);
      const next = secLast[sec.key] || sec.views[0][0];
      if (next !== view) { setView(next); scrollTo(0, 0); }
    });
  });
  $('refreshBtn').addEventListener('click', () => {
    load(true);
    loadReport(true);
    if (previousTrips) loadPreviousTrips(true);
    if (campaigns) loadCampaigns(true);
    if (adHistory) loadHistory(true);
    if (leads) loadLeads(true);
    if (engagements) loadEngagements(true);
    if (tripsData) loadTrips(true);
    if (feedback) loadFeedback(true);
    if (revData) loadRevenue(true);
    if (impData) loadImpact(true);
    if (monData) loadPending(true);
    if (kpiData) loadKpis(true);
    if (view === 'overview') renderOverview();
  });

  /* ================= sidebar ================= */

  // Wide screens: the toggle docks or collapses the sidebar to an icon rail,
  // and the choice is kept (the class itself is applied by the snippet at the
  // top of <body>, before first paint). Narrow screens: the sidebar is a
  // drawer, opened by the header's menu button, and the same toggle closes it.
  const SB_KEY = 'nomuSidebarCollapsed';
  const narrow = matchMedia('(max-width: 900px)');
  const docEl = document.documentElement;

  function syncSidebar() {
    const open = docEl.classList.contains('sb-open');
    const collapsed = docEl.classList.contains('sb-collapsed');
    const toggle = $('sbToggle');
    if (narrow.matches) {
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', 'Close menu');
    } else {
      toggle.setAttribute('aria-expanded', String(!collapsed));
      toggle.setAttribute('aria-label', collapsed ? 'Expand sidebar' : 'Collapse sidebar');
    }
    $('sbMenu').setAttribute('aria-expanded', String(open));
  }
  const closeDrawer = () => { docEl.classList.remove('sb-open'); syncSidebar(); };

  $('sbToggle').addEventListener('click', () => {
    if (narrow.matches) { closeDrawer(); return; }
    const collapsed = docEl.classList.toggle('sb-collapsed');
    try { localStorage.setItem(SB_KEY, collapsed ? '1' : '0'); } catch (e) { /* not remembered, still works */ }
    syncSidebar();
  });
  $('sbMenu').addEventListener('click', () => {
    docEl.classList.add('sb-open');
    syncSidebar();
    // Straight to the current tab, so a keyboard user lands inside the menu.
    const current = $('viewSeg').querySelector('[aria-pressed="true"]');
    if (current) current.focus();
  });
  $('sbBackdrop').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && docEl.classList.contains('sb-open')) closeDrawer();
  });
  // Picking a tab from the drawer is the end of the errand, so it closes.
  $('viewSeg').querySelectorAll('button[data-section]').forEach((b) => {
    b.addEventListener('click', () => { if (narrow.matches) closeDrawer(); });
  });
  // A tablet rotated across the breakpoint shouldn't keep a drawer open over
  // what is now a docked layout.
  narrow.addEventListener('change', () => { docEl.classList.remove('sb-open'); syncSidebar(); });
  syncSidebar();

  // Restore whichever tab/filter/period the screen was showing before this
  // load, so a refresh (or the wall display losing power overnight) picks up
  // where it left off instead of resetting to the very beginning.
  loadViewState();

  // A #hash beats stored state, so a wall display can be pointed straight at
  // one tab by URL and stay there through reboots, and any tab can be linked.
  const VIEWS = ['overview', 'board', 'report', 'previous', 'trips', 'feedback', 'revenue', 'impact', 'campaigns', 'history', 'leads', 'engagements', 'pending', 'kpis'];
  const viewFromHash = () => {
    const h = String(location.hash || '').replace(/^#/, '');
    return VIEWS.includes(h) ? h : null;
  };
  const hashView = viewFromHash();
  if (hashView) view = hashView;
  addEventListener('hashchange', () => {
    const next = viewFromHash();
    if (next && next !== view) setView(next);
  });

  setView(view);

  load(false);
  loadReport(false);
  loadAnnouncement();
  setInterval(() => load(false), POLL_MS);
  // Picks up a banner edited in Vercel without anyone touching the display.
  setInterval(loadAnnouncement, POLL_MS);
  // Unconditional now — the header stats need report data on every tab, not
  // just while the Report tab itself is open.
  setInterval(() => loadReport(false), 120000);
  // Meta's numbers move far slower than bookings and the Graph API is rate
  // limited per app, so 10 minutes, and only once the tab has been opened.
  setInterval(() => { if (campaigns) loadCampaigns(false); }, 600000);
  // Marina updates the sheet through the day; every 5 minutes keeps the tab
  // close behind her without hammering OneDrive (the API caches a minute).
  setInterval(() => { if (leads) loadLeads(false); }, 300000);
  setInterval(() => { if (engagements) loadEngagements(false); }, 300000);
  setInterval(() => { if (tripsData) loadTrips(false); }, 300000);
  setInterval(() => { if (feedback) loadFeedback(false); }, 300000);
  setInterval(() => { if (revData) loadRevenue(false); }, 300000);
  setInterval(() => { if (impData) loadImpact(false); }, 300000);
  setInterval(() => { if (mcData) loadMc(false); }, 300000);
  setInterval(() => { if (monData) loadPending(false); }, 300000);
  setInterval(() => { if (kpiData) loadKpis(false); }, 300000);
  // Re-render between fetches so a highlight lapses at its own 24h mark and the
  // "3h ago" text stays honest, without waiting on the server cache.
  setInterval(() => { if (latest) render(latest); }, 20000);
</script>
</body>
</html>
