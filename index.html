  const PT_MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  const ptDate = (iso) => {
    const d = new Date(`${iso}T00:00:00Z`);
    return Number.isNaN(d.getTime()) ? '' : `${d.getUTCDate()} ${PT_MONTHS_SHORT[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  };

  function ptGroupTotals(rows) {
    return {
      booked: rows.reduce((sum, t) => sum + t.booked, 0),
      cancelled: rows.reduce((sum, t) => sum + t.cancelled, 0),
    };
  }

  // The dropdown only earns its place on a trip that actually has more than
  // one week to break down — a single-week trip's own date range already
  // says everything the expansion would, so it gets no button at all rather
  // than a "Weeks · 1" that opens onto one row identical to what's already
  // shown.
  function ptTripRow(t) {
    const weeks = t.weeks || [];
    const multi = weeks.length > 1;
    const cancelled = !!t.cancelledTrip;
    const open = ptOpenTrips.has(t.uuid);

    // An empty cell still fills its grid column, so Booked/Cancelled stay
    // aligned whether or not this row has a button in it.
    const weeksCell = multi ? `
      <button class="pt-toggle" data-toggle="${esc(t.uuid)}" aria-expanded="${open}">
        <span class="pt-toggle-lab"><span class="pt-ar">›</span>Weeks</span>
        <b>${weeks.length}</b>
      </button>` : '<div></div>';

    const weeksPanel = multi && open ? `
      <div class="pt-weeks">
        ${weeks.map((w) => `
          <div class="pt-wrow${w.unavailable ? ' pt-cancelled-row' : ''}">
            <div class="pt-wlabel">${esc(w.label)}${w.unavailable ? '<span class="pt-tag">Cancelled</span>' : ''}</div>
            <div class="pt-wnum">Booked <b>${int(w.booked)}</b></div>
          </div>`).join('')}
        ${t.unallocated ? `<div class="pt-unalloc">+${int(t.unallocated)} booked, week not specified</div>` : ''}
      </div>` : '';

    return `
    <div class="pt-row${cancelled ? ' pt-cancelled-row' : ''}">
      <div>
        <div class="pt-name">${esc(t.name)}${t.charter ? '<span class="pt-charter">Charter</span>' : ''}${cancelled ? '<span class="pt-tag">Cancelled</span>' : ''}</div>
        <div class="pt-dest">${esc(t.destination || '—')}</div>
      </div>
      <div class="pt-dates">${esc(ptDate(t.start))}${t.end && t.end !== t.start ? ' – ' + esc(ptDate(t.end)) : ''}</div>
      ${weeksCell}
      <div class="pt-num">Booked<br><b>${int(t.booked)}</b></div>
      <div class="pt-num pt-cancel">Cancelled<br><b>${int(t.cancelled)}</b></div>
      ${weeksPanel}
    </div>`;
  }

  // One year on screen at a time — same approach as the History tab, so a
  // long booking history doesn't turn into one endless scroll of every year
  // stacked on top of each other. Trips within the chosen year still break
  // out by month, since that grouping is what makes a busy year scannable.
  function renderPreviousTrips() {
    const p = previousTrips;
    if (!p) return;
    if (p.error && !p.trips) {
      $('previousWrap').innerHTML = `<div class="msg err">Could not load previous trips: ${esc(p.error)}</div>`;
      return;
    }

    if (ptYear == null || !p.years.includes(ptYear)) ptYear = p.years[0] ?? null;

    const inYear = p.trips.filter((t) => t.year === ptYear);
    const filtered = inYear.filter((t) => ptMonth === 'all' || t.month === Number(ptMonth));
    const yTotals = ptGroupTotals(filtered);

    const showMonths = ptMonth === 'all';
    let body;
    if (showMonths) {
      const byMonth = new Map();
      for (const t of filtered) {
        if (!byMonth.has(t.month)) byMonth.set(t.month, []);
        byMonth.get(t.month).push(t);
      }
      // Rows arrive already sorted most-recent-first, so months only need a
      // distinct-and-descending pass, not a second re-sort by date.
      const months = [...byMonth.keys()].sort((a, b) => b - a);
      body = months.map((month) => {
        const mRows = byMonth.get(month);
        const mTotals = ptGroupTotals(mRows);
        return `
          <div class="pt-month">
            <div class="pt-mhead">
              <span class="pt-mname">${esc(PT_MONTHS[month])}</span>
              <span class="pt-mmeta">${mRows.length} trip${mRows.length === 1 ? '' : 's'}</span>
              <div class="pt-mnums">
                <span>Booked <b>${int(mTotals.booked)}</b></span>
                <span class="cancel">Cancelled <b>${int(mTotals.cancelled)}</b></span>
              </div>
            </div>
            ${mRows.map(ptTripRow).join('')}
          </div>`;
      }).join('');
    } else {
      body = filtered.map(ptTripRow).join('');
    }

    const yearTabs = p.years.map((y) =>
      `<button data-year="${y}" aria-pressed="${y === ptYear}">${y}</button>`).join('');
    const monthOptions = ['<option value="all">All months</option>']
      .concat(PT_MONTHS.map((m, i) => `<option value="${i}" ${String(i) === ptMonth ? 'selected' : ''}>${esc(m)}</option>`));

    $('previousWrap').innerHTML = `
      ${p.stale ? `<div class="msg err">Showing last known figures — ${esc(p.error || 'WeTravel unreachable')}</div>` : ''}

      <div class="panel">
        <div class="ptitle">Previous trips · ${ptYear ?? '—'}</div>
        <div class="filters"><div class="seg" id="ptYearSeg">${yearTabs}</div></div>
        <div class="vhero">
          <span class="vh-n">${int(filtered.length)}</span>
          <span class="vh-s">departed trip${filtered.length === 1 ? '' : 's'} · <b style="color:#fff">${int(yTotals.booked)}</b> booked · <b style="color:var(--danger)">${int(yTotals.cancelled)}</b> cancelled</span>
        </div>
        <div class="filters" style="margin-top:12px">
          <select class="fselect" id="ptMonthSel">${monthOptions.join('')}</select>
          <div class="fnote">${p.trips.length} total on record across ${p.years.length} year${p.years.length === 1 ? '' : 's'}</div>
        </div>
      </div>

      <div class="panel">
        ${body || '<div class="msg">No previous trips match this filter.</div>'}
      </div>`;

    $('previousWrap').querySelectorAll('#ptYearSeg button').forEach((b) => {
      b.addEventListener('click', () => {
        const year = Number(b.dataset.year);
        if (year === ptYear) return;
        ptYear = year;
        ptMonth = 'all';
        renderPreviousTrips();
        saveViewState();
      });
    });
    $('ptMonthSel').addEventListener('change', (e) => { ptMonth = e.target.value; renderPreviousTrips(); saveViewState(); });
    $('previousWrap').querySelectorAll('[data-toggle]').forEach((b) => {
      b.addEventListener('click', () => {
        const uuid = b.dataset.toggle;
        if (ptOpenTrips.has(uuid)) ptOpenTrips.delete(uuid); else ptOpenTrips.add(uuid);
        renderPreviousTrips();
      });
    });
  }

  async function loadPreviousTrips(force) {
    try {
      const res = await fetch('/api/previous-trips' + (force ? '?refresh=1' : ''));
      const p = await res.json();
      if (!res.ok && !p.trips) throw new Error(p.error || `HTTP ${res.status}`);
      previousTrips = p;
      renderPreviousTrips();
    } catch (err) {
      if (!previousTrips) {
        $('previousWrap').innerHTML = `<div class="msg err">Could not load previous trips: ${esc(err.message)}</div>`;
      }
    }
  }

  /* ================= view switching ================= */

  // Explicit target, not a toggle — Dashboard is always one click away from
  // Report, rather than requiring "click the same tab again to go back."
  function setView(next) {
    view = next;
    $('viewSeg').querySelectorAll('button').forEach((b) => {
      b.setAttribute('aria-pressed', String(b.dataset.view === view));
    });
    $('board').hidden = view !== 'board';
    $('legend').hidden = view !== 'board';
    applyAnnouncement();
    // The board's status line and footnotes describe bookings only, so they
    // travel with the board rather than sitting under whichever tab is open.
    $('msg').hidden = view !== 'board';
    $('notes').hidden = view !== 'board';
    $('reportWrap').hidden = view !== 'report';
    $('previousWrap').hidden = view !== 'previous';
    $('campaignsWrap').hidden = view !== 'campaigns';
    $('historyWrap').hidden = view !== 'history';
    if (view === 'report') {
      if (!report) $('reportWrap').innerHTML = '<div class="msg">Loading report…</div>';
      loadReport(false);
    }
    if (view === 'previous' && !previousTrips) {
      $('previousWrap').innerHTML = '<div class="msg">Loading previous trips…</div>';
      loadPreviousTrips(false);
    }
    // Meta data is fetched only once someone actually opens the tab — unlike
    // the booking report, nothing outside this tab depends on it.
    if (view === 'campaigns') {
      if (!campaigns) $('campaignsWrap').innerHTML = '<div class="msg">Loading campaign data…</div>';
      loadCampaigns(false);
    }
    // Three years of month-by-month insights is a slow first call, so it waits
    // for someone to actually ask for it and then caches for half an hour.
    if (view === 'history') {
      if (!adHistory) $('historyWrap').innerHTML = '<div class="msg">Loading campaign history…</div>';
      loadHistory(false);
    }
    // Keep the address bar in step, so a reload or a copied link lands on the
    // same tab. replaceState rather than the hash property: no history entry
    // per tab click, so Back still leaves the dashboard.
    try {
      if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
    } catch (e) { /* file:// or a sandboxed frame — the tab still switches */ }
    saveViewState();
  }

  $('viewSeg').querySelectorAll('button').forEach((b) => {
    b.addEventListener('click', () => setView(b.dataset.view));
  });
  $('refreshBtn').addEventListener('click', () => {
    load(true);
    loadReport(true);
    if (previousTrips) loadPreviousTrips(true);
    if (campaigns) loadCampaigns(true);
    if (adHistory) loadHistory(true);
  });

  // Restore whichever tab/filter/period the screen was showing before this
  // load, so a refresh (or the wall display losing power overnight) picks up
  // where it left off instead of resetting to the very beginning.
  loadViewState();

  // A #hash beats stored state, so a wall display can be pointed straight at
  // one tab by URL and stay there through reboots, and any tab can be linked.
  const VIEWS = ['board', 'report', 'previous', 'campaigns', 'history'];
  const viewFromHash = () => {
    const h = String(location.hash || '').replace(/^#/, '');
    return VIEWS.includes(h) ? h : null;
  };
  const hashView = viewFromHash();
  if (hashView) view = hashView;
  addEventListener('hashchange', () => {
    const next = viewFromHash();
    if (next && next !== view) setView(next);
  });

  setView(view);

  load(false);
  loadReport(false);
  loadAnnouncement();
  setInterval(() => load(false), POLL_MS);
  // Picks up a banner edited in Vercel without anyone touching the display.
  setInterval(loadAnnouncement, POLL_MS);
  // Unconditional now — the header stats need report data on every tab, not
  // just while the Report tab itself is open.
  setInterval(() => loadReport(false), 120000);
  // Meta's numbers move far slower than bookings and the Graph API is rate
  // limited per app, so 10 minutes, and only once the tab has been opened.
  setInterval(() => { if (campaigns) loadCampaigns(false); }, 600000);
  // Re-render between fetches so a highlight lapses at its own 24h mark and the
  // "3h ago" text stays honest, without waiting on the server cache.
  setInterval(() => { if (latest) render(latest); }, 20000);
</script>
</body>
</html>
