<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NomuHub CRM</title>
<link rel="icon" type="image/jpeg" href="/favicon.jpg">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2099ac">
<link rel="apple-touch-icon" href="/brand/icon-192.png">
<style>
  :root {
    /* Dark mode is the dark version of the light theme (Anton, 19 Oct 2026):
       deep teal surfaces and the brand teal as the accent, replacing the old
       navy and yellow. --navy / --yellow keep their names (page background /
       accent) so nothing that uses them had to change. */
    --navy: #0b1c20;
    --card: #12292e;
    --card-2: #0e2226;
    --line: #22414a;
    --yellow: #3cc3d3;
    --fill: #2db1c3;
    --fill-full: #3fbf86;
    --fill-empty: #2b4b54;
    --track: #09171a;
    --target: #ef8b3c;
    --danger: #e0483d;
    --danger-bg: #3a1f23;
    --soldout: #e0791f;
    --info: #4fa6e0;
    --info-bg: rgba(77,157,224,.10);
    --info-line: rgba(77,157,224,.4);
    --fresh: #3ddc84;
    --fresh-bright: #8bf0b8;
    --fresh-dim: #1e5c3d;
    --fresh-wash: rgba(61,220,132,.20);
    --fresh-ink: #062d18;
    --text: #eef7f8;
    --text-2: #a9c4ca;
    --text-3: #7d9aa1;

    /* Leads channels. The first three reference-palette slots, validated as
       a set against --track, where the charts sit (all pairs: CVD dE 9.4,
       normal-vision dE 20.9, every one >= 3:1). WhatsApp takes the green-
       leaning aqua people already associate with it. Blue is not a third
       channel: it's IG + WA together, for the days the sheet doesn't split
       them. Status green/red stay reserved for good/bad. */
    --lead-wa: #199e70;
    --lead-ig: #d95926;
    --tgt-leads: #9fc4ff;   /* daily target line, leads */
    --tgt-hp: #f2b233;      /* daily target line and bars, high-potential leads */
    --lead-all: #3987e5;

    /* Trips quality ratings. High/Medium/Low are the dataviz skill's fixed
       status steps (good / warning / critical), validated against --track
       in rating order: CVD dE 11.3, normal-vision 27.6, all >= 3:1. The
       dashboard's own --fresh/--target/--danger were tried first and
       failed: amber and red sat 14.6 apart, under the 15 floor, and they
       touch in the weeks bar. R&D isn't a performance state, so it's the
       neutral categorical blue, not a status colour. Each always ships with
       a glyph and its label, never colour alone. */
    --q-high: #0ca30c;
    --q-med: #fab219;
    --q-low: #d03b3b;
    --q-rd: #3987e5;
    --q-none: #6d8b93;

    /* Reference bands behind the weekly chart. Kept faint on purpose: they
       have to tint the plot without competing with the line drawn over them. */
    --zone-good: rgba(61,220,132,.09);
    --zone-watch: rgba(239,139,60,.09);
    --zone-act: rgba(224,72,61,.10);
    /* Theme tokens for colours that used to be hard-coded for the dark look
       (18 Oct 2026, light / dark switch). */
    --strong: #ffffff;
    --good-ink: #5fd35f;
    --bad-ink: #ff8a80;
    --bad-soft: #ffb3ab;
    --cancel-ink: #f0b8b3;
    --cancel-ink2: #c98d87;
    --cancel-track: #2a1a1d;
    --ov: 255,255,255;
    --well-rgb: 5,16,19;
    --mix-ink: #fff;
    --tip-bg: #0a191d;
    /* The accent and the bar fill as RGB triplets, for tints:
       rgba(var(--acc-rgb), .15). */
    --acc-rgb: 60,195,211;
    /* Status colours when they are TEXT, not bars: readable on the cards in
       each theme (19 Oct 2026 contrast pass; amber and orange text on white
       read at 1.6-3:1 before). */
    --target-ink: #f39a52; --warn-ink: #f5be45; --hp-ink: #f2b233; --fresh-ink: #3ddc84;
    --fill-rgb: 45,177,195;
  }

  /* Light mode (Anton, 18 Oct 2026): NomuHub's brand teal from the logo
     (#2099ac) on white. Dark mode is the original navy look, unchanged. */
  html[data-theme="light"] {
    color-scheme: light;
    --navy: #eaf4f6; --card: #ffffff; --card-2: #f4f9fa; --line: #d3e4e9; --track: #e6f0f3;
    --yellow: #137483; --fill: #2099ac; --fill-full: #2e9e6b; --fill-empty: #b9d3da;
    --target: #d9772b; --danger: #d63c32; --danger-bg: #fbe3e1; --soldout: #d36b12;
    --info: #1f7fb8; --info-bg: rgba(31,127,184,.08); --info-line: rgba(31,127,184,.35);
    --fresh: #179c53; --fresh-bright: #0e8a45; --fresh-dim: #c7ecd7; --fresh-wash: rgba(23,156,83,.12);
    --text: #0f2f38; --text-2: #3e5d68; --text-3: #527079; --strong: #0b2a33;
    --tgt-leads: #3b73c4; --tgt-hp: #e0a21f;
    --good-ink: #0f7a3a; --bad-ink: #c0352b; --bad-soft: #b4413a;
    --cancel-ink: #b4413a; --cancel-ink2: #9a3f37; --cancel-track: #f6dcd9;
    --ov: 15,47,56; --well-rgb: 230,240,243; --mix-ink: #000; --tip-bg: #ffffff;
    --acc-rgb: 19,116,131; --fill-rgb: 32,153,172;
    --target-ink: #a4500f; --warn-ink: #8a5a00; --hp-ink: #8a5a00; --fresh-ink: #0f7a3a;
    --zone-good: rgba(23,156,83,.08); --zone-watch: rgba(217,119,43,.08); --zone-act: rgba(214,60,50,.08);
  }
  /* Dark sidebar: the light theme's teal, taken down to night. */
  html:not([data-theme="light"]) .sidebar { background: linear-gradient(180deg, #0f3036, #0a2226); border-right-color: #1b3a41; }
  /* The sidebar wears the brand teal in light mode, like the logo. */
  html[data-theme="light"] .sidebar { background: linear-gradient(180deg, #1f97aa, #157e8f); border-right-color: transparent; }
  html[data-theme="light"] .sb-brand { color: #fff; }
  html[data-theme="light"] .sb-cat { color: rgba(255,255,255,.7); }
  html[data-theme="light"] .sb-item { color: rgba(255,255,255,.92); }
  html[data-theme="light"] .sb-item:hover { background: rgba(255,255,255,.16); color: #fff; }
  html[data-theme="light"] .sb-item[aria-pressed="true"] { background: #fff; color: #137483; }
  html[data-theme="light"] .sb-btn { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.3); color: #fff; }
  html[data-theme="light"] .panel, html[data-theme="light"] .trip { box-shadow: 0 1px 3px rgba(15,47,56,.08); }
  html[data-theme="light"] .trip.cancelled .wnum, html[data-theme="light"] .trip.cancelled .wnum .of { color: #fff !important; }
  html[data-theme="light"] .adv-btn { background: radial-gradient(circle at 30% 25%, #5cc6d4, #2099ac 55%, #137483); color: #fff; }
  html[data-theme="light"] .adv-m.me, html[data-theme="light"] .adv-form button, html[data-theme="light"] .adv-mini { color: #fff; }
  /* Adviser panel in light mode: white card, teal accents, soft shadow. */
  html[data-theme="light"] .adv-panel { background: #fff; border-color: #cfe2e7; box-shadow: 0 18px 50px rgba(15,47,56,.22); }
  html[data-theme="light"] .adv-head { background: linear-gradient(180deg, #f2f9fa, #fff); border-bottom-color: #dbe9ed; }
  html[data-theme="light"] .adv-m.ai { background: #eef6f8; }
  html[data-theme="light"] .adv-form { border-top-color: #dbe9ed; }
  html[data-theme="light"] .adv-form textarea { background: #fff; border-color: #cfe2e7; }
  html[data-theme="light"] .adv-chips button { border-color: rgba(32,153,172,.35); background: rgba(32,153,172,.07); }
  html[data-theme="light"] .adv-cloud { color: #137483; }


  /* ---------- Dashboard (executive overview) ----------
     The executives' first screen (Anton, 19 Oct 2026, after the meeting with
     Shakir, who built HASA's EMMS): one card per headline number against its
     target, and a tap on any card opens the tab with the details. Kept light
     on the eyes: white cards, one accent, colour only where it means
     on / off target. Classes prefixed ov-. */
  #overviewWrap > * + * { margin-top: 14px; }
  .ov-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .ov-sub { font-size: 12.5px; color: var(--text-3); }
  /* KPI scorecard: one row per KPI, judged daily (yesterday), weekly and
     monthly. On a phone the KPI name sits above its three cells. */
  .ovk { border-radius: 14px; }
  .ovk-sum { font-size: 12.5px; color: var(--text-2); }
  .ovk-sum b { color: var(--strong); font-size: 15px; }
  .ovk-head, .ovk-row { display: grid; grid-template-columns: minmax(170px, 1.1fr) repeat(3, minmax(0, 1fr)); gap: 16px; align-items: center; }
  .ovk-head { padding: 0 10px 9px; border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
  .ovk-head span { display: flex; flex-direction: column; gap: 2px; }
  .ovk-head b { color: var(--text); }
  .ovk-head small { font-size: 11px; font-weight: 500; letter-spacing: 0; text-transform: none; }
  .ovk-head small { margin-top: 3px; }
  .ovk-pick select { width: 100%; max-width: 240px; margin-top: 4px; font: inherit; font-size: 12.5px; font-weight: 600; letter-spacing: 0; text-transform: none; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  .ovk-row { padding: 13px 10px; border-bottom: 1px solid var(--line); border-radius: 10px; color: inherit; text-decoration: none; }
  .ovk-row:last-child { border-bottom: 0; }
  .ovk-row:hover, .ovk-row:focus-visible { background: rgba(var(--acc-rgb),.06); outline: none; }
  .ovk-name b { display: block; font-size: 14px; color: var(--strong); }
  .ovk-name small { display: block; margin-top: 2px; font-size: 11.5px; color: var(--text-3); }
  .ovk-wrap { min-width: 0; }
  .ovk-mob { display: none; }
  .ovk-cell { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ovk-v { display: flex; align-items: baseline; gap: 4px; }
  .ovk-v b { font-size: 20px; font-weight: 800; color: var(--strong); font-variant-numeric: tabular-nums; }
  .ovk-v small { font-size: 12px; font-weight: 600; color: var(--text-3); }
  .ovk-st { margin-left: auto; align-self: center; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; }
  .ovk-cell.good .ovk-st { color: var(--good-ink); background: rgba(12,163,12,.13); }
  .ovk-cell.bad .ovk-st { color: var(--bad-ink); background: rgba(208,59,59,.13); }
  .ovk-cell.na .ovk-v b, .ovk-cell.wait .ovk-v b { color: var(--text-3); font-weight: 600; }
  .ovk-n { font-size: 11.5px; line-height: 1.35; color: var(--text-3); }
  @media (max-width: 760px) {
    .ovk-head { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 4px 10px; }
    .ovk-head > span:first-child { display: none; }
    .ovk-pick select { font-size: 11.5px; padding: 5px 4px; }
    .ovk-row { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 12px 4px; align-items: start; }
    .ovk-v { white-space: nowrap; }
    .ovk-v small { font-size: 10.5px; }
    .ovk-name { grid-column: 1 / -1; }
    .ovk-mob { display: block; margin-bottom: 4px; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
    .ovk-v b { font-size: 17px; }
    .ovk-st { width: 17px; height: 17px; font-size: 10px; }
  }
  .ov-pdf { display: inline-flex; align-items: center; gap: 6px; }
  .ov-pdf svg { width: 15px; height: 15px; }
  .ov-sec { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; color: var(--text-3); margin-top: 20px !important; }
  .ov-sec::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .ov-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 10px !important; }
  @media (max-width: 1100px) { .ov-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .ov-card {
    display: flex; flex-direction: column; gap: 10px; min-width: 0;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 15px 16px 14px;
    color: inherit; text-decoration: none; cursor: pointer;
    transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .ov-card:hover, .ov-card:focus-visible { border-color: rgba(var(--acc-rgb),.6); box-shadow: 0 6px 20px rgba(var(--acc-rgb),.14); transform: translateY(-1px); outline: none; }
  .ov-top { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .ov-ico { flex: none; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: rgba(var(--acc-rgb),.13); color: var(--yellow); }
  .ov-ico svg { width: 17px; height: 17px; }
  .ov-ico.mkt { background: rgba(217,119,43,.14); color: var(--target); }
  .ov-ico.ops { background: rgba(var(--ov),.07); color: var(--info); }
  .ov-name { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.25; }
  .ov-pill { flex: none; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: rgba(var(--acc-rgb),.12); color: var(--yellow); }
  .ov-mid { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .ov-num { font-size: 28px; font-weight: 800; line-height: 1; color: var(--strong); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ov-num small { font-size: 13px; font-weight: 600; color: var(--text-3); }
  .ov-pct { font-size: 13px; font-weight: 800; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ov-pct.good { color: var(--good-ink); } .ov-pct.bad { color: var(--bad-ink); } .ov-pct.warn { color: var(--target-ink); }
  .ov-track { position: relative; height: 8px; border-radius: 999px; background: var(--track); overflow: visible; }
  .ov-track > i { display: block; height: 100%; border-radius: 999px; background: var(--fill); max-width: 100%; }
  .ov-track > i.good { background: var(--q-high); } .ov-track > i.bad { background: var(--q-low); } .ov-track > i.warn { background: var(--target); }
  .ov-track > b { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--text-2); }
  .ov-stack { display: flex; gap: 2px; height: 8px; border-radius: 999px; overflow: hidden; background: var(--track); }
  .ov-stack > i { display: block; height: 100%; min-width: 3px; }
  .ov-note { font-size: 11.5px; line-height: 1.4; color: var(--text-3); }
  .ov-note b { color: var(--text-2); font-weight: 700; }
  .ov-note .good { color: var(--good-ink); font-weight: 700; } .ov-note .bad { color: var(--bad-ink); font-weight: 700; } .ov-note .warn { color: var(--target-ink); font-weight: 700; }
  .ov-low { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; margin-top: 20px !important; }
  .ov-low .panel { border-radius: 14px; min-width: 0; }
  .ov-ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .ov-ph .ptitle { margin: 0; }
  .ov-more { font-size: 12px; font-weight: 700; color: var(--yellow); text-decoration: none; white-space: nowrap; }
  .ov-more:hover { text-decoration: underline; }
  .ov-filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .ov-filters select { font: inherit; font-size: 12px; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--text); max-width: 220px; }
  .ov-chart { overflow-x: auto; }
  .ov-chart-in { min-width: 100%; }
  .ov-cols { position: relative; display: flex; align-items: flex-end; gap: 6px; height: 190px; padding-top: 16px; border-bottom: 1px solid var(--line); }
  .ov-col { flex: 1 1 0; min-width: 0; height: 100%; position: relative; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  .ov-col .v { font-size: 10.5px; font-weight: 700; color: var(--text-2); margin-bottom: 3px; font-variant-numeric: tabular-nums; }
  .ov-col .b { width: 72%; max-width: 34px; display: flex; flex-direction: column; gap: 2px; border-radius: 4px 4px 0 0; overflow: hidden; min-height: 2px; }
  .ov-col .b u { display: block; text-decoration: none; min-height: 2px; }
  .ov-col .b .nw { background: var(--fill); }
  .ov-col .b .rp { background: var(--lead-all); }
  .ov-col .b.now .nw { background: repeating-linear-gradient(135deg, var(--fill) 0 6px, rgba(var(--fill-rgb),.4) 6px 12px); }
  .ov-col .b.now .rp { background: repeating-linear-gradient(135deg, var(--lead-all) 0 6px, rgba(57,135,229,.4) 6px 12px); }
  .ov-col .t { position: absolute; left: 6%; right: 6%; height: 0; border-top: 2px dashed var(--target); }
  .ov-axis { display: flex; gap: 6px; margin-top: 5px; }
  .ov-axis span { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; font-size: 10.5px; color: var(--text-3); white-space: nowrap; line-height: 1.25; }
  .ov-axis span small { font-size: 9.5px; opacity: .8; }
  .ov-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 11.5px; color: var(--text-2); }
  .ov-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .ov-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .ov-legend i.tl { height: 0; border-top: 2px dashed var(--target); border-radius: 0; width: 16px; }
  .ov-big { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .ov-big b { font-size: 30px; font-weight: 800; color: var(--strong); line-height: 1; }
  .ov-big span { font-size: 12.5px; color: var(--text-3); }
  .ov-dstack { display: flex; gap: 2px; height: 14px; border-radius: 7px; overflow: hidden; background: var(--track); }
  .ov-dstack i { display: block; height: 100%; }
  .ov-dleg { display: grid; grid-template-columns: 1fr auto; gap: 7px 10px; margin-top: 12px; font-size: 12.5px; color: var(--text-2); }
  .ov-dleg span { display: inline-flex; align-items: center; gap: 8px; }
  .ov-dleg i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .ov-dleg b { color: var(--strong); font-variant-numeric: tabular-nums; text-align: right; }
  .ov-next { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .ov-next .ptitle { margin-bottom: 8px; }
  .ov-trip { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 7px 0; font-size: 12.5px; }
  .ov-trip + .ov-trip { border-top: 1px dashed var(--line); }
  .ov-trip .n { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ov-trip .d { color: var(--text-3); font-size: 11.5px; }
  .ov-trip .c { text-align: right; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ov-trip .c b { color: var(--strong); }
  html[data-theme="light"] .ov-card, html[data-theme="light"] .ov-low .panel { box-shadow: 0 1px 3px rgba(15,47,56,.07); }
  html[data-theme="light"] .ov-card:hover { box-shadow: 0 8px 22px rgba(15,47,56,.12); }
  @media (max-width: 900px) { .ov-low { grid-template-columns: 1fr; } }
  @media (max-width: 600px) {
    .ov-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .ov-card { padding: 12px 12px 11px; gap: 8px; }
    .ov-top { align-items: flex-start; }
    .ov-ico { width: 28px; height: 28px; }
    .ov-mid { flex-wrap: wrap; row-gap: 2px; }
    .ov-num { font-size: 22px; white-space: normal; }
    .ov-note { font-size: 11px; }
    .ov-pill { display: none; }
  }
  @media (max-width: 360px) { .ov-grid { grid-template-columns: minmax(0, 1fr); } }
  /* Download PDF prints the page: just the overview, on white. */
  @media print {
    .sidebar, .sb-backdrop, .head .headright, .sb-menu, #adv, .sec-tabs, .ov-pdf, .ov-filters, .ov-more { display: none !important; }
    .shell { margin-left: 0 !important; padding: 0 !important; }
    body { background: #fff; }
    .ov-card, .ov-low .panel { break-inside: avoid; box-shadow: none !important; }
    .ov-grid { grid-template-columns: repeat(3, 1fr); }
  }

  /* ---------- Impact tab (im-) ---------- */
  .im-search { display: flex; gap: 8px; margin: 2px 0 14px; }
  .im-search input { flex: 1; min-width: 0; font: inherit; font-size: 14.5px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .im-search input:focus { outline: none; border-color: var(--yellow); box-shadow: 0 0 0 3px rgba(var(--acc-rgb),.15); }
  .im-search .btn { padding: 0 16px; font-size: 13.5px; font-weight: 700; }
  .im-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .im-tile { display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card-2); color: inherit; font: inherit; }
  button.im-tile { cursor: pointer; }
  button.im-tile:hover { border-color: rgba(var(--acc-rgb),.6); }
  .im-tile span { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }

  .im-count > b { color: var(--strong); font-size: 15px; }

  @media (max-width: 700px) {

    .im-st { margin-left: 0; }

  /* ---------- phones: bottom bar, page chips, shorter lists ----------
     (Anton, 19 Oct 2026: avoid long scrolls, more mobile friendly.) */
  .botnav { display: none; }
  @media (max-width: 700px) {
    .botnav {
      display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      background: var(--card); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
      box-shadow: 0 -4px 18px rgba(0,0,0,.08);
    }
    .bn-item { display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none; padding: 4px 2px; font: inherit; font-size: 10.5px; font-weight: 600; color: var(--text-3); cursor: pointer; border-radius: 10px; }
    .bn-item svg { width: 21px; height: 21px; }
    .bn-item[aria-pressed="true"] { color: var(--yellow); background: rgba(var(--acc-rgb),.1); }
    .shell { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
    html .adv { bottom: calc(78px + env(safe-area-inset-bottom)); left: 12px; }
    html .adv-cloud { display: none; }
    html .adv-btn { width: 48px; height: 48px; }
    #headStats { display: none !important; }
    .head { gap: 10px; padding-bottom: 10px; flex-wrap: nowrap; }
    .head .titles { flex: 1; min-width: 0; }
    .head .titles h1 { font-size: 19px; }
    .head .asof { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .head .spacer { display: none; }
    .headright { gap: 8px; }
    #refreshBtn { padding: 6px 9px; }
    .themebtn { width: 34px; height: 34px; }
    .ov-pdf { display: none; }
    .sec-tabs { margin-bottom: 12px; }
    .sec-tabs button { padding: 8px 11px 9px; font-size: 13px; }
  }
  /* Page chips: a long page shows one part at a time. */
  .pv-bar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 12px; padding: 2px 0; }
  .pv-bar::-webkit-scrollbar { display: none; }
  .pv-bar button { flex: none; font: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--text-2); cursor: pointer; white-space: nowrap; }
  .pv-bar button[aria-pressed="true"] { background: var(--yellow); border-color: var(--yellow); color: var(--navy); }
  .pv-off { display: none !important; }
  @media (max-width: 700px) {
    .pv-bar { position: sticky; top: 0; z-index: 6; background: var(--navy); margin: 0 -16px 12px; padding: 8px 16px; }
  }
  /* Long lists show their first rows and a Show all button. */
  .pv-hide { display: none !important; }
  .pv-more { display: block; width: 100%; margin-top: 10px; padding: 9px; border-radius: 10px; border: 1px dashed var(--line); background: transparent; color: var(--yellow); font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .pv-more:hover { background: rgba(var(--acc-rgb),.06); }
  @media print { .pv-bar, .pv-more, .botnav { display: none !important; } .pv-off, .pv-hide { display: revert !important; } }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--navy); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- sidebar ----------
     Every tab lives here, grouped by what the data is about (Booking, Ad
     Campaign). Wide screens: docked, and collapsible to an icon rail that
     the page reflows beside, remembered across visits. Narrow screens: a
     drawer over the page, opened from the menu button, closed once a tab is
     picked, since a permanent rail would eat a phone's width. */
  :root { --sb-w: 240px; --sb-rail: 64px; }
  .shell { padding: 16px 20px 26px; margin-left: var(--sb-w); min-width: 0; transition: margin-left .18s ease; }

  .sidebar {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 30;
    width: var(--sb-w); padding: 14px 10px;
    display: flex; flex-direction: column; gap: 18px;
    background: var(--card-2); border-right: 1px solid var(--line);
    overflow-y: auto; overflow-x: hidden;
    transition: width .18s ease, transform .2s ease;
  }
  .sb-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 2px 0 6px; }
  .sb-brand {
    display: flex; align-items: center; gap: 9px; min-width: 0;
    font-size: 18px; font-weight: 800; color: var(--yellow); white-space: nowrap;
  }
  .sb-brand svg { width: 26px; height: 26px; flex: none; }
  .sb-btn {
    flex: none; width: 32px; height: 32px; display: grid; place-items: center;
    background: var(--track); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text-2); cursor: pointer; padding: 0;
  }
  .sb-btn:hover { color: var(--strong); border-color: var(--info-line); }
  .sb-btn svg { width: 17px; height: 17px; transition: transform .18s ease; }

  .sb-nav { display: flex; flex-direction: column; gap: 16px; }
  .sb-group { display: flex; flex-direction: column; gap: 3px; }
  .sb-cat {
    font-size: 9.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--text-3); padding: 0 10px 5px; white-space: nowrap;
  }
  .sb-item {
    position: relative; display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 9px 10px; border: 0; border-radius: 8px; background: transparent;
    color: var(--text-2); font: inherit; font-size: 13.5px; font-weight: 600;
    text-align: left; white-space: nowrap; cursor: pointer;
  }
  .sb-item svg { width: 19px; height: 19px; flex: none; }
  a.sb-item { text-decoration: none; }
  /* Theme switch, top right of every page: shows the mode it switches TO
     (a moon while it's light, a sun while it's dark). */
  .themebtn { width: 36px; height: 36px; flex: none; display: inline-flex; align-items: center; justify-content: center; padding: 0; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text-2); cursor: pointer; }
  .themebtn:hover { color: var(--strong); border-color: var(--yellow); }
  .themebtn:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
  .themebtn svg { width: 18px; height: 18px; }
  .themebtn .ico-moon { display: none; }
  html[data-theme="light"] .themebtn .ico-moon { display: block; }
  html[data-theme="light"] .themebtn .ico-sun { display: none; }
  .sb-item:hover { background: rgba(var(--ov),.06); color: var(--strong); }
  .sb-item[aria-pressed="true"] { background: var(--yellow); color: var(--navy); font-weight: 700; }
  .sb-item:focus-visible, .sb-btn:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }

  /* The menu button in the header only exists for the drawer. */
  .sb-menu { display: none; }
  .sb-backdrop { display: none; }

  @media (min-width: 901px) {
    html.sb-collapsed .shell { margin-left: var(--sb-rail); }
    /* The rail is short enough to never scroll, and it has to let the
       hover labels spill out to its right. */
    html.sb-collapsed .sidebar { width: var(--sb-rail); overflow: visible; }
    html.sb-collapsed .sb-top { flex-direction: column; padding: 2px 0 0; gap: 12px; }
    html.sb-collapsed .sb-brand span { display: none; }
    html.sb-collapsed .sb-toggle svg { transform: rotate(180deg); }
    html.sb-collapsed .sb-cat { height: 0; padding: 0; overflow: hidden; border-top: 1px solid var(--line); margin: 2px 8px 6px; }
    html.sb-collapsed .sb-item { justify-content: center; padding: 10px 0; }
    /* Icons alone don't say which tab is which, so the label reappears as a
       flyout beside the icon on hover or keyboard focus. */
    html.sb-collapsed .sb-label {
      position: absolute; left: calc(100% + 12px); top: 50%; transform: translateY(-50%);
      padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 600;
      background: var(--tip-bg); color: var(--strong); border: 1px solid var(--line);
      box-shadow: 0 8px 20px rgba(0,0,0,.35); opacity: 0; pointer-events: none;
      transition: opacity .12s;
    }
    html.sb-collapsed .sb-item:hover .sb-label,
    html.sb-collapsed .sb-item:focus-visible .sb-label { opacity: 1; }
  }

  @media (max-width: 900px) {
    .shell { margin-left: 0; }
    .sidebar { width: 264px; transform: translateX(-100%); }
    html.sb-open .sidebar { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.5); }
    html.sb-open .sb-backdrop { display: block; position: fixed; inset: 0; z-index: 29; background: rgba(5,12,25,.55); }
    .sb-menu { display: grid; }
  }
  @media (prefers-reduced-motion: reduce) {
    .shell, .sidebar, .sb-btn svg { transition: none; }
  }

  /* ---------- header ---------- */
  .head { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; padding-bottom: 16px; }
  .titles h1 { margin: 0; font-size: 20px; font-weight: 800; color: var(--strong); letter-spacing: -.01em; }
  .asof { margin-top: 2px; font-size: 11.5px; color: var(--text-2); }
  .asof b { color: var(--yellow); font-weight: 600; }
  .spacer { flex: 1; }

  .stats { display: flex; gap: 24px; align-items: baseline; }
  .stat .n { font-size: 26px; font-weight: 700; line-height: 1; }
  .stat .l { font-size: 10.5px; color: var(--text-3); margin-top: 4px; }

  .headright { display: flex; align-items: center; gap: 16px; }

  .btn {
    background: transparent; color: var(--text-2); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 11px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .btn:hover { background: var(--card); color: var(--strong); }
  .btn[aria-pressed="true"] { background: var(--yellow); border-color: var(--yellow); color: var(--navy); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #58c493; flex: none; }
  .dot.warn { background: var(--target); }

  /* ---------- month sections ---------- */
  .month { margin-bottom: 22px; }
  .mhead {
    display: flex; align-items: center; gap: 12px;
    font-size: 11px; font-weight: 700; letter-spacing: .13em;
    color: var(--yellow); text-transform: uppercase; margin-bottom: 10px;
  }
  .mhead::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .mhead .c { color: var(--text-3); font-weight: 600; letter-spacing: .04em; }

  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); }

  /* ---------- trip card ---------- */
  .trip {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 13px 14px 12px; position: relative;
  }
  /* Sold out is good news, not a faded/broken state — no dimming, a clear
     green badge instead, same treatment as the red CANCELLED tag. */
  .trip.done { border-color: var(--soldout); }
  .tag.soldout { background: var(--soldout); color: var(--navy); }
  .trip.cancelled {
    background: var(--danger-bg); border-color: var(--danger);
  }
  .trip.cancelled .tname { text-decoration: line-through; color: var(--cancel-ink); }
  .trip.cancelled .tmeta, .trip.cancelled .wlab, .trip.cancelled .wdate { color: var(--cancel-ink2); }
  .trip.cancelled .tnum .b { color: var(--cancel-ink) !important; }
  .trip.cancelled .fill, .trip.cancelled .wnum { background: var(--danger) !important; color: var(--cancel-ink) !important; }
  .trip.cancelled .wnum, .trip.cancelled .wnum .of, .trip.cancelled .wk .wnum, .trip.cancelled .wk .wnum .of { background: #b8342b !important; color: #fff !important; }
  .trip.cancelled .track { background: var(--cancel-track); }
  /* One week closed in WeTravel (0 seats, "Unavailable") on a trip that
     still runs: that week alone reads as cancelled. */
  .wk.wk-cancel .wlab, .wk.wk-cancel .wdate { color: var(--cancel-ink2); text-decoration: line-through; }
  .wk.wk-cancel .wnum, .wk.wk-cancel .wnum .of { color: var(--cancel-ink) !important; }
  .wk.wk-cancel .fill { background: var(--danger) !important; }
  .wk.wk-cancel .track { background: var(--cancel-track); }
  .trip.cancelled .wcancel { display: none; } /* the card already says it */
  .wcancel { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 4px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 800; letter-spacing: .06em; vertical-align: 1px; }

  .thead { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 3px; }
  .tname { font-size: 14.5px; font-weight: 700; line-height: 1.25; flex: 1; min-width: 0; }
  .tnum { text-align: right; line-height: 1; white-space: nowrap; }
  .tnum .b { font-size: 22px; font-weight: 700; }
  .tnum .b.full { color: var(--soldout); }
  .tnum .b.none { color: var(--text-3); }
  .tnum .s { font-size: 10px; color: var(--text-3); margin-top: 3px; }
  .tmeta { font-size: 11px; color: var(--text-3); margin-bottom: 11px; }

  .tag {
    display: inline-block; font-size: 8.5px; font-weight: 700; letter-spacing: .09em;
    padding: 2px 6px; border-radius: 3px; vertical-align: 2px; margin-left: 6px;
    background: var(--danger); color: #fff;
  }

  /* ---------- week meters ---------- */
  .weeks { display: flex; flex-direction: column; gap: 8px; }
  .wk { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; align-items: baseline; }
  .wlab { font-size: 11.5px; font-weight: 600; color: var(--text); }
  .wdate { font-size: 10.5px; color: var(--text-3); font-weight: 400; margin-left: 5px; }
  .wnum { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .wnum .of { color: var(--text-3); font-weight: 500; }
  .wnum.full { color: var(--soldout); }
  .wnum.none { color: var(--text-3); }

  .track {
    grid-column: 1 / -1; position: relative; height: 9px;
    background: var(--track); border-radius: 5px; overflow: hidden;
  }
  .fill { height: 100%; border-radius: 5px; background: var(--fill); transition: width .35s ease; }
  .fill.full { background: var(--soldout); }
  .fill.none { background: transparent; }
  /* where the goal sits, so a short track reads as "can't get there" */
  .tick { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--target); }
  .cap {
    grid-column: 1 / -1; font-size: 9.5px; color: var(--text-3); margin-top: -1px;
  }

  .single .wlab { display: none; }

  /* ---------- new booking, first 24h ---------- */
  /* The whole card lights up — a bright wash plus a glowing border — so a new
     booking reads as "look here" from across the room, not just up close. */
  .trip.fresh {
    background:
      linear-gradient(155deg, var(--fresh-wash), transparent 60%),
      var(--card);
    border-color: var(--fresh);
    box-shadow: 0 0 0 1px var(--fresh);
  }

  .newbadge {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--fresh); color: var(--fresh-ink);
    font-size: 9.5px; font-weight: 800; letter-spacing: .06em;
    padding: 3px 8px; border-radius: 20px; margin-left: 7px; vertical-align: 2px;
    white-space: nowrap;
  }
  .newbadge::before {
    content: ""; width: 5px; height: 5px; border-radius: 50%;
    background: var(--fresh-ink); animation: breathe 1.4s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .2 } }
  @media (prefers-reduced-motion: reduce) {
    .newbadge::before { animation: none; }
  }

  .wk.fresh { background: var(--fresh-wash); border-radius: 8px; margin: -6px -8px; padding: 6px 8px; }
  .wk.fresh .wlab, .wk.fresh .wdate { color: var(--fresh-bright); }
  .wpill {
    font-size: 9.5px; font-weight: 800; color: var(--fresh-ink);
    background: var(--fresh); border-radius: 20px;
    padding: 1px 7px; margin-left: 6px; white-space: nowrap;
  }
  .wk.fresh .fill { background: var(--fresh); }
  .wago { font-size: 9.5px; color: var(--fresh-bright); font-weight: 600; }

  .stat .n.fresh { color: var(--fresh); }

  /* ---------- report ---------- */
  .rtop { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 12px; margin-bottom: 14px; }
  @media (max-width: 900px) { .rtop { grid-template-columns: 1fr; } }

  .panel {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 16px 15px;
  }
  /* Panels stacked directly in a tab need air between them. This rule once
     covered Campaigns and History, went out with the chart CSS in 4bd0a36,
     and those tabs' panels have touched since; Previous Projects and Leads
     never had it. */
  #previousWrap > .panel, #campaignsWrap > .panel,
  #historyWrap > .panel, #leadsWrap > .panel, #engagementsWrap > .panel, #tripsWrap > .panel, #feedbackWrap > .panel, #revenueWrap > .panel, #impactWrap > .panel, #pendingWrap > .panel, #kpisWrap > .panel { margin-bottom: 12px; }
  .ptitle {
    font-size: 10.5px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase;
    color: var(--text-3); margin-bottom: 10px;
  }

  .hero { display: flex; align-items: baseline; gap: 8px; }
  .hero .big { font-size: 44px; font-weight: 700; line-height: 1; }
  .hero .of { font-size: 17px; color: var(--text-3); font-weight: 600; }
  .hero.hit .big { color: var(--fill-full); }
  .hsub { font-size: 11.5px; color: var(--text-2); margin-top: 7px; }
  .hsub b { color: var(--yellow); font-weight: 600; }
  .htrack { height: 10px; background: var(--track); border-radius: 5px; margin-top: 11px; position: relative; overflow: hidden; }
  .hfill { height: 100%; border-radius: 5px; background: var(--fill); transition: width .35s ease; }
  .hfill.hit { background: var(--fill-full); }
  .pace { font-size: 11px; margin-top: 8px; font-weight: 600; }
  .pace.ok { color: var(--fill-full); }
  .pace.behind { color: var(--target-ink); }

  /* day strip for the current week */
  .days { display: flex; gap: 6px; }
  .dcell { flex: 1 1 0; text-align: center; }
  .dbar-wrap { height: 78px; display: flex; align-items: flex-end; justify-content: center; }
  .dbar {
    width: 70%; min-height: 3px; background: var(--fill);
    border-radius: 4px 4px 0 0; transition: height .3s ease;
  }
  .dcell.today .dbar { background: var(--fresh); }
  .dcell.ahead .dbar { background: #2c4a75; }
  .dnum { font-size: 13px; font-weight: 700; margin-top: 6px; }
  .dcell.ahead .dnum, .dcell.zero .dnum { color: var(--text-3); }
  .dlab { font-size: 9.5px; color: var(--text-2); margin-top: 2px; }
  .dcell.today .dlab { color: var(--fresh); font-weight: 700; }

  /* main report chart */
  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .seg { display: inline-flex; background: var(--track); border-radius: 8px; padding: 2px; }
  .seg button {
    background: transparent; border: 0; color: var(--text-2); cursor: pointer;
    font: inherit; font-size: 11.5px; padding: 5px 11px; border-radius: 6px;
  }
  .seg button[aria-pressed="true"] { background: var(--yellow); color: var(--navy); font-weight: 700; }

  .fnote { font-size: 11px; color: var(--text-3); margin-left: auto; }
  /* A pill only works for one short line — border-radius:20px on wrapped
     text produces the huge lopsided caps a pill was never meant to show. */
  .tzbadge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(var(--acc-rgb),.14); border: 1px solid rgba(var(--acc-rgb),.35);
    color: var(--yellow); font-size: 12px; font-weight: 600;
    padding: 6px 12px; border-radius: 20px; margin-bottom: 14px;
  }
  .tzbadge b { font-weight: 800; }

  .chart { position: relative; height: 230px; padding-left: 30px; }
  .crule { position: absolute; left: 30px; right: 0; height: 1px; background: rgba(var(--ov),.07); }
  .crule .ct {
    position: absolute; left: -30px; top: -8px; width: 24px; text-align: right;
    font-size: 10.5px; color: var(--text-3); font-variant-numeric: tabular-nums;
  }
  .ctarget { position: absolute; left: 30px; right: 0; height: 2px; background: var(--target); }
  .ctflag {
    position: absolute; right: 0; top: -17px; font-size: 9px; font-weight: 700;
    letter-spacing: .07em; color: var(--target-ink);
  }
  .cbars { position: relative; display: flex; height: 100%; gap: 10px; }
  .cslot {
    flex: 1 1 0; height: 100%; display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center; position: relative;
  }
  .cval { font-size: 13px; font-weight: 700; margin-bottom: 5px; }
  .cslot.zero .cval { color: var(--text-3); }
  .cslot.hit .cval { color: var(--fill-full); }
  .cbar {
    flex: 0 0 auto; width: 100%; max-width: 54px; min-height: 3px;
    background: var(--fill); border-radius: 5px 5px 0 0; transition: height .3s ease;
  }
  .cslot.hit .cbar { background: var(--fill-full); }
  /* The bar currently driving the hero/KPI panel above — a ring, not a color
     swap, so it stays legible whether the bar is also .zero, .hit, or .partial. */
  .cslot.selected .cbar { box-shadow: 0 0 0 2px var(--yellow); }
  .cslot.selected .cval { color: var(--yellow); }
  /* the in-progress period is drawn hollow so a partial week never reads as a miss */
  .cslot.partial .cbar {
    background: repeating-linear-gradient(135deg, var(--fill) 0 6px, rgba(var(--fill-rgb),.35) 6px 12px);
  }
  .cslot .charter {
    width: 100%; max-width: 54px; min-height: 0;
    background: #4d6a94; border-radius: 5px 5px 0 0; transition: height .3s ease;
  }
  .clab { font-size: 10px; color: var(--text-3); margin-top: 8px; text-align: center; line-height: 1.3; }
  .cslot.partial .clab { color: var(--yellow); }
  .caxis { display: flex; gap: 10px; padding-left: 30px; }
  /* min-width: 0 so every label keeps its bar's width: on a phone "Nov
     2025" was wider than its slot, the labels pushed each other right, and
     July's bar read as May's. A label still wider than its bar is centred
     on it and spills evenly both sides, so it stays under the right bar. */
  .caxis > div { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .cslot { min-width: 0; }
  @media (max-width: 600px) { .clab { font-size: 9px; } }
  .ps-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-top: 14px; }
  .ps-line { margin-top: 12px; font-size: 13px; color: var(--text-2); line-height: 1.6; }
  .ps-line b { color: var(--strong); }
  .ps-line .up { color: var(--fill-full); font-weight: 700; }
  .ps-line .down { color: var(--bad-ink); font-weight: 700; }
  .ps-months { flex-wrap: wrap; }

  .rlegend { display: flex; gap: 15px; flex-wrap: wrap; font-size: 10.5px; color: var(--text-3); margin-top: 12px; }
  .rlegend i { display: inline-block; width: 16px; height: 8px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }

  /* ---------- period navigation (This week hero panel) ---------- */
  .pnav { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .pnav .ptitle { flex: 1; }
  .navbtn {
    background: transparent; border: 1px solid var(--line); color: var(--text-2);
    width: 24px; height: 24px; border-radius: 6px; font-size: 14px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none;
  }
  .navbtn:hover:not(:disabled) { background: var(--card-2); color: var(--strong); }
  .navbtn:disabled { opacity: .3; cursor: default; }
  .navbtn-today {
    width: auto; padding: 0 9px; font-size: 10.5px; font-weight: 700;
  }

  /* ---------- simple 3-stat summary (Last 24h / Last week / Weekly target) ---------- */
  .skpi-panel { display: flex; gap: 0; }
  .skpi {
    flex: 1; text-align: center; padding: 4px 12px;
    border-right: 1px solid var(--line);
  }
  .skpi:last-child { border-right: 0; }
  .skpi-n { font-size: 32px; font-weight: 700; line-height: 1; color: var(--strong); }
  .skpi-l { font-size: 11.5px; color: var(--text-3); margin-top: 6px; }
  .skpi-sub { font-size: 10px; color: var(--text-3); margin-top: 3px; }

  /* A tile earns a colour only when a published benchmark says the number is
     out of the usual range — never for the metric merely existing. The word
     underneath always carries the same meaning as the colour, so the signal
     survives colour-blindness and a black-and-white print alike. */

  /* ---------- campaigns (Meta Ads) ---------- */

  /* Six tiles across on a wall display, folding to three then two as the
     window narrows — the KPI block is the part people read from a distance. */

  /* Wide tables scroll inside their own panel rather than pushing the page. */
  .tscroll { overflow-x: auto; }
  .ctable { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }
  .ctable th {
    text-align: right; font-weight: 600; color: var(--text-3);
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
    padding: 6px 10px; border-bottom: 1px solid var(--line);
  }
  .ctable th:first-child, .ctable td:first-child { text-align: left; }
  .ctable td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--line); color: var(--text-2); }
  .ctable tbody tr:hover td { background: rgba(var(--acc-rgb),.05); }
  .ctable td.cname { color: var(--strong); font-weight: 600; white-space: normal; min-width: 190px; }
  .ctable tfoot td {
    border-top: 1px solid var(--line); border-bottom: 0;
    font-weight: 700; color: var(--strong); padding-top: 9px;
  }
  .ctable .num { font-variant-numeric: tabular-nums; }
  /* Same benchmark meaning as the tiles, applied per campaign so a single
     under-performing line is findable without reading every number. */

  /* Status and objective read as quiet labels, not as alarm colors — the
     booking board already owns green/yellow/red for capacity meaning. */
  .cpill {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 10px; font-weight: 600; letter-spacing: .02em;
  }
  .cpill.on  { background: rgba(61,220,132,.16); color: var(--fresh-ink); }
  .cpill.off { background: rgba(134,152,180,.14); color: var(--text-3); }
  /* Cost per result over the limit (running campaigns only). */
  .cpr-over { display: inline-block; padding: 1px 8px; border-radius: 999px; background: rgba(239,83,80,.16); color: var(--bad-ink); font-weight: 700; cursor: help; }
  .cpr-note { font-size: 12.5px; color: var(--text-2); margin: -4px 0 12px; }
  .cpr-note.bad { color: var(--bad-ink); }
  /* Lead quality of running campaigns: status uses the fixed status steps
     with a glyph, HP rate bar in the HP target's yellow (as on Leads). */
  .lq-st { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; cursor: help; white-space: nowrap; }
  .lq-st.good { background: rgba(12,163,12,.18); color: var(--good-ink); }
  .lq-st.watch { background: rgba(250,178,25,.16); color: var(--warn-ink); }
  .lq-st.bad { background: rgba(208,59,59,.2); color: var(--bad-ink); }
  .lq-st.none { background: rgba(111,134,168,.16); color: var(--text-2); }
  .lq-sub { font-size: 11px; color: var(--text-3); font-weight: 500; margin-top: 2px; }
  .abar-fill.lq { background: var(--tgt-hp); }
  /* ---- budget vs actual ----
     The one comparison this tab exists to make: two figures side by side and
     a single track underneath, rather than numbers the reader has to divide
     in their head. */
  /* Single-figure hero — the Previous Trips headline count. */
  .vhero { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .vhero .vh-n { font-size: 46px; font-weight: 700; line-height: 1; color: var(--strong); font-variant-numeric: tabular-nums; }
  .vhero .vh-c { font-size: 15px; color: var(--yellow); font-weight: 700; }
  .vhero .vh-s { font-size: 12px; color: var(--text-3); }

  .bvhero { display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap; }
  .bv-side { min-width: 130px; }
  .bv-lab { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
  .bv-n { font-size: 34px; font-weight: 700; color: var(--strong); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .bv-n.bv-act { color: var(--yellow); }
  .bv-s { font-size: 11px; color: var(--text-3); margin-top: 2px; }
  .bv-vs { font-size: 12px; color: var(--text-3); padding-bottom: 10px; }

  .bvbar { margin-top: 16px; }
  .bvbar-track { position: relative; height: 14px; border-radius: 7px; background: var(--track); overflow: hidden; }
  .bvbar-fill { height: 100%; background: var(--fill); border-radius: 7px; min-width: 2px; }

  /* Per-row actual-vs-budget bar. Amber as it nears the budget, red once it
     is past it — the number beside it says the same thing, so the colour is
     never the only signal. */
  .abar-cell { min-width: 190px; }
  .abar {
    display: inline-block; vertical-align: middle; width: 120px; height: 9px;
    border-radius: 5px; background: var(--track); overflow: hidden;
  }
  .abar-fill { height: 100%; border-radius: 5px; background: var(--fresh); min-width: 2px; }
  .abar-fill.near { background: var(--target); }
  .abar-fill.over { background: var(--danger); }
  .abar-pct {
    display: inline-block; margin-left: 9px; font-size: 12px; min-width: 44px; text-align: right;
    color: var(--text-2); font-variant-numeric: tabular-nums;
  }

  /* Month-by-month strip for a full calendar year. Twelve rows always, so a
     month with no spend reads as a deliberate gap rather than a missing one;
     bars are scaled against the busiest month of that year. */
  .mgrid {
    display: grid; grid-template-columns: 38px 1fr 96px;
    gap: 7px 12px; align-items: center; margin-top: 18px;
  }
  .mgrid .m-l {
    font-size: 11px; font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase; color: var(--text-3);
  }
  .mgrid .m-l.now { color: var(--yellow); }
  .mgrid .m-b { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
  .mgrid .m-f { height: 100%; border-radius: 5px; background: var(--fill); }
  .mgrid .m-v {
    text-align: right; font-size: 12px; color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }
  .mgrid .m-v.zero { color: var(--text-3); }
  /* Small print under a panel, for a caveat the numbers can't carry alone. */
  .pnote { margin-top: 14px; font-size: 11.5px; color: var(--text-3); line-height: 1.6; }
  .pnote b { color: var(--text-2); }

  /* ---------- previous trips ---------- */

  .fselect {
    background: var(--track); color: var(--text-2); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .fselect:hover { border-color: var(--info-line); color: var(--strong); }

  /* The year itself is now a picker (the .seg tabs above), not a repeated
     block per year, so only the month sub-level still needs its own header —
     one that still reads from across the room, a filled band with its own
     accent colour (blue, so it never competes with the yellow year tabs),
     not just smaller type. */
  .pt-month { margin: 0 0 18px 0; }
  .pt-month:last-child { margin-bottom: 0; }
  .pt-mhead {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    background: rgba(var(--acc-rgb),.10); border: 1px solid rgba(var(--acc-rgb),.32);
    border-left: 3px solid var(--yellow);
    border-radius: 7px; padding: 8px 14px; margin-bottom: 10px;
  }
  .pt-mname { font-size: 14px; font-weight: 800; color: var(--yellow); text-transform: uppercase; letter-spacing: .04em; }
  .pt-mmeta { font-size: 11.5px; color: var(--text-2); }
  .pt-mnums { margin-left: auto; display: flex; gap: 16px; font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--text-2); }
  .pt-mnums b { color: var(--strong); font-weight: 700; }
  .pt-mnums .cancel b { color: var(--bad-ink); }

  .pt-row {
    display: grid; grid-template-columns: minmax(0,1.2fr) 158px 74px 74px 74px;
    gap: 10px; align-items: center; padding: 9px 2px; font-size: 12.5px;
  }
  .pt-row + .pt-row { border-top: 1px solid var(--line); }
  .pt-name { color: var(--strong); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* A project code is an identifier, not prose — monospaced and letter-spaced
     so ZNZ-BL-202607-02C can be read off and compared at a glance. Trips the
     code list can't place keep their WeTravel title in normal type. */
  .pt-name.pt-code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; letter-spacing: .02em; color: var(--yellow);
  }
  .pt-dest { font-size: 11px; color: var(--text-3); margin-top: 2px; }
  /* No nowrap — a long "27 Aug 2026 – 30 Aug 2026" range wraps onto a second
     line rather than overflowing into the next column. */
  .pt-dates { color: var(--text-2); font-size: 11.5px; text-align: right; line-height: 1.35; }
  .pt-num { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }
  .pt-num b { color: var(--strong); font-weight: 700; }
  .pt-num.pt-cancel b { color: var(--bad-ink); }
  .pt-charter {
    display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 999px;
    background: rgba(77,157,224,.14); color: var(--info);
    font-size: 9px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  }
  @media (max-width: 780px) {
    .pt-row { grid-template-columns: 1fr auto auto auto; row-gap: 6px; }
    .pt-dates { grid-column: 1 / -1; text-align: left; }
  }

  .pt-row.pt-cancelled-row {
    background: rgba(224,72,61,.07); border-radius: 6px; margin: 0 -6px; padding-left: 8px; padding-right: 8px;
  }
  .pt-row.pt-cancelled-row .pt-name { color: var(--bad-soft); }
  .pt-tag {
    display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 999px;
    background: rgba(224,72,61,.18); color: #ff9d92;
    font-size: 9px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  }

  /* Weeks is its own stat column now, styled as a real button rather than a
     line of small text, so "this trip has more detail behind it" is obvious
     at a glance, not something you notice only by hovering. Every trip with
     week data gets one, single week or many, since Muatasam asked for it to
     always be clickable. */
  .pt-toggle {
    display: flex; flex-direction: column; align-items: flex-end; gap: 1px;
    margin-left: auto; background: rgba(77,157,224,.14); border: 1px solid rgba(77,157,224,.38);
    border-radius: 7px; padding: 5px 9px; color: var(--info);
    font: inherit; font-size: 10px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
    cursor: pointer;
  }
  .pt-toggle:hover { background: rgba(77,157,224,.24); border-color: var(--info); }
  .pt-toggle[aria-expanded="true"] { background: rgba(77,157,224,.28); border-color: var(--info); }
  .pt-toggle-lab { display: flex; align-items: center; gap: 4px; }
  .pt-toggle .pt-ar { font-size: 8px; transition: transform .15s; }
  .pt-toggle[aria-expanded="true"] .pt-ar { transform: rotate(90deg); }
  .pt-toggle b { color: var(--strong); font-size: 13.5px; font-weight: 800; text-transform: none; letter-spacing: 0; }
  .pt-weeks {
    grid-column: 1 / -1; margin: 8px 0 2px 0; padding: 8px 0 2px 14px; border-left: 2px solid var(--line);
  }
  .pt-wrow {
    display: grid; grid-template-columns: minmax(0,1fr) 90px; gap: 10px; align-items: center;
    padding: 5px 8px; font-size: 11.5px; border-radius: 5px;
  }
  .pt-wrow.pt-cancelled-row { background: rgba(224,72,61,.09); }
  .pt-wlabel { color: var(--text-2); }
  .pt-wrow.pt-cancelled-row .pt-wlabel { color: var(--bad-soft); }
  .pt-wnum { text-align: right; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .pt-wnum b { color: var(--strong); }
  .pt-unalloc { font-size: 10.5px; color: var(--text-3); padding: 4px 8px; }

  /* ---------- leads ---------- */

  .lhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .lhead .ptitle { margin-bottom: 0; }
  .lnav { display: flex; gap: 6px; }
  .lnav button {
    background: var(--track); border: 1px solid var(--line); color: var(--text-2);
    border-radius: 7px; padding: 5px 11px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .lnav button:hover:not(:disabled) { color: var(--strong); border-color: var(--info-line); }
  .lnav button:disabled { opacity: .35; cursor: default; }

  /* Charts sit on --track, the surface the channel colours were validated
     against. Bars are capped at 24px and leave the rest of their slot as
     air; the 2px gap between the WA and IG segments is surface, not a
     stroke. Data-end rounded, baseline square. */
  .lchart { background: var(--track); border-radius: 8px; padding: 12px 12px 8px; margin-top: 14px; }
  .lscroll { overflow-x: auto; }
  .lscroll .lchart { min-width: 620px; }
  .lplot { position: relative; display: flex; align-items: flex-end; gap: 2px; }
  .lgl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); pointer-events: none; }
  .lgl span { position: absolute; left: -26px; top: -7px; width: 22px; text-align: right; font-size: 9.5px; color: var(--text-3); }
  .lplot.gut, .laxis.gut { margin-left: 26px; }
  .lcol {
    flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center;
    background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: default;
  }
  button.lcol { cursor: pointer; }
  .lcol:hover .lstack { filter: brightness(1.18); }
  .lval { font-size: 11.5px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; min-height: 15px; font-variant-numeric: tabular-nums; }
  .lcol.missing .lval, .lcol.future .lval { color: var(--text-3); font-weight: 400; }
  .lstack { width: 100%; max-width: 24px; display: flex; flex-direction: column-reverse; gap: 2px; }
  .lstack.thin { max-width: 14px; }
  .lseg { display: block; min-height: 2px; }
  .lstack .lseg:last-child { border-radius: 4px 4px 0 0; }
  .lseg.wa { background: var(--lead-wa); }
  .lseg.ig { background: var(--lead-ig); }
  .lseg.all { background: var(--lead-all); }
  /* Overall weekly conversion vs its 10% target (status steps, glyph in the
     legend, tooltip and headline too, so colour never carries it alone). */
  .lseg.cv-ok { background: var(--q-high); }
  .lseg.cv-low { background: var(--q-low); }
  .bv-n.cv-up { color: var(--good-ink); }
  .bv-n.cv-down { color: var(--bad-ink); }
  .lcol.sel .lval { color: var(--strong); }
  /* Daily targets (Muatasam, 6 Oct 2026: 20 leads and 10 high-potential leads
     a day): a dashed line each, in its own colour, across the plot; and each
     day's high-potential leads as a thin bar beside its lead bar. */
  .lpair { display: flex; align-items: flex-end; justify-content: center; gap: 3px; width: 100%; }
  .lpair .lstack { flex: 0 1 24px; width: auto; }
  .lhp1 { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; flex: 0 0 10px; }
  .lhpn { font-size: 9.5px; font-weight: 700; color: var(--hp-ink); line-height: 1; margin-bottom: 2px; font-variant-numeric: tabular-nums; }
  .lhpbar {
    display: block; width: 8px; min-height: 3px; border-radius: 4px 4px 0 0;
    background: linear-gradient(180deg, color-mix(in srgb, var(--tgt-hp) 70%, #fff), var(--tgt-hp));
    box-shadow: 0 0 10px color-mix(in srgb, var(--tgt-hp) 45%, transparent);
  }
  /* A target line: short dashes, a glowing round cap on the right, and its
     label as a small pill in a gutter beyond the bars. */
  .ltgt { position: absolute; left: 0; right: 0; height: 0; pointer-events: none; z-index: 2; }
  .ltgt::before {
    content: ''; position: absolute; left: 0; right: 0; top: -1px; height: 2px; border-radius: 2px;
    background: repeating-linear-gradient(90deg, var(--c) 0 8px, transparent 8px 13px);
  }
  .ltgt::after {
    content: ''; position: absolute; right: 0; top: -4px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent);
  }
  /* The labels sit in a gutter to the right of the bars, so a tall bar never
     runs under one. */
  .lplot.tg, .laxis.tg { margin-right: 84px; }
  .ltgt span {
    position: absolute; left: calc(100% + 14px); top: -9px; padding: 3px 10px; border-radius: 999px;
    background: color-mix(in srgb, var(--c) 16%, var(--track)); border: 1px solid color-mix(in srgb, var(--c) 50%, transparent);
    font-size: 9.5px; font-weight: 700; letter-spacing: .07em; line-height: 1; color: color-mix(in srgb, var(--c) 50%, var(--strong)); white-space: nowrap;
  }
  .lleg .ltl {
    display: inline-block; width: 22px; height: 3px; margin-right: 7px; vertical-align: 2px; border-radius: 2px;
    background: repeating-linear-gradient(90deg, var(--c) 0 5px, transparent 5px 8px);
  }
  .laxis { display: flex; gap: 2px; margin-top: 6px; }
  .laxis span {
    flex: 1; min-width: 0; text-align: center; font-size: 10px; color: var(--text-3);
    white-space: nowrap; line-height: 1.3;
  }
  .laxis span b { display: block; font-size: 11px; color: var(--text-2); font-weight: 600; }
  .laxis span.on, .laxis span.on b { color: var(--yellow); font-weight: 700; }
  /* The selected week is marked under the axis, not by recolouring its bar,
     so a bar's colour only ever means its channel. (lweeks, not "weeks":
     .weeks is already the trip cards' stacked week meters, and borrowing it
     turned this axis into a column.) */
  .laxis.lweeks span { overflow: visible; }
  .laxis.lweeks span.on { box-shadow: inset 0 2px 0 var(--yellow); padding-top: 3px; }
  /* The tapped day, marked the same way as the selected week. */
  .laxis span.pick { box-shadow: inset 0 2px 0 var(--yellow); padding-top: 3px; }
  .laxis span.pick, .laxis span.pick b { color: var(--strong); }
  .lsplit { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); margin: 0 0 8px; }
  .lsplit i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .lsplit b { color: var(--strong); font-variant-numeric: tabular-nums; }

  .lleg { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11px; color: var(--text-2); margin-top: 10px; }
  .lleg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .pnote.warn { color: var(--bad-soft); }
  /* HP count: the brand yellow, as a small pill, so it reads apart from leads. */
  .lhp { display: inline-block; min-width: 22px; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--yellow) 22%, transparent); color: var(--yellow); font-weight: 700; text-align: center; }
  .abar-fill.lead { background: var(--lead-all); }

  /* ---------- trips (decision dashboard) ---------- */
  /* In-page sub-tabs: the same pill switch as the pickers, a size up, so it
     reads as navigation for the tab rather than a filter. */
  .seg.subtabs { margin-bottom: 12px; padding: 3px; }
  /* Section tabs: the pages of the open sidebar section, as underlined text
     so they don't look like the pill sub-tabs some pages have inside. */
  .bk-filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .bk-filters .seg { flex-wrap: wrap; }
  .bk-filters .seg button { font-size: 12.5px; padding: 6px 12px; }
  .bk-filters select { font: inherit; font-size: 12.5px; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); max-width: 240px; }
  .sec-tabs { display: flex; gap: 2px; margin: -6px 0 18px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .sec-tabs::-webkit-scrollbar { display: none; }
  .sec-tabs button { flex: none; background: none; border: 0; border-bottom: 2.5px solid transparent; margin-bottom: -1px; padding: 9px 14px 10px; font: inherit; font-size: 13.5px; font-weight: 600; color: var(--text-3); cursor: pointer; white-space: nowrap; }
  .sec-tabs button:hover { color: var(--text); }
  .sec-tabs button[aria-selected="true"] { color: var(--yellow); border-bottom-color: var(--yellow); }
  .seg.subtabs button { font-size: 13px; font-weight: 600; padding: 7px 16px; }
  /* Top-aligned: the quality tiles carry a "trips" line the first two don't, and
     bottom alignment left their labels on different lines. */
  .trp-tiles { display: flex; flex-wrap: wrap; gap: 14px 30px; align-items: flex-start; }
  .trp-q { display: inline-flex; align-items: center; gap: 5px; }
  .trp-q i { font-style: normal; font-size: 10px; }
  /* Where the weeks go: one bar, a segment per rating, 2px of surface
     between segments, rounded only at the two outer ends. */
  .trp-bar { display: flex; gap: 2px; height: 26px; border-radius: 6px; overflow: hidden; background: var(--track); margin: 16px 0 8px; }
  .trp-seg { min-width: 3px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #0b1a2e; }
  .trp-leg { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 11.5px; color: var(--text-2); }
  .trp-leg b { color: var(--strong); font-variant-numeric: tabular-nums; }
  .trp-mini { display: flex; gap: 2px; height: 10px; width: 140px; border-radius: 5px; overflow: hidden; background: var(--track); }
  .trp-pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600; color: var(--strong); white-space: nowrap;
  }
  .trp-pill i { font-style: normal; font-size: 9px; }
  .trp-sub { display: block; margin-top: 2px; font-size: 10.5px; font-weight: 500; color: var(--text-3); white-space: normal; }
  #tripsWrap .ctable td.cname { min-width: 170px; }
  #tripsWrap .ctable td.trp-txt { white-space: normal; text-align: left; min-width: 220px; max-width: 420px; font-size: 11.5px; line-height: 1.45; }
  #tripsWrap .ctable th.trp-l, #tripsWrap .ctable td.trp-l { text-align: left; }
  .trp-sub.nw { white-space: nowrap; }
  #tripsWrap .ctable td.trp-dec { min-width: 150px; max-width: 220px; }
  /* Under the trip name, so it's on screen however far the table scrolls. */
  .trp-toggle {
    display: inline-block; margin-top: 6px;
    background: var(--track); border: 1px solid var(--line); color: var(--text-2);
    border-radius: 6px; padding: 2px 9px; font: inherit; font-size: 10.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .trp-toggle:hover, .trp-toggle[aria-expanded="true"] { color: var(--strong); border-color: var(--info-line); }
  /* R&D board. Cards on the track surface; the single accent is the brand
     fill, so a stage never borrows a quality colour. */
  .trp-strip-wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .trp-strip { flex: 1; min-width: 200px; display: flex; gap: 2px; height: 22px; border-radius: 6px; overflow: hidden; background: var(--track); }
  .trp-strip-seg {
    display: flex; align-items: center; justify-content: center; min-width: 22px;
    font-size: 11px; font-weight: 700; color: var(--strong); background: rgba(var(--fill-rgb),.35);
  }
  .trp-strip-seg.idle { background: rgba(134,152,180,.28); }
  .trp-strip-seg.done { background: var(--fill); color: #0b1a2e; }
  .trp-strip-seg span { font-weight: 600; white-space: nowrap; }
  @media (max-width: 600px) { .trp-strip-seg span { display: none; } }
  .trp-strip-seg.paused { background: repeating-linear-gradient(45deg, rgba(134,152,180,.35) 0 6px, rgba(134,152,180,.18) 6px 12px); }
  .trp-board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, .85fr); gap: 12px; align-items: start; }
  .trp-board + .trp-board { margin-top: 12px; }
  .trp-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .trp-col-head {
    font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2);
    padding: 0 2px 6px; border-bottom: 2px solid rgba(var(--fill-rgb),.45);
  }
  .trp-col.hold .trp-col-head { border-bottom-style: dashed; border-bottom-color: var(--line); color: var(--text-3); }
  .trp-col-empty { font-size: 11.5px; color: var(--text-3); padding: 10px 4px; }
  .trp-card {
    background: var(--track); border: 1px solid var(--line); border-radius: 10px; padding: 12px 13px;
    display: flex; flex-direction: column; gap: 7px; transition: border-color .15s, transform .15s;
  }
  .trp-card:hover { border-color: rgba(var(--fill-rgb),.55); transform: translateY(-1px); }
  .trp-card.hold { border-style: dashed; }
  .trp-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .trp-card-name { font-size: 14px; font-weight: 700; color: var(--strong); line-height: 1.25; }
  .trp-year {
    flex: none; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
    color: var(--text-2); border: 1px solid var(--line); font-variant-numeric: tabular-nums;
  }
  .trp-year.now { color: var(--yellow); border-color: rgba(var(--fill-rgb),.6); }
  .trp-stepper { display: flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--text-2); }
  .trp-stepper i { display: block; width: 18px; height: 5px; border-radius: 3px; background: rgba(134,152,180,.25); }
  .trp-stepper i.on { background: rgba(var(--fill-rgb),.7); }
  .trp-stepper.done i.on { background: var(--fill); }
  .trp-stepper.paused i.on { background: rgba(134,152,180,.7); }
  .trp-stepper span { margin-left: 6px; }
  .trp-stepper.done span { color: var(--yellow); }
  .trp-owner { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2); }
  .trp-owner b {
    width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(77,157,224,.22); color: var(--strong); font-size: 10.5px;
  }
  .trp-owner em { color: var(--text-3); font-style: italic; }
  .trp-next { font-size: 11.5px; line-height: 1.45; color: var(--text-2); border-top: 1px solid var(--line); padding-top: 7px; }
  .trp-next span { display: block; font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin-bottom: 2px; }
  @media (max-width: 1100px) { .trp-board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 600px) { .trp-board { grid-template-columns: 1fr; } }
  .ctable tr.trp-detail td, .ctable tbody tr.trp-detail:hover td { background: var(--card-2); box-shadow: inset 3px 0 0 var(--yellow); text-align: left; white-space: normal; padding: 12px 16px 14px; }
  .trp-dl {
    display: grid; grid-template-columns: 150px 1fr; gap: 8px 16px; font-size: 12px; line-height: 1.55; color: var(--text-2);
    position: sticky; left: 16px; max-width: 900px;
  }
  .trp-dl dt { color: var(--text-2); font-weight: 700; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding-top: 2px; }
  .trp-dl dd { margin: 0; }
  @media (max-width: 600px) {
    /* 100vw less the page gutter (40), panel (34), cell padding (16) and the
       sticky inset (16): the width actually visible inside the scroll box. */
    .trp-dl { grid-template-columns: 1fr; gap: 2px; max-width: calc(100vw - 110px); }
    .trp-dl dd { margin-bottom: 8px; }
    #tripsWrap .ctable td.cname { min-width: 130px; }
  }

  /* ---------- engagements ----------
     One series per chart (views per post), so one hue: the brand fill, as
     on the other single-series bars on the board. The Leads chart classes
     (.lchart, .lplot, .lcol...) are reused; only what differs is here. */
  .lseg.eng { background: var(--fill); }
  .abar-fill.eng { background: var(--fill); }
  .esub { display: block; margin-top: 2px; font-size: 10.5px; font-weight: 500; color: var(--text-3); }
  .efilters { display: flex; gap: 10px 22px; flex-wrap: wrap; margin-bottom: 14px; }
  .efilter { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  /* On a phone the buttons wrap as a group; a label never splits from its count. */
  .efilter .seg { flex-wrap: wrap; }
  .efilter .seg button { white-space: nowrap; }
  .efilter.cshow { margin: 4px 0 12px; }
  .efl { font-size: 9.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
  .ecount { font-size: 10px; opacity: .6; margin-left: 2px; font-variant-numeric: tabular-nums; }
  .seg button[aria-pressed="true"] .ecount { opacity: .75; }
  #engagementsWrap .ctable td.etype { text-align: left; color: var(--text-2); white-space: nowrap; }
  #engagementsWrap .ctable th.etype { text-align: left; }
  /* Type is its own column on wide screens and moves under the post name on
     a phone, so it's always on screen without pushing engagement off it. */
  .etype-sub { display: none; }
  /* Top performing: three ranked rows, each with a bar scaled to the best. */
  .et-list { display: grid; gap: 8px; }
  .et-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) 140px 56px; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; background: var(--track); }
  .et-rank { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--yellow); color: var(--navy); font-size: 12px; font-weight: 800; }
  .et-row:nth-child(n+2) .et-rank { background: var(--card); color: var(--text-2); border: 1px solid var(--line); }
  .et-name { font-size: 13.5px; font-weight: 700; color: var(--strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .et-sub { margin-top: 2px; font-size: 11px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .et-val { color: var(--strong); text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  .et-row .abar { width: 140px; }
  @media (max-width: 600px) { .et-row { grid-template-columns: 24px minmax(0, 1fr) 52px; } .et-row .abar { display: none; } }
  .eres { white-space: normal; font-size: 11.5px; color: var(--text-2); min-width: 180px; text-align: left !important; }
  #engagementsWrap .ctable td.cname { min-width: 200px; max-width: 320px; }
  /* On a phone the post name, views and engagement have to fit on screen;
     the counts after them scroll. */
  @media (max-width: 600px) {
    #engagementsWrap .ctable td.cname { min-width: 118px; }
    #engagementsWrap .ctable td { padding-left: 6px; padding-right: 6px; }
    #engagementsWrap .abar { width: 38px; }
    #engagementsWrap .abar-pct { min-width: 38px; margin-left: 6px; }
    #engagementsWrap .abar-cell { min-width: 0; white-space: nowrap; }
    #engagementsWrap .ctable .etype { display: none; }
    .etype-sub { display: inline; }
  }
  /* On a phone the project table should fit without scrolling, so its
     share bars shrink to leave room for the percentage. */
  @media (max-width: 600px) {
    #leadsWrap .abar-cell { min-width: 0; white-space: nowrap; }
    #leadsWrap .abar { width: 60px; }
    /* .cname's 190px floor is for long campaign names; project codes are
       short, and the floor is what pushed the share column off screen. */
    #leadsWrap .ctable td.cname { min-width: 0; }
  }

  /* ---------- notes ---------- */

  .notes { margin-top: 6px; font-size: 11.5px; color: var(--text-3); line-height: 1.6; }
  .notes b { color: var(--target-ink); font-weight: 600; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11px; color: var(--text-3); margin-bottom: 16px; }
  .legend i { display: inline-block; width: 20px; height: 8px; border-radius: 4px; vertical-align: -1px; margin-right: 5px; }

  /* Manual notices from Operations — a distinct blue so it never reads as a
     status color (green/yellow/red already mean sold out, new, cancelled).
     Bold on purpose: this has to win against a room full of trip cards. */
  .announce {
    display: flex; gap: 14px; align-items: flex-start;
    background: #ffffff;
    border: 1.5px solid var(--info);
    border-left: 6px solid var(--info);
    border-radius: 10px; padding: 16px 20px; margin-bottom: 18px;
    box-shadow: 0 0 0 1px rgba(77,157,224,.15), 0 6px 20px rgba(77,157,224,.18);
  }
  .announce-icon { font-size: 26px; line-height: 1.2; flex: none; }
  /* Dark ink on the white card — the opposite pairing from the rest of the
     (light-text-on-navy) page, so this needs its own colors, not the page's tokens. */
  .announce-title {
    font-weight: 800; font-size: 16.5px; color: #16294a; margin-bottom: 5px;
    letter-spacing: .01em;
  }
  .announce-body { font-size: 13.5px; color: #3d4a5c; line-height: 1.6; }

  /* Nothing to announce shouldn't shout. Same slot so the layout doesn't jump,
     but recedes into the page instead of demanding attention. */
  .announce.empty {
    background: transparent;
    border: 1px dashed var(--line);
    border-left: 1px dashed var(--line);
    box-shadow: none;
    padding: 11px 16px;
    align-items: center;
  }
  .announce.empty .announce-icon { font-size: 15px; opacity: .5; }
  .announce.empty .announce-title {
    font-weight: 600; font-size: 12.5px; color: var(--text-3); margin-bottom: 0;
  }

  /* Several banners can show at once (env banner + dated reminders). */
  .announce-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .announce-list > .announce { margin-bottom: 0; }
  /* A reminder with a deadline: amber edge, so it reads as "act on this",
     distinct from the blue general banner. */
  .announce.due { border-color: var(--yellow); border-left-color: var(--yellow); box-shadow: 0 0 0 1px rgba(var(--acc-rgb),.18), 0 6px 20px rgba(var(--acc-rgb),.16); }
  .announce-due {
    display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase;
    color: #7a5200; background: #fff1cf; border-radius: 999px; padding: 3px 10px; margin-bottom: 7px;
  }
  .announce-due.soon { color: #fff; background: #d64545; }

  /* KPIs tab (Corporate): Passed / Failed with a glyph and the word, so
     colour never carries it alone. */
  /* Summary: a pass-rate ring, big counts, per-area chips and one segment
     per KPI (hover a segment for its name). Glyphs and words, not colour
     alone. */
  .kp-hero { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; margin: 6px 0 2px; }
  .kp-ring { position: relative; width: 92px; height: 92px; flex: none; }
  .kp-ring svg { width: 100%; height: 100%; }
  .kp-ring circle { fill: none; stroke-width: 9; }
  .kp-ring-bg { stroke: var(--track); }

  .kp-ring-n b { font-size: 28px; font-weight: 800; line-height: 1; color: var(--strong); font-variant-numeric: tabular-nums; }

  .kp-sum { display: flex; flex-direction: column; gap: 8px; }
  .kp-big { font-size: 18px; font-weight: 700; color: var(--strong); }
  .kp-counts { display: flex; gap: 8px; flex-wrap: wrap; }
  .kp-c { padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; }
  .kp-c.pass { background: rgba(12,163,12,.1); color: var(--good-ink); }
  .kp-c.fail { background: rgba(208,59,59,.1); color: var(--bad-ink); }
  .kp-c.na { background: rgba(var(--ov),.06); color: var(--text-3); }
  .kp-areas { display: flex; flex-direction: column; gap: 12px; min-width: 200px; margin-left: auto; }
